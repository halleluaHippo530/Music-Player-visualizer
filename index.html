    for(var bi2=0;bi2<8;bi2++)this._freqBands[bi2]=this._freqBands[bi2]||0;
    this._energy=this._energy||0;this._bassEnergy=this._bassEnergy||0;
  }
  this._throttleFrame=this.frameCount%2;

  this.updateCelestial();
  this.transitionWeather();
  this.transitionSeason();
/* Flood level: rises during rain, recedes slowly */
var isRainNow=this.currentWeather==="rain"||this.currentWeather==="heavy_rain"||this.currentWeather==="thunderstorm"||this.currentWeather==="light_rain";
var targetFlood=isRainNow?8:0;
this._floodLevel=lerp(this._floodLevel||0,targetFlood,0.002);
  this._updateWeatherBlend();
  this._updateSeasonBlend();
  this.updateClouds();
  if(this._throttleFrame===0){
    this._spawnWeatherParticles();
    this._updateWeatherParticles();
  }
  this._updateLightning();
  this._updateFogWisps();
  this.updateTrain();
  this.updateEasterEggs();
  this._updateProgress();
  if(this.frameCount%10===0)this.detectTone();

  this.render();
  }catch(e){
    if(!this._loopErrors)this._loopErrors=0;
    this._loopErrors++;
  }
  this._loopRunning=false;
  /* Always re-schedule even after errors */
  this.animate();
};



P.render=function(){
  var w=this.W,h=this.H;
  ctx.clearRect(0,0,w,h);
  this._renderCityscape();
};


P._drawFireworks=function(){
  var fw=this.fireworksState;
  if(!fw.visible)return;
  /* Draw rockets (ascending trails) */
  for(var ri=0;ri<fw.rockets.length;ri++){
    var rkt=fw.rockets[ri];
    /* Rocket trail */
    ctx.strokeStyle="rgba(255,200,100,0.6)";
    ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(rkt.x,rkt.y);ctx.lineTo(rkt.x,rkt.y-rkt.vy*3);ctx.stroke();
    /* Rocket head */
    ctx.fillStyle="#fff";
    ctx.fillRect(rkt.x-1,rkt.y-1,2,2);
  }
  /* Draw explosion particles */
  for(var pk=0;pk<fw.particles.length;pk++){
    var ptc=fw.particles[pk];
    var alpha=ptc.life/ptc.maxLife;
    var size=alpha<0.3?1:alpha<0.7?1.5:2;
    /* Core bright particle */
    ctx.fillStyle="hsla("+ptc.colorH+","+ptc.colorS+"%,"+Math.min(90,ptc.colorL+alpha*20)+"%,"+alpha+")";
    ctx.fillRect(ptc.x-size/2,ptc.y-size/2,size,size);
    /* Glow for brighter particles */
    if(alpha>0.5&&size>1){
      ctx.fillStyle="hsla("+ptc.colorH+","+ptc.colorS+"%,"+Math.min(95,ptc.colorL+30)+"%,"+(alpha*0.15)+")";
      ctx.beginPath();ctx.arc(ptc.x,ptc.y,size*2,0,Math.PI*2);ctx.fill();
    }
    /* Trail behind fast particles */
    if(alpha>0.4){
      ctx.fillStyle="hsla("+ptc.colorH+","+(ptc.colorS*0.7)+"%,"+(ptc.colorL+10)+"%,"+(alpha*0.2)+")";
      ctx.fillRect(ptc.x-ptc.vx*1.5-size/2,ptc.y-ptc.vy*1.5-size/2,size*0.7,size*0.7);
    }
  }
  /* Flash glow when many particles are fresh */
  var freshCount=0;
  for(var fc=0;fc<fw.particles.length;fc++){
    if(fw.particles[fc].life>fw.particles[fc].maxLife*0.8)freshCount++;
  }
  if(freshCount>20){
    var flashA=Math.min(0.08,freshCount*0.002);
    ctx.fillStyle="rgba(255,240,220,"+flashA+")";
    ctx.fillRect(0,0,this.W,this.H*0.6);
  }
};


P._drawBridgeArch=function(){
  var br=this.bridgeState;
  if(!br.visible)return;
  var w=this.W,h=this.H,nf=this.nightFactor;
  var archTop=h*LAYERS[1].groundFrac+5;
  var archBot=h*LAYERS[3].groundFrac-3;
  var archH=archBot-archTop;
  var archW=180;
  var cx=br.x+archW/2;
  var deckH=6;
  var deckY=archBot-deckH;
  var pillarW=5;
  var deckCol=nf>0.5?hsl(220,10,22):hsl(35,12,55);
  var pillarCol=nf>0.5?hsl(220,8,18):hsl(30,10,45);
  var cableCol=nf>0.5?hsla(210,15,35,0.6):hsla(210,20,60,0.5);
  var railCol=nf>0.5?hsl(0,0,25):hsl(0,0,55);

  if(br.archStyle===0){
    /* Cable-stayed bridge: fan cables from two towers */
    var tower1X=cx-archW*0.3;
    var tower2X=cx+archW*0.3;
    var towerTop=archTop-25;
    /* Deck */
    ctx.fillStyle=deckCol;
    ctx.fillRect(cx-archW/2,deckY,archW,deckH);
    /* Edge line */
    ctx.fillStyle=railCol;
    ctx.fillRect(cx-archW/2,deckY,archW,1);
    /* Towers */
    for(var ti=0;ti<2;ti++){
      var tx=ti===0?tower1X:tower2X;
      ctx.fillStyle=pillarCol;
      ctx.fillRect(tx-pillarW/2,towerTop,pillarW,deckY-towerTop+deckH);
      ctx.fillRect(tx-pillarW/2-2,towerTop,pillarW+4,3);
      /* Tower top cap */
      ctx.fillRect(tx-pillarW/2-3,towerTop-2,pillarW+6,3);
      /* Fan cables from tower top to deck */
      for(var ci=-8;ci<=8;ci++){
        var cabX=tx+ci*archW*0.06;
        ctx.strokeStyle=cableCol;
        ctx.lineWidth=0.8;
        ctx.beginPath();
        ctx.moveTo(tx,towerTop);
        ctx.lineTo(cabX,deckY);
        ctx.stroke();
      }
    }
    /* Night tower lights */
    if(nf>0.3){
      var nlA=clamp((nf-0.3)/0.3,0,1);
      for(var nl=0;nl<2;nl++){
        var nlx=nl===0?tower1X:tower2X;
        ctx.fillStyle=hsla(0,100,55,nlA*0.9);
        ctx.fillRect(nlx-1,towerTop-4,2,2);
        /* Red aviation beacon */
        ctx.fillStyle=hsla(0,100,50,nlA*(Math.sin(this.frameCount*0.08)>0.3?0.9:0.3));
        ctx.fillRect(nlx-1,towerTop-6,2,2);
      }
    }
  }else if(br.archStyle===1){
    /* Modern arch bridge: single sweeping arch with vertical suspenders */
    var archCenterY=archTop+archH*0.35;
    var archR=archW*0.42;
    /* Deck */
    ctx.fillStyle=deckCol;
    ctx.fillRect(cx-archW/2,deckY,archW,deckH);
    ctx.fillStyle=railCol;
    ctx.fillRect(cx-archW/2,deckY,archW,1);
    /* Main arch - thick parabolic curve */
    ctx.strokeStyle=nf>0.5?hsl(0,0,28):hsl(0,0,65);
    ctx.lineWidth=4;
    ctx.beginPath();
    for(var ax=-archR;ax<=archR;ax+=2){
      var archYPos=archCenterY+(ax*ax)/(archR)*0.6;
      if(ax===-archR)ctx.moveTo(cx+ax,archYPos);
      else ctx.lineTo(cx+ax,archYPos);
    }
    ctx.stroke();
    /* Thinner highlight on arch */
    ctx.strokeStyle=nf>0.5?hsla(210,10,35,0.5):hsla(210,15,75,0.4);
    ctx.lineWidth=1;
    ctx.beginPath();
    for(var ax2=-archR;ax2<=archR;ax2+=2){
      var archYPos2=archCenterY+(ax2*ax2)/(archR)*0.6-1;
      if(ax2===-archR)ctx.moveTo(cx+ax2,archYPos2);
      else ctx.lineTo(cx+ax2,archYPos2);
    }
    ctx.stroke();
    /* Vertical suspenders from arch to deck */
    ctx.strokeStyle=cableCol;
    ctx.lineWidth=0.8;
    for(var si=-8;si<=8;si++){
      var suspX=cx+si*(archW/18);
      var suspArchY=archCenterY+(si*archW/18)*(si*archW/18)/(archR)*0.6;
      ctx.beginPath();ctx.moveTo(suspX,suspArchY);ctx.lineTo(suspX,deckY);ctx.stroke();
    }
    /* End pillars */
    ctx.fillStyle=pillarCol;
    ctx.fillRect(cx-archW/2+5,archTop+10,pillarW,deckY-archTop-10);
    ctx.fillRect(cx+archW/2-10,archTop+10,pillarW,deckY-archTop-10);
    /* Night: arch illumination */
    if(nf>0.3){
      var aiA=clamp((nf-0.3)/0.3,0,1);
      ctx.strokeStyle=hsla(45,80,70,aiA*0.3);
      ctx.lineWidth=2;
      ctx.beginPath();
      for(var ax3=-archR;ax3<=archR;ax3+=2){
        var archYPos3=archCenterY+(ax3*ax3)/(archR)*0.6;
        if(ax3===-archR)ctx.moveTo(cx+ax3,archYPos3);
        else ctx.lineTo(cx+ax3,archYPos3);
      }
      ctx.stroke();
    }
  }else{
    /* Tied-arch (bowstring) bridge: arch below deck with vertical ties */
    var bowY=deckY+archH*0.5;
    /* Deck */
    ctx.fillStyle=deckCol;
    ctx.fillRect(cx-archW/2,deckY,archW,deckH);
    ctx.fillStyle=railCol;
    ctx.fillRect(cx-archW/2,deckY,archW,1);
    /* Bow arch below deck */
    ctx.strokeStyle=nf>0.5?hsl(0,0,30):hsl(0,0,62);
    ctx.lineWidth=3;
    ctx.beginPath();
    for(var bx=-archW*0.45;bx<=archW*0.45;bx+=2){
      var byPos=bowY+(bx/(archW*0.45))*(bx/(archW*0.45))*archH*0.25;
      if(bx===-archW*0.45)ctx.moveTo(cx+bx,byPos);
      else ctx.lineTo(cx+bx,byPos);
    }
    ctx.stroke();
    /* Vertical ties from arch to deck */
    ctx.strokeStyle=cableCol;
    ctx.lineWidth=0.8;
    for(var ti2=-7;ti2<=7;ti2++){
      var tieX=cx+ti2*(archW/16);
      var norm=ti2/7;
      var tieArchY=bowY+(norm*norm)*archH*0.25;
      ctx.beginPath();ctx.moveTo(tieX,deckY+deckH);ctx.lineTo(tieX,tieArchY);ctx.stroke();
    }
    /* End pillars */
    ctx.fillStyle=pillarCol;
    ctx.fillRect(cx-archW/2+8,archTop,pillarW,deckY-archTop);
    ctx.fillRect(cx+archW/2-13,archTop,pillarW,deckY-archTop);
    /* Deck traffic */
    for(var vc=0;vc<3;vc++){
      var vx=cx-archW*0.3+vc*archW*0.25+(this.frameCount*0.3+vc*100)%archW;
      if(vx>cx+archW/2-10||vx<cx-archW/2+10)continue;
      var vcColors=[[0,0,30],[220,50,35],[200,40,50]];
      var vcc=vcColors[vc];
      var vcl=clamp(lerp(vcc[2],vcc[2]-8,nf),8,85);
      ctx.fillStyle=hsl(vcc[0],vcc[1],vcl);
      ctx.fillRect(vx,deckY+1,8,3);
      if(nf>0.3){
        ctx.fillStyle=hsla(50,100,90,clamp((nf-0.3)/0.3,0,1)*0.7);
        ctx.fillRect(vx>cx?vx+8:vx,deckY+1,1,1);
        ctx.fillRect(vx>cx?vx+8:vx,deckY+3,1,1);
      }
    }
  }
};







/* ═══════════════════════════════════════════════════════
   LANDSCAPE SCENE — Snow mountains, grassland, river
   ═══════════════════════════════════════════════════════ */
P.landscapeMountains=[];P.landscapeTrees=[];P.landscapeRocks=[];

P._initLandscape=function(){
  var w=this.W,h=this.H;
  /* Generate mountain range */
  this.landscapeMountains=[];
  var peakCount=7+Math.floor(Math.random()*5);
  for(var i=0;i<peakCount;i++){
    var x=(i+Math.random()*0.5)/(peakCount+0.5);
    var mh=0.25+Math.random()*0.3;
    var mw=0.08+Math.random()*0.1;
    this.landscapeMountains.push({x:x,h:mh,w:mw,
      snowLine:0.3+Math.random()*0.25,hasPeak:Math.random()>0.3});
  }
  /* Generate scattered trees on grassland */
  this.landscapeTrees=[];
  var treeCount=20+Math.floor(Math.random()*15);
  for(var t=0;t<treeCount;t++){
    this.landscapeTrees.push({
      x:Math.random(),y:0.62+Math.random()*0.06,
      size:4+Math.random()*8,type:Math.floor(Math.random()*3)});
  }
  /* Generate rocks */
  this.landscapeRocks=[];
  for(var r=0;r<8;r++){
    this.landscapeRocks.push({x:Math.random(),y:0.63+Math.random()*0.04,
      size:2+Math.random()*4});
  }
  /* River properties */
  this._riverPhase=Math.random()*100;
};

P._renderLandscape=function(){
  var w=this.W,h=this.H;
  var nf=this.nightFactor;
  var t=this.frameCount*0.01;
  var grassY=h*0.6;
  var energy=this._energy||0;

  /* Stars */
  this.drawStars();

  /* Clouds */
  this.drawClouds();

  /* Easter eggs (sky-based) */
  this.drawEasterEggs();

  /* ---- SNOW-CAPPED MOUNTAINS ---- */
  /* Far mountains (blue-gray silhouettes) */
  var farMGrad=ctx.createLinearGradient(0,h*0.15,0,grassY);
  farMGrad.addColorStop(0,nf>0.5?hsl(220,15,12):hsl(220,20,55));
  farMGrad.addColorStop(1,nf>0.5?hsl(220,10,8):hsl(220,12,35));
  ctx.fillStyle=farMGrad;
  ctx.beginPath();ctx.moveTo(0,grassY);
  var peaks=this.landscapeMountains;
  ctx.lineTo(0,grassY-peaks[0].h*h*0.5);
  for(var mi=0;mi<peaks.length;mi++){
    var pk=peaks[mi];
    var px=pk.x*w;
    var py=grassY-pk.h*h*(0.5+mi*0.08);
    var pw=pk.w*w;
    /* Mountain peak with bezier curves */
    ctx.lineTo(px-pw*0.5,grassY-pk.h*h*(0.3+mi*0.06));
    ctx.quadraticCurveTo(px-pw*0.15,py-pk.h*h*0.1,px,py);
    ctx.quadraticCurveTo(px+pw*0.15,py-pk.h*h*0.08,px+pw*0.5,grassY-pk.h*h*(0.3+mi*0.06));
  }
  ctx.lineTo(w,grassY);ctx.closePath();ctx.fill();

  /* Snow caps on peaks */
  ctx.fillStyle=nf>0.5?hsl(210,10,25):hsl(210,15,85);
  for(var si=0;si<peaks.length;si++){
    var sp=peaks[si];
    var spx=sp.x*w;
    var spy=grassY-sp.h*h*(0.5+si*0.08);
    var snowH=sp.h*h*sp.snowLine;
    var snowW=sp.w*w*0.4;
    ctx.beginPath();
    ctx.moveTo(spx-snowW,spy+snowH);
    ctx.quadraticCurveTo(spx-snowW*0.3,spy+snowH*0.3,spx,spy);
    ctx.quadraticCurveTo(spx+snowW*0.3,spy+snowH*0.3,spx+snowW,spy+snowH);
    ctx.closePath();ctx.fill();
  }

  /* Mountain ridge highlight */
  ctx.strokeStyle=nf>0.5?hsla(210,15,20,0.3):hsla(210,20,60,0.2);
  ctx.lineWidth=1;
  ctx.beginPath();
  for(var ri=0;ri<peaks.length;ri++){
    var rp=peaks[ri];
    var rpx=rp.x*w;
    var rpy=grassY-rp.h*h*(0.5+ri*0.08)+3;
    if(ri===0)ctx.moveTo(0,rpy);
    else ctx.lineTo(rpx,rpy);
  }
  ctx.lineTo(w,rpy);ctx.stroke();

  /* ---- GRASSLAND ---- */
  var grassGrad=ctx.createLinearGradient(0,grassY,0,h*0.68);
  if(nf>0.5){
    grassGrad.addColorStop(0,hsl(120,15,12));
    grassGrad.addColorStop(1,hsl(120,10,6));
  }else{
    var gLerp=1-nf;
    grassGrad.addColorStop(0,hsl(100,40,25+gLerp*20));
    grassGrad.addColorStop(1,hsl(90,35,15+gLerp*15));
  }
  ctx.fillStyle=grassGrad;
  ctx.fillRect(0,grassY,w,h*0.1);

  /* Grass texture - subtle blade lines */
  ctx.strokeStyle=nf>0.5?hsla(110,10,15,0.3):hsla(100,30,35,0.25);
  ctx.lineWidth=0.5;
  for(var gi=0;gi<w;gi+=6){
    var gh=2+Math.sin(gi*0.3+t)*1.5;
    var gy=grassY+Math.random()*h*0.02;
    ctx.beginPath();ctx.moveTo(gi,gy+gh);ctx.lineTo(gi+Math.sin(t+gi)*1.5,gy);ctx.stroke();
  }

  /* ---- RIVER (foreground, crossing screen) ---- */
  this._riverPhase+=0.008;
  var riverY=h*0.7;
  var riverW=h*0.06;
  var riverCenterY=riverY;
  ctx.save();
  /* River body with wave motion */
  var rivGrad=ctx.createLinearGradient(0,riverCenterY-riverW,0,riverCenterY+riverW);
  rivGrad.addColorStop(0,nf>0.5?hsl(210,25,18):hsl(210,35,42));
  rivGrad.addColorStop(0.3,nf>0.5?hsl(200,20,22):hsl(200,30,50));
  rivGrad.addColorStop(0.5,nf>0.5?hsl(195,25,25):hsl(195,35,55));
  rivGrad.addColorStop(0.7,nf>0.5?hsl(200,20,22):hsl(200,30,50));
  rivGrad.addColorStop(1,nf>0.5?hsl(210,25,18):hsl(210,35,42));
  ctx.fillStyle=rivGrad;
  ctx.beginPath();
  ctx.moveTo(0,riverCenterY-riverW*0.5);
  /* Top bank with wave undulation */
  for(var rx=0;rx<=w;rx+=8){
    var wave=Math.sin(rx*0.02+this._riverPhase)*riverW*0.15;
    var energyWave=Math.sin(rx*0.05+t*2)*riverW*0.08*energy;
    ctx.lineTo(rx,riverCenterY-riverW*0.4+wave+energyWave);
  }
  /* Bottom bank */
  for(var rx2=w;rx2>=0;rx2-=8){
    var wave2=Math.sin(rx2*0.02+this._riverPhase+1)*riverW*0.15;
    var energyWave2=Math.sin(rx2*0.05+t*2+1)*riverW*0.08*energy;
    ctx.lineTo(rx2,riverCenterY+riverW*0.5+wave2+energyWave2);
  }
  ctx.closePath();ctx.fill();

  /* River surface highlights */
  ctx.strokeStyle=nf>0.5?hsla(200,30,35,0.15):hsla(200,40,70,0.2);
  ctx.lineWidth=0.5;
  for(var rh=0;rh<6;rh++){
    var rhY=riverCenterY-riverW*0.3+rh*riverW*0.12;
    ctx.beginPath();
    for(var rhx=0;rhx<=w;rhx+=6){
      var rhy=rhY+Math.sin(rhx*0.03+this._riverPhase*1.5+rh)*2;
      if(rhx===0)ctx.moveTo(rhx,rhy);else ctx.lineTo(rhx,rhy);
    }
    ctx.stroke();
  }

  /* River sparkles */
  if(nf<0.5){
    for(var rs=0;rs<12;rs++){
      var rsx=(Math.sin(rs*3.7+t*0.7)*0.5+0.5)*w;
      var rsy=riverCenterY+Math.sin(rs*2.1+t)*riverW*0.3;
      var rsA=0.3+0.3*Math.sin(t*3+rs*1.5);
      ctx.fillStyle=hsla(200,50,85,rsA);
      ctx.fillRect(rsx,rsy,2,1);
    }
  }

  /* River banks - darker edges */
  ctx.fillStyle=nf>0.5?hsl(25,15,8):hsl(25,25,30);
  for(var rb=0;rb<w;rb+=3){
    var bankTopWave=Math.sin(rb*0.02+this._riverPhase)*riverW*0.15;
    ctx.fillRect(rb,riverCenterY-riverW*0.5+bankTopWave,2,2);
    var bankBotWave=Math.sin(rb*0.02+this._riverPhase+1)*riverW*0.15;
    ctx.fillRect(rb,riverCenterY+riverW*0.4+bankBotWave,2,2);
  }
  ctx.restore();

  /* ---- FOREGROUND GROUND (below river) ---- */
  var fgGrad=ctx.createLinearGradient(0,riverCenterY+riverW*0.5,0,h);
  fgGrad.addColorStop(0,nf>0.5?hsl(100,12,10):hsl(100,25,22));
  fgGrad.addColorStop(1,nf>0.5?hsl(100,8,5):hsl(100,15,12));
  ctx.fillStyle=fgGrad;
  ctx.fillRect(0,riverCenterY+riverW*0.5,w,h-riverCenterY-riverW*0.5);

  /* ---- TREES ON GRASSLAND ---- */
  var trees=this.landscapeTrees;
  for(var ti=0;ti<trees.length;ti++){
    var tr=trees[ti];
    var tx=tr.x*w;
    var ty=tr.y*h;
    /* Trunk */
    ctx.fillStyle=nf>0.5?hsl(25,20,12):hsl(25,35,30);
    ctx.fillRect(tx-1,ty-tr.size*0.4,2,tr.size*0.5);
    /* Canopy */
    var season=this.currentSeason;
    var canopyH,canopyS,canopyL;
    if(season===3){canopyH=0;canopyS=0;canopyL=nf>0.5?15:40}
    else if(season===2){canopyH=25;canopyS=50;canopyL=nf>0.5?18:40}
    else{canopyH=120;canopyS=45;canopyL=nf>0.5?15:35}
    ctx.fillStyle=hsl(canopyH,canopyS,canopyL);
    if(tr.type===0){
      /* Round tree */
      ctx.beginPath();ctx.arc(tx,ty-tr.size*0.6,tr.size*0.5,0,Math.PI*2);ctx.fill();
    }else if(tr.type===1){
      /* Conical pine */
      ctx.beginPath();ctx.moveTo(tx,ty-tr.size*1.2);
      ctx.lineTo(tx-tr.size*0.4,ty-tr.size*0.3);
      ctx.lineTo(tx+tr.size*0.4,ty-tr.size*0.3);ctx.closePath();ctx.fill();
    }else{
      /* Bush */
      ctx.beginPath();ctx.ellipse(tx,ty-tr.size*0.35,tr.size*0.5,tr.size*0.3,0,0,Math.PI*2);ctx.fill();
    }
    /* Music-reactive sway */
    if(energy>0.1){
      var sway=Math.sin(t*2+ti)*energy*2;
      ctx.fillStyle=hsla(canopyH,canopyS-10,canopyL+10,0.3);
      ctx.beginPath();ctx.arc(tx+sway,ty-tr.size*0.6,tr.size*0.15,0,Math.PI*2);ctx.fill();
    }
  }

  /* ---- ROCKS ---- */
  for(var rki=0;rki<this.landscapeRocks.length;rki++){
    var rk=this.landscapeRocks[rki];
    var rkx=rk.x*w,rky=rk.y*h;
    ctx.fillStyle=nf>0.5?hsl(220,8,14):hsl(220,10,40);
    ctx.beginPath();
    ctx.ellipse(rkx,rky,rk.size,rk.size*0.6,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=nf>0.5?hsla(220,5,20,0.3):hsla(220,8,55,0.2);
    ctx.beginPath();
    ctx.ellipse(rkx-1,rky-1,rk.size*0.6,rk.size*0.3,0,0,Math.PI*2);ctx.fill();
  }

  /* ---- WILDLIFE (small deer silhouettes) ---- */
  if(Math.sin(t*0.1)>0.95){
    var deerX=(w*0.3+Math.sin(t*0.05)*w*0.2);
    var deerY=grassY+h*0.02;
    ctx.fillStyle=nf>0.5?hsl(0,0,10):hsl(0,0,30);
    /* Body */
    ctx.fillRect(deerX,deerY-6,10,4);
    /* Legs */
    ctx.fillRect(deerX+1,deerY-2,1,3);ctx.fillRect(deerX+3,deerY-2,1,3);
    ctx.fillRect(deerX+7,deerY-2,1,3);ctx.fillRect(deerX+9,deerY-2,1,3);
    /* Head */
    ctx.fillRect(deerX+10,deerY-7,3,2);
    /* Antlers */
    ctx.fillRect(deerX+11,deerY-10,1,3);ctx.fillRect(deerX+13,deerY-9,1,2);
  }

  /* Fireworks (shared between scenes) */
  this._drawFireworks();

  /* Tyndall rays through mountains */
  this._drawTyndallEffect();

  /* Birds in sky */
  for(var bi=0;bi<3;bi++){
    var birdX=(w*0.2+bi*w*0.25+Math.sin(t*0.5+bi*2)*50)%(w+100)-50;
    var birdY=h*0.15+bi*20+Math.sin(t*0.8+bi)*8;
    var wingPhase=Math.sin(t*3+bi*1.5);
    ctx.strokeStyle=nf>0.5?hsl(0,0,20):hsl(0,0,40);
    ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(birdX-4,birdY+wingPhase*3);
    ctx.quadraticCurveTo(birdX-1,birdY-1,birdX,birdY);
    ctx.quadraticCurveTo(birdX+1,birdY-1,birdX+4,birdY+wingPhase*3);
    ctx.stroke();
  }
};

/* ═══════════════════════════════════════════════════════
   PIXEL ART GRASSLAND SCENE
   ═══════════════════════════════════════════════════════ */
P.pixelMountains=[];P.pixelFlowers=[];P.pixelClouds=[];

P._initPixelGrass=function(){
  var w=this.W,h=this.H;
  /* Pixel mountains - blocky peaks */
  this.pixelMountains=[];
  var pkCount=6+Math.floor(Math.random()*4);
  for(var i=0;i<pkCount;i++){
    var x=Math.floor((i+0.5)/pkCount*w);
    var peakH=Math.floor(h*randf(0.15,0.4));
    var baseW=Math.floor(randf(40,90));
    this.pixelMountains.push({x:x,peakH:peakH,baseW:baseW,
      snowStart:Math.floor(peakH*randf(0.3,0.5))});
  }
  /* Pixel flowers */
  this.pixelFlowers=[];
  for(var f=0;f<40;f++){
    this.pixelFlowers.push({
      x:Math.floor(Math.random()*w),
      y:Math.floor(h*randf(0.58,0.66)),
      color:[Math.floor(Math.random()*3)],
      size:Math.floor(randf(2,5))});
  }
  /* Pixel clouds */
  this.pixelClouds=[];
  for(var c=0;c<4;c++){
    this.pixelClouds.push({
      x:Math.floor(Math.random()*w),
      y:Math.floor(h*randf(0.08,0.22)),
      w:Math.floor(randf(30,70)),
      h:Math.floor(randf(8,16)),
      speed:randf(0.2,0.6)});
  }
  this._pxRiverPhase=0;
};

P._renderPixelGrass=function(){
  var w=this.W,h=this.H;
  var nf=this.nightFactor;
  var PX=4; /* pixel block size */
  var energy=this._energy||0;
  var t=this.frameCount*0.01;
  var grassY=Math.floor(h*0.55);

  /* Stars */
  this.drawStars();

  /* ---- PIXEL CLOUDS ---- */
  var pxcls=this.pixelClouds;
  for(var ci=0;ci<pxcls.length;ci++){
    var pc=pxcls[ci];
    pc.x+=pc.speed;if(pc.x>w+pc.w)pc.x=-pc.w;
    var cCol=nf>0.5?hsl(220,8,20):hsl(0,0,85);
    for(var py=0;py<pc.h;py+=PX){
      for(var px=0;px<pc.w;px+=PX){
        /* Rounded cloud shape */
        var dx=(px-pc.w/2)/(pc.w/2);
        var dy=(py-pc.h/2)/(pc.h/2);
        if(dx*dx+dy*dy<1){
          ctx.fillStyle=cCol;
          ctx.fillRect(Math.floor(pc.x+px),Math.floor(pc.y+py),PX,PX);
        }
      }
    }
    /* Cloud highlight */
    var hlCol=nf>0.5?hsl(220,5,25):hsl(0,0,92);
    for(var phy=0;phy<pc.h*0.4;phy+=PX){
      for(var phx=pc.w*0.2;phx<pc.w*0.7;phx+=PX){
        ctx.fillStyle=hlCol;
        ctx.fillRect(Math.floor(pc.x+phx),Math.floor(pc.y+phy),PX,PX);
      }
    }
  }

  /* Easter eggs (sky) */
  this.drawEasterEggs();

  /* ---- PIXEL MOUNTAINS ---- */
  var pxmks=this.pixelMountains;
  var energy=this._energy||0;

  /* Layer 0: Far distant mountains (blue haze, small, subtle) */
  var farA=nf>0.5?hsl(225,15,12):hsl(225,20,55);
  var farB=nf>0.5?hsl(220,12,9):hsl(220,16,45);
  for(var fx=0;fx<w;fx+=PX){
    var farH=Math.floor(h*0.12+Math.sin(fx*0.008)*h*0.04+Math.sin(fx*0.003+1)*h*0.06);
    farH=Math.floor(farH*(0.85+energy*0.15));
    for(var fy=0;fy<farH;fy+=PX){
      var fCol=(Math.floor(fx/PX)+Math.floor(fy/PX))%3;
      ctx.fillStyle=fCol===0?farA:farB;
      ctx.fillRect(fx,grassY-farH+fy,PX,PX);
    }
  }

  /* Layer 1: Mid mountains with snow caps */
  var midCol=nf>0.5?hsl(220,14,16):hsl(220,20,48);
  var midDk=nf>0.5?hsl(220,10,11):hsl(220,14,38);
  var snowA=nf>0.5?hsl(210,8,24):hsl(210,12,80);
  var snowB=nf>0.5?hsl(210,5,20):hsl(0,0,90);
  for(var mx=0;mx<w;mx+=PX){
    var midH=0;
    for(var mp=0;mp<pxmks.length;mp++){
      var mk=pxmks[mp];
      var dx=mx-mk.x;
      var halfW=mk.baseW*1.3;
      if(Math.abs(dx)<halfW){
        var d=Math.abs(dx)/halfW;
        var pkH=mk.peakH*(1-d*d)*(0.85+energy*0.15);
        if(pkH>midH)midH=pkH;
      }
    }
    midH=Math.floor(midH);
    for(var my=0;my<midH;my+=PX){
      var drawX=mx;
      var drawY=grassY-midH+my;
      /* Snow zone: top portion */
      var snowFrac=0.35;
      if(my<midH*snowFrac){
        /* Snow with sparkle dither */
        var sDither=(Math.floor(mx/PX)+Math.floor(my/PX))%5;
        ctx.fillStyle=sDither<2?snowA:sDither<4?snowB:
          nf>0.5?hsl(210,3,28):hsl(0,0,95);
      }else if(my<midH*snowFrac+PX*2){
        /* Snow-rock transition band - staggered edge */
        var tDither=(Math.floor(mx/PX*0.7)+Math.floor(my/PX))%3;
        ctx.fillStyle=tDither===0?snowA:midCol;
      }else{
        /* Rock body with diagonal stripe shading */
        var stripe=(Math.floor(mx/PX)+Math.floor(my/PX))%4;
        ctx.fillStyle=stripe<2?midCol:midDk;
        /* Alpine shadow band - horizontal dark strip */
        if(my>midH*0.5&&my<midH*0.5+PX&&(Math.floor(mx/PX))%3===0){
          ctx.fillStyle=hsla(220,15,5,nf>0.5?0.4:0.2);
        }
      }
      ctx.fillRect(drawX,drawY,PX,PX);
    }
  }

  /* Layer 2: Foreground ridgeline (darkest, tallest, jagged) */
  var fgCol=nf>0.5?hsl(220,12,10):hsl(220,22,32);
  var fgDk=nf>0.5?hsl(220,8,6):hsl(220,16,22);
  var fgSnow=nf>0.5?hsl(210,6,20):hsl(210,10,75);
  for(var rx=0;rx<w;rx+=PX){
    /* Jagged ridgeline using combined sine waves */
    var ridgeH=Math.floor(h*0.08
      +Math.sin(rx*0.012)*h*0.06
      +Math.sin(rx*0.025+2)*h*0.03
      +Math.sin(rx*0.005)*h*0.05
      +Math.abs(Math.sin(rx*0.04))*h*0.02);
    ridgeH=Math.floor(ridgeH*(0.9+energy*0.1));
    for(var ry=0;ry<ridgeH;ry+=PX){
      var rdrawX=rx;
      var rdrawY=grassY-ridgeH+ry;
      /* Snow on very top pixels */
      if(ry<PX*2){
        ctx.fillStyle=fgSnow;
      }else{
        var rStripe=(Math.floor(rx/PX)+Math.floor(ry/PX))%3;
        ctx.fillStyle=rStripe===0?fgCol:fgDk;
      }
      ctx.fillRect(rdrawX,rdrawY,PX,PX);
    }
    /* Occasional pine tree silhouette on ridge */
    if(rx%(PX*12)===PX*6&&ridgeH>h*0.1){
      var pineH=Math.floor(h*0.04+Math.random()*h*0.02);
      var pineBase=grassY-ridgeH;
      ctx.fillStyle=nf>0.5?hsl(220,15,7):hsl(220,25,18);
      for(var py2=0;py2<pineH;py2+=PX){
        var pineW=Math.floor((py2/pineH)*PX*2);
        ctx.fillRect(rx-pineW,pineBase-pineH+py2,pineW*2+PX,PX);
      }
      /* Snow on pine tips */
      ctx.fillStyle=nf>0.5?hsl(210,5,22):hsl(210,10,72);
      ctx.fillRect(rx-PX,pineBase-pineH,PX*3,PX);
    }
  }

  /* Mountain base fog/mist pixels */
  for(var bfx=0;bfx<w;bfx+=PX){
    var mistH=Math.floor(PX*(1+Math.sin(bfx*0.02+t)*0.5));
    for(var mfy=0;mfy<mistH;mfy+=PX){
      ctx.fillStyle=hsla(nf>0.5?220:210,nf>0.5?10:15,
        nf>0.5?12:50,0.15+0.1*Math.sin(bfx*0.01+t));
      ctx.fillRect(bfx,grassY-mfy,PX,PX);
    }
  }

  /* ---- PIXEL GRASSLAND ---- */
  /* Main grass area with color variation */
  var grassCols=[
    nf>0.5?hsl(120,20,12):hsl(105,45,28),
    nf>0.5?hsl(115,18,10):hsl(100,40,24),
    nf>0.5?hsl(125,15,8):hsl(110,35,20),
    nf>0.5?hsl(110,12,14):hsl(95,50,32)
  ];
  for(var gy=grassY;gy<h*0.7;gy+=PX){
    for(var gx=0;gx<w;gx+=PX){
      /* Music-reactive grass brightness */
      var bandIdx=Math.floor(gx/(w/8))%8;
      var bandE=this._freqBands?this._freqBands[bandIdx]||0:0;
      var gBright=bandE*15;
      var colIdx=(Math.floor(gx/PX*0.3)+Math.floor(gy/PX))%grassCols.length;
      /* Occasional darker patch */
      if((gx*7+gy*13)%47<5){
        ctx.fillStyle=nf>0.5?hsl(120,15,6):hsl(100,30,16);
      }else{
        ctx.fillStyle=grassCols[colIdx];
      }
      ctx.fillRect(gx,gy,PX,PX);
      /* Grass blade highlight on top edge */
      if(gy===grassY&&Math.random()>0.7){
        ctx.fillStyle=nf>0.5?hsl(100,25,16):hsl(110,50,38+gBright);
        ctx.fillRect(gx,gy,PX,PX);
      }
    }
  }

  /* ---- PIXEL FLOWERS ---- */
  var pxfls=this.pixelFlowers;
  var flowerPalette=[
    [nf>0.5?hsl(340,60,30):hsl(340,70,60),nf>0.5?hsl(340,50,20):hsl(340,60,45)],
    [nf>0.5?hsl(45,70,35):hsl(45,80,65),nf>0.5?hsl(45,60,25):hsl(45,70,50)],
    [nf>0.5?hsl(280,50,30):hsl(280,60,60),nf>0.5?hsl(280,40,20):hsl(280,50,45)]
  ];
  for(var fi=0;fi<pxfls.length;fi++){
    var fl=pxfls[fi];
    var flPal=flowerPalette[fl.color[0]];
    /* Stem */
    ctx.fillStyle=nf>0.5?hsl(120,20,14):hsl(120,35,30);
    ctx.fillRect(fl.x,fl.y,Math.max(PX-1,1),fl.size*PX);
    /* Flower head */
    ctx.fillStyle=flPal[0];
    ctx.fillRect(fl.x-PX,fl.y-PX,fl.size*PX,fl.size*PX);
    /* Flower center */
    ctx.fillStyle=flPal[1];
    var fc=Math.floor(fl.size/2);
    ctx.fillRect(fl.x-PX+fc*PX,fl.y-PX+fc*PX,PX,PX);
    /* Music-reactive flower glow */
    if(energy>0.2){
      ctx.fillStyle=hsla(fl.color[0]===0?340:fl.color[0]===1?45:280,70,60,energy*0.3);
      ctx.fillRect(fl.x-PX*2,fl.y-PX*2,fl.size*PX+PX*2,fl.size*PX+PX*2);
    }
  }

  /* ---- PIXEL RIVER ---- */
  this._pxRiverPhase+=0.5;
  var rivY=Math.floor(h*0.7);
  var rivH=Math.floor(h*0.07);
  var rivCols=[
    nf>0.5?hsl(210,30,18):hsl(210,45,42),
    nf>0.5?hsl(200,25,22):hsl(200,40,50),
    nf>0.5?hsl(195,30,25):hsl(195,45,55),
    nf>0.5?hsl(200,20,20):hsl(200,35,48)
  ];
  for(var ry=rivY;ry<rivY+rivH;ry+=PX){
    for(var rx=0;rx<w;rx+=PX){
      /* Wave displacement */
      var wave=Math.sin(rx*0.03+this._pxRiverPhase*0.05+ry*0.1)*PX;
      var eWave=Math.sin(rx*0.07+t*2)*PX*energy;
      var drawRY=Math.floor(ry+wave+eWave);
      if(drawRY>=rivY&&drawRY<rivY+rivH){
        /* Water color with checkerboard dither */
        var wIdx=(Math.floor(rx/PX)+Math.floor(drawRY/PX))%rivCols.length;
        ctx.fillStyle=rivCols[wIdx];
        ctx.fillRect(rx,drawRY,PX,PX);
        /* Surface sparkle */
        if(Math.random()>0.97&&nf<0.5){
          ctx.fillStyle=hsl(0,0,90);
          ctx.fillRect(rx,drawRY,PX,PX);
        }
      }
    }
  }
  /* River bank edges - darker pixels */
  for(var bx=0;bx<w;bx+=PX){
    var bankWave=Math.sin(bx*0.03+this._pxRiverPhase*0.05)*PX;
    ctx.fillStyle=nf>0.5?hsl(25,20,8):hsl(25,30,28);
    ctx.fillRect(bx,rivY+Math.floor(bankWave)-PX,PX,PX);
    ctx.fillRect(bx,rivY+rivH+Math.floor(bankWave),PX,PX);
  }

  /* ---- FOREGROUND (below river) ---- */
  var fgY=rivY+rivH;
  for(var fy=fgY;fy<h;fy+=PX){
    for(var fx=0;fx<w;fx+=PX){
      var fgIdx=(Math.floor(fx/PX)+Math.floor(fy/PX))%3;
      var fgCols2=[nf>0.5?hsl(100,12,8):hsl(100,22,18),
                   nf>0.5?hsl(95,10,6):hsl(95,18,14),
                   nf>0.5?hsl(105,14,10):hsl(105,25,22)];
      ctx.fillStyle=fgCols2[fgIdx];
      ctx.fillRect(fx,fy,PX,PX);
    }
  }

  /* ---- PIXEL TREES (on grassland) ---- */
  var treePositions=[0.08,0.18,0.35,0.52,0.65,0.78,0.92];
  for(var ti=0;ti<treePositions.length;ti++){
    var tpx=Math.floor(treePositions[ti]*w);
    var tpy=grassY+Math.floor(Math.random()*h*0.02);
    /* Trunk */
    ctx.fillStyle=nf>0.5?hsl(25,30,14):hsl(25,45,32);
    ctx.fillRect(tpx,tpy-PX*4,PX,PX*5);
    /* Pixel canopy - blocky circle */
    var canopyCol=nf>0.5?hsl(120,20,12):hsl(120,40,28);
    for(var cy=-PX*5;cy<=PX*2;cy+=PX){
      for(var cx=-PX*3;cx<=PX*3;cx+=PX){
        var d=Math.sqrt(cx*cx+cy*cy);
        if(d<PX*4){
          ctx.fillStyle=(cx+cy)%2===0?canopyCol:nf>0.5?hsl(115,18,10):hsl(115,35,24);
          ctx.fillRect(tpx+cx,tpy-PX*5+cy,PX,PX);
        }
      }
    }
  }

  /* ---- PIXEL ANIMALS (sheep) ---- */
  var sheepX=Math.floor((w*0.4+Math.sin(t*0.03)*w*0.15));
  var sheepY=grassY+Math.floor(h*0.04);
  ctx.fillStyle=nf>0.5?hsl(0,0,20):hsl(0,0,85);
  /* Body */
  ctx.fillRect(sheepX,sheepY,PX*3,PX*2);
  ctx.fillRect(sheepX-PX,sheepY+PX,PX,PX);
  /* Head */
  ctx.fillStyle=nf>0.5?hsl(0,0,15):hsl(30,20,40);
  ctx.fillRect(sheepX+PX*3,sheepY,PX,PX*2);
  /* Legs */
  ctx.fillStyle=nf>0.5?hsl(0,0,12):hsl(30,15,30);
  ctx.fillRect(sheepX,sheepY+PX*2,PX,PX);
  ctx.fillRect(sheepX+PX*2,sheepY+PX*2,PX,PX);

  /* Fireworks */
  this._drawFireworks();

  /* Tyndall */
  this._drawTyndallEffect();

  /* ---- PIXEL BIRDS ---- */
  for(var bi=0;bi<3;bi++){
    var bx2=(Math.floor(w*0.2+bi*w*0.25)+Math.floor(Math.sin(t*0.5+bi*2)*30));
    var by2=Math.floor(h*0.12+bi*PX*4+Math.sin(t*0.8+bi)*PX);
    var wing=Math.sin(t*3+bi*1.5)>0;
    ctx.fillStyle=nf>0.5?hsl(0,0,18):hsl(0,0,35);
    ctx.fillRect(bx2-PX*2,by2+(wing?0:PX),PX,wing?PX:PX);
    ctx.fillRect(bx2-PX,by2-PX,PX,PX);
    ctx.fillRect(bx2,by2,PX,PX);
    ctx.fillRect(bx2+PX,by2-PX,PX,PX);
    ctx.fillRect(bx2+PX*2,by2+(wing?0:PX),PX,PX);
  }
};

/* ═══════════════════════════════════════════════════════
   CITYSCAPE SCENE (original city renderer)
   ═══════════════════════════════════════════════════════ */
/* ── Aurora Borealis — winter night, clear sky only ── */
P._drawAurora=function(){
  /* Conditions: winter season (index 3), night, clear sky */
  var nf=this.nightFactor;
  var season=this.currentSeason;
  var targetSeason=this.targetSeason;
  var isWinter=(season===3)||(targetSeason===3&&(this.seasonBlend>0.5));
  var cw=this.currentWeather;
  var pw=this.prevWeather;
  var isClear=(cw==="clear_sky"&&(pw==="clear_sky"||this.weatherBlend>0.5))||
             (cw==="partly_cloudy"&&this.weatherBlend<0.3);
  if(!isWinter||nf<0.4||!isClear)return;
  var w=this.W,h=this.H;
  var fc=this.frameCount;
  /* Aurora alpha fades in with night and winter blend */
  var nightA=clamp((nf-0.4)/0.25,0,1);
  var winterA=season===3?1:(targetSeason===3?this.seasonBlend:0);
  var baseAlpha=nightA*Math.min(winterA,1)*0.85;
  if(baseAlpha<0.02)return;
  var energy=this._energy||0;
  ctx.save();
  ctx.globalCompositeOperation="screen";
  for(var i=0;i<this.auroraStraps.length;i++){
    var a=this.auroraStraps[i];
    /* Multi-speed movement: slow drift + fast shimmer */
    a.phase+=a.speed*a.drift;
    var hueShift=Math.sin(fc*0.003*a.hueDrift+i*1.7)*20+Math.sin(fc*0.007+i)*8;
    var curHue=a.hue+hueShift;
    /* Horizontal position drift — aurora slides across sky */
    var hDrift=Math.sin(fc*0.002+a.phase*0.3)*0.15*a.drift;
    /* Energy pulse brightens curtain */
    var ePulse=0.75+0.35*energy+0.15*Math.sin(fc*0.06+i*2.1);
    /* Draw curtain as vertical gradient strips with wave top edge */
    var strips=Math.floor(w/4);
    for(var sx=0;sx<strips;sx++){
      var xFrac=sx/strips+hDrift;
      if(xFrac<-0.1)xFrac+=1;if(xFrac>1.1)xFrac-=1;
      var x=xFrac*w;
      /* Multi-frequency wave for organic movement */
      var wave1=Math.sin(xFrac*a.waveFreq*Math.PI*2+a.phase)*a.waveAmp;
      var wave2=Math.sin(xFrac*a.waveFreq*1.7*Math.PI*2+a.phase*1.3)*a.waveAmp*0.4;
      var wave3=Math.sin(fc*0.015+xFrac*4+a.phase*0.7)*a.waveAmp*0.2;
      var waveY=a.baseY+wave1+wave2+wave3;
      var edgeFade=1-Math.pow(Math.abs(xFrac-0.5)*2,4);
      /* Height pulses with shimmer */
      var heightPulse=1+0.2*Math.sin(fc*0.02+i*1.3)+0.1*Math.sin(fc*0.05);
      var curtainH=a.height*edgeFade*heightPulse;
      var alpha=baseAlpha*a.brightness*edgeFade*ePulse;
      if(alpha<0.01)continue;
      var topY=waveY*h;
      var botY=topY+curtainH*h;
      var grad=ctx.createLinearGradient(0,topY,0,botY);
      grad.addColorStop(0,hsla(curHue,85,60,0));
      grad.addColorStop(0.08,hsla(curHue,85,55,alpha*0.9));
      grad.addColorStop(0.2,hsla(curHue+5,80,50,alpha*0.75));
      grad.addColorStop(0.45,hsla(curHue+15,70,42,alpha*0.4));
      grad.addColorStop(0.7,hsla(curHue+25,55,32,alpha*0.15));
      grad.addColorStop(1,hsla(curHue+35,45,22,0));
      ctx.fillStyle=grad;
      ctx.fillRect(x,topY,4,curtainH*h);
    }
    /* Bright ray pillars shooting up from curtain — shimmer effect */
    if(a.brightness>0.5){
      var rayCount=3+Math.floor(a.brightness*4);
      for(var ri=0;ri<rayCount;ri++){
        var rayX=(Math.sin(fc*0.01+ri*2.3+a.phase)*0.4+0.5)*w;
        var rayAlpha=baseAlpha*a.brightness*0.25*(0.5+0.5*Math.sin(fc*0.04+ri*1.7))*ePulse;
        if(rayAlpha<0.02)continue;
        var rayGrad=ctx.createLinearGradient(0,a.baseY*h*0.7,0,a.baseY*h);
        rayGrad.addColorStop(0,hsla(curHue,90,65,0));
        rayGrad.addColorStop(0.5,hsla(curHue,85,55,rayAlpha));
        rayGrad.addColorStop(1,hsla(curHue,80,50,rayAlpha*0.3));
        ctx.fillStyle=rayGrad;
        ctx.fillRect(rayX-1,a.baseY*h*0.7,3,a.baseY*h*0.3);
      }
    }
  }
  /* Bright ambient glow layer — stronger */
  var glowAlpha=baseAlpha*0.22;
  var glowGrad=ctx.createLinearGradient(0,h*0.02,0,h*0.45);
  glowGrad.addColorStop(0,hsla(125,70,50,glowAlpha*0.6));
  glowGrad.addColorStop(0.15,hsla(135,65,45,glowAlpha));
  glowGrad.addColorStop(0.4,hsla(145,55,35,glowAlpha*0.4));
  glowGrad.addColorStop(1,hsla(160,40,20,0));
  ctx.fillStyle=glowGrad;
  ctx.fillRect(0,h*0.02,w,h*0.43);
  ctx.restore();
};

P._renderCityscape=function(){
  this.drawSky();
  this.drawSunGlow();
  this.drawSun();
  this.drawMountains();
  this._drawTyndallEffect();
  this.drawStars();
  this._drawAurora();
  this._drawMidAutumnEvent();
  this._drawChristmasEvent();
  this.drawClouds();
  this.drawEasterEggs();
  this.drawBuildingLayer(0);
  this.drawFamousBuildings(0);
  this.drawBuildingLayer(1);
  this.drawFamousBuildings(1);
  this.drawBuildingLayer(2);
  this.drawFamousBuildings(2);
  this.drawRoad();
  this.drawElevatedRoad(0.58,0.60,"highway");
  this.drawTrain();
  this._drawBridgeArch();
  this.drawBuildingLayer(3);
  this.drawFamousBuildings(3);
  this._drawGodzillaBody();
  this.drawElevatedRoad(0.63,0.65,"bridge");
  this.drawBuildingLayer(4);
  this.drawFerrisWheel();
  this.drawFamousBuildingLasers();
  this._drawGodzillaEffects();
  this._drawFireworks();
  this.drawForegroundRoad();
  this.drawWater();
  this._drawShips();
  /* Post-processing overlays */
  this._drawDynamicLighting();
  this._drawSeasonParticles();
  this._drawWeatherParticles();
  this._drawFog();
};

/* ═══════════════════════════════════════════════════════
   START
   ═══════════════════════════════════════════════════════ */
window.player=P;
P.init();

})();
</script>
