<!DOCTYPE html>
<html lang="en" data-theme="xray">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="Pulse of Time - Immersive audio visualizer with music-driven scenes, dynamic weather, seasons, and easter eggs">
<meta name="theme-color" content="#020810">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>CityTone</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
background:var(--bg);color:var(--fg);transition:background .35s,color .35s}

/* ═══ Theme ═══ */
:root{
  --bg:#020810;--surface:rgba(10,22,40,0.85);--border:#0e3a5e;--border2:#0a2540;
  --fg:#4ecdc4;--fg2:#7fdbff;--fg3:#2d8a9e;--fg4:#1a5a6e;
  --accent:#00e5ff;--accent2:#18ffff;--accent-bg:rgba(0,229,255,0.1);--accent-bg2:rgba(0,229,255,0.05);
  --accent-shadow:rgba(0,229,255,0.35);
  --hover:rgba(0,229,255,0.04);--hover2:rgba(0,229,255,0.08);--hover3:rgba(0,229,255,0.15);
  --toast-bg:#0a1628;--toast-border:#0e3a5e;
  --slider-track:rgba(0,229,255,0.15);--slider-thumb:#00e5ff;
  --scrollbar:rgba(0,229,255,0.12);--glass:rgba(2,8,16,0.7);--glass-border:rgba(0,229,255,0.1);--glass-blur:16px;
}

/* ═══ Unified Layout ═══ */
.app{display:flex;flex-direction:column;height:100vh;position:relative}
.viz-stage{flex:1;position:relative;overflow:hidden;background:var(--bg);transition:background .35s}
.viz-stage canvas{display:block;width:100%;height:100%;will-change:contents}
.viz-overlay{position:absolute;bottom:0;left:0;right:0;display:flex;flex-direction:column;
background:linear-gradient(to top,rgba(0,0,0,0.65) 0%,rgba(0,0,0,0.2) 55%,transparent 100%);
padding:36px 20px 14px;pointer-events:none;transition:opacity .5s}
.viz-overlay>*{pointer-events:auto}

/* Auto-hide UI on idle */
body.ui-hidden .topbar,body.ui-hidden .viz-modes,body.ui-hidden .viz-overlay{
  opacity:0;pointer-events:none;transform:translateY(8px)}
body.ui-hidden .playlist-panel:not(.open){transform:translateX(100%);opacity:0}
body.ui-hidden{cursor:none}
.viz-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
flex-direction:column;color:var(--fg4);font-size:14px;pointer-events:none;transition:color .35s}
.viz-empty svg{width:48px;height:48px;margin-bottom:12px;opacity:.3}

/* Top Bar (floating) */
.topbar{position:absolute;top:16px;left:16px;z-index:10;display:flex;align-items:center;gap:10px;
background:var(--glass);border:1px solid var(--glass-border);
backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur));
border-radius:12px;padding:6px 12px;transition:opacity .5s,transform .5s}
.topbar-title{font-size:14px;font-weight:600;color:var(--fg2)}

/* Track Info (overlay) */
.track-info{text-align:center;margin-bottom:12px}
.track-name{font-size:18px;font-weight:600;color:#fff;white-space:nowrap;
overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 4px rgba(0,0,0,0.5)}
.track-meta{font-size:12px;color:rgba(255,255,255,0.6);margin-top:2px}

/* Progress (overlay) */
.progress-wrap{margin-bottom:14px}
.progress-bar{position:relative;width:100%;height:5px;background:rgba(255,255,255,0.15);
border-radius:3px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.progress-fill{height:100%;border-radius:3px;width:0%;pointer-events:none;transition:background .4s}
.progress-thumb{position:absolute;top:50%;width:14px;height:14px;background:#fff;border-radius:50%;
transform:translate(50%,-50%);opacity:0;transition:opacity .2s;pointer-events:none}
.progress-bar:hover .progress-thumb,.progress-bar:active .progress-thumb{opacity:1}
.time-row{display:flex;justify-content:space-between;margin-top:6px;font-size:11px;
color:rgba(255,255,255,0.5);font-variant-numeric:tabular-nums}

/* Controls (overlay) */
.controls{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:10px}
.ctrl-btn{border:none;background:none;color:rgba(255,255,255,0.7);cursor:pointer;padding:8px;
border-radius:50%;display:flex;align-items:center;justify-content:center;
transition:all .2s;-webkit-tap-highlight-color:transparent}
.ctrl-btn:hover{color:#fff;background:rgba(255,255,255,0.12)}
.ctrl-btn:active{transform:scale(0.92)}
.ctrl-btn.on{color:var(--accent)}
.ctrl-btn svg{display:block;pointer-events:none}
.ctrl-play{width:52px;height:52px;color:#fff;border-radius:50%;padding:0;
transition:background .35s,box-shadow .35s}
.ctrl-play:hover{filter:brightness(1.15)}
.ctrl-play:active{transform:scale(0.92)}
.ctrl-play svg{margin:auto}

/* Volume + Playlist Toggle (overlay) */
.bottom-row{display:flex;align-items:center;gap:12px;justify-content:center;max-width:440px;margin:0 auto;width:100%}
.vol-group{display:flex;align-items:center;gap:8px;flex:1}
.vol-group svg{color:rgba(255,255,255,0.5);flex-shrink:0}
.vol-slider{flex:1;-webkit-appearance:none;appearance:none;height:4px;
background:rgba(255,255,255,0.15);border-radius:2px;outline:none}
.vol-slider::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;
background:#fff;border-radius:50%;cursor:pointer}
.vol-slider::-moz-range-thumb{width:12px;height:12px;background:#fff;border-radius:50%;border:none;cursor:pointer}
.pl-toggle{border:none;background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.6);
cursor:pointer;padding:8px 14px;border-radius:8px;font-size:12px;display:flex;align-items:center;gap:5px;
transition:all .2s;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.pl-toggle:hover{background:rgba(255,255,255,0.18);color:#fff}
.pl-toggle.active{background:rgba(255,255,255,0.2);color:#fff}
.pl-toggle svg{pointer-events:none}
.pl-count-badge{background:var(--accent);color:#fff;font-size:10px;padding:1px 6px;border-radius:8px;
min-width:18px;text-align:center}

/* Playlist Panel (right-side) */
.playlist-panel{position:absolute;top:0;right:0;bottom:0;width:320px;
background:rgba(10,15,25,0.55);border-left:1px solid rgba(255,255,255,0.08);
backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
transform:translateX(100%);transition:transform .35s cubic-bezier(0.4,0,0.2,1);
z-index:20;display:flex;flex-direction:column;overflow:hidden}
.playlist-panel.open{transform:translateX(0)}
.pl-handle{width:36px;height:4px;background:var(--glass-border);border-radius:2px;
margin:8px auto 0;flex-shrink:0}
.pl-header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 6px;flex-shrink:0}
.pl-header-left{display:flex;align-items:center;gap:10px}
.pl-title{font-size:14px;font-weight:600;color:var(--fg2)}
.pl-actions-row{display:flex;gap:6px;align-items:center}
.pl-count{font-size:11px;color:var(--fg3);padding:2px 8px;border-radius:10px;background:var(--hover)}
.pl-fold-btn{border:none;background:none;color:var(--fg4);cursor:pointer;padding:6px;border-radius:8px;
display:flex;align-items:center;justify-content:center;transition:all .2s}
.pl-fold-btn:hover{color:var(--fg2);background:var(--hover2)}
.pl-fold-btn svg{pointer-events:none;transition:transform .3s;transform:rotate(90deg)}
.playlist-panel:not(.open) .pl-fold-btn svg{transform:rotate(0deg)}
.clear-btn{border:none;background:none;color:var(--fg4);cursor:pointer;font-size:11px;
padding:4px 8px;border-radius:4px;transition:all .15s}
.clear-btn:hover{color:var(--accent);background:var(--accent-bg2)}
.add-btn{border:1px dashed var(--glass-border);background:none;color:var(--fg3);
font-size:12px;cursor:pointer;padding:4px 10px;border-radius:6px;display:flex;align-items:center;gap:4px;
transition:all .2s;white-space:nowrap}
.add-btn:hover{border-color:var(--accent);color:var(--accent)}
.add-btn svg{pointer-events:none}
.save-btn,.load-btn{border:1px solid var(--glass-border);background:none;color:var(--fg3);
font-size:12px;cursor:pointer;padding:4px 10px;border-radius:6px;display:flex;align-items:center;gap:4px;
transition:all .2s;white-space:nowrap}
.save-btn:hover,.load-btn:hover{border-color:var(--accent);color:var(--accent)}
.save-btn svg,.load-btn svg{pointer-events:none}

.pl-list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 12px 20px}
.pl-list::-webkit-scrollbar{width:4px}
.pl-list::-webkit-scrollbar-track{background:transparent}
.pl-list::-webkit-scrollbar-thumb{background:var(--scrollbar);border-radius:2px}

.pl-item{display:flex;align-items:center;padding:10px 12px;border-radius:10px;
cursor:pointer;transition:all .15s;border:1px solid transparent;margin-bottom:2px}
.pl-item:hover{background:var(--hover2)}
.pl-item.active{background:var(--accent-bg);border-color:var(--accent-bg)}
.pl-idx{width:22px;font-size:11px;color:var(--fg4);text-align:center;flex-shrink:0}
.pl-idx .bars{display:flex;gap:2px;align-items:flex-end;justify-content:center;height:12px}
.pl-idx .bars span{width:2px;background:var(--accent);border-radius:1px;animation:eq .4s ease-in-out infinite alternate}
.pl-idx .bars span:nth-child(1){animation-delay:0s}
.pl-idx .bars span:nth-child(2){animation-delay:.12s}
.pl-idx .bars span:nth-child(3){animation-delay:.24s}
@keyframes eq{0%{height:3px}100%{height:12px}}
.pl-info{flex:1;min-width:0;margin-left:10px}
.pl-name{font-size:13px;font-weight:500;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-dur{font-size:11px;color:var(--fg4);margin-top:1px}
.pl-act-btns{display:flex;gap:2px;margin-left:6px}
.pl-act{border:none;background:none;color:var(--fg4);cursor:pointer;padding:5px;border-radius:6px;
display:flex;transition:all .15s;opacity:0.5}
.pl-item:hover .pl-act,.pl-item.active .pl-act{opacity:1}
.pl-act:hover{color:var(--accent);background:var(--accent-bg)}
.pl-act svg{display:block;pointer-events:none}
.pl-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;
padding:30px 20px;color:var(--fg4)}
.pl-drop-zone{width:100%;border:2px dashed var(--glass-border);border-radius:14px;
padding:32px 20px;display:flex;flex-direction:column;align-items:center;
justify-content:center;text-align:center;transition:all .25s;cursor:pointer}
.pl-drop-zone:hover,.pl-drop-zone.drag-over{border-color:var(--accent);background:var(--accent-bg)}
.pl-drop-zone svg{margin-bottom:12px;opacity:.4;width:36px;height:36px}
.pl-drop-zone p{font-size:14px;color:var(--fg3);margin-bottom:4px}
.pl-drop-zone small{font-size:11px;color:var(--fg4);opacity:.7}
.pl-browse-btn{border:1px solid var(--accent);background:var(--accent-bg);
color:var(--accent);font-size:13px;cursor:pointer;padding:10px 24px;
border-radius:8px;display:flex;align-items:center;gap:6px;margin-top:16px;
transition:all .2s;font-weight:500}
.pl-browse-btn:hover{background:var(--accent);color:var(--bg)}
.pl-browse-btn svg{pointer-events:none}
.pl-quick-add{flex-shrink:0;padding:8px 12px;border-top:1px solid var(--glass-border);
display:flex;align-items:center;gap:10px}
.pl-quick-btn{border:1px solid var(--glass-border);background:none;color:var(--fg3);
font-size:12px;cursor:pointer;padding:6px 14px;border-radius:6px;display:flex;
align-items:center;gap:5px;transition:all .2s;white-space:nowrap}
.pl-quick-btn:hover{border-color:var(--accent);color:var(--accent)}
.pl-quick-btn svg{pointer-events:none}
.pl-quick-hint{font-size:10px;color:var(--fg4);opacity:.6}

/* Toast */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);
background:var(--surface);color:var(--fg2);padding:10px 20px;border-radius:10px;font-size:13px;
z-index:999;transition:all .3s ease;pointer-events:none;
border:1px solid var(--glass-border);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.toast.show{transform:translateX(-50%) translateY(0)}

#audioEl{display:none}
.file-hidden{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}



/* Xray glow extras */
[data-theme="xray"] .ctrl-play{box-shadow:0 0 24px rgba(0,229,255,0.3),0 2px 12px rgba(0,229,255,0.2)}
[data-theme="xray"] .topbar{box-shadow:0 0 20px rgba(0,229,255,0.06)}

/* Touch optimization */
.progress-bar,.vol-slider{-webkit-tap-highlight-color:transparent;touch-action:none}
.ctrl-btn{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.pl-toggle,.add-btn,.clear-btn,.pl-fold-btn,.shuffle-btn,.repeat-btn{
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;min-height:44px;min-width:44px;
  display:flex;align-items:center;justify-content:center}

/* Prevent text selection on controls */
.controls,.progress-bar,.bottom-row,.pl-actions-row{
  -webkit-user-select:none;user-select:none}

/* Mobile-first responsive */
@media(max-width:600px){
  html,body{height:100%;overflow:hidden;position:fixed;width:100%}
  .topbar{top:max(env(safe-area-inset-top),8px);left:max(env(safe-area-inset-left),8px);
    padding:5px 10px;border-radius:10px}
  .topbar-title{font-size:13px}
  .viz-overlay{
    padding:max(env(safe-area-inset-top),16px) max(env(safe-area-inset-left),14px)
            max(env(safe-area-inset-bottom),10px) max(env(safe-area-inset-right),14px);
    padding-top:max(calc(env(safe-area-inset-top) + 16px),28px)}
  .track-name{font-size:16px}
  .track-meta{font-size:11px}
  .controls{gap:10px;margin-bottom:8px}
  .ctrl-btn{padding:10px}
  .ctrl-play{width:52px;height:52px}
  .bottom-row{gap:10px;padding-bottom:max(env(safe-area-inset-bottom),4px)}
  .progress-bar{height:6px}
  .progress-thumb{width:18px;height:18px;opacity:1}
  .vol-slider{height:6px}
  .vol-slider::-webkit-slider-thumb{width:18px;height:18px}
  .vol-slider::-moz-range-thumb{width:18px;height:18px}
  .playlist-panel{
    top:0;bottom:0;right:0;width:85vw;max-width:320px;max-height:none;
    border-radius:16px 0 0 16px;
    padding-top:max(env(safe-area-inset-top),12px);
    padding-bottom:max(env(safe-area-inset-bottom),12px)}
  .playlist-panel.open{transform:translateX(0)}
  .pl-header{padding:12px 14px 6px}
  .pl-item{padding:10px 14px}
  .pl-toggle{min-height:48px;min-width:48px;padding:10px 14px}
  .add-btn,.clear-btn{min-height:40px;padding:6px 14px;font-size:13px}
  .save-btn,.load-btn{min-height:40px;padding:6px 10px;font-size:12px}
  .time-row{font-size:12px}
}
@media(max-width:380px){
  .controls{gap:6px}
  .ctrl-play{width:44px;height:44px}
  .bottom-row{gap:6px}
  .pl-toggle span,.add-btn span,.clear-btn{display:none}
}
</style>
</head>
<body>
<div class="app">
  <!-- Full-screen Visualizer -->
  <div class="viz-stage" id="vizStage">
    <canvas id="vizCanvas"></canvas>
    <div class="viz-empty" id="vizEmpty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      <p>Add audio to start</p>
    </div>

    <!-- Floating Top Bar -->
    <div class="topbar">
      <span class="topbar-title">Pulse of Time</span>
    </div>

    <!-- Overlay Controls -->
    <div class="viz-overlay" id="vizOverlay">
      <div class="track-info">
        <div class="track-name" id="trackName">No Track</div>
        <div class="track-meta" id="trackMeta">Add files to playlist</div>
      </div>

      <div class="progress-wrap">
        <div class="progress-bar" id="progressBar">
          <div class="progress-fill" id="progressFill"></div>
          <div class="progress-thumb" id="progressThumb"></div>
        </div>
        <div class="time-row">
          <span id="curTime">0:00</span>
          <span id="durTime">0:00</span>
        </div>
      </div>

      <div class="controls">
        <button class="ctrl-btn" id="shuffleBtn" title="Shuffle">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
        </button>
        <button class="ctrl-btn" id="prevBtn" title="Previous">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button class="ctrl-btn ctrl-play" id="playBtn" title="Play">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" id="icoPlay"><path d="M8 5v14l11-7z"/></svg>
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" id="icoPause" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <button class="ctrl-btn" id="nextBtn" title="Next">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
        <button class="ctrl-btn" id="repeatBtn" title="Repeat">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 1l4 4-4 4M3 11V9a4 4 0 014-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 01-4 4H3"/></svg>
        </button>
      </div>

      <div class="bottom-row">
        <div class="vol-group">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
          <input type="range" class="vol-slider" id="volSlider" min="0" max="100" value="75">
        </div>
        <button class="pl-toggle" id="plToggle">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M15 6H3v2h12V6zm0 4H3v2h12v-2zM3 16h8v-2H3v2zM17 6v8.18c-.31-.11-.65-.18-1-.18-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3V8h3V6h-5z"/></svg>
          Playlist
          <span class="pl-count-badge" id="plCountBadge">0</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Playlist Panel (right-side) -->
  <div class="playlist-panel" id="playlistPanel">
    <div class="pl-header">
      <div class="pl-header-left">
        <button class="pl-fold-btn" id="plFoldBtn" title="Fold">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <span class="pl-title">Playlist</span>
      </div>
      <div class="pl-actions-row">
        <span class="pl-count" id="plCount">0 tracks</span>
        <button class="clear-btn" id="clearBtn" title="Clear">Clear</button>
        <button class="save-btn" id="saveBtn" title="Save Playlist">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
          <span>Save</span>
        </button>
        <button class="load-btn" id="loadBtn" title="Load Playlist">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          <span>Load</span>
        </button>
        <button class="add-btn" id="addBtn" title="Add Music">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add
        </button>
      </div>
    </div>
    <div class="pl-list" id="plList">
      <!-- Empty state: large drop zone -->
      <div class="pl-empty" id="plEmpty">
        <div class="pl-drop-zone" id="plDropZone">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
          <p>Drop audio files here</p>
          <small>or click below to browse</small>
          <button class="pl-browse-btn" id="plBrowseBtn">

/* ═══════════════════════════════════════════════════════

   ═══════════════════════════════════════════════════════ */
var SCENES={
  cityscape:{
    name:"CityTone",id:"cityscape",

    description:"Urban skyline with buildings, roads, and harbor"

  landscape:{

    energyThreshold:0.08,toneMatch:["sub_bass","bass","mid"],
    description:"Snow-capped mountains, grassland, and river",
    disabled:true
  },
  pixelgrass:{
    name:"Pixel Grassland",id:"pixelgrass",
    energyThreshold:0.12,toneMatch:["mid","high_mid","presence","brilliance"],
    description:"Pixel art grassland with mountains, flowers, and river"
  }
};
P.currentScene="cityscape";
P.targetScene="cityscape";
P.sceneBlend=1;P._sceneSwitchCooldown=0;
P._sceneToneHistory=[];

P._detectSceneSwitch=function(){
  if(this._sceneSwitchCooldown>0){this._sceneSwitchCooldown--;return}
  var energy=this._energy||0;
  var tone=this._toneHue;
  var toneName=null;
  if(tone!==undefined&&tone!==null){
    var keys=Object.keys(TONES);
    for(var k=0;k<keys.length;k++){
      if(TONES[keys[k]].hue===tone){toneName=keys[k];break}
    }
  }
  /* Record tone history */
  this._sceneToneHistory.push({tone:toneName,energy:energy,frame:this.frameCount});
  if(this._sceneToneHistory.length>60)this._sceneToneHistory.shift();
  /* Need enough history to make a decision */
  if(this._sceneToneHistory.length<30)return;
  /* Count dominant tones in recent history */
  var toneCounts={};
  for(var h=0;h<this._sceneToneHistory.length;h++){
    var t=this._sceneToneHistory[h].tone;
    if(t)toneCounts[t]=(toneCounts[t]||0)+1;
  }
  /* Find most frequent tone */
  var maxTone=null,maxCount=0;
  for(var tn in toneCounts){
    if(toneCounts[tn]>maxCount){maxCount=toneCounts[tn];maxTone=tn}
  }
  /* Calculate average energy */
  var avgEnergy=0;
  for(var ae=0;ae<this._sceneToneHistory.length;ae++){
    avgEnergy+=this._sceneToneHistory[ae].energy;
  }
  avgEnergy/=this._sceneToneHistory.length;
  /* Check if current scene still matches */
  var curScene=SCENES[this.currentScene];
  var stillMatches=false;
  if(curScene){
    if(avgEnergy>=curScene.energyThreshold*0.7){
      if(!maxTone||curScene.toneMatch.indexOf(maxTone)!==-1)stillMatches=true;
      if(avgEnergy>=curScene.energyThreshold)stillMatches=true;
    }
  }
  if(stillMatches)return;
  /* Find best matching alternative scene */
  var bestScene=null,bestScore=0;
  var sceneKeys=Object.keys(SCENES);
  for(var si=0;si<sceneKeys.length;si++){
    if(sceneKeys[si]===this.currentScene)continue;
    var sc=SCENES[sceneKeys[si]];
    if(sc.disabled)continue;
    var score=0;
    if(avgEnergy>=sc.energyThreshold)score+=2;
    else if(avgEnergy>=sc.energyThreshold*0.5)score+=1;
    if(maxTone&&sc.toneMatch.indexOf(maxTone)!==-1)score+=3;
    else if(maxTone)score+=1;
    if(score>bestScore){bestScore=score;bestScene=sceneKeys[si]}
  }
  if(bestScene&&bestScore>=3){
    this.targetScene=bestScene;
    this.sceneBlend=0;
    this._sceneSwitchCooldown=300; /* 5 second cooldown */
    this._sceneToneHistory=[];
  }
};

P._updateSceneBlend=function(){
  if(this.sceneBlend<1){

/* ═══════════════════════════════════════════════════════

P._ensureAudio=function(){
  if(!this.audioCtx){
    this.audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    this.analyser=this.audioCtx.createAnalyser();
    this.analyser.fftSize=512;
    this.analyser.smoothingTimeConstant=0.8;
    this.gainNode=this.audioCtx.createGain();
    this.gainNode.gain.value=this.volume;
    this.gainNode.connect(this.analyser);
    this.analyser.connect(this.audioCtx.destination);
    this.freqData=new Uint8Array(this.analyser.frequencyBinCount);
  }
  if(this.audioCtx.state==="suspended")this.audioCtx.resume();
};

P._connectSource=function(){
  if(this.sourceNode){try{this.sourceNode.disconnect()}catch(e){}}
  if(this.audioCtx&&audioEl._srcNode!==this.sourceNode){
    this.sourceNode=this.audioCtx.createMediaElementSource(audioEl);
    audioEl._srcNode=this.sourceNode;
  }
  if(this.sourceNode&&this.gainNode){
    try{this.sourceNode.connect(this.gainNode)}catch(e){}
  }
};

P.loadFile=function(file){
  this._ensureAudio();
  this._connectSource();
  var url=URL.createObjectURL(file);
  audioEl.src=url;
  audioEl.load();
};

P.addToPlaylist=function(file){
  var obj={name:file.name.replace(/\.[^.]+$/,""),url:URL.createObjectURL(file),file:file,dur:0};
  this.playlist.push(obj);
  this.renderPlaylist();
  /* Auto-open playlist panel when adding first tracks */
  if(this.playlist.length<=3&&!playlistPanel.classList.contains("open")){
    playlistPanel.classList.add("open");plToggle.classList.add("active");
  }
  if(this.currentTrack<0)this.play(this.playlist.length-1);
  else this.toast("Added: "+obj.name);
};

P.play=function(idx){
  if(idx<0||idx>=this.playlist.length)return;
  this._ensureAudio();
  this._connectSource();
  this.currentTrack=idx;
  var t=this.playlist[idx];
  audioEl.src=t.url;
  audioEl.load();
  var self=this;
  audioEl.onloadedmetadata=function(){t.dur=audioEl.duration;self.renderPlaylist()};
  audioEl.onended=function(){self.onTrackEnd()};
  audioEl.play().then(function(){
    self.isPlaying=true;self._updatePlayIcon();self.renderPlaylist();
    trackNameEl.textContent=t.name;
  }).catch(function(){});
};

P.pause=function(){
  audioEl.pause();this.isPlaying=false;this._updatePlayIcon();this.renderPlaylist();
};

P.togglePlay=function(){
  if(this.playlist.length===0){
    /* Open playlist panel so user can add music */
    if(!playlistPanel.classList.contains("open")){
      playlistPanel.classList.add("open");plToggle.classList.add("active");
    }
    fileInput.click();
    return;
  }
  if(this.currentTrack<0){this.play(0);return}
  if(this.isPlaying)this.pause();else{
    this._ensureAudio();
    audioEl.play().then(function(){P.isPlaying=true;P._updatePlayIcon();P.renderPlaylist()}).catch(function(){});
  }
};

P.next=function(){
  if(this.playlist.length===0)return;
  if(this.shuffle){
    var n=randi(0,this.playlist.length-1);
    if(this.playlist.length>1)while(n===this.currentTrack)n=randi(0,this.playlist.length-1);
    this.play(n);
  }else{
    var idx=this.currentTrack+1;
    if(idx>=this.playlist.length){
      if(this.repeat===1)idx=0;else{this.pause();return}
    }
    this.play(idx);
  }
};

P.prev=function(){
  if(this.playlist.length===0)return;
  if(audioEl.currentTime>3){audioEl.currentTime=0;return}
  var idx=this.currentTrack-1;
  if(idx<0)idx=this.repeat===1?this.playlist.length-1:0;
  this.play(idx);
};

P.onTrackEnd=function(){
  if(this.repeat===2){
    this._ensureAudio();
    audioEl.currentTime=0;audioEl.play().catch(function(){});return;
  }
  this.next();
};

P.seek=function(frac){
  if(!audioEl.duration||!isFinite(audioEl.duration))return;
  audioEl.currentTime=frac*audioEl.duration;
};

P.setVolume=function(v){
  this.volume=clamp(v,0,1);
  if(this.gainNode)this.gainNode.gain.value=this.volume;
  volSlider.value=Math.round(this.volume*100);
};

P._updatePlayIcon=function(){
  icoPlay.style.display=this.isPlaying?"none":"block";
  icoPause.style.display=this.isPlaying?"block":"none";
};

P._updateProgress=function(){
  if(!audioEl.duration||!isFinite(audioEl.duration))return;
  var pct=(audioEl.currentTime/audioEl.duration)*100;
  progressFill.style.width=pct+"%";
  progressThumb.style.left=pct+"%";
  curTimeEl.textContent=fmtTime(audioEl.currentTime);
  durTimeEl.textContent=fmtTime(audioEl.duration);

};

P.renderPlaylist=function(){

  if(list.length===0){
    plList.innerHTML="";
    plList.appendChild(plEmpty);
    plEmpty.style.display="flex";
    plQuickAdd.style.display="none";
    return;
  }
  plEmpty.style.display="none";
  plQuickAdd.style.display="flex";
  var html="";
  for(var i=0;i<list.length;i++){
    var t=list[i],active=i===this.currentTrack;
    html+='<div class="pl-item'+(active?" active":"")+'" data-idx="'+i+'">';
    if(active&&this.isPlaying){
      html+='<div class="pl-idx"><div class="bars"><span></span><span></span><span></span></div></div>';
    }else{
      html+='<div class="pl-idx">'+(i+1)+'</div>';
    }
    html+='<div class="pl-info"><div class="pl-name">'+t.name+'</div>';
    html+='<div class="pl-dur">'+(t.dur?fmtTime(t.dur):"--:--")+'</div></div>';
    html+='<div class="pl-act-btns"><button class="pl-act pl-remove" data-idx="'+i+'" title="Remove">';
    html+='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
    html+='</button></div></div>';
  }
  plList.innerHTML=html;
  var items=plList.querySelectorAll(".pl-item");
  for(var j=0;j<items.length;j++){
    items[j].addEventListener("click",(function(idx){return function(e){
      if(e.target.closest(".pl-remove"))return;P.play(idx);
    }})(parseInt(items[j].dataset.idx)));
  }
  var rmBtns=plList.querySelectorAll(".pl-remove");
  for(var k=0;k<rmBtns.length;k++){
    rmBtns[k].addEventListener("click",(function(idx){return function(e){
      e.stopPropagation();var wasPlaying=P.currentTrack===idx&&P.isPlaying;
      URL.revokeObjectURL(P.playlist[idx].url);
      P.playlist.splice(idx,1);
      if(P.playlist.length===0){P.currentTrack=-1;P.pause();trackNameEl.textContent="No Track";trackMetaEl.textContent="Add files to playlist"}
      else if(idx===P.currentTrack){P.currentTrack=Math.min(idx,P.playlist.length-1);if(wasPlaying)P.play(P.currentTrack)}
      else if(idx<P.currentTrack)P.currentTrack--;
      P.renderPlaylist();
    }})(parseInt(rmBtns[k].dataset.idx)));
  }
};

P.clearPlaylist=function(){
  for(var i=0;i<this.playlist.length;i++)URL.revokeObjectURL(this.playlist[i].url);
  this.playlist=[];this.currentTrack=-1;
  audioEl.pause();audioEl.src="";this.isPlaying=false;
  this._updatePlayIcon();
  trackNameEl.textContent="No Track";trackMetaEl.textContent="Add files to playlist";
  progressFill.style.width="0%";curTimeEl.textContent="0:00";durTimeEl.textContent="0:00";
  this.renderPlaylist();this.toast("Playlist cleared");
};

P.savePlaylist=function(){
  var saved=[];
  var pending=0;
  if(this.playlist.length===0){this.toast("Nothing to save");return}
  for(var i=0;i<this.playlist.length;i++){
    (function(idx){
      pending++;
      var track=this.playlist[idx];
      var reader=new FileReader();
      reader.onload=function(e){
        saved[idx]={name:track.name,data:e.target.result};
        pending--;
        if(pending===0)_finish();
      };
      reader.onerror=function(){pending--;if(pending===0)_finish()};
      reader.readAsDataURL(track.file);
    })(i);
  }
  var self=this;
  function _finish(){
    try{
      localStorage.setItem("citytone_playlist",JSON.stringify(saved));
      self.toast("Saved "+saved.length+" tracks");
    }catch(e){
      self.toast("Save failed (storage full)");
    }
  }
};

P.loadPlaylist=function(){
  var raw=localStorage.getItem("citytone_playlist");
  if(!raw){this.toast("No saved playlist found");return}
  try{
    var saved=JSON.parse(raw);
    if(!saved.length){this.toast("Saved playlist is empty");return}
    var self=this;
    var loaded=0;
    for(var i=0;i<saved.length;i++){
      (function(s){
        var parts=s.data.split(",");
        var mime=parts[0].match(/:(.*?);/)[1];
        var b64=parts.slice(1).join(",");
        var bin=atob(b64);
        var arr=new Uint8Array(bin.length);
        for(var j=0;j<bin.length;j++)arr[j]=bin.charCodeAt(j);
        var file=new File([arr],s.name,{type:mime});
        self.addToPlaylist(file);
        loaded++;
      })(saved[i]);
    }
    this.toast("Loaded "+loaded+" tracks");
  }catch(e){
    this.toast("Load failed (corrupted data)");
  }
};

P.clearSavedPlaylist=function(){
  localStorage.removeItem("citytone_playlist");
  this.toast("Saved playlist deleted");
};

/* ═══════════════════════════════════════════════════════
   CELESTIAL SYSTEM
   ═══════════════════════════════════════════════════════ */
P.initStars=function(){
  this.stars=[];
  /* Star magnitude distribution: many dim, few bright */
  for(var i=0;i<280;i++){
    var isTrailer=Math.random()<0.35;
    /* Power-curve size: mostly small, occasional large */
    var mag=Math.pow(Math.random(),1.8);
    var size=mag<0.7?randf(0.4,1.2):mag<0.9?randf(1,2.2):randf(2,3.5);
    /* Brightness correlated with size but with scatter */
    var brightness=size<1?randf(0.2,0.5):size<2?randf(0.4,0.8):randf(0.7,1);
    /* Color tint: most white, some warm/cool */
    var tint=Math.random();
    var colorR=tint>0.9?255:tint>0.8?255:240;
    var colorG=tint>0.9?220:tint>0.8?245:240;
    var colorB=tint>0.9?180:tint>0.8?200:255;
    this.stars.push({x:Math.random(),y:Math.random()*0.55,
      size:size,
      twinkleSpeed:randf(0.3,2.5),twinkleOffset:Math.random()*Math.PI*2,
      brightness:brightness,
      r:colorR,g:colorG,b:colorB,
      trailer:isTrailer&&size>0.8,
      trailAngle:isTrailer?randf(0,Math.PI*2):0,
      trailSpeed:isTrailer?randf(0.1,0.4):0,
      trailLen:isTrailer?Math.floor(size*randi(3,6)):0});
  }
};
/* ═══ Aurora Borealis ═══ */
P.auroraStraps=[];
P.initAurora=function(){
  this.auroraStraps=[];

      waveAmp:0.01+Math.random()*0.025,
      hue:110+Math.random()*60,
      hueDrift:Math.random()*0.5,
      phase:Math.random()*Math.PI*2,

      height:0.04+Math.random()*0.08,
      drift:Math.random()<0.5?1:-1
    });
  }
};

P.updateCelestial=function(){
  /* Special date events detection */
  var d=new Date();var m=d.getMonth()+1;var day=d.getDate();
  this._midAutumnActive=(m===9&&day>=15&&day<=17)||(m===9&&this._isCityPop&&this.nightFactor>0.5);
  this._christmasActive=(m===12&&(day===24||day===25));
  /* Day-night loop always runs when idling or playing */
  /* City-pop music extends night (slower cycle, more night time) */
  var timeSpeed=0.00008;
  if(this._isCityPop){
    var sp=this._sunProgress;
    /* During night half (0.5-1.0), slow down 3x to extend night */
    if(sp>0.5){timeSpeed=0.00003}
    /* During dusk/dawn transition, slow 2x for longer golden hour */
    else if(sp<0.1||sp>0.4){timeSpeed=0.00004}
  }
  this.time+=timeSpeed;
  /* Full day cycle: 0=dawn, 0.25=noon, 0.5=dusk, 0.75=midnight, 1.0=dawn */
  this._sunProgress=(this.time%1);
  var sp=this._sunProgress;
  /* Sun: visible 0→0.5 (dawn→noon→dusk), hidden 0.5→1.0 */
  var sunPhase=sp<0.5?sp/0.5:0; /* 0→1 during day half */
  /* Moon: visible 0.5→1.0 (dusk→midnight→dawn), hidden 0→0.5 */
  var moonPhase=sp>=0.5?(sp-0.5)/0.5:0; /* 0→1 during night half */
  /* Night factor: 0 at noon, 1 at midnight — extended dawn/dusk plateaus */
  /* Dawn: sp 0→0.18 (18% of cycle), Day: sp 0.18→0.38, Dusk: sp 0.38→0.55, Night: sp 0.55→1.0 */
  /* Season-adjusted day length: autumn has shorter days */
var season=this.currentSeason;
var sBlend=this.seasonBlend;
/* Autumn: shift dawn later and dusk earlier (shorter days) */
var dawnEnd=0.18,dayEnd=0.38,duskEnd=0.55;
if(season===2||this.targetSeason===2){
  var ab=season===2?(1-sBlend):sBlend;
  dawnEnd=lerp(dawnEnd,0.22,ab);dayEnd=lerp(dayEnd,0.33,ab);duskEnd=lerp(duskEnd,0.48,ab);
}
/* Winter: even shorter days */
if(season===3||this.targetSeason===3){
  var wb=season===3?(1-sBlend):sBlend;
  dawnEnd=lerp(dawnEnd,0.25,wb);dayEnd=lerp(dayEnd,0.32,wb);duskEnd=lerp(duskEnd,0.45,wb);
}
/* Smooth cosine-based night factor: no hard jumps */
/* Map sp to a 0-1 phase within dawn/day/dusk/night, then use cosine easing */
var nightTarget=0;
if(sp<dawnEnd){
  /* Dawn: 1→0 smooth cosine */
  var t=sp/dawnEnd;
  nightTarget=0.5*(1+Math.cos(t*Math.PI));
}else if(sp<dayEnd){
  nightTarget=0;
}else if(sp<duskEnd){
  /* Dusk: 0→1 smooth cosine */
  var t=(sp-dayEnd)/(duskEnd-dayEnd);
  nightTarget=0.5*(1-Math.cos(t*Math.PI));
}else{
  /* Night: stays near 1 with gentle breathing */
  var nightT=(sp-duskEnd)/(1.0-duskEnd+0.01);
  nightTarget=0.85+0.15*Math.cos(nightT*Math.PI*0.5);
}
this._targetNight=clamp(nightTarget,0,1);
/* Winter nights are brighter (snow reflects light) */
var winterBlend=this.currentSeason===3?1-this.seasonBlend:(this.targetSeason===3?this.seasonBlend:0);
if(winterBlend>0.01){this._targetNight*=lerp(1,0.82,winterBlend)}
  /* Faster lerp: 0.012 instead of 0.005 — smoother tracking of the smooth target */
  this.nightFactor=lerp(this.nightFactor,this._targetNight,0.012);
  var w=this.W,h=this.H;
  /* Sun arc: rises left, sets right */
  this._sunX=sunPhase*(w*1.2)-w*0.1;
  this._sunY=h*0.6-Math.sin(sunPhase*Math.PI)*h*0.45;
  /* Moon arc: rises right (as sun sets), sets left (as sun rises) */
  this._moonX=w-moonPhase*(w*1.2)+w*0.1;
  this._moonY=h*0.55-Math.sin(moonPhase*Math.PI)*h*0.4;
  /* Moon phase based on sun-moon position */
  var angle=Math.atan2(this._sunY-this._moonY,this._sunX-this._moonX);
  this._moonPhase=(angle+Math.PI)/(Math.PI*2);
  /* Randomly switch dawn/dusk palette at each transition */
  var sunHalf=sp<0.5?0:1;
  if(sunHalf!==this._lastSunHalf){
    this._lastSunHalf=sunHalf;
    if(sunHalf===0){
      /* Entering dawn: pick new dawn palette */
      this._dawnPalette=Math.floor(Math.random()*DUSK_PALETTES.length);
    }else{
      /* Entering dusk: pick new dusk palette */
      this._duskPalette=Math.floor(Math.random()*DUSK_PALETTES.length);
    }
    this._skyCacheKey=""; /* force sky re-cache */
    this._sunGlowCacheKey=""; /* force glow re-cache */
  }
};

P.drawSky=function(){
  var w=this.W,h=this.H,nf=this.nightFactor;
  var sp=this._sunProgress;
  var dim=this._getWeatherDim();
  var cacheKey=Math.round(w)+"|"+Math.round(h)+"|"+Math.round(nf*20)+"|"+Math.round(dim*10);
  if(this._skyCacheKey!==cacheKey){
    this._skyCacheKey=cacheKey;
    var dTop=dim*15,dMid=dim*10,dBot=dim*8;
    /* Season-adjusted hue/saturation */
    var sTopH=this._getSeasonLerp("skyTopH");
    var sTopS=this._getSeasonLerp("skyTopS");
    var sBotH=this._getSeasonLerp("skyBotH");
    var sAmbient=this._getSeasonLerp("ambient");
    /* Day palette: season-tinted sky → white mid → palette horizon */
    /* Night palette: deep indigo top → dark blue mid → dark violet bottom */
    var pal=this._getDuskPalette();
    var pMidH=pal[0],pHorH=pal[1],pBotH=pal[2];
    var pMidS=pal[3],pHorS=pal[4],pBotS=pal[5];
    var pMidL=pal[6],pHorL=pal[7],pBotL=pal[8];
    /* Golden hour intensity: peaks near dawn (sp~0.05) and dusk (sp~0.45-0.5) */
    var goldenDawn=sp<0.15?clamp(1-sp/0.15,0,1):0;
    var goldenDusk=sp>0.38&&sp<0.52?clamp((sp-0.38)/0.08,0,1)*(sp<0.5?1:clamp(1-(sp-0.5)/0.02,0,1)):0;
    var goldenH=Math.max(goldenDawn,goldenDusk);
    var contrastBoost=goldenH*0.35;
    var grad=ctx.createLinearGradient(0,0,0,h);
    if(nf<0.5){
      var t=nf*2;
      /* Top: season sky color → deep indigo */
      grad.addColorStop(0,hsl(lerp(sTopH,250,nf),lerp(sTopS,50,nf),clamp(lerp(72+sAmbient*0.2,12,nf)-dTop,5,90)));
      /* Upper mid: lighter sky → teal-blue */
      var umidL=clamp(lerp(82+sAmbient*0.15,20,nf)-dMid,5,90)+goldenH*8;
      grad.addColorStop(0.25,hsl(lerp(sTopH+5,235,nf),lerp(sTopS-10,45,nf)+goldenH*10,umidL));
      /* Golden hour band: vivid warm palette color at mid-height (HIGH CONTRAST) */
      if(goldenH>0.05){
        grad.addColorStop(0.38,hsl(lerp(pMidH,40,nf),lerp(pMidS+15,85,goldenH),clamp(pMidL+sAmbient*0.1+contrastBoost*20-dBot,5,95)));
        grad.addColorStop(0.48,hsl(lerp(pHorH,25,nf),lerp(pHorS+12,90,goldenH),clamp(pHorL+sAmbient*0.1+contrastBoost*25-dBot,5,95)));
      }
      /* Middle: warm white → deep blue (no green) */
      var midL=clamp(lerp(90+sAmbient*0.1,24,nf)-dMid,5,95)+goldenH*5;
      grad.addColorStop(0.55,hsl(lerp(210,225,nf),lerp(35,40,nf)+goldenH*8,midL));
      /* Lower mid: palette color → blue-violet */
      grad.addColorStop(0.72,hsl(lerp(pMidH,255,nf),lerp(pMidS,40,nf)+contrastBoost*10,clamp(lerp(pMidL+sAmbient*0.1,20,nf)-dBot,5,90)));
      /* Horizon: palette color → deep purple */
      grad.addColorStop(0.88,hsl(lerp(pHorH,270,nf),lerp(pHorS,50,nf)+contrastBoost*15,clamp(lerp(pHorL+sAmbient*0.1,16,nf)-dBot,5,90)));
      /* Bottom: palette color → dark violet */
      grad.addColorStop(1,hsl(lerp(pBotH,280,nf),lerp(pBotS,40,nf)+contrastBoost*8,clamp(lerp(pBotL,12,nf)-dBot,5,80)));
    }else{
      var n2=(nf-0.5)*2;
      grad.addColorStop(0,hsl(265,45,clamp(10-dTop,5,90)));
      grad.addColorStop(0.3,hsl(lerp(240,250,n2),40,clamp(lerp(18,10,n2)-dMid,5,90)));
      grad.addColorStop(0.55,hsl(lerp(230,245,n2),35,clamp(lerp(22,14,n2)-dMid,5,90)));
      grad.addColorStop(0.72,hsl(lerp(260,260,n2),lerp(35,30,n2),clamp(lerp(20,10,n2)-dBot,5,90)));
      grad.addColorStop(0.88,hsl(275,30,clamp(lerp(18,8,n2)-dBot,5,90)));
      grad.addColorStop(1,hsl(280,35,clamp(12-dBot,5,80)));
    }
    this._skyCache=grad;
  }
  ctx.fillStyle=this._skyCache;
  ctx.fillRect(0,0,w,h);
};

P._getDuskPalette=function(){
  /* Use dawn palette for sp<0.5 (day half starts at dawn), dusk palette for sp>=0.5 */
  var idx=this._sunProgress<0.5?this._dawnPalette:this._duskPalette;
  return DUSK_PALETTES[idx];
};

P._getWeatherDim=function(){
  var wt=WTYPES[this.currentWeather];
  if(!wt)return 0;
  var t=WTYPES[this.prevWeather];
  var p=wt.p*(this.weatherBlend)+(t?t.p:0)*(1-this.weatherBlend);
  return clamp(p,0,1);
};

P.drawSunGlow=function(){
  if(this.nightFactor>0.9)return;
  var w=this.W,h=this.H,x=this._sunX,y=this._sunY;
  /* Mountain horizon: front layer base at ~h*0.536 */
  var mountainHorizon=h*0.536;
  /* Sun elevation above horizon (negative = below horizon) */
  var sunElev=mountainHorizon-y;
  /* Glow is strongest when sun is near the horizon, fading when high up or far below */
  var elevNorm=clamp(sunElev/(h*0.4),-0.3,1);
  /* Horizon proximity: peaks when sun is within 20% of screen height of horizon */
  var horizonProximity=Math.exp(-elevNorm*elevNorm*8);
  /* Base alpha from nightFactor */
  var nightAlpha=clamp(1-this.nightFactor*1.2,0,1);
  /* Combined: strongest glow at sunrise/sunset (near horizon), moderate at noon, zero at deep night */
  var alpha=clamp(horizonProximity*0.55+nightAlpha*0.12,0,1)*0.65;
  if(alpha<0.005)return;
  /* Glow radius grows when sun is near horizon (atmospheric scattering) */
  var baseR=Math.max(1,Math.min(w,h)*0.35);
  var r=baseR*(1+horizonProximity*0.6);
  var cacheKey=Math.round(x)+"|"+Math.round(y)+"|"+Math.round(r)+"|"+Math.round(alpha*100);
  if(this._sunGlowCacheKey!==cacheKey){
    this._sunGlowCacheKey=cacheKey;
    var pal=this._getDuskPalette();
    var gH1=pal[12],gH2=pal[13],gH3=pal[14];
    var grad=ctx.createRadialGradient(x,y,0,x,y,r);
    grad.addColorStop(0,hsla(35,100,92,alpha*0.85));
    grad.addColorStop(0.08,hsla(gH1,100,85,alpha*0.6));
    grad.addColorStop(0.18,hsla(gH2,90,75,alpha*0.4));
    grad.addColorStop(0.3,hsla(gH3,80,70,alpha*0.25));
    grad.addColorStop(0.45,hsla(210,50,80,alpha*0.18));
    grad.addColorStop(0.6,hsla(220,55,68,alpha*0.12));
    grad.addColorStop(0.75,hsla(265,55,50,alpha*0.07));
    grad.addColorStop(0.88,hsla(280,50,38,alpha*0.03));
    grad.addColorStop(1,hsla(285,45,30,0));
    this._sunGlowCache=grad;
  }
  ctx.fillStyle=this._sunGlowCache;
  ctx.fillRect(x-r,y-r,r*2,r*2);
};

P.drawMoonGlow=function(){
  if(this.nightFactor<0.5)return;
  var w=this.W,h=this.H,x=this._moonX,y=this._moonY;
  var alpha=clamp((this.nightFactor-0.5)*2,0,1)*0.35;
  var r=Math.max(1,Math.min(w,h)*0.25);
  var cacheKey=Math.round(x)+"|"+Math.round(y)+"|"+Math.round(r)+"|"+Math.round(alpha*100);
  if(this._moonGlowCacheKey!==cacheKey){
    this._moonGlowCacheKey=cacheKey;
    var grad=ctx.createRadialGradient(x,y,0,x,y,r);
    grad.addColorStop(0,hsla(220,40,85,alpha));
    grad.addColorStop(0.3,hsla(220,30,70,alpha*0.4));
    grad.addColorStop(0.6,hsla(220,20,55,alpha*0.1));
    grad.addColorStop(1,hsla(220,10,45,0));
    this._moonGlowCache=grad;
  }
  ctx.fillStyle=this._moonGlowCache;
  ctx.fillRect(x-r,y-r,r*2,r*2);
};

P.drawSun=function(){
  if(this.nightFactor>0.9)return;
  var x=this._sunX,y=this._sunY;
  var w=this.W,h=this.H;
  var mountainHorizon=h*0.536;
  var sunElev=mountainHorizon-y;
  /* Sun visibility: hidden when far below horizon, fading when near/below horizon */
  var visibility=clamp(sunElev/(h*0.08),0,1);
  /* Warm color shift near horizon (more orange/red when low) */
  var horizonTint=clamp(1-Math.abs(sunElev)/(h*0.3),0,1);
  var nightFade=clamp(1-this.nightFactor*1.2,0,1);
  var alpha=clamp(visibility*nightFade,0,1);
  if(alpha<0.005)return;
  var r=PX*5;
  ctx.globalAlpha=alpha;
  /* Corona shimmer — larger and warmer near horizon */
  var coronaR=r*(1.8+horizonTint*0.8);
  var coronaGrad=ctx.createRadialGradient(x,y,r*0.85,x,y,coronaR);
  coronaGrad.addColorStop(0,hsla(35,100,90,alpha*0.3));
  coronaGrad.addColorStop(0.3,hsla(30+horizonTint*5,90,80,alpha*0.15));
  coronaGrad.addColorStop(0.6,hsla(25+horizonTint*10,80,70,alpha*0.06));
  coronaGrad.addColorStop(1,hsla(20+horizonTint*10,70,60,0));
  ctx.fillStyle=coronaGrad;
  ctx.beginPath();ctx.arc(x,y,coronaR,0,Math.PI*2);ctx.fill();
  /* Spherical sun body — horizon-tinted color shift */
  var sunGrad=ctx.createRadialGradient(x-r*0.2,y-r*0.2,0,x,y,r);
  var sunCenterH=45-horizonTint*10;
  var sunEdgeH=10+horizonTint*5;
  sunGrad.addColorStop(0,hsla(sunCenterH,100,100,1));
  sunGrad.addColorStop(0.3,hsla(sunCenterH-5,100,96,1));
  sunGrad.addColorStop(0.6,hsla(sunCenterH-15,100,88,0.98));
  sunGrad.addColorStop(0.85,hsla(sunEdgeH,95,75,0.95));
  sunGrad.addColorStop(1,hsla(sunEdgeH-5,90,60,0.85));
  ctx.fillStyle=sunGrad;
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  /* Sunspots */
  ctx.fillStyle="rgba(200,80,0,0.2)";
  ctx.beginPath();ctx.arc(x-r*0.25,y+r*0.1,r*0.08,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(x+r*0.3,y-r*0.2,r*0.06,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="rgba(210,100,20,0.15)";
  ctx.beginPath();ctx.arc(x+r*0.1,y+r*0.35,r*0.05,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=1;
};

P.drawMoon=function(){
  if(this.nightFactor<0.3)return;
  var x=this._moonX,y=this._moonY;
  var alpha=clamp((this.nightFactor-0.3)/0.5,0,1);
  var r=PX*5;
  ctx.globalAlpha=alpha;
  /* Outer lunar glow — soft blue-white halo */
  var glowR=r*2.0;
  var glowGrad=ctx.createRadialGradient(x,y,r*0.85,x,y,glowR);
  glowGrad.addColorStop(0,hsla(220,18,88,alpha*0.22));
  glowGrad.addColorStop(0.3,hsla(225,22,80,alpha*0.12));
  glowGrad.addColorStop(0.6,hsla(230,20,72,alpha*0.05));
  glowGrad.addColorStop(1,hsla(230,18,65,0));
  ctx.fillStyle=glowGrad;
  ctx.beginPath();ctx.arc(x,y,glowR,0,Math.PI*2);ctx.fill();
  /* Moon body — detailed spherical gradient with subtle color variation */
  var moonGrad=ctx.createRadialGradient(x-r*0.28,y-r*0.28,0,x,y,r);
  moonGrad.addColorStop(0,hsla(230,12,97,1));
  moonGrad.addColorStop(0.3,hsla(228,10,94,1));
  moonGrad.addColorStop(0.55,hsla(226,12,90,1));
  moonGrad.addColorStop(0.75,hsla(225,10,85,1));
  moonGrad.addColorStop(0.9,hsla(222,12,78,1));
  moonGrad.addColorStop(1,hsla(220,15,68,0.95));
  ctx.fillStyle=moonGrad;
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  /* Lunar surface features (drawn BEFORE phase shadow so they show on lit side) */
  /* Maria — large dark basaltic plains */
  var mariaData=[
    {cx:-0.20,cy:0.05,rx:0.28,ry:0.22,a:0.13},
    {cx:0.22,cy:-0.10,rx:0.22,ry:0.18,a:0.11},
    {cx:-0.05,cy:-0.35,rx:0.18,ry:0.12,a:0.10},
    {cx:0.15,cy:0.30,rx:0.15,ry:0.20,a:0.09},
    {cx:-0.35,cy:-0.15,rx:0.12,ry:0.10,a:0.07}
  ];
  for(var mi=0;mi<mariaData.length;mi++){
    var m=mariaData[mi];
    ctx.fillStyle="rgba(80,85,110,"+m.a+")";
    ctx.beginPath();ctx.ellipse(x+m.cx*r,y+m.cy*r,m.rx*r,m.ry*r,0,0,Math.PI*2);ctx.fill();
    /* Maria internal detail: slightly lighter center for depth */
    ctx.fillStyle="rgba(90,95,120,"+m.a*0.5+")";
    ctx.beginPath();ctx.ellipse(x+m.cx*r+m.rx*r*0.1,y+m.cy*r+m.ry*r*0.1,m.rx*r*0.6,m.ry*r*0.5,0,0,Math.PI*2);ctx.fill();
  }
  /* Craters — 10 craters with rims and shadows */
  var craterData=[
    {cx:-0.30,cy:-0.20,r:0.18,d:0.25},{cx:0.25,cy:0.30,r:0.15,d:0.20},
    {cx:-0.10,cy:0.45,r:0.11,d:0.18},{cx:0.35,cy:-0.20,r:0.12,d:0.15},
    {cx:-0.40,cy:0.15,r:0.09,d:0.12},{cx:0.10,cy:-0.42,r:0.08,d:0.12},
    {cx:0.00,cy:0.15,r:0.10,d:0.10},{cx:-0.20,cy:-0.40,r:0.07,d:0.08},
    {cx:0.30,cy:0.10,r:0.06,d:0.08},{cx:-0.15,cy:0.35,r:0.05,d:0.06}
  ];
  for(var ci=0;ci<craterData.length;ci++){
    var c=craterData[ci];
    var ccx=x+c.cx*r,ccy=y+c.cy*r,cr=c.r*r;
    /* Crater floor (slightly darker) */
    ctx.fillStyle="rgba(140,145,170,"+c.d*0.5+")";
    ctx.beginPath();ctx.arc(ccx,ccy,cr,0,Math.PI*2);ctx.fill();
    /* Crater rim highlight (top-left lit edge) */
    ctx.strokeStyle="rgba(200,205,225,"+c.d*0.4+")";
    ctx.lineWidth=Math.max(0.5,cr*0.15);
    ctx.beginPath();ctx.arc(ccx-cr*0.1,ccy-cr*0.1,cr*0.9,Math.PI*1.1,Math.PI*1.9);ctx.stroke();
    /* Crater interior shadow (bottom-right) */
    ctx.fillStyle="rgba(110,115,140,"+c.d*0.35+")";
    ctx.beginPath();ctx.arc(ccx+cr*0.08,ccy+cr*0.08,cr*0.65,0,Math.PI*2);ctx.fill();
    /* Small central peak for larger craters */
    if(cr>r*0.12){
      ctx.fillStyle="rgba(180,185,205,"+c.d*0.3+")";
      ctx.beginPath();ctx.arc(ccx-cr*0.1,ccy-cr*0.1,cr*0.15,0,Math.PI*2);ctx.fill();
    }
  }
  /* Ray system — bright streaks from Tycho-like crater */
  ctx.strokeStyle="rgba(200,205,225,0.06)";
  ctx.lineWidth=Math.max(0.5,r*0.02);
  for(var ray=0;ray<6;ray++){
    var rAngle=ray*Math.PI/3+0.3;
    ctx.beginPath();ctx.moveTo(x+craterData[1].cx*r,y+craterData[1].cy*r);
    ctx.lineTo(x+Math.cos(rAngle)*r*0.9,y+Math.sin(rAngle)*r*0.9);ctx.stroke();
  }
  /* Phase shadow — crescent illumination with smooth terminator */
  var phase=this._moonPhase||0.5;
  /* Smooth terminator using gradient instead of flat ellipse */
  var phaseAngle=phase*Math.PI*2;
  var shadowDir=phase<0.5?1:-1;
  var shadowWidth=Math.abs(Math.cos(phaseAngle));
  if(shadowWidth<0.02)shadowWidth=0.02;
  /* Clamp shadow to never fully cover or fully reveal */
  shadowWidth=clamp(shadowWidth,0.05,0.98);
  /* Draw phase shadow with soft edge */
  ctx.save();
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.clip();
  var shGrad;
  if(shadowDir>0){
    shGrad=ctx.createLinearGradient(x-r,y,x+r,y);
    shGrad.addColorStop(0,hsla(230,20,90,0));
    shGrad.addColorStop(clamp(1-shadowWidth-0.08,0,0.95),hsla(230,20,90,0));
    shGrad.addColorStop(clamp(1-shadowWidth,0,1),hsla(225,25,18,0.7));
    shGrad.addColorStop(1,hsla(220,20,12,0.85));
  }else{
    shGrad=ctx.createLinearGradient(x+r,y,x-r,y);
    shGrad.addColorStop(0,hsla(230,20,90,0));
    shGrad.addColorStop(clamp(1-shadowWidth-0.08,0,0.95),hsla(230,20,90,0));
    shGrad.addColorStop(clamp(1-shadowWidth,0,1),hsla(225,25,18,0.7));
    shGrad.addColorStop(1,hsla(220,20,12,0.85));
  }
  ctx.fillStyle=shGrad;
  ctx.fillRect(x-r,y-r,r*2,r*2);
  ctx.restore();
  /* Earthshine — faint illumination on the shadow side */
  if(shadowWidth>0.3){
    var esAlpha=(shadowWidth-0.3)*0.08;
    ctx.fillStyle=hsla(220,15,55,esAlpha);
    ctx.beginPath();ctx.arc(x,y,r*0.95,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
};


/* ═══════════════════════════════════════════════════════
   MOUNTAINS (3 layers)
   ═══════════════════════════════════════════════════════ */
P.initMountains=function(){
  this.mountains=[];
  var seeds=[42,137,256];
  for(var layer=0;layer<3;layer++){
    var pts=[];
    var rng=seededRng(seeds[layer]);
    var segments=16+layer*4;
    for(var i=0;i<=segments;i++){
      var x=i/segments;
      var peakH=0.015+layer*0.01+rng()*0.015;
      if(i>0&&i<segments)peakH+=rng()*0.008;
      pts.push({x:x,h:peakH});
    }
    this.mountains.push({points:pts,baseY:0.50+layer*0.018,alpha:0.18+layer*0.08});
  }
};

P.drawMountains=function(){
  var w=this.W,h=this.H,nf=this.nightFactor;
  var t=this.frameCount*0.012;
  for(var layer=0;layer<3;layer++){
    var m=this.mountains[layer];
    var baseL=lerp(35,8,nf),baseS=lerp(15,10,nf),baseH=lerp(220,230,nf);
    var a=m.alpha*(1-nf*0.3);
    var waveSpeed=0.3+layer*0.15;
    var waveAmp=0.004+layer*0.002;
    /* Mountain body */
    ctx.fillStyle=hsla(baseH,baseS,baseL,a);
    ctx.beginPath();
    ctx.moveTo(0,h);
    var pts=m.points;
    for(var i=0;i<pts.length;i++){
      var px=pts[i].x*w;
      var waveOffset=Math.sin(t*waveSpeed+pts[i].x*Math.PI*2*(1+layer*0.5))*waveAmp;
      var waveOffset2=Math.sin(t*waveSpeed*0.7+pts[i].x*Math.PI*3+layer*1.5)*waveAmp*0.5;
      var py=h*(m.baseY-(pts[i].h+waveOffset+waveOffset2));
      if(i===0){ctx.lineTo(px,py);continue}
      var prevWave=Math.sin(t*waveSpeed+pts[i-1].x*Math.PI*2*(1+layer*0.5))*waveAmp;
      var prevWave2=Math.sin(t*waveSpeed*0.7+pts[i-1].x*Math.PI*3+layer*1.5)*waveAmp*0.5;
      var prevX=pts[i-1].x*w,prevY=h*(m.baseY-(pts[i-1].h+prevWave+prevWave2));
      var cpx=(prevX+px)/2;
      ctx.quadraticCurveTo(prevX,py,cpx,(prevY+py)/2);
      if(i===pts.length-1)ctx.lineTo(px,py);
    }
    ctx.lineTo(w,h);ctx.closePath();ctx.fill();
    /* Highlight ridge */
    var hlL=lerp(50,15,nf);
    ctx.fillStyle=hsla(baseH,baseS-5,hlL,a*0.3);
    ctx.beginPath();ctx.moveTo(0,h);
    for(var j=0;j<pts.length;j++){
      var px2=pts[j].x*w;
      var wv=Math.sin(t*waveSpeed+pts[j].x*Math.PI*2*(1+layer*0.5))*waveAmp;
      var wv2=Math.sin(t*waveSpeed*0.7+pts[j].x*Math.PI*3+layer*1.5)*waveAmp*0.5;
      var py2=h*(m.baseY-(pts[j].h+wv+wv2))-2;
      if(j===0){ctx.lineTo(px2,py2);continue}
      var pwv=Math.sin(t*waveSpeed+pts[j-1].x*Math.PI*2*(1+layer*0.5))*waveAmp;
      var pwv2=Math.sin(t*waveSpeed*0.7+pts[j-1].x*Math.PI*3+layer*1.5)*waveAmp*0.5;
      var prevX2=pts[j-1].x*w,prevY2=h*(m.baseY-(pts[j-1].h+pwv+pwv2))-2;
      var cpx2=(prevX2+px2)/2;
      ctx.quadraticCurveTo(prevX2,py2,cpx2,(prevY2+py2)/2);
      if(j===pts.length-1)ctx.lineTo(px2,py2);
    }
    ctx.lineTo(w,h);ctx.closePath();ctx.fill();
  }
  /* Horizontal base glow */
  var hglowY=h*m.baseY;
  var sunA=clamp(1-nf,0,1)*0.15;
  if(sunA>0.01){
    var hGrad=ctx.createLinearGradient(0,hglowY-20,0,hglowY+30);
    hGrad.addColorStop(0,hsla(40,80,70,sunA));
    hGrad.addColorStop(1,hsla(40,80,70,0));
    ctx.fillStyle=hGrad;
    ctx.fillRect(0,hglowY-20,w,50);
  }
};

/* ═══════════════════════════════════════════════════════
   CLOUDS (Pixel Style)
   ═══════════════════════════════════════════════════════ */
P.initClouds=function(){
  this.clouds=[];
  var count=randi(18,30);
  for(var i=0;i<count;i++){
    var cType=Math.floor(Math.random()*10);/* 0-9 cloud types */
    var puffs=[];
    var puffCount,yRange,xSpacing;

    switch(cType){
      case 0:/* Cumulus: fluffy, tall puffs */
        puffCount=randi(4,8);
        for(var p=0;p<puffCount;p++){
          var pw=randi(3,5),ph=randi(3,5);
          puffs.push(this._makePuff(p*PX*randi(2,3),randf(-PX*0.8,PX*0.3),pw,ph));
        }
        break;
      case 1:/* Stratus: long, flat, layered */
        puffCount=randi(5,10);
        for(var p=0;p<puffCount;p++){
          var pw=randi(4,7),ph=randi(1,2);
          puffs.push(this._makePuff(p*PX*2,randf(-PX*0.2,PX*0.2),pw,ph));
        }
        break;
      case 2:/* Cirrus: wispy, thin streaks — with tails */
        puffCount=randi(2,4);
        for(var p=0;p<puffCount;p++){
          var pw=randi(6,10),ph=randi(1,2);
          var px=[];
          for(var col=0;col<pw;col++){
            /* Tapered edges for cirrus wisps */
            var edgeFade=Math.abs(col-pw/2)/(pw/2);
            var ci2=edgeFade>0.8?2:(edgeFade>0.5?1:0);
            if(Math.random()>edgeFade*0.6)px.push({cx:col,cy:Math.sin(col*0.5)*0.3,ci:ci2});
          }
          puffs.push({xOff:p*PX*3,yOff:randf(-PX*0.1,PX*0.1),
            w:pw,h:ph,depth:randf(0,1),pixels:px});
        }
        break;
      case 3:/* Cumulonimbus: towering, dark base with anvil top */
        puffCount=randi(6,12);
        for(var p=0;p<puffCount;p++){
          var pw=randi(3,6),ph=p<puffCount*0.4?randi(4,6):randi(2,3);
          puffs.push(this._makePuff(p*PX*randi(1,2)+Math.sin(p)*PX,randf(-PX*1.2,PX*0.2),pw,ph));
        }
        break;
      case 4:/* Altocumulus: small patches, mackerel sky */
        puffCount=randi(2,4);
        for(var p=0;p<puffCount;p++){
          var pw=randi(2,3),ph=randi(2,3);
          puffs.push(this._makePuff(p*PX*randi(4,7),randf(-PX*0.3,PX*0.3),pw,ph));
        }
        break;
      case 5:/* Cirrocumulus: tiny dots high up */
        puffCount=randi(3,6);
        for(var p=0;p<puffCount;p++){
          var pw=randi(1,2),ph=randi(1,2);
          puffs.push(this._makePuff(p*PX*randi(3,6),randf(-PX*0.2,PX*0.2),pw,ph));
        }
        break;
      case 6:/* Lenticular: lens-shaped cloud — smooth elliptical */
        puffCount=1;
        puffs.push(this._makePuff(0,0,randi(7,10),randi(2,3)));
        break;
      case 7:/* Nimbostratus: dark, thick, featureless rain layer */
        puffCount=randi(8,14);
        for(var p=0;p<puffCount;p++){
          var pw=randi(5,8),ph=randi(2,3);
          puffs.push(this._makePuff(p*PX*1.5,randf(-PX*0.1,PX*0.1),pw,ph));
        }
        break;
      case 8:/* Stratocumulus: large lumpy rolls */
        puffCount=randi(3,6);
        for(var p=0;p<puffCount;p++){
          var pw=randi(4,7),ph=randi(2,4);
          puffs.push(this._makePuff(p*PX*2.5,randf(-PX*0.5,PX*0.1),pw,ph));
        }
        break;
      default:/* Fractus: small ragged scraps near ground */
        puffCount=randi(2,4);
        for(var p=0;p<puffCount;p++){
          var pw=randi(2,3),ph=randi(1,2);
          puffs.push(this._makePuff(p*PX*randi(2,4),randf(-PX*0.3,PX*0.3),pw,ph));
        }
    }

    var yPos=cType===2?randf(this.H*0.02,this.H*0.12):
             cType===4||cType===5||cType===6?randf(this.H*0.03,this.H*0.15):
             cType===9?randf(this.H*0.15,this.H*0.3):
             randf(this.H*0.03,this.H*0.28);
    this.clouds.push({x:randf(-200,this.W+200),y:yPos,
      puffs:puffs,speed:cType===2?randf(0.15,0.5):randf(0.08,0.35),
      depth:randf(0,1),baseScale:cType===3?1.3:cType===7?1.15:1,cloudType:cType});
  }
};

P._makePuff=function(xOff,yOff,pw,ph){
  var pixels=[];
  for(var row=0;row<ph;row++){
    for(var col=0;col<pw;col++){
      var cx=col-pw/2,cy=row-ph;
      var dist=Math.sqrt(cx*cx+cy*cy);
      if(dist>pw/2+0.5)continue;
      var ci=0;if(dist>pw/3)ci=2;else if(dist>pw/5)ci=1;
      pixels.push({cx:col,cy:row,ci:ci});
    }
  }
  return{xOff:xOff,yOff:yOff,w:pw,h:ph,depth:randf(0,1),pixels:pixels};
};

P._getCloudColor=function(depth,nf,cloudType){
  var bucket=Math.round(depth*4);
  var nfKey=Math.round(nf*10);
  var ctKey=cloudType||0;
  var key=bucket+"_"+nfKey+"_"+ctKey;
  if(this._cloudColorCache[key])return this._cloudColorCache[key];
  var baseL=lerp(90,25,nf);var baseS=lerp(10,5,nf);
  var baseH=lerp(210,220,nf);
  /* Weather darkening */
  var cw=this.currentWeather;
  if(cw==="rain"||cw==="heavy_rain"||cw==="thunderstorm"||cw==="cloudy")baseL=clamp(baseL-15,5,95);
  if(cw==="heavy_rain"||cw==="thunderstorm")baseL=clamp(baseL-10,5,95);
  /* Cloud-type color differentiation */
  var hlL,shL,sH=baseH,sS=baseS;
  switch(ctKey){
    case 0:/* Cumulus: bright white, puffy */
      hlL=clamp(baseL+12,0,100);shL=clamp(baseL-8,0,100);
      if(nf<0.3){sH=195;sS=15}
      break;
    case 1:/* Stratus: flat gray, uniform */
      hlL=clamp(baseL+5,0,100);shL=clamp(baseL-10,0,100);
      sS=baseS+3;
      break;
    case 2:/* Cirrus: wispy, slightly warm-white, thin */
      hlL=clamp(baseL+15,0,100);shL=clamp(baseL+2,0,100);
      sS=Math.max(baseS-2,2);sH=lerp(200,215,nf);
      break;
    case 3:/* Cumulonimbus: dark base, bright top */
      hlL=clamp(baseL+8,0,100);shL=clamp(baseL-20,0,100);
      sH=lerp(210,225,nf);sS=baseS+5;
      break;
    case 4:/* Altocumulus: soft, slightly warm */
      hlL=clamp(baseL+8,0,100);shL=clamp(baseL-6,0,100);
      sH=lerp(205,218,nf);
      break;
    case 5:/* Cirrocumulus: very thin, high, delicate */
      hlL=clamp(baseL+10,0,100);shL=clamp(baseL,0,100);
      sS=Math.max(baseS-3,2);sH=lerp(200,215,nf);
      break;
    case 6:/* Lenticular: smooth, even illumination */
      hlL=clamp(baseL+10,0,100);shL=clamp(baseL-3,0,100);
      sS=Math.max(baseS-2,2);
      break;
    case 7:/* Nimbostratus: very dark, featureless */
      hlL=clamp(baseL-5,0,100);shL=clamp(baseL-25,0,100);
      sH=lerp(215,225,nf);sS=baseS+8;
      break;
    case 8:/* Stratocumulus: medium gray, roll shadows */
      hlL=clamp(baseL+7,0,100);shL=clamp(baseL-15,0,100);
      sS=baseS+3;
      break;
    case 9:/* Fractus: ragged, dark scraps */
      hlL=clamp(baseL,0,100);shL=clamp(baseL-18,0,100);
      sH=lerp(212,222,nf);sS=baseS+5;
      break;
    default:
      hlL=clamp(baseL+10,0,100);shL=clamp(baseL-12,0,100);
  }
/* Sun glow color tinting on clouds — clouds near horizon pick up warm glow hues */
var sp=this._sunProgress;
var glowTint=0;
if(sp<0.2)glowTint=(1-sp/0.2)*0.15;
else if(sp>0.35&&sp<0.55)glowTint=Math.min((sp-0.35)/0.1,1)*0.2*(1-(sp-0.45)/0.1);
if(glowTint>0.01){
  var pal=this._getDuskPalette();
  var gh=pal[12];
  sH=lerp(sH,gh,glowTint);
  sS=clamp(sS+glowTint*15,0,100);
  hlL=clamp(hlL+glowTint*8,0,100);
  baseL=clamp(baseL+glowTint*5,0,100);
}
var colors=[hsl(sH,sS,hlL),hsl(sH,sS,baseL),hsl(sH,sS+5,shL)];
  this._cloudColorCache[key]=colors;
  return colors;
};

P.updateClouds=function(){
  for(var i=0;i<this.clouds.length;i++){
    var c=this.clouds[i];
    c.x+=c.speed;
    if(c.x>this.W+300)c.x=-300;
  }
};

P.drawClouds=function(){
  var nf=this.nightFactor;
  /* Scale clouds based on weather: thicker/larger in rain/storm */
  var weatherScale=1;
  var cw=this.currentWeather;
  if(cw==="rain"||cw==="light_rain"||cw==="drizzle")weatherScale=1.8;
  else if(cw==="heavy_rain"||cw==="thunderstorm")weatherScale=2.2;
  else if(cw==="cloudy")weatherScale=1.5;
  else if(cw==="snow"||cw==="heavy_snow"||cw==="sleet")weatherScale=1.6;
  else if(cw==="blizzard")weatherScale=1.9;
  /* Blend with weather transition */
  var pw=this.prevWeather;
  if(pw==="rain"||pw==="light_rain"||pw==="drizzle")weatherScale=lerp(weatherScale,1.8,this.weatherBlend);
  else if(pw==="heavy_rain"||pw==="thunderstorm")weatherScale=lerp(weatherScale,2.2,this.weatherBlend);
  var scaledPx=Math.ceil(PX*weatherScale);

  /* Batch cloud pixels by color index to minimize fillStyle changes */
  for(var i=0;i<this.clouds.length;i++){
    var c=this.clouds[i];
    if(c.x>this.W+100||c.x<-100)continue;
    var colors=this._getCloudColor(c.depth,nf,c.cloudType);
    /* Pre-batch pixels into 3 arrays (one per color index) */
    var batches=[[],[],[]];
    for(var p=0;p<c.puffs.length;p++){
      var pf=c.puffs[p];
      var bx=Math.floor(c.x+pf.xOff*weatherScale);
      var by=Math.floor(c.y+pf.yOff*weatherScale);
      for(var pi=0;pi<pf.pixels.length;pi++){
        var px=pf.pixels[pi];
        batches[px.ci].push(bx+px.cx*scaledPx,by+px.cy*scaledPx);
      }
    }
    /* Draw each batch with single fillStyle */
    for(var bi=0;bi<3;bi++){
      var b=batches[bi];
      if(b.length===0)continue;
      ctx.fillStyle=colors[bi];
      for(var bj=0;bj<b.length;bj+=2){
        ctx.fillRect(b[bj],b[bj+1],scaledPx,scaledPx);
      }
    }
  }
};

/* ═══════════════════════════════════════════════════════
   BUILDINGS (Cityscape)
   ═══════════════════════════════════════════════════════ */
P.initBuildings=function(){
  this.buildings=[];
  for(var li=0;li<LAYERS.length;li++){
    var L=LAYERS[li];
    var blds=[];
    var rng=seededRng(li*1000+7);
    var x=-50;
    var targetW=Math.max(2400,this.W*2.5);
    while(x<targetW){
      var bw=Math.round(rng()*(L.maxW-L.minW)+L.minW);
      var bh=Math.round(rng()*(L.maxH-L.minH)+L.minH);
      /* Overlap: next building starts before previous ends - up to 60% */
      var overlap=Math.floor(rng()*bw*0.6+bw*0.1);
      var gap=rng()<0.6?0:Math.floor(rng()*2);
      var styleVariant=Math.floor(rng()*23);
      /* Industrial facilities: layers 2-3 get more factories */
      if(li===1&&rng()<0.35)styleVariant=16;
      if((li===2||li===3)&&rng()<0.25)styleVariant=16;
      /* Parks in layers 2-4 */
      if((li===2||li===3)&&rng()<0.06)styleVariant=21;
      if(li===4&&rng()<0.08)styleVariant=21;
      /* 4% chance of street tree/vegetation */
      if(Math.random()<0.04)styleVariant=24;
      /* Foreground layer: construction yards, cranes, harbors */
      if(li===4){
        var r=rng();
        if(r<0.15)styleVariant=17; /* Construction yard */
        else if(r<0.30)styleVariant=18; /* Tall crane */
        else if(r<0.40)styleVariant=19; /* Harbor/dock */
        else if(r<0.48)styleVariant=22; /* Jetty */
        else if(r<0.54)styleVariant=23; /* Seawall */
      }
      /* TV towers in layers 2-4 */
      if((li===2||li===3)&&rng()<0.03)styleVariant=20;
      if(li===4&&rng()<0.05)styleVariant=20;
      var litWindows=[];
      if(li>=2){
        var wCols=Math.floor(bw/8);var wRows=Math.floor(bh/10);
        for(var wi=0;wi<wRows;wi++){
          for(var wj=0;wj<wCols;wj++){
            if(rng()<0.15)litWindows.push({r:wi,c:wj});
          }
        }
      }
      blds.push({x:x,w:bw,h:bh,gap:gap,styleVariant:styleVariant,litWindows:litWindows});
      x+=bw-overlap+gap;
    }
    L.buildings=blds;
    L.wrapW=x+100;
    this.buildings.push(blds);
  }
};

P.drawBuildingLayer=function(li){
  var L=LAYERS[li];
  var w=this.W,h=this.H;
  var groundY=h*L.groundFrac;
  var nf=this.nightFactor;
  var sp=this._sunProgress;
  var scrollOff=this.frameCount*L.scrollMul*0.3;
  var wrapW=L.wrapW||1000;
  var energy=this._energy||0;
  var bassEnergy=this._bassEnergy||0;
  for(var i=0;i<L.buildings.length;i++){
    var b=L.buildings[i];
    var bx=b.x-scrollOff%wrapW;
    /* Wrap for endless scrolling */
    while(bx+b.w<-50)bx+=wrapW;
    while(bx>w+50)bx-=wrapW;
    if(bx+b.w<-50||bx>w+50)continue;
    /* Dynamic height: buildings pulse with music (except factories) */
    var isFactory=b.styleVariant===16&&L.style==="mixed";
    var dynH=b.h;
    if(energy>0.03){
      /* Frequency-sensitive: each building responds to a specific band */
      var bands=this._freqBands;
      var bandIdx=((i+li*7)&7); /* assign building to a freq band */
      var bandEnergy=bands?bands[bandIdx]:0;
      /* Smooth energy transition */
      if(!b._smoothEnergy)b._smoothEnergy=0;
      b._smoothEnergy+=(bandEnergy-b._smoothEnergy)*0.35;
      var se=b._smoothEnergy;
      /* Height multiplier: 0.3x to 2.5x based on frequency band */
      var pulseFactor=(i*31+li*17)%100/100;
      var heightMul=0.3+se*2.2*(0.6+pulseFactor*0.4);
      /* Subtle oscillation for liveliness */
      var osc=Math.sin(this.frameCount*0.12+i*0.9+li*2)*0.08*se;
      heightMul+=osc;
      dynH=b.h*clamp(heightMul,0.3,2.5);
    }
    /* Safety: cap dynH to prevent canvas overdraw */
    if(dynH>500||dynH!==dynH||dynH<1)dynH=b.h;
    var by=groundY-dynH;
    var dayL,dayS,dayH,nightL;

    if(li===0){dayH=220;dayS=20;dayL=55;nightL=6}
    else if(li===1){dayH=35;dayS=15;dayL=40;nightL=5}
    else if(li===2){dayH=200;dayS=35;dayL=45;nightL=4}
    else if(li===3){dayH=30;dayS=15;dayL=50;nightL=3}
    else{dayH=210;dayS=12;dayL=45;nightL=2}

    var baseL=lerp(dayL,nightL,nf);
    var baseS=lerp(dayS,Math.max(dayS-10,5),nf);
    var baseH=lerp(dayH,230,nf);

    var sunBright=0;
    var sunDir=0;
    if(sp>0.15&&sp<0.85){
      sunDir=sp<0.5?1:-1;
      /* Stronger directional lighting: ±18 lightness during full day */
      var dayAmt=1-nf;
      sunBright=sunDir*18*dayAmt;
    }
    var bL=clamp(baseL+sunBright,0,95);
    var sL=clamp(bL-10,0,95);
    var tL=clamp(bL+8,0,98);
    /* Sun-warm hue shift on sun-facing side */
    var sunHueShift=sunDir>0?-8:8; /* warmer on sun side */
    var sunFaceL=clamp(bL+Math.abs(sunBright)*0.4,0,95);
    var shadeFaceL=clamp(bL-Math.abs(sunBright)*0.35,0,95);
    var dayAmt2=clamp(1-nf,0,1);

    if(isFactory){
      this._drawFactory(bx,by,b.w,dynH,baseH,baseS,bL,sL,tL,nf,li);
    }else if(b.styleVariant===17){
      this._drawConstructionYard(bx,by,b.w,dynH,baseH,baseS,bL,sL,tL,nf,li);
    }else if(b.styleVariant===18){
      this._drawCrane(bx,by,b.w,dynH,baseH,baseS,bL,sL,tL,nf,li);
    }else if(b.styleVariant===19){
      this._drawHarbor(bx,by,b.w,dynH,baseH,baseS,bL,sL,tL,nf,li);
    }else if(b.styleVariant===22){
      this._drawJetty(bx,by,b.w,dynH,groundY,nf);
    }else if(b.styleVariant===23){
      this._drawSeawall(bx,by,b.w,dynH,groundY,nf);
    }else if(b.styleVariant===24){
      this._drawStreetTree(bx,by,b.w,dynH,baseH,baseS,bL,sL,tL,nf,li);
    }else if(b.styleVariant===20){
      this._drawTVTower(bx,by,b.w,dynH,baseH,baseS,bL,sL,tL,nf,li);
    }else if(b.styleVariant===21){
      this._drawPark(bx,by,b.w,dynH,baseH,baseS,bL,sL,tL,nf,li);
    }else{
      /* Building face with sun-directional gradient (daytime only, foreground layers) */
      if(dayAmt2>0.2&&sunDir!==0&&b.w>6&&li>=2){
        var faceGrad=ctx.createLinearGradient(bx,0,bx+b.w,0);
        if(sunDir>0){
          /* Sun from right: right side warmer/brighter */
          faceGrad.addColorStop(0,hsl(baseH+sunHueShift,baseS,shadeFaceL));
          faceGrad.addColorStop(0.5,hsl(baseH,baseS,bL));
          faceGrad.addColorStop(1,hsl(baseH-sunHueShift,baseS,sunFaceL));
        }else{
          /* Sun from left: left side warmer/brighter */
          faceGrad.addColorStop(0,hsl(baseH-sunHueShift,baseS,sunFaceL));
          faceGrad.addColorStop(0.5,hsl(baseH,baseS,bL));
          faceGrad.addColorStop(1,hsl(baseH+sunHueShift,baseS,shadeFaceL));
        }
        ctx.fillStyle=faceGrad;
      }else{
        ctx.fillStyle=hsl(baseH,baseS,bL);
      }
      ctx.fillRect(bx,by,b.w,dynH);
      /* Bottom shadow */
      ctx.fillStyle=hsl(baseH,baseS,sL);
      ctx.fillRect(bx,by+dynH-Math.max(2,li*2),b.w,Math.max(2,li*2));
      /* Top roof highlight — brighter when sun is high (noon) */
      var roofHi=dayAmt2>0.2?clamp(tL+sunBright*0.3,0,98):tL;
      ctx.fillStyle=hsl(baseH,Math.max(baseS-3,5),roofHi);
      ctx.fillRect(bx,by,b.w,Math.max(1,li+1));
      /* Enhanced sun directional edge highlights (wider, warmer) */
      if(sunBright>0){
        /* Sun on right: warm bright edge */
        var edgeW=Math.max(2,Math.min(4,b.w*0.15));
        ctx.fillStyle=hsla(baseH-10,baseS+5,clamp(bL+sunBright*0.6,0,95),0.6*dayAmt2);
        ctx.fillRect(bx+b.w-edgeW,by,edgeW,dynH);
        /* Sun-side roof glow */
        ctx.fillStyle=hsla(35,30,clamp(bL+15,0,95),0.4*dayAmt2);
        ctx.fillRect(bx+b.w-edgeW,by,edgeW,Math.max(2,li+1));
      }else if(sunBright<0){
        /* Sun on left: warm bright edge */
        var edgeW2=Math.max(2,Math.min(4,b.w*0.15));
        ctx.fillStyle=hsla(baseH-10,baseS+5,clamp(bL+Math.abs(sunBright)*0.6,0,95),0.6*dayAmt2);
        ctx.fillRect(bx,by,edgeW2,dynH);
        /* Sun-side roof glow */
        ctx.fillStyle=hsla(35,30,clamp(bL+15,0,95),0.4*dayAmt2);
        ctx.fillRect(bx,by,edgeW2,Math.max(2,li+1));
      }
/* Snow cap on buildings during snow weather */
var isSnow=this.currentWeather==="snow"||this.currentWeather==="heavy_snow"||this.currentWeather==="blizzard"||this.currentWeather==="sleet";
var isPrevSnow=this.prevWeather==="snow"||this.prevWeather==="heavy_snow"||this.prevWeather==="blizzard";
var snowActive=isSnow||(isPrevSnow&&this.weatherBlend<1);
if(snowActive&&nf<0.7){
  var snowDepth=clamp((isSnow?1:this.weatherBlend)*3+1,1,5);
  var snowL=clamp(85+dayAmt2*15,0,98);
  ctx.fillStyle=hsl(210,8,snowL);
  ctx.fillRect(bx-1,by-snowDepth+1,b.w+2,snowDepth);
  /* Snow drip edges */
  if(snowDepth>2){
    ctx.fillStyle=hsl(210,5,snowL-5);
    for(var sd=0;sd<b.w;sd+=randi(4,8)){
      ctx.fillRect(bx+sd,by,1,randi(1,3));
    }
  }
}
      /* Cast shadow on ground (foreground layers only, daytime) */
      if(dayAmt2>0.3&&sunDir!==0&&li>=3&&b.w>8){
        var shadowLen=Math.min(b.w*0.8,dynH*0.4)*dayAmt2;
        var shadowDir=-sunDir;
        ctx.fillStyle=hsla(220,15,15,0.18*dayAmt2);
        ctx.beginPath();
        ctx.moveTo(bx,groundY);
        ctx.lineTo(bx+shadowDir*shadowLen,groundY);
        ctx.lineTo(bx+shadowDir*shadowLen+b.w*0.3,groundY+3);
        ctx.lineTo(bx+b.w,groundY+3);
        ctx.closePath();ctx.fill();
      }
      if(L.style==="mixed"){
        /* Stylish skyscraper variants */
        var sv=b.styleVariant%10;
        if(sv===0){
          /* Stepped setback skyscraper */
          var sw1=b.w*0.8,sh1=Math.floor(dynH*0.15);
          var sw2=b.w*0.5,sh2=Math.floor(dynH*0.1);
          ctx.fillStyle=hsl(baseH,baseS,clamp(bL+2,0,95));
          ctx.fillRect(bx+(b.w-sw1)/2,by-sh1,sw1,sh1);
          ctx.fillRect(bx+(b.w-sw2)/2,by-sh1-sh2,sw2,sh2);
        }else if(sv===1){
          /* Spire top */
          var spireH=Math.floor(dynH*0.2);
          ctx.fillStyle=hsl(baseH,baseS,clamp(bL-3,0,95));
          ctx.fillRect(bx+b.w/2-1,by-spireH,2,spireH);
          /* Beacon on spire */
          if(nf>0.4){
            var beaconA=Math.sin(this.frameCount*0.1+i)>0.5?"hsla(0,100%,50%,0.9)":"hsla(0,100%,50%,0.2)";
            ctx.fillStyle=beaconA;
            ctx.fillRect(bx+b.w/2-1,by-spireH-2,2,2);
          }
        }else if(sv===2){
          /* Glass curtain wall effect */
          var stripeW=Math.max(3,Math.floor(b.w/5));
          for(var gs=0;gs<b.w;gs+=stripeW*2){
            ctx.fillStyle=hsla(baseH,Math.min(100,baseS+15),clamp(bL+6,0,95),0.3);
            ctx.fillRect(bx+gs,by,stripeW,dynH);
          }
        }else if(sv===3){
          /* Antenna cluster */
          var a1h=randi(10,25),a2h=randi(8,18);
          ctx.fillStyle=hsl(baseH,baseS,clamp(bL-4,0,95));
          ctx.fillRect(bx+b.w*0.3,by-a1h,1,a1h);
          ctx.fillRect(bx+b.w*0.7,by-a2h,1,a2h);
          /* Cross bars */
          ctx.fillRect(bx+b.w*0.3-2,by-a1h+3,5,1);
          ctx.fillRect(bx+b.w*0.7-2,by-a2h+2,5,1);
        }else if(sv===4){
          /* Tapered top (pyramid cap) */
          var capH=Math.floor(dynH*0.08);
          ctx.fillStyle=hsl(baseH,baseS,clamp(bL+4,0,95));
          ctx.beginPath();
          ctx.moveTo(bx+b.w*0.15,by);
          ctx.lineTo(bx+b.w*0.5,by-capH);
          ctx.lineTo(bx+b.w*0.85,by);
          ctx.closePath();ctx.fill();
        }else if(sv===5){
          /* Twin tower notch */
          var notchW=Math.floor(b.w*0.15),notchH=Math.floor(dynH*0.3);
          ctx.fillStyle=hsl(baseH,baseS+5,clamp(bL+3,0,95));
          var midX=bx+(b.w-notchW)/2;
          /* Draw two halves leaving a notch gap */
          ctx.fillRect(bx,by,midX-bx,notchH);
          ctx.fillRect(midX+notchW,by,bx+b.w-midX-notchW,notchH);
        }else if(sv===6){
          /* Dome/crown top */
          var domeR=Math.floor(b.w*0.3);
          ctx.fillStyle=hsl(baseH,baseS,clamp(bL+3,0,95));
          ctx.beginPath();
          ctx.arc(bx+b.w/2,by,domeR,Math.PI,0);
          ctx.closePath();ctx.fill();
        }else if(sv===7){
          /* Horizontal banding (art deco) */
          var bandH=Math.max(2,Math.floor(dynH/12));
          for(var bb=0;bb<dynH;bb+=bandH*2){
            ctx.fillStyle=hsla(baseH,baseS+8,clamp(bL+5,0,95),0.2);
            ctx.fillRect(bx,by+bb,b.w,bandH);
          }
        }else{
          /* Default: simple ledge */
          var ledgeW=b.w*0.6;
          ctx.fillStyle=hsl(baseH,baseS,clamp(bL+3,0,95));
          ctx.fillRect(bx+(b.w-ledgeW)/2,by-PX,ledgeW,PX);
        }
      }
    }

    if(li<=1){
      this._drawDistantWindows(bx,by,b.w,dynH,li,nf);
    }else{
      this._drawNearWindows(bx,by,b.w,dynH,li,nf,b.litWindows);
    }

    if(li===0){
      this._drawBuildingGlow(bx,by,b.w,dynH,nf);
    }
  }
};

P._drawFactory=function(bx,by,bw,bh,bH,bS,bL,sL,tL,nf,li){
  /* Main factory body */
  ctx.fillStyle=hsl(bH,bS,bL);
  ctx.fillRect(bx,by,bw,bh);
  /* Bottom shadow */
  ctx.fillStyle=hsl(bH,bS,sL);
  ctx.fillRect(bx,by+bh-3,bw,3);
  /* Top highlight */
  ctx.fillStyle=hsl(bH,bS-3,tL);
  ctx.fillRect(bx,by,bw,2);
  /* Smokestacks */
  var stackCount=bw>30?3:2;
  for(var si=0;si<stackCount;si++){
    var stackX=bx+bw*(0.2+si*0.3);
    var stackW=Math.max(3,Math.floor(bw*0.08));
    var stackH=bh*(0.3+si*0.1);
    ctx.fillStyle=hsl(bH,bS,clamp(bL-5,0,95));
    ctx.fillRect(stackX,by-stackH,stackW,stackH);
    /* Stack cap */
    ctx.fillStyle=hsl(bH,bS,clamp(bL+5,0,95));
    ctx.fillRect(stackX-1,by-stackH,stackW+2,2);
    /* Smoke puffs */
    var ft=this.frameCount*0.03;
    var smokeAlpha=clamp(0.2-nf*0.1,0.05,0.2);
    ctx.fillStyle=hsla(0,0,70,smokeAlpha);
    var puffY=by-stackH-5-Math.sin(ft+si*2)*4;
    ctx.fillRect(stackX-2,puffY,stackW+4,4);
    ctx.fillRect(stackX-3,puffY-5,stackW+6,3);
  }
  /* Status lights */
  var ft=this.frameCount*0.05;
  if(Math.sin(ft*3)>0.5){
    ctx.fillStyle="rgba(255,40,40,0.9)";
    ctx.fillRect(bx+Math.floor(bw*0.3)+1,by-2,2,2);
  }
  if(Math.sin(ft*2.5)>0.3){
    ctx.fillStyle="rgba(40,255,40,0.9)";
    ctx.fillRect(bx+Math.floor(bw*0.65)+1,by-2,2,2);
  }
  /* Industrial windows */
  var wRows=Math.floor(bh/12);
  var wCols=Math.floor(bw/10);
  for(var wr=0;wr<wRows;wr++){
    for(var wc=0;wc<wCols;wc++){
      var wx=bx+3+wc*10;
      var wy=by+4+wr*12;
      if(wx+6>bx+bw-2||wy+6>by+bh-3)continue;
      if(nf>0.3){
        ctx.fillStyle=hsla(45,80,70,clamp((nf-0.3)*1.5,0,0.8));
      }else{
        ctx.fillStyle="rgba(150,180,200,0.3)";
      }
      ctx.fillRect(wx,wy,5,6);
    }
  }
};

P._drawConstructionYard=function(bx,by,bw,bh,bH,bS,bL,sL,tL,nf,li){
  /* Open yard with fencing and materials */
  ctx.fillStyle=hsl(bH,bS,bL);
  /* Main structure (partial building under construction) */
  ctx.fillRect(bx,by+bh*0.3,bw,bh*0.7);
  /* Exposed steel framework on top */
  ctx.fillStyle=hsl(0,0,clamp(lerp(55,25,nf),0,100));
  ctx.fillRect(bx+bw*0.1,by,bw*0.8,bh*0.35);
  /* Cross beams */
  for(var cb=0;cb<3;cb++){
    var cbY=by+bh*0.1+cb*bh*0.08;
    ctx.fillRect(bx+bw*0.15,cbY,bw*0.7,1);
  }
  /* Vertical beams */
  ctx.fillRect(bx+bw*0.15,by,1,bh*0.3);
  ctx.fillRect(bx+bw*0.5,by,1,bh*0.3);
  ctx.fillRect(bx+bw*0.85,by,1,bh*0.3);
  /* Crane arm on top */
  var craneH=bh*0.6;
  var craneX=bx+bw*0.5;
  var armLen=bw*0.8;
  ctx.fillStyle=hsl(0,0,clamp(lerp(50,20,nf),0,100));
  ctx.fillRect(craneX-1,by-craneH,2,craneH);
  /* Arm extending left */
  ctx.fillRect(craneX-armLen,by-craneH,armLen,2);
  /* Arm extending right (shorter) */
  ctx.fillRect(craneX,by-craneH,armLen*0.4,2);
  /* Counterweight */
  ctx.fillRect(craneX+armLen*0.3,by-craneH+2,4,6);
  /* Cable */
  ctx.fillStyle=hsla(0,0,60,0.6);
  var cableX=craneX-armLen*0.6;
  var cableLen=bh*0.4;
  ctx.fillRect(cableX,by-craneH,cableLen>8?1:1,cableLen);
  /* Hook */
  ctx.fillStyle=hsl(0,0,clamp(lerp(40,15,nf),0,100));
  ctx.fillRect(cableX-2,by-craneH+cableLen,4,3);
  /* Safety fence at base */
  ctx.fillStyle=nf>0.5?"rgba(200,150,50,0.3)":"rgba(255,200,0,0.5)";
  for(var fp=bx;fp<bx+bw;fp+=6){
    ctx.fillRect(fp,by+bh-4,2,4);
  }
  ctx.fillRect(bx,by+bh-5,bw,1);
  /* Material piles */
  ctx.fillStyle=nf>0.5?hsl(30,20,18):hsl(30,25,55);
  ctx.fillRect(bx+bw*0.05,by+bh*0.7,bw*0.2,bh*0.15);
  ctx.fillStyle=nf>0.5?hsl(0,0,20):hsl(0,0,50);
  ctx.fillRect(bx+bw*0.7,by+bh*0.75,bw*0.2,bh*0.1);
};

P._drawCrane=function(bx,by,bw,bh,bH,bS,bL,sL,tL,nf,li){
  /* Tower crane - tall freestanding */
  var craneH=bh*1.8;
  var craneBase=bx+bw*0.5;
  /* Tower mast */
  ctx.fillStyle=hsl(0,0,clamp(lerp(50,22,nf),0,100));
  ctx.fillRect(craneBase-2,by-craneH+bh,4,craneH-bh);
  /* Lattice pattern on mast */
  ctx.fillStyle=hsla(0,0,clamp(lerp(60,28,nf),0,100),0.4);
  for(var lm=0;lm<craneH-bh;lm+=8){
    ctx.fillRect(craneBase-2,by-craneH+bh+lm,4,1);
    if(lm%16===0){
      ctx.fillRect(craneBase-4,by-craneH+bh+lm,8,1);
    }
  }
  /* Operator cab */
  ctx.fillStyle=nf>0.5?hsl(210,15,25):hsl(210,20,55);
  ctx.fillRect(craneBase-5,by-craneH+bh+craneH*0.6,10,8);
  ctx.fillStyle=nf>0.5?"rgba(100,180,255,0.4)":"rgba(150,200,255,0.5)";
  ctx.fillRect(craneBase-4,by-craneH+bh+craneH*0.6+1,8,4);
  /* Jib (arm) - long one side, short counter-jib */
  var jibLen=bw*1.5;
  var counterLen=bw*0.5;
  ctx.fillStyle=hsl(0,0,clamp(lerp(45,20,nf),0,100));
