    var carColors=[[0,0,30],[220,50,35],[0,60,50],[200,40,50],[45,60,35]];
    for(var car=0;car<4;car++){
      ctx.fillStyle=hsl(carColors[car][0],carColors[car][1],nf>0.5?carColors[car][2]-5:carColors[car][2]);
      ctx.fillRect(fex+fdir*(15+car*22),fey-fh*0.36,12,3);
    }
    if(nf>0.3){
      var feA=clamp((nf-0.3)/0.3,0,1);
      /* Passenger windows */
      for(var pw=0;pw<8;pw++){
        var pwX=fsX+fdir*(pw/8*fsW);
        ctx.fillStyle=hsla(45,90,80,feA*(0.4+0.4*Math.sin(fe.lightPhase+pw)));
        ctx.fillRect(pwX,fey-fh*0.8,4,3);
      }
      /* Wheelhouse windows */
      ctx.fillStyle=hsla(200,60,75,feA*0.6);
      ctx.fillRect(wbX+fdir*3,fey-fh*1.02,fw2*0.14,2);
      /* Navigation lights */
      ctx.fillStyle=hsla(0,100,50,feA*0.8);
      ctx.fillRect(fex+fdir*(fw2+12),fey-fh*0.08,2,2);
      ctx.fillStyle=hsla(120,100,50,feA*0.8);
      ctx.fillRect(fex-fdir*2,fey-fh*0.05,2,2);
      /* Ramp light */
      ctx.fillStyle=hsla(45,100,80,feA*0.4);
      ctx.fillRect(fex+fdir*fw2+fdir*5,fey+2,3,1);
    }
    /* Wake - wider for flat-bottom ferry */
    ctx.strokeStyle="rgba(255,255,255,0.15)";ctx.lineWidth=1;
    ctx.beginPath();
    var feWake=fdir>0?fex:fex+fdir*fw2;
    ctx.moveTo(feWake,fey+2);
    for(var wk5=0;wk5<12;wk5++){
      ctx.lineTo(feWake-fdir*(wk5*3),fey+2+wk5*0.3+Math.sin(this.frameCount*0.02+wk5*0.6)*1);
    }ctx.stroke();
    /* Second wake line */
    ctx.strokeStyle="rgba(255,255,255,0.08)";
    ctx.beginPath();
    ctx.moveTo(feWake,fey+4);
    for(var wk6=0;wk6<10;wk6++){
      ctx.lineTo(feWake-fdir*(wk6*3),fey+4+wk6*0.2+Math.sin(this.frameCount*0.015+wk6*0.7));
    }ctx.stroke();
  }

  /* --- Zeppelin Airship --- */
  var zp=this.zeppelinState;
  if(zp.visible){
    var zpx=Math.floor(zp.x),zpy=Math.floor(zp.y);
    var zeW=90,zeH=25;
    /* Envelope (gas bag) - silver/gray */
    var envGrad=ctx.createRadialGradient(zpx,zpy-zeH*0.3,2,zpx,zpy-zeH*0.3,zeW*0.5);
    envGrad.addColorStop(0,nf>0.5?hsl(220,10,35):hsl(220,12,72));
    envGrad.addColorStop(1,nf>0.5?hsl(220,8,22):hsl(220,10,55));
    ctx.fillStyle=envGrad;
    ctx.beginPath();
    ctx.ellipse(zpx,zpy-zeH*0.3,zeW*0.5,zeH*0.45,0,0,Math.PI*2);
    ctx.fill();
    /* Envelope shading - darker bottom */
    ctx.fillStyle=nf>0.5?hsla(220,8,18,0.3):hsla(220,10,40,0.2);
    ctx.beginPath();
    ctx.ellipse(zpx,zpy,zeW*0.45,zeH*0.15,0,0,Math.PI);
    ctx.fill();
    /* Vertical stripes on envelope */
    ctx.strokeStyle=nf>0.5?hsla(220,5,28,0.2):hsla(220,8,50,0.15);
    ctx.lineWidth=0.5;
    for(var zs=0;zs<5;zs++){
      var zsx=zpx-zeW*0.35+zs*zeW*0.18;
      ctx.beginPath();
      ctx.moveTo(zsx,zpy-zeH*0.65);
      ctx.quadraticCurveTo(zsx,zpy-zeH*0.1,zsx,zpy+zeH*0.05);
      ctx.stroke();
    }
    /* Gondola / cabin underneath */
    ctx.fillStyle=nf>0.5?hsl(25,25,18):hsl(25,30,48);
    ctx.fillRect(zpx-zeW*0.15,zpy+zeH*0.1,zeW*0.3,zeH*0.2);
    /* Gondola windows */
    if(nf>0.3){
      var zA=clamp((nf-0.3)/0.3,0,1);
      for(var zw=0;zw<4;zw++){
        ctx.fillStyle=hsla(45,90,80,zA*0.6);
        ctx.fillRect(zpx-zeW*0.12+zw*zeW*0.08,zpy+zeH*0.14,3,2);
      }
    }
    /* Cables from envelope to gondola */
    ctx.strokeStyle=nf>0.5?hsla(0,0,30,0.4):hsla(0,0,55,0.3);
    ctx.lineWidth=0.5;
    ctx.beginPath();ctx.moveTo(zpx-zeW*0.2,zpy-zeH*0.05);ctx.lineTo(zpx-zeW*0.12,zpy+zeH*0.1);ctx.stroke();
    ctx.beginPath();ctx.moveTo(zpx+zeW*0.2,zpy-zeH*0.05);ctx.lineTo(zpx+zeW*0.12,zpy+zeH*0.1);ctx.stroke();
    /* Tail fins */
    ctx.fillStyle=nf>0.5?hsl(220,10,25):hsl(220,15,55);
    /* Top fin */
    ctx.beginPath();
    ctx.moveTo(zpx-zeW*0.45,zpy-zeH*0.5);
    ctx.lineTo(zpx-zeW*0.55,zpy-zeH*0.7);
    ctx.lineTo(zpx-zeW*0.35,zpy-zeH*0.55);
    ctx.closePath();ctx.fill();
    /* Side fins (cross shape) */
    ctx.fillRect(zpx-zeW*0.48,zpy-zeH*0.2,2,zeH*0.4);
    ctx.fillRect(zpx-zeW*0.52,zpy-zeH*0.15,zeW*0.08,2);
    /* Propulsion glow at tail */
    ctx.fillStyle=hsla(0,0,80,0.05);
    ctx.beginPath();ctx.arc(zpx-zeW*0.5,zpy,4,0,Math.PI*2);ctx.fill();
    /* Night beacon */
    if(nf>0.3){
      var zBA=clamp((nf-0.3)/0.3,0,1);
      var blink=Math.sin(this.frameCount*0.06)>0.3;
      ctx.fillStyle=hsla(0,100,50,zBA*(blink?0.8:0.2));
      ctx.fillRect(zpx+zeW*0.45,zpy-zeH*0.4,2,2);
      ctx.fillRect(zpx-zeW*0.45,zpy-zeH*0.4,2,2);
    }
  }

  /* --- Ferris Wheel (on layer 4 ground) --- */
  var fws=this.ferrisWheelState;
  if(fws.visible){
    var fwx=Math.floor(fws.x);
    var fwGroundY=h*LAYERS[4].groundFrac;
    var fR=30;
    var fwCenterY=fwGroundY-fR-5;
    /* Support structure - A-frame */
    ctx.fillStyle=nf>0.5?hsl(25,25,18):hsl(25,35,42);
    ctx.fillRect(fwx-1,fwCenterY,2,fR+5);
    ctx.fillRect(fwx-fR*0.5,fwGroundY,1,fR+5);
    ctx.fillRect(fwx+fR*0.5-1,fwGroundY,1,fR+5);
    /* Cross braces */
    ctx.strokeStyle=nf>0.5?hsla(25,20,20,0.4):hsla(25,30,40,0.3);
    ctx.lineWidth=0.5;
    ctx.beginPath();ctx.moveTo(fwx-fR*0.4,fwGroundY-5);ctx.lineTo(fwx,fwCenterY+10);ctx.stroke();
    ctx.beginPath();ctx.moveTo(fwx+fR*0.4,fwGroundY-5);ctx.lineTo(fwx,fwCenterY+10);ctx.stroke();
    /* Outer wheel rim */
    ctx.strokeStyle=nf>0.5?hsl(0,0,30):hsl(0,0,60);
    ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(fwx,fwCenterY,fR,0,Math.PI*2);ctx.stroke();
    /* Inner wheel rim */
    ctx.lineWidth=0.5;
    ctx.beginPath();ctx.arc(fwx,fwCenterY,fR*0.92,0,Math.PI*2);ctx.stroke();
    /* Spokes */
    ctx.strokeStyle=nf>0.5?hsl(0,0,28):hsl(0,0,55);
    ctx.lineWidth=1;
    var spokes=8;
    for(var spk=0;spk<spokes;spk++){
      var sAngle=fws.angle+spk*(Math.PI*2/spokes);
      var sx=fwx+Math.cos(sAngle)*fR;
      var sy=fwCenterY+Math.sin(sAngle)*fR;
      ctx.beginPath();ctx.moveTo(fwx,fwCenterY);ctx.lineTo(sx,sy);ctx.stroke();
    }
    /* Gondolas (cabins) at spoke ends */
    var gondolaColors=[0,30,55,120,200,280,330,45];
    for(var gn=0;gn<spokes;gn++){
      var gAngle=fws.angle+gn*(Math.PI*2/spokes);
      var gx=fwx+Math.cos(gAngle)*(fR-3);
      var gy=fwCenterY+Math.sin(gAngle)*(fR-3);
      /* Gondola always hangs down */
      ctx.fillStyle=nf>0.5?hsl(gondolaColors[gn],40,20):hsl(gondolaColors[gn],50,45);
      ctx.fillRect(gx-3,gy,6,4);
      /* Gondola hanger */
      ctx.strokeStyle=nf>0.5?hsl(0,0,25):hsl(0,0,50);
      ctx.lineWidth=0.5;
      ctx.beginPath();ctx.moveTo(gx,gy-1);ctx.lineTo(gx,fwCenterY+Math.sin(gAngle)*fR);ctx.stroke();
      /* Night gondola lights */
      if(nf>0.3){
        var gnA=clamp((nf-0.3)/0.3,0,1);
        ctx.fillStyle=hsla(gondolaColors[gn],80,65,gnA*0.6);
        ctx.fillRect(gx-2,gy+1,4,1);
      }
    }
    /* Center hub */
    ctx.fillStyle=nf>0.5?hsl(0,0,25):hsl(0,0,55);
    ctx.beginPath();ctx.arc(fwx,fwCenterY,3,0,Math.PI*2);ctx.fill();
    /* Night center glow */
    if(nf>0.3){
      var fcA=clamp((nf-0.3)/0.3,0,1);
      ctx.fillStyle=hsla(45,90,80,fcA*0.4);
      ctx.beginPath();ctx.arc(fwx,fwCenterY,5,0,Math.PI*2);ctx.fill();
      /* Rim lights */
      for(var rl=0;rl<16;rl++){
        var rlA=fws.angle*0.5+rl*(Math.PI*2/16);
        var rlx=fwx+Math.cos(rlA)*fR;
        var rly=fwCenterY+Math.sin(rlA)*fR;
        ctx.fillStyle=hsla(rl*22,90,60,fcA*0.5);
        ctx.fillRect(rlx-0.5,rly-0.5,1,1);
      }
    }
    /* Base platform */
    ctx.fillStyle=nf>0.5?hsl(25,20,16):hsl(25,30,40);
    ctx.fillRect(fwx-fR*0.6,fwGroundY,fR*1.2,3);
  }
};

/* ══════════════════════════════════════════════════════════════════════════════════════
   FAMOUS BUILDINGS — Global landmarks as city-pop easter eggs
   Oriental Pearl, Tokyo Tower, Burj Khalifa, CCTV, Eiffel, Golden Gate,
   Forbidden City, Summer Palace, Construction w/ crane. Night flashing + lasers.
   ══════════════════════════════════════════════════════════════════════════════════════ */
P._isCityPop=false;
P._cityPopScore=0;
P.famousBuildings=[];
P.famousBuildingsTimer=0;
var FAMOUS_TYPES=["orientalPearl","tokyoTower","burjKhalifa","cctv","eiffel","goldenGate","forbiddenCity","summerPalace","construction"];
var LASER_TYPES={"orientalPearl":1,"tokyoTower":1,"burjKhalifa":1,"eiffel":1};

P._detectCityPop=function(){
  var trackName="";
  if(this.playlist&&this.currentTrack>=0&&this.playlist[this.currentTrack]){
    trackName=(this.playlist[this.currentTrack].name||"").toLowerCase();
  }
  var keywords=["city pop","citypop","city-pop","japanese","tokyo","80s","jazz funk","funk",
    "mariya","takeuchi","tatsuro","yamashita","anri","toshiki","miki","omura",
    "plastic love","stay with me","mayonaka","midnight","japan","shibuya","akihabara",
    "osaka","kyoto","synth pop","retro pop","yacht rock","aor","city sound"];
  var nameMatch=false;
  for(var i=0;i<keywords.length;i++){
    if(trackName.indexOf(keywords[i])>=0){nameMatch=true;break}
  }
  var energy=this._energy||0, bass=this._bassEnergy||0;
  var energyFit=energy>0.08&&energy<0.45&&bass<0.55;
  if(nameMatch){this._cityPopScore=Math.min(1,this._cityPopScore+0.08)}
  else if(energyFit&&this.isPlaying){this._cityPopScore=Math.min(0.65,this._cityPopScore+0.003)}
  else{this._cityPopScore=Math.max(0,this._cityPopScore-0.008)}
  this._isCityPop=this._cityPopScore>0.25;
};

P.initFamousBuildings=function(){
  this.famousBuildingsTimer=randi(2000,5000);
};

P.updateFamousBuildings=function(){
  this._detectCityPop();
  /* If not city-pop or not cityscape, fade out */
  if(!this._isCityPop||this.currentScene!=="cityscape"){
    for(var i=this.famousBuildings.length-1;i>=0;i--){
      this.famousBuildings[i].fadeOut=true;
    }
  }
  this.famousBuildingsTimer--;
  if(this._isCityPop&&this.currentScene==="cityscape"&&this.famousBuildingsTimer<=0){
    if(this.famousBuildings.length<4){
      var type=FAMOUS_TYPES[randi(0,FAMOUS_TYPES.length-1)];
      /* Conspicuous positions: prefer center 60% of screen, avoid extreme edges */
      var xPos;
      var slot=Math.random();
      if(slot<0.5){xPos=randf(this.W*0.2,this.W*0.4)}
      else{xPos=randf(this.W*0.55,this.W*0.8)}
      /* Prefer mid-ground layers (1-3) for prominence; never place in foreground (4) */
      var layerIdx=Math.random()<0.3?0:(Math.random()<0.5?1:(Math.random()<0.6?2:3));
      var fb={
        type:type,
        x:xPos,
        layerIdx:layerIdx,
        phase:randf(0,Math.PI*2),
        laserActive:false,
        laserTimer:randi(600,2400),
        laserPhase:0,
        laserHue:randi(180,320),
        laserAngle:randf(-0.18,0.18),
        fadeOut:false,
        opacity:0,
        buildProgress:randf(0.2,0.7),
        buildDir:Math.random()<0.5?1:-1,
        craneAngle:randf(-0.6,0.6),
        craneTarget:randf(-0.8,0.8),
        flashSeed:randi(0,1000)
      };
      this.famousBuildings.push(fb);
    }
    this.famousBuildingsTimer=randi(1500,4000);
  }
  /* Update each building */
  for(var j=this.famousBuildings.length-1;j>=0;j--){
    var fb=this.famousBuildings[j];
    if(fb.fadeOut){fb.opacity-=0.012;if(fb.opacity<=0){this.famousBuildings.splice(j,1);continue}}
    else{fb.opacity=Math.min(1,fb.opacity+0.012)}
    fb.phase+=0.02;
    /* Laser beam logic for skyscrapers (low frequency, night only) */
    if(LASER_TYPES[fb.type]){
      fb.laserTimer--;
      if(fb.laserTimer<=0&&!fb.laserActive){
        /* Only fire at night */
        if(this.nightFactor>0.32&&Math.random()<0.20){
          fb.laserActive=true;fb.laserPhase=0;
          fb.laserHue=randi(180,320);
          fb.laserAngle=randf(-0.18,0.18);
        }
        fb.laserTimer=randi(700,2600);
      }
      if(fb.laserActive){
        fb.laserPhase+=0.035;
        if(fb.laserPhase>Math.PI*2.4){fb.laserActive=false;fb.laserTimer=randi(1200,3400)}
      }
    }
    /* Construction logic — shape changes with music */
    if(fb.type==="construction"){
      var energy=this._energy||0;
      fb.buildProgress+=fb.buildDir*0.0015*(0.4+energy*2.5);
      if(fb.buildProgress>0.92){fb.buildProgress=0.92;fb.buildDir=-1}
      if(fb.buildProgress<0.18){fb.buildProgress=0.18;fb.buildDir=1}
      /* Crane arm swings with music */
      var craneDiff=fb.craneTarget-fb.craneAngle;
      fb.craneAngle+=craneDiff*0.02+Math.sin(this.frameCount*0.04+fb.phase)*0.005*(0.5+energy*2);
      if(Math.abs(craneDiff)<0.05){fb.craneTarget=randf(-0.85,0.85)}
    }
  }
};

P.drawFamousBuildings=function(layerFilter){
  if(this.famousBuildings.length===0)return;
  var w=this.W,h=this.H,nf=this.nightFactor,fc=this.frameCount;
  var sp=this._sunProgress;
  /* Sun direction: -1 = sun on left (morning), +1 = sun on right (afternoon) */
  var sunDir=sp<0.5?(sp<0.25?1:-1):0;
  /* Daylight intensity: 0 at night, 1 at noon */
  var dayLight=clamp(1-nf*1.15,0,1);
  /* Music energy for reactive lights and lasers */
  var energy=this._energy||0;
  var bass=this._bassEnergy||0;
  for(var i=0;i<this.famousBuildings.length;i++){
    var fb=this.famousBuildings[i];
    if(fb.opacity<=0)continue;
    /* Layer filter: when specified, only draw buildings in that layer */
    if(typeof layerFilter==="number"&&fb.layerIdx!==layerFilter)continue;
    var groundY=h*LAYERS[fb.layerIdx].groundFrac;
    var baseScale=1.1+fb.layerIdx*0.3;
    /* Parallax: scroll building with its assigned layer */
    var scrollOff=fc*LAYERS[fb.layerIdx].scrollMul*0.3;
    var wrapW=LAYERS[fb.layerIdx].wrapW||1000;
    var drawX=fb.x-scrollOff%wrapW;
    while(drawX<-200)drawX+=wrapW;
    while(drawX>w+200)drawX-=wrapW;
    if(drawX<-200||drawX>w+200)continue;
    ctx.save();
    ctx.globalAlpha=clamp(fb.opacity,0,1);
    /* Override fb.x with parallax-shifted position for drawing */
    var _origX=fb.x;fb.x=drawX;
    /* Ground cast shadow (daytime only, opposite to sun direction) */
    if(dayLight>0.15){
      var shadowW=baseScale*30;
      var shadowH=baseScale*6;
      var shadowDir=-sunDir;
      if(shadowDir!==0){
        ctx.fillStyle=hsla(220,15,15,dayLight*0.25);
        ctx.beginPath();
        ctx.ellipse(drawX+shadowDir*shadowW*0.5,groundY+2,shadowW,shadowH,0,0,Math.PI*2);
        ctx.fill();
      }
    }
    switch(fb.type){
      case "orientalPearl":this._drawOrientalPearl(fb,groundY,baseScale,nf,fc,sunDir,dayLight,energy);break;
      case "tokyoTower":this._drawTokyoTower(fb,groundY,baseScale,nf,fc,sunDir,dayLight,energy);break;
      case "burjKhalifa":this._drawBurjKhalifa(fb,groundY,baseScale,nf,fc,sunDir,dayLight,energy);break;
      case "cctv":this._drawCCTV(fb,groundY,baseScale,nf,fc,sunDir,dayLight,energy);break;
      case "eiffel":this._drawEiffel(fb,groundY,baseScale,nf,fc,sunDir,dayLight,energy);break;
      case "goldenGate":this._drawGoldenGate(fb,groundY,baseScale,nf,fc,sunDir,dayLight,energy);break;
      case "forbiddenCity":this._drawForbiddenCity(fb,groundY,baseScale,nf,fc,sunDir,dayLight,energy);break;
      case "summerPalace":this._drawSummerPalace(fb,groundY,baseScale,nf,fc,sunDir,dayLight,energy);break;
      case "construction":this._drawConstructionBldg(fb,groundY,baseScale,nf,fc,sunDir,dayLight,energy);break;
    }
    fb.x=_origX;
    ctx.restore();
  }
};

/* Draw laser beams from famous buildings — called after all layers so lasers render on top */
P.drawFamousBuildingLasers=function(){
  if(this.famousBuildings.length===0)return;
  var w=this.W,h=this.H,nf=this.nightFactor,fc=this.frameCount;
  var energy=this._energy||0;
  var bass=this._bassEnergy||0;
  for(var i=0;i<this.famousBuildings.length;i++){
    var fb=this.famousBuildings[i];
    if(!fb.laserActive||!LASER_TYPES[fb.type]||nf<=0.22||fb.opacity<=0)continue;
    var groundY=h*LAYERS[fb.layerIdx].groundFrac;
    var baseScale=1.1+fb.layerIdx*0.3;
    var scrollOff=fc*LAYERS[fb.layerIdx].scrollMul*0.3;
    var wrapW=LAYERS[fb.layerIdx].wrapW||1000;
    var drawX=fb.x-scrollOff%wrapW;
    while(drawX<-200)drawX+=wrapW;
    while(drawX>w+200)drawX-=wrapW;
    if(drawX<-200||drawX>w+200)continue;
    ctx.save();
    ctx.globalAlpha=clamp(fb.opacity,0,1);
    var topY=this._famousTopY(fb,groundY,baseScale);
    var topX=drawX;
    var len=h*0.68;
    var ph=fb.laserPhase;
    var lA;
    if(ph<0.6){lA=ph/0.6}
    else if(ph<Math.PI*2.0){lA=1}
    else{lA=clamp(1-(ph-Math.PI*2.0)/1.2,0,1)}
    lA=clamp(lA,0,1);
    var musicAngle=Math.sin(fc*0.08+fb.flashSeed)*0.12*bass+Math.sin(fc*0.13+fb.phase)*0.08*energy;
    var totalAngle=fb.laserAngle+musicAngle;
    var flick=0.82+0.18*Math.sin(fc*0.9+fb.flashSeed*1.3)+0.15*bass*Math.sin(fc*0.25);
    lA*=clamp(flick,0,1.2);
    ctx.save();
    ctx.translate(topX,topY);
    ctx.rotate(totalAngle);
    /* Wide atmospheric glow (soft halo around beam) */
    var glowW=baseScale*26;
    var lg=ctx.createLinearGradient(0,-len,0,0);
    lg.addColorStop(0,hsla(fb.laserHue,90,80,0));
    lg.addColorStop(0.25,hsla(fb.laserHue,90,72,lA*0.22));
    lg.addColorStop(0.7,hsla(fb.laserHue,90,75,lA*0.45));
    lg.addColorStop(1,hsla(fb.laserHue,85,82,lA*0.7));
    ctx.fillStyle=lg;ctx.fillRect(-glowW,-len,glowW*2,len);
    /* Mid glow */
    var mg=ctx.createLinearGradient(0,-len,0,0);
    mg.addColorStop(0,hsla(fb.laserHue,95,82,0));
    mg.addColorStop(0.5,hsla(fb.laserHue,95,80,lA*0.4));
    mg.addColorStop(1,hsla(fb.laserHue,95,85,lA*0.8));
    ctx.fillStyle=mg;ctx.fillRect(-baseScale*9,-len,baseScale*18,len);
    /* Core beam */
    ctx.fillStyle=hsla(fb.laserHue,100,88,lA*0.95);
    ctx.fillRect(-baseScale*3,-len,baseScale*6,len);
    /* Super-bright inner core (near-white) */
    ctx.fillStyle=hsla(fb.laserHue,40,97,lA);
    ctx.fillRect(-baseScale*1.1,-len,baseScale*2.2,len);
    /* Traveling energy pulses climbing the beam */
    for(var p=0;p<5;p++){
      var pp=((fc*0.018+p*0.2)%1);
      var py=-len+pp*len;
      var pa=Math.sin(pp*Math.PI)*lA;
      ctx.fillStyle=hsla(fb.laserHue,25,99,pa*0.95);
      ctx.fillRect(-baseScale*4.5,py-baseScale*2.5,baseScale*9,baseScale*5);
    }
    /* Origin starburst flash */
    var flR=baseScale*18*lA;
    var fl=ctx.createRadialGradient(0,0,0,0,0,flR);
    fl.addColorStop(0,hsla(fb.laserHue,30,98,lA));
    fl.addColorStop(0.35,hsla(fb.laserHue,80,88,lA*0.7));
    fl.addColorStop(1,hsla(fb.laserHue,90,75,0));
    ctx.fillStyle=fl;ctx.beginPath();ctx.arc(0,0,flR,0,Math.PI*2);ctx.fill();
    /* Rotating star rays */
    ctx.strokeStyle=hsla(fb.laserHue,50,96,lA*0.75);
    ctx.lineWidth=Math.max(1,baseScale*1.1);
    for(var r=0;r<6;r++){
      var ra=r*Math.PI/3+fc*0.012;
      ctx.beginPath();ctx.moveTo(0,0);
      ctx.lineTo(Math.cos(ra)*flR*1.7,Math.sin(ra)*flR*1.7);
      ctx.stroke();
    }
    ctx.restore();
    ctx.restore();
  }
};

/* Returns approximate top Y of a famous building (for laser origin) */
P._famousTopY=function(fb,groundY,sc){
  var heights={"orientalPearl":180,"tokyoTower":160,"burjKhalifa":220,"eiffel":150,
    "cctv":110,"goldenGate":70,"forbiddenCity":55,"summerPalace":120,"construction":130};
  return groundY-(heights[fb.type]||100)*sc;
};

/* ── Oriental Pearl Tower (Shanghai) — 3 spheres on tapered column ── */
P._drawOrientalPearl=function(fb,gy,sc,nf,fc,sunDir,dayLight,energy){
  var x=Math.floor(fb.x);
  var H=180*sc;
  var colW=Math.max(3,6*sc);
  var sunHi=dayLight>0.1&&sunDir!==0;
  var sunSide=sunDir>0?1:-1;
  /* Base legs (3 splayed) with detail */
  ctx.strokeStyle=nf>0.5?hsl(210,15,25):hsl(210,10,45);
  ctx.lineWidth=Math.max(1,2*sc);
  ctx.beginPath();
  ctx.moveTo(x-colW*2.5,gy);ctx.lineTo(x-colW*0.5,gy-H*0.35);
  ctx.moveTo(x+colW*2.5,gy);ctx.lineTo(x+colW*0.5,gy-H*0.35);
  ctx.moveTo(x,gy);ctx.lineTo(x,gy-H*0.35);
  ctx.stroke();
  /* Leg cross-braces for detail */
  ctx.lineWidth=Math.max(0.5,1*sc);
  ctx.strokeStyle=nf>0.5?hsla(210,15,20,0.5):hsla(210,10,40,0.4);
  for(var lb=1;lb<=3;lb++){
    var lbY=gy-H*0.35*lb/4;
    var lbW=lerp(colW*2.5,colW*0.5,lb/4);
    ctx.beginPath();ctx.moveTo(x-lbW,lbY);ctx.lineTo(x+lbW,lbY);ctx.stroke();
  }
  /* Main column with sun-side highlight */
  var colBaseL=nf>0.5?30:55;
  if(sunHi){
    var colGrad=ctx.createLinearGradient(x-colW,0,x+colW,0);
    if(sunSide>0){
      colGrad.addColorStop(0,hsl(210,12,colBaseL-8));
      colGrad.addColorStop(0.5,hsl(210,10,colBaseL));
      colGrad.addColorStop(1,hsl(35,20,colBaseL+12*dayLight));
    }else{
      colGrad.addColorStop(0,hsl(35,20,colBaseL+12*dayLight));
      colGrad.addColorStop(0.5,hsl(210,10,colBaseL));
      colGrad.addColorStop(1,hsl(210,12,colBaseL-8));
    }
    ctx.fillStyle=colGrad;
  }else{
    ctx.fillStyle=nf>0.5?hsl(210,12,colBaseL):hsl(210,10,colBaseL);
  }
  ctx.fillRect(x-colW*0.5,gy-H*0.85,colW,H*0.5);
  /* Column vertical fluting */
  ctx.strokeStyle=nf>0.5?hsla(210,15,20,0.3):hsla(210,10,40,0.2);
  ctx.lineWidth=Math.max(0.5,0.5*sc);
  ctx.beginPath();ctx.moveTo(x-colW*0.2,gy-H*0.85);ctx.lineTo(x-colW*0.2,gy-H*0.35);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x+colW*0.2,gy-H*0.85);ctx.lineTo(x+colW*0.2,gy-H*0.35);ctx.stroke();
  /* Spheres: big bottom, medium middle, small top */
  var spheres=[{y:gy-H*0.35,r:14*sc},{y:gy-H*0.62,r:9*sc},{y:gy-H*0.88,r:6*sc}];
  for(var si=0;si<spheres.length;si++){
    var s=spheres[si];
    var sg=ctx.createRadialGradient(x+s.r*0.3*sunSide,s.y-s.r*0.3,0,x,s.y,s.r);
    if(nf>0.4){
      sg.addColorStop(0,hsl(200,40,55));sg.addColorStop(0.6,hsl(210,30,30));sg.addColorStop(1,hsl(220,30,18));
    }else{
      var sphereBase=75;
      if(sunHi){
        sg.addColorStop(0,hsl(200,30,sphereBase+10*dayLight));
        sg.addColorStop(0.5,hsl(210,20,sphereBase));
        sg.addColorStop(1,hsl(220,20,sphereBase-15));
      }else{
        sg.addColorStop(0,hsl(200,30,sphereBase));sg.addColorStop(0.6,hsl(210,20,55));sg.addColorStop(1,hsl(220,20,40));
      }
    }
    ctx.fillStyle=sg;ctx.beginPath();ctx.arc(x,s.y,s.r,0,Math.PI*2);ctx.fill();
    /* Sphere equator ring */
    ctx.strokeStyle=nf>0.5?hsla(200,30,40,0.4):hsla(200,20,60,0.3);
    ctx.lineWidth=Math.max(0.5,0.5*sc);
    ctx.beginPath();ctx.ellipse(x,s.y,s.r,s.r*0.3,0,0,Math.PI*2);ctx.stroke();
  }
  /* Connecting skyway between big and medium sphere */
  ctx.fillStyle=nf>0.5?hsl(210,15,28):hsl(210,10,50);
  ctx.fillRect(x-3*sc,spheres[0].y-s.r,6*sc,spheres[1].y+s.r-spheres[0].y+s.r);
  /* Spire */
  ctx.fillStyle=nf>0.5?hsl(210,15,40):hsl(210,10,60);
  ctx.beginPath();ctx.moveTo(x,gy-H);ctx.lineTo(x-2*sc,gy-H*0.92);ctx.lineTo(x+2*sc,gy-H*0.92);ctx.closePath();ctx.fill();
  /* Antenna detail on spire */
  ctx.strokeStyle=nf>0.5?hsl(0,0,50):hsl(0,0,70);
  ctx.lineWidth=Math.max(0.5,0.5*sc);
  ctx.beginPath();ctx.moveTo(x,gy-H);ctx.lineTo(x,gy-H*1.02);ctx.stroke();
  /* Night flashing lights */
  if(nf>0.3){
    var nA=clamp((nf-0.3)/0.3,0,1)*(0.6+0.4*energy);
    var blink=Math.sin(fc*0.15+fb.flashSeed)>0.4?1:0.2;
    blink*=0.5+0.5*energy; /* Music pulse */
    /* Sphere rim lights */
    for(var si2=0;si2<spheres.length;si2++){
      var s2=spheres[si2];
      ctx.fillStyle=hsla(0,0,90,nA*blink*0.5);
      ctx.beginPath();ctx.arc(x+s2.r*0.7,s2.y-s2.r*0.5,1.5*sc,0,Math.PI*2);ctx.fill();
    }
    /* Column window lights */
    for(var wy=gy-H*0.8;wy>gy-H*0.4;wy-=4*sc){
      if((Math.floor(wy)+fb.flashSeed)%3===0){
        ctx.fillStyle=hsla(45,80,70,nA*0.7);
        ctx.fillRect(x-colW*0.3,wy,1.5*sc,1.5*sc);
      }
    }
    /* Top beacon */
    if(blink>0.5){ctx.fillStyle=hsla(0,90,70,nA);ctx.beginPath();ctx.arc(x,gy-H,2*sc,0,Math.PI*2);ctx.fill()}
  }
};

/* ── Tokyo Tower — red-orange lattice Eiffel-like ── */
P._drawTokyoTower=function(fb,gy,sc,nf,fc,sunDir,dayLight,energy){
  var x=Math.floor(fb.x);
  var H=160*sc;
  var baseW=26*sc, topW=4*sc;
  var sunHi=dayLight>0.1&&sunDir!==0;
  var sunSide=sunDir>0?1:-1;
  var redBase=nf>0.5?32:50;
  var red=nf>0.5?hsl(12,75,redBase):hsl(12,80,redBase);
  var redLite=nf>0.5?hsl(12,80,redBase+10):hsl(12,85,redBase+10);
  var redDark=nf>0.5?hsl(12,70,redBase-10):hsl(12,75,redBase-10);
  var white=nf>0.5?hsl(0,0,70):hsl(0,0,90);
  /* Sun-tinted red on sun-facing side */
  var redSun=sunHi?hsl(25,70,redBase+8*dayLight):red;
  var redShade=sunHi?hsl(10,65,redBase-6*dayLight):redDark;
  /* 4 legs tapering — sun-side and shadow-side differentiation */
  ctx.fillStyle=sunSide>0?redSun:redShade;
  ctx.beginPath();
  ctx.moveTo(x-baseW,gy);ctx.lineTo(x-baseW*0.3,gy);ctx.lineTo(x-topW*0.5,gy-H*0.5);ctx.lineTo(x-topW,gy-H*0.5);
  ctx.closePath();ctx.fill();
  ctx.fillStyle=sunSide>0?redShade:redSun;
  ctx.beginPath();
  ctx.moveTo(x+baseW,gy);ctx.lineTo(x+baseW*0.3,gy);ctx.lineTo(x+topW*0.5,gy-H*0.5);ctx.lineTo(x-topW,gy-H*0.5);
  ctx.closePath();ctx.fill();
  /* Upper section (white) */
  ctx.fillStyle=white;
  ctx.fillRect(x-topW,gy-H*0.85,topW*2,H*0.35);
  /* Lattice cross-braces — more detail with 12 levels */
  ctx.strokeStyle=redLite;ctx.lineWidth=Math.max(0.5,1*sc);
  for(var ly=0;ly<12;ly++){
    var yFrac=ly/12;
    var yB=gy-H*yFrac, yT=gy-H*(yFrac+1/12);
    var wB=lerp(baseW,topW,yFrac), wT=lerp(baseW,topW,yFrac+1/12);
    ctx.beginPath();ctx.moveTo(x-wB,yB);ctx.lineTo(x+wT,yT);ctx.moveTo(x+wB,yB);ctx.lineTo(x-wT,yT);ctx.stroke();
    /* Horizontal brace */
    ctx.beginPath();ctx.moveTo(x-wB,yB);ctx.lineTo(x+wB,yB);ctx.stroke();
    /* X-brace detail */
    if(ly%2===0){
      ctx.lineWidth=Math.max(0.3,0.5*sc);
      ctx.beginPath();ctx.moveTo(x-wB,yB);ctx.lineTo(x+wT,yT);ctx.stroke();
      ctx.lineWidth=Math.max(0.5,1*sc);
    }
  }
  /* Inner vertical center beam */
  ctx.strokeStyle=redDark;ctx.lineWidth=Math.max(0.5,1*sc);
  ctx.beginPath();ctx.moveTo(x,gy);ctx.lineTo(x,gy-H*0.5);ctx.stroke();
  /* Antenna + observatory deck */
  ctx.fillStyle=red;ctx.fillRect(x-topW,gy-H*0.78,topW*2,3*sc);
  ctx.fillStyle=white;ctx.fillRect(x-1*sc,gy-H,2*sc,H*0.15);
  /* Observatory deck windows */
  ctx.fillStyle=nf>0.5?hsla(45,60,50,0.5):hsla(45,50,70,0.4);
  ctx.fillRect(x-topW*0.8,gy-H*0.77,topW*1.6,1.5*sc);
  /* Night flashing */
  if(nf>0.3){
    var nA=clamp((nf-0.3)/0.3,0,1)*(0.6+0.4*energy);
    var blink=Math.sin(fc*0.12+fb.flashSeed)>0.3?1:0.15;
    blink*=0.5+0.5*energy; /* Music pulse */
    /* Observation deck glow */
    ctx.fillStyle=hsla(45,90,70,nA*blink*0.8);
    ctx.fillRect(x-topW*1.5,gy-H*0.78,topW*3,3*sc);
    /* Leg lights */
    for(var li=0;li<6;li++){
      var lY=gy-H*(0.05+li*0.07);
      var lW=lerp(baseW,topW,li*0.07+0.05);
      ctx.fillStyle=hsla(12,90,65,nA*0.6*(Math.sin(fc*0.2+li+fb.flashSeed)>0?1:0.3));
      ctx.fillRect(x-lW-1,lY,2*sc,1.5*sc);ctx.fillRect(x+lW-1,lY,2*sc,1.5*sc);
    }
    /* Top beacon */
    if(blink>0.5){ctx.fillStyle=hsla(0,100,70,nA);ctx.beginPath();ctx.arc(x,gy-H,2.5*sc,0,Math.PI*2);ctx.fill()}
  }
};

/* ── Burj Khalifa — tall tapered spire with setback tiers ── */
P._drawBurjKhalifa=function(fb,gy,sc,nf,fc,sunDir,dayLight,energy){
  var x=Math.floor(fb.x);
  var H=220*sc;
  var baseW=22*sc;
  var sunHi=dayLight>0.1&&sunDir!==0;
  var sunSide=sunDir>0?1:-1;
  /* Y-plan setback tiers (3 lobes) */
  var tiers=12;
  for(var ti=0;ti<tiers;ti++){
    var yF=ti/tiers;
    var yBot=gy-H*yF, yTop=gy-H*(yF+1/tiers);
    var wBot=baseW*(1-yF*0.92), wTop=baseW*(1-(yF+1/tiers)*0.92);
    wBot=Math.max(2*sc,wBot);wTop=Math.max(1*sc,wTop);
    var bL=lerp(40,20,nf), bS=lerp(8,12,nf);
    var tierL=bL+15+yF*8;
    if(nf<0.5)tierL=bL+15+yF*8;
    /* Sun-side gradient on each tier */
    if(sunHi){
      var tierGrad=ctx.createLinearGradient(x-wBot,0,x+wBot,0);
      if(sunSide>0){
        tierGrad.addColorStop(0,hsl(bS,12,tierL-6*dayLight));
        tierGrad.addColorStop(0.6,hsl(bS,12,tierL));
        tierGrad.addColorStop(1,hsl(30,15,tierL+8*dayLight));
      }else{
        tierGrad.addColorStop(0,hsl(30,15,tierL+8*dayLight));
        tierGrad.addColorStop(0.4,hsl(bS,12,tierL));
        tierGrad.addColorStop(1,hsl(bS,12,tierL-6*dayLight));
      }
      ctx.fillStyle=tierGrad;
    }else{
      ctx.fillStyle=nf>0.5?hsl(bS,15,bL+yF*5):hsl(bS,12,tierL);
    }
    /* Central column */
    ctx.fillRect(x-wBot,yTop,wBot*2,yBot-yTop);
    /* Side setbacks (Y-plan silhouette) */
    if(wBot>4*sc){
      ctx.fillRect(x-wBot*1.4,yTop,wBot*0.4,yBot-yTop);
      ctx.fillRect(x+wBot,yTop,wBot*0.4,yBot-yTop);
      /* Recessed shadow between lobes */
      ctx.fillStyle=nf>0.5?hsla(bS,15,bL-8,0.5):hsla(bS,12,tierL-10,0.3);
      ctx.fillRect(x-wBot*1.05,yTop,1.5*sc,yBot-yTop);
      ctx.fillRect(x+wBot-0.5*sc,yTop,1.5*sc,yBot-yTop);
    }
    /* Horizontal banding */
    if(ti%2===0){
      ctx.fillStyle=nf>0.5?hsl(bS,15,bL-5):hsl(bS,12,tierL-5);
      ctx.fillRect(x-wBot,yTop,wBot*2,1*sc);
    }
    /* Vertical mullion lines for glass curtain detail */
    if(wBot>6*sc&&ti%2===1){
      ctx.strokeStyle=nf>0.5?hsla(bS,20,bL-10,0.3):hsla(bS,15,tierL-8,0.2);
      ctx.lineWidth=Math.max(0.3,0.5*sc);
      for(var mx=-wBot+3*sc;mx<wBot;mx+=4*sc){
        ctx.beginPath();ctx.moveTo(x+mx,yTop);ctx.lineTo(x+mx,yBot);ctx.stroke();
      }
    }
  }
  /* Spire */
  ctx.fillStyle=nf>0.5?hsl(20,15,35):hsl(20,12,60);
  ctx.beginPath();ctx.moveTo(x,gy-H);ctx.lineTo(x-1.5*sc,gy-H*0.97);ctx.lineTo(x+1.5*sc,gy-H*0.97);ctx.closePath();ctx.fill();
  /* Spire tip highlight */
  if(sunHi){
    ctx.fillStyle=hsla(35,30,80,dayLight*0.5);
    ctx.fillRect(x+sunSide*0.5*sc,gy-H,1*sc,H*0.03);
  }
  /* Night window flashing */
  if(nf>0.3){
    var nA=clamp((nf-0.3)/0.3,0,1)*(0.6+0.4*energy);
    for(var wi=0;wi<tiers;wi++){
      var wy2=gy-H*(wi/tiers+0.5/tiers);
      var ww=baseW*(1-(wi/tiers+0.5/tiers)*0.92);
      for(var wx=-ww+2*sc;wx<ww;wx+=4*sc){
        if(((Math.floor(wx)+wi+fb.flashSeed)%4)<2){
          var winB=Math.sin(fc*0.1+wi*0.5+wx+fb.flashSeed)>0.2?1:0.2;
          ctx.fillStyle=hsla(45,80,65,nA*winB*0.6);
          ctx.fillRect(x+wx,wy2,1.5*sc,1.5*sc);
        }
      }
    }
    /* Crown lights */
    var crownB=Math.sin(fc*0.18+fb.flashSeed)>0?1:0.3;
    ctx.fillStyle=hsla(200,90,70,nA*crownB*0.7);
    ctx.fillRect(x-3*sc,gy-H*0.97,6*sc,2*sc);
  }
};

/* ── CCTV Building (Beijing) — the "pants" loop shape ── */
P._drawCCTV=function(fb,gy,sc,nf,fc,sunDir,dayLight,energy){
  var x=Math.floor(fb.x);
  var H=110*sc, W=44*sc;
  var sunHi=dayLight>0.1&&sunDir!==0;
  var sunSide=sunDir>0?1:-1;
  var bL=nf>0.5?22:50;
  /* Main fill with sun gradient */
  if(sunHi){
    var cctvGrad=ctx.createLinearGradient(x-W*0.5,0,x+W*0.5,0);
    if(sunSide>0){
      cctvGrad.addColorStop(0,hsl(215,8,bL-6*dayLight));
      cctvGrad.addColorStop(0.5,hsl(215,8,bL));
      cctvGrad.addColorStop(1,hsl(35,12,bL+8*dayLight));
    }else{
      cctvGrad.addColorStop(0,hsl(35,12,bL+8*dayLight));
      cctvGrad.addColorStop(0.5,hsl(215,8,bL));
      cctvGrad.addColorStop(1,hsl(215,8,bL-6*dayLight));
    }
    ctx.fillStyle=cctvGrad;
  }else{
    ctx.fillStyle=nf>0.5?hsl(215,10,bL):hsl(215,8,bL);
  }
  /* Bottom horizontal base */
  ctx.fillRect(x-W*0.5,gy-H*0.22,W,H*0.22);
  /* Two leaning towers (legs of the pants) — slight inward lean */
  var lean=0.12;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(x-W*0.45,gy-H*0.22);
  ctx.lineTo(x-W*0.5+lean*H*0.75,gy-H*0.97);
  ctx.lineTo(x-W*0.2+lean*H*0.75,gy-H*0.97);
  ctx.lineTo(x-W*0.15,gy-H*0.22);
  ctx.closePath();ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x+W*0.45,gy-H*0.22);
  ctx.lineTo(x+W*0.5-lean*H*0.75,gy-H*0.97);
  ctx.lineTo(x+W*0.2-lean*H*0.75,gy-H*0.97);
  ctx.lineTo(x+W*0.15,gy-H*0.22);
  ctx.closePath();ctx.fill();
  ctx.restore();
  /* Top horizontal cantilever */
  ctx.fillRect(x-W*0.5+lean*H*0.75,gy-H*0.97,W,H*0.06);
  /* Glass curtain diagonal stripes */
  ctx.strokeStyle=nf>0.5?hsl(200,30,35):hsl(200,25,65);
  ctx.lineWidth=Math.max(0.5,1*sc);
  for(var sx=-W*0.4;sx<W*0.4;sx+=6*sc){
    ctx.beginPath();ctx.moveTo(x+sx,gy-H*0.25);ctx.lineTo(x+sx+lean*H*0.75,gy-H*0.95);ctx.stroke();
  }
  /* Horizontal floor lines */
  ctx.lineWidth=Math.max(0.3,0.5*sc);
  ctx.strokeStyle=nf>0.5?hsla(200,25,30,0.4):hsla(200,20,55,0.3);
  for(var fy=gy-H*0.9;fy<gy-H*0.25;fy+=4*sc){
    ctx.beginPath();ctx.moveTo(x-W*0.45,gy-H*0.22);ctx.lineTo(x-W*0.5+lean*H*0.75,gy-H*0.97);ctx.stroke();
    /* Left tower floor */
    var lStartY=lerp(gy-H*0.22,gy-H*0.97,(fy-(gy-H*0.22))/((gy-H*0.97)-(gy-H*0.22)));
    if(lStartY>=gy-H*0.22&&lStartY<=gy-H*0.97){
      var lStartX=lerp(x-W*0.45,x-W*0.5+lean*H*0.75,(fy-(gy-H*0.22))/((gy-H*0.97)-(gy-H*0.22)));
      var lEndX=lerp(x-W*0.15,x-W*0.2+lean*H*0.75,(fy-(gy-H*0.22))/((gy-H*0.97)-(gy-H*0.22)));
      ctx.beginPath();ctx.moveTo(lStartX,fy);ctx.lineTo(lEndX,fy);ctx.stroke();
    }
  }
  /* Night window grid flashing */
  if(nf>0.3){
    var nA=clamp((nf-0.3)/0.3,0,1)*(0.6+0.4*energy);
    for(var lx=-W*0.4;lx<W*0.4;lx+=5*sc){
      for(var ly=gy-H*0.9;ly<gy-H*0.25;ly+=5*sc){
        if((Math.floor(lx)+Math.floor(ly)+fb.flashSeed)%5<2){
          var winB=Math.sin(fc*0.13+lx*0.1+ly*0.1+fb.flashSeed)>0.1?1:0.25;
          ctx.fillStyle=hsla(200,70,65,nA*winB*0.6);
          ctx.fillRect(x+lx+lean*(gy-ly),ly,2*sc,2*sc);
        }
      }
    }
  }
};

/* ── Eiffel Tower — brown lattice with 3 levels ── */
P._drawEiffel=function(fb,gy,sc,nf,fc,sunDir,dayLight,energy){
  var x=Math.floor(fb.x);
  var H=150*sc;
  var baseW=24*sc, midW=10*sc, topW=4*sc;
  var sunHi=dayLight>0.1&&sunDir!==0;
  var sunSide=sunDir>0?1:-1;
  var brBase=nf>0.5?22:42;
  var br=nf>0.5?hsl(28,35,brBase):hsl(28,40,brBase);
  var brLite=nf>0.5?hsl(28,40,brBase+10):hsl(28,45,brBase+13);
  var brDark=nf>0.5?hsl(28,30,brBase-6):hsl(28,35,brBase-8);
  var brSun=sunHi?hsl(32,35,brBase+6*dayLight):br;
  var brShade=sunHi?hsl(25,30,brBase-4*dayLight):brDark;
  /* 4 curved legs to level 1 — sun-side/shadow-side */
  ctx.fillStyle=sunSide>0?brShade:brSun;
  ctx.beginPath();
  ctx.moveTo(x-baseW,gy);ctx.lineTo(x-midW*0.8,gy-H*0.28);
  ctx.lineTo(x-midW*0.3,gy-H*0.28);ctx.lineTo(x-baseW*0.3,gy);ctx.closePath();ctx.fill();
  ctx.fillStyle=sunSide>0?brSun:brShade;
  ctx.beginPath();
  ctx.moveTo(x+baseW,gy);ctx.lineTo(x+midW*0.8,gy-H*0.28);
  ctx.lineTo(x+midW*0.3,gy-H*0.28);ctx.lineTo(x+baseW*0.3,gy);ctx.closePath();ctx.fill();
  /* Level 1 platform */
  ctx.fillRect(x-baseW*0.9,gy-H*0.28,baseW*1.8,H*0.03);
  /* Mid section to level 2 */
  ctx.fillStyle=sunSide>0?brShade:brSun;
  ctx.beginPath();
  ctx.moveTo(x-midW*0.8,gy-H*0.31);ctx.lineTo(x-topW*0.8,gy-H*0.7);
  ctx.lineTo(x-topW*0.3,gy-H*0.7);ctx.lineTo(x-midW*0.3,gy-H*0.31);ctx.closePath();ctx.fill();
  ctx.fillStyle=sunSide>0?brSun:brShade;
  ctx.beginPath();
  ctx.moveTo(x+midW*0.8,gy-H*0.31);ctx.lineTo(x+topW*0.8,gy-H*0.7);
  ctx.lineTo(x+topW*0.3,gy-H*0.7);ctx.lineTo(x+midW*0.3,gy-H*0.31);ctx.closePath();ctx.fill();
  /* Level 2 platform */
  ctx.fillRect(x-midW,gy-H*0.7,midW*2,H*0.025);
  /* Top section + antenna */
  ctx.fillStyle=br;
  ctx.fillRect(x-topW*0.5,gy-H,topW,H*0.3);
  /* Lattice cross-braces — denser with 14 levels */
  ctx.strokeStyle=brLite;ctx.lineWidth=Math.max(0.5,0.8*sc);
  for(var ci=0;ci<14;ci++){
    var yF=ci/14, yT=(ci+1)/14;
    var wBF=lerp(baseW,midW*0.8,yF), wTF=lerp(baseW,midW*0.8,yT);
    if(yF<0.28){
      ctx.beginPath();ctx.moveTo(x-wBF,gy-H*yF);ctx.lineTo(x+wTF,gy-H*yT);
      ctx.moveTo(x+wBF,gy-H*yF);ctx.lineTo(x-wTF,gy-H*yT);ctx.stroke();
      /* Horizontal */
      ctx.beginPath();ctx.moveTo(x-wBF,gy-H*yF);ctx.lineTo(x+wBF,gy-H*yF);ctx.stroke();
    }
  }
  /* Mid-section lattice */
  ctx.lineWidth=Math.max(0.3,0.5*sc);
  for(var mi=0;mi<8;mi++){
    var myF=0.31+mi*0.05;
    if(myF>0.7)break;
    var mwB=lerp(midW*0.8,topW*0.8,(myF-0.31)/0.39);
    ctx.beginPath();ctx.moveTo(x-mwB,gy-H*myF);ctx.lineTo(x+mwB,gy-H*myF);ctx.stroke();
  }
  /* Level 1 arch detail */
  ctx.strokeStyle=brDark;ctx.lineWidth=Math.max(0.5,1*sc);
  ctx.beginPath();
  ctx.moveTo(x-baseW*0.85,gy-H*0.05);
  ctx.quadraticCurveTo(x,gy-H*0.18,x+baseW*0.85,gy-H*0.05);
  ctx.stroke();
  /* Night sparkle (the Eiffel sparkles!) */
  if(nf>0.3){
    var nA=clamp((nf-0.3)/0.3,0,1)*(0.6+0.4*energy);
    /* Sparkle effect — random dots for 5s every 10s */
    var sparklePhase=Math.floor(fc/600)%2;
    if(sparklePhase===0){
      var sparkCount=Math.floor(20+30*energy);
      for(var sp=0;sp<sparkCount;sp++){
        var sy=gy-randf(0,H*0.95);
        var sx2=x+randf(-baseW*(1-sy/H*0.8),baseW*(1-sy/H*0.8));
        if((sp+fc+fb.flashSeed)%3===0){
          ctx.fillStyle=hsla(50,90,80,nA*randf(0.4,1));
          ctx.fillRect(sx2,sy,1.5*sc,1.5*sc);
        }
      }
    }
    /* Steady golden glow on platforms */
    ctx.fillStyle=hsla(40,70,60,nA*0.5);
    ctx.fillRect(x-baseW*0.9,gy-H*0.28,baseW*1.8,2*sc);
    ctx.fillRect(x-midW,gy-H*0.7,midW*2,2*sc);
    /* Top beacon rotating */
    var beaconA=Math.abs(Math.sin(fc*0.05));
    ctx.fillStyle=hsla(0,90,70,nA*beaconA*0.8);
    ctx.beginPath();ctx.arc(x,gy-H,3*sc,0,Math.PI*2);ctx.fill();
  }
};

/* ── Golden Gate Bridge — red suspension bridge ── */
P._drawGoldenGate=function(fb,gy,sc,nf,fc,sunDir,dayLight,energy){
  var x=Math.floor(fb.x);
  var H=70*sc, span=90*sc;
  var sunHi=dayLight>0.1&&sunDir!==0;
  var sunSide=sunDir>0?1:-1;
  var ggBase=nf>0.5?30:48;
  var ggRed=nf>0.5?hsl(8,65,ggBase):hsl(8,75,ggBase);
  var ggRedLite=nf>0.5?hsl(8,70,ggBase+10):hsl(8,80,ggBase+10);
  var ggRedSun=sunHi?hsl(15,65,ggBase+6*dayLight):ggRed;
  var ggRedShade=sunHi?hsl(5,60,ggBase-5*dayLight):ggRed;
  /* Deck */
  ctx.fillStyle=nf>0.5?hsl(8,40,20):hsl(8,50,40);
  ctx.fillRect(x-span,gy-H*0.1,span*2,4*sc);
  /* Deck railing */
  ctx.strokeStyle=nf>0.5?hsl(8,50,28):hsl(8,55,48);
  ctx.lineWidth=Math.max(0.5,0.5*sc);
  ctx.beginPath();ctx.moveTo(x-span,gy-H*0.1-1*sc);ctx.lineTo(x+span,gy-H*0.1-1*sc);ctx.stroke();
  /* Two towers — sun-side differentiation */
  for(var ti=0;ti<2;ti++){
    var tx=x+(ti===0?-span*0.4:span*0.4);
    var towerSide=(ti===0?-1:1)*sunSide;
    ctx.fillStyle=towerSide>0?ggRedSun:ggRedShade;
    ctx.fillRect(tx-2*sc,gy-H,4*sc,H);
    /* Tower cross-braces */
    ctx.fillStyle=ggRed;
    for(var cb=0;cb<3;cb++){
      ctx.fillRect(tx-3*sc,gy-H*0.3-cb*H*0.2,6*sc,1.5*sc);
    }
    /* Tower top detail — finial */
    ctx.fillRect(tx-1*sc,gy-H-H*0.05,2*sc,H*0.05);
    /* Sun-side highlight strip */
    if(sunHi){
      ctx.fillStyle=hsla(20,40,75,dayLight*0.4);
      ctx.fillRect(tx+towerSide*1.5*sc,gy-H,1*sc,H);
    }
  }
  /* Suspension cables (catenary curve) */
  ctx.strokeStyle=ggRedLite;ctx.lineWidth=Math.max(1,1.5*sc);
  /* Main span cable */
  ctx.beginPath();
  for(var cx=-span*0.4;cx<=span*0.4;cx+=2){
    var t=(cx+span*0.4)/(span*0.8);
    var y=gy-H*0.1-H*0.7*Math.sin(t*Math.PI);
    if(cx===-span*0.4)ctx.moveTo(x+cx,y);else ctx.lineTo(x+cx,y);
  }
  ctx.stroke();
  /* Side span cables */
  ctx.beginPath();
  for(var sx2=-span;sx2<=-span*0.4;sx2+=2){
    var t2=(sx2+span)/(span*0.6);
    var y2=gy-H*0.1-H*0.4*Math.sin(t2*Math.PI);
    if(sx2===-span)ctx.moveTo(x+sx2,y2);else ctx.lineTo(x+sx2,y2);
  }
  ctx.stroke();
  ctx.beginPath();
  for(var sx3=span*0.4;sx3<=span;sx3+=2){
    var t3=(sx3-span*0.4)/(span*0.6);
    var y3=gy-H*0.1-H*0.4*Math.sin(t3*Math.PI);
    if(sx3===span*0.4)ctx.moveTo(x+sx3,y3);else ctx.lineTo(x+sx3,y3);
  }
  ctx.stroke();
  /* Vertical hangers */
  ctx.lineWidth=Math.max(0.5,0.8*sc);
  for(var hx=-span*0.38;hx<=span*0.38;hx+=6*sc){
    var ht=(hx+span*0.4)/(span*0.8);
    var hy=gy-H*0.1-H*0.7*Math.sin(ht*Math.PI);
    ctx.beginPath();ctx.moveTo(x+hx,gy-H*0.1);ctx.lineTo(x+hx,hy);ctx.stroke();
  }
  /* Tower pier bases in water */
  for(var pi=0;pi<2;pi++){
    var px2=x+(pi===0?-span*0.4:span*0.4);
    ctx.fillStyle=nf>0.5?hsl(210,10,15):hsl(210,8,35);
    ctx.fillRect(px2-3*sc,gy,6*sc,3*sc);
  }
  /* Night lights */
  if(nf>0.3){
    var nA=clamp((nf-0.3)/0.3,0,1)*(0.6+0.4*energy);
    /* Deck roadway lights */
    for(var dlx=-span;dlx<=span;dlx+=8*sc){
      var dlB=Math.sin(fc*0.1+dlx*0.1+fb.flashSeed)>-0.3?1:0.3;
      ctx.fillStyle=hsla(45,80,65,nA*dlB*0.7);
      ctx.fillRect(x+dlx,gy-H*0.1-1*sc,1.5*sc,1.5*sc);
    }
    /* Tower top beacons */
    for(var tbi=0;tbi<2;tbi++){
      var tbx=x+(tbi===0?-span*0.4:span*0.4);
      if(Math.sin(fc*0.08+tbi+fb.flashSeed)>0){
        ctx.fillStyle=hsla(0,90,70,nA*0.9);
        ctx.beginPath();ctx.arc(tbx,gy-H,2*sc,0,Math.PI*2);ctx.fill();
      }
    }
  }
};

/* ── Forbidden City — low palace with golden tiered roofs ── */
P._drawForbiddenCity=function(fb,gy,sc,nf,fc,sunDir,dayLight,energy){
  var x=Math.floor(fb.x);
  var W=55*sc, H=55*sc;
  var sunHi=dayLight>0.1&&sunDir!==0;
  var sunSide=sunDir>0?1:-1;
  var wallBase=nf>0.5?22:45;
  var wall=nf>0.5?hsl(15,55,wallBase):hsl(15,60,wallBase);
  var wallLite=nf>0.5?hsl(15,60,wallBase+8):hsl(15,65,wallBase+10);
  var wallSun=sunHi?hsl(20,55,wallBase+6*dayLight):wall;
  var wallShade=sunHi?hsl(10,50,wallBase-4*dayLight):wall;
  var roof=nf>0.5?hsl(42,60,30):hsl(42,70,52);
  var roofLite=nf>0.5?hsl(42,70,42):hsl(42,80,65);
  var roofSun=sunHi?hsl(45,65,52+8*dayLight):roof;
  var roofShade=sunHi?hsl(38,55,52-6*dayLight):roof;
  /* Main hall body with sun gradient */
  if(sunHi){
    var wallGrad=ctx.createLinearGradient(x-W*0.5,0,x+W*0.5,0);
    if(sunSide>0){wallGrad.addColorStop(0,wallShade);wallGrad.addColorStop(1,wallSun)}
    else{wallGrad.addColorStop(0,wallSun);wallGrad.addColorStop(1,wallShade)}
    ctx.fillStyle=wallGrad;
  }else{ctx.fillStyle=wall}
  ctx.fillRect(x-W*0.5,gy-H*0.45,W,H*0.45);
  /* Central hall — taller */
  ctx.fillRect(x-W*0.2,gy-H*0.7,W*0.4,H*0.7);
  /* Marble foundation base */
  ctx.fillStyle=nf>0.5?hsl(30,5,25):hsl(30,8,60);
  ctx.fillRect(x-W*0.55,gy-H*0.05,W*1.1,H*0.05);
  ctx.fillStyle=nf>0.5?hsl(30,5,20):hsl(30,8,52);
  ctx.fillRect(x-W*0.55,gy-H*0.05,W*1.1,1.5*sc);
  /* Tiered roofs (curved eaves) */
  function drawRoof(rx,rw,ry,rh,roofColor,roofLiteColor){
    ctx.fillStyle=roofColor;
    ctx.beginPath();
    ctx.moveTo(rx-rw*0.6,ry);
    ctx.quadraticCurveTo(rx-rw*0.65,ry-rh*0.3,rx-rw*0.3,ry-rh*0.5);
    ctx.lineTo(rx+rw*0.3,ry-rh*0.5);
    ctx.quadraticCurveTo(rx+rw*0.65,ry-rh*0.3,rx+rw*0.6,ry);
    ctx.closePath();ctx.fill();
    /* Roof highlight */
    ctx.fillStyle=roofLiteColor;
    ctx.beginPath();
    ctx.moveTo(rx-rw*0.3,ry-rh*0.5);
    ctx.lineTo(rx+rw*0.3,ry-rh*0.5);
    ctx.lineTo(rx,ry-rh*0.6);
    ctx.closePath();ctx.fill();
    /* Eave ridge line */
    ctx.strokeStyle=nf>0.5?hsla(42,60,40,0.5):hsla(42,70,62,0.4);
    ctx.lineWidth=Math.max(0.5,0.5*sc);
    ctx.beginPath();
    ctx.moveTo(rx-rw*0.65,ry-rh*0.3);
    ctx.quadraticCurveTo(rx-rw*0.3,ry-rh*0.5,rx+rw*0.3,ry-rh*0.5);
    ctx.quadraticCurveTo(rx+rw*0.65,ry-rh*0.3,rx+rw*0.6,ry);
    ctx.stroke();
  }
  var roofMain=sunSide>0?roofShade:roofSun;
  var roofMain2=sunSide>0?roofSun:roofShade;
  drawRoof(x,W*0.5,gy-H*0.45,H*0.18,roofMain,roofLite);
  drawRoof(x,W*0.22,gy-H*0.7,H*0.2,roofMain,roofLite);
  drawRoof(x,W*0.16,gy-H*0.85,H*0.12,roofMain,roofLite);
  /* Side wings */
  ctx.fillStyle=sunSide>0?wallShade:wallSun;
  ctx.fillRect(x-W*0.5,gy-H*0.3,W*0.15,H*0.3);
  ctx.fillRect(x+W*0.35,gy-H*0.3,W*0.15,H*0.3);
  drawRoof(x-W*0.42,W*0.18,gy-H*0.3,H*0.1,roofMain2,roofLite);
  drawRoof(x+W*0.42,W*0.18,gy-H*0.3,H*0.1,roofMain2,roofLite);
  /* Columns */
  ctx.fillStyle=wallLite;
  for(var cx2=-W*0.18;cx2<=W*0.18;cx2+=5*sc){
    ctx.fillRect(x+cx2,gy-H*0.65,1.5*sc,H*0.65);
  }
  /* Doorway arch */
  ctx.fillStyle=nf>0.5?hsl(15,40,15):hsl(15,45,30);
  ctx.fillRect(x-3*sc,gy-H*0.35,6*sc,H*0.35);
  /* Roof ridge ornaments (hipping) */
  ctx.fillStyle=roofLite;
  for(var ri2=0;ri2<3;ri2++){
    var ry2=gy-H*(0.45+ri2*0.15);
    ctx.fillRect(x-1*sc,ry2-H*0.08,2*sc,H*0.04);
  }
  /* Night lights — warm lanterns */
  if(nf>0.3){
    var nA=clamp((nf-0.3)/0.3,0,1)*(0.6+0.4*energy);
    /* Lanterns along eaves */
    for(var li2=-2;li2<=2;li2++){
      var lanB=Math.sin(fc*0.15+li2+fb.flashSeed)>-0.2?1:0.2;
      lanB*=0.5+0.5*energy; /* Music pulse */
      ctx.fillStyle=hsla(15,90,60,nA*lanB*0.85);
      ctx.beginPath();ctx.arc(x+li2*8*sc,gy-H*0.5,2*sc,0,Math.PI*2);ctx.fill();
    }
    /* Doorway glow */
    var dg=ctx.createRadialGradient(x,gy-H*0.1,0,x,gy-H*0.1,10*sc);
    dg.addColorStop(0,hsla(40,80,55,nA*0.5));dg.addColorStop(1,hsla(40,80,55,0));
    ctx.fillStyle=dg;ctx.beginPath();ctx.arc(x,gy-H*0.1,10*sc,0,Math.PI*2);ctx.fill();
    /* Window glows */
    for(var wx2=-W*0.3;wx2<=W*0.3;wx2+=8*sc){
      if(Math.abs(wx2)>W*0.2){
        ctx.fillStyle=hsla(40,70,55,nA*0.4);
        ctx.fillRect(x+wx2,gy-H*0.35,3*sc,4*sc);
      }
    }
  }
};

/* ── Summer Palace — multi-tiered pagoda ── */
P._drawSummerPalace=function(fb,gy,sc,nf,fc,sunDir,dayLight,energy){
  var x=Math.floor(fb.x);
  var H=120*sc;
  var sunHi=dayLight>0.1&&sunDir!==0;
  var sunSide=sunDir>0?1:-1;
  var bodyBase=nf>0.5?28:55;
  var body=nf>0.5?hsl(25,30,bodyBase):hsl(25,35,bodyBase);
  var bodyLite=nf>0.5?hsl(25,35,bodyBase+10):hsl(25,40,bodyBase+13);
  var bodySun=sunHi?hsl(30,30,bodyBase+6*dayLight):body;
  var bodyShade=sunHi?hsl(22,28,bodyBase-4*dayLight):body;
  var roof=nf>0.5?hsl(10,50,25):hsl(10,60,45);
  var roofLite=nf>0.5?hsl(10,60,35):hsl(10,70,58);
  var roofSun=sunHi?hsl(12,55,45+6*dayLight):roof;
  var roofShade=sunHi?hsl(8,45,45-5*dayLight):roof;
  var tiers=5;
  for(var ti2=0;ti2<tiers;ti2++){
    var tF=ti2/tiers;
    var tY=gy-H*tF-H/tiers;
    var tW=(1-tF*0.6)*16*sc;
    var tH=H/tiers*0.7;
    /* Body section with sun gradient */
    if(sunHi){
      var bodyGrad=ctx.createLinearGradient(x-tW,0,x+tW,0);
      if(sunSide>0){bodyGrad.addColorStop(0,bodyShade);bodyGrad.addColorStop(1,bodySun)}
      else{bodyGrad.addColorStop(0,bodySun);bodyGrad.addColorStop(1,bodyShade)}
      ctx.fillStyle=bodyGrad;
    }else{ctx.fillStyle=body}
    ctx.fillRect(x-tW*0.7,tY,tW*1.4,tH);
    /* Curved roof eave */
    ctx.fillStyle=sunSide>0?roofShade:roofSun;
    ctx.beginPath();
    ctx.moveTo(x-tW,tY);
    ctx.quadraticCurveTo(x-tW*1.1,tY-tH*0.3,x-tW*0.4,tY-tH*0.5);
    ctx.lineTo(x+tW*0.4,tY-tH*0.5);
    ctx.quadraticCurveTo(x+tW*1.1,tY-tH*0.3,x+tW,tY);
    ctx.closePath();ctx.fill();
    /* Roof ridge highlight */
    ctx.fillStyle=roofLite;
    ctx.fillRect(x-tW*0.4,tY-tH*0.5,tW*0.8,1*sc);
    /* Upswept eave corners (distinctive Chinese architecture) */
    ctx.strokeStyle=roofLite;ctx.lineWidth=Math.max(0.5,1*sc);
    ctx.beginPath();
    ctx.moveTo(x-tW,tY);
    ctx.quadraticCurveTo(x-tW*1.15,tY-tH*0.15,x-tW*1.2,tY-tH*0.35);
    ctx.moveTo(x+tW,tY);
    ctx.quadraticCurveTo(x+tW*1.15,tY-tH*0.15,x+tW*1.2,tY-tH*0.35);
    ctx.stroke();
    /* Window */
    if(tW>4*sc){
      ctx.fillStyle=bodyLite;
      ctx.fillRect(x-2*sc,tY+tH*0.2,4*sc,tH*0.4);
      /* Window frame */
      ctx.strokeStyle=nf>0.5?hsla(25,30,20,0.5):hsla(25,35,40,0.3);
      ctx.lineWidth=Math.max(0.3,0.5*sc);
      ctx.strokeRect(x-2*sc,tY+tH*0.2,4*sc,tH*0.4);
    }
    /* Horizontal floor band */
    ctx.fillStyle=nf>0.5?hsla(25,30,20,0.4):hsla(25,35,40,0.3);
    ctx.fillRect(x-tW*0.7,tY+tH-1*sc,tW*1.4,1*sc);
  }
  /* Finial spire */
  ctx.fillStyle=roof;ctx.fillRect(x-1*sc,gy-H-H*0.05,2*sc,H*0.06);
  ctx.beginPath();ctx.arc(x,gy-H-H*0.06,2*sc,0,Math.PI*2);ctx.fill();
  /* Finial orbs */
  ctx.fillStyle=roofLite;
  ctx.beginPath();ctx.arc(x,gy-H-H*0.08,1.5*sc,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(x,gy-H-H*0.1,1*sc,0,Math.PI*2);ctx.fill();
  /* Night lantern lights */
  if(nf>0.3){
    var nA=clamp((nf-0.3)/0.3,0,1)*(0.6+0.4*energy);
    for(var li3=0;li3<tiers;li3++){
      var lY=gy-H*(li3/tiers+0.5/tiers)-H/tiers*0.3;
      var lB=Math.sin(fc*0.14+li3*0.8+fb.flashSeed)>-0.3?1:0.2;
      lB*=0.5+0.5*energy; /* Music pulse */
      ctx.fillStyle=hsla(40,85,65,nA*lB*0.85);
      ctx.beginPath();ctx.arc(x,lY,2*sc,0,Math.PI*2);ctx.fill();
      /* Eave corner lights */
      var lW2=(1-(li3/tiers)*0.6)*16*sc;
      ctx.fillRect(x-lW2*0.9,lY,1.5*sc,1.5*sc);
      ctx.fillRect(x+lW2*0.8,lY,1.5*sc,1.5*sc);
    }
  }
};

/* ── Construction Building — skeleton frame + working crane, music-reactive ── */
P._drawConstructionBldg=function(fb,gy,sc,nf,fc,sunDir,dayLight,energy){
  var x=Math.floor(fb.x);
  var maxH=130*sc;
  var curH=maxH*fb.buildProgress;
  var W=22*sc;
  var sunHi=dayLight>0.1&&sunDir!==0;
  var sunSide=sunDir>0?1:-1;
  var steelBase=nf>0.5?28:50;
  var steel=nf>0.5?hsl(210,8,steelBase):hsl(210,6,steelBase);
  var steelLite=nf>0.5?hsl(210,10,steelBase+12):hsl(210,8,steelBase+15);
  var steelSun=sunHi?hsl(35,10,steelBase+8*dayLight):steel;
  var steelShade=sunHi?hsl(210,8,steelBase-5*dayLight):steel;
  /* Skeleton frame (built portion) */
  ctx.strokeStyle=steel;ctx.lineWidth=Math.max(1,1.5*sc);
  /* Vertical columns */
  ctx.beginPath();ctx.moveTo(x-W*0.5,gy);ctx.lineTo(x-W*0.5,gy-curH);
  ctx.moveTo(x+W*0.5,gy);ctx.lineTo(x+W*0.5,gy-curH);ctx.stroke();
  /* Floor beams + cross-braces */
  var floors=Math.floor(curH/(8*sc));
  for(var fi=0;fi<=floors;fi++){
    var fY=gy-fi*8*sc;
    if(fY<gy-curH)break;
    ctx.beginPath();ctx.moveTo(x-W*0.5,fY);ctx.lineTo(x+W*0.5,fY);ctx.stroke();
    if(fi%2===0){
      ctx.beginPath();ctx.moveTo(x-W*0.5,fY);ctx.lineTo(x+W*0.5,fY-8*sc);ctx.stroke();
      ctx.beginPath();ctx.moveTo(x+W*0.5,fY);ctx.lineTo(x-W*0.5,fY-8*sc);ctx.stroke();
    }
  }
  /* Top incomplete floor — partial beams */
  var topFY=gy-floors*8*sc;
  if(topFY>gy-curH){
    ctx.strokeStyle=steelLite;ctx.setLineDash([3*sc,2*sc]);
    ctx.beginPath();ctx.moveTo(x-W*0.5,topFY);ctx.lineTo(x+W*0.5,topFY);ctx.stroke();
    ctx.setLineDash([]);
  }
  /* Construction crane (tower + jib) */
  var craneX=x+W*0.2, craneBaseY=gy, craneTopY=gy-curH-15*sc;
  /* Mast */
  ctx.strokeStyle=steel;ctx.lineWidth=Math.max(1,2*sc);
  ctx.beginPath();ctx.moveTo(craneX,craneBaseY);ctx.lineTo(craneX,craneTopY);ctx.stroke();
  /* Mast cross-braces */
  for(var cb2=0;cb2<8;cb2++){
    var cbY=lerp(craneBaseY,craneTopY,cb2/8);
    var cbY2=lerp(craneBaseY,craneTopY,(cb2+1)/8);
    ctx.beginPath();ctx.moveTo(craneX-2*sc,cbY);ctx.lineTo(craneX+2*sc,cbY2);ctx.stroke();
    ctx.beginPath();ctx.moveTo(craneX+2*sc,cbY);ctx.lineTo(craneX-2*sc,cbY2);ctx.stroke();
  }
  /* Operator cabin */
  ctx.fillStyle=steel;ctx.fillRect(craneX-3*sc,craneTopY-2*sc,6*sc,4*sc);
  /* Jib (horizontal arm) — rotates with craneAngle */
  ctx.save();
  ctx.translate(craneX,craneTopY);
  ctx.rotate(fb.craneAngle*0.3);
  var jibLen=25*sc;
  ctx.strokeStyle=steelLite;ctx.lineWidth=Math.max(1,1.5*sc);
  ctx.beginPath();ctx.moveTo(-jibLen*0.3,0);ctx.lineTo(jibLen,0);ctx.stroke();
  /* Jib truss */
  for(var jt=0;jt<5;jt++){
    var jx=lerp(-jibLen*0.3,jibLen,jt/5);
    ctx.beginPath();ctx.moveTo(jx,0);ctx.lineTo(jx+jibLen*0.1,2*sc);ctx.stroke();
    ctx.beginPath();ctx.moveTo(jx,0);ctx.lineTo(jx+jibLen*0.1,-2*sc);ctx.stroke();
  }
  /* Hook line + load — bobs with music */
  var hookX=jibLen*0.7;
  var hookLen=10*sc+Math.sin(fc*0.1+fb.phase)*4*sc*(0.5+(this._energy||0)*2);
  ctx.strokeStyle=steel;ctx.lineWidth=0.8*sc;
  ctx.beginPath();ctx.moveTo(hookX,0);ctx.lineTo(hookX,hookLen);ctx.stroke();
  /* Load block */
  ctx.fillStyle=steel;ctx.fillRect(hookX-2*sc,hookLen,4*sc,3*sc);
  ctx.restore();
  /* Counter-jib + counterweight */
  ctx.fillStyle=steel;ctx.fillRect(craneX-jibLen*0.35-4*sc,craneTopY-2*sc,4*sc,4*sc);
  /* Night work lights */
  if(nf>0.3){
    var nA=clamp((nf-0.3)/0.3,0,1)*(0.6+0.4*energy);
    /* Crane top beacon */
    if(Math.sin(fc*0.2+fb.flashSeed)>0){
      ctx.fillStyle=hsla(0,90,65,nA);ctx.beginPath();ctx.arc(craneX,craneTopY,2*sc,0,Math.PI*2);ctx.fill();
    }
    /* Work floodlights on built floors */
    for(var wfi=0;wfi<floors;wfi+=2){
      if((wfi+fb.flashSeed)%3===0){
        var wfY=gy-wfi*8*sc-4*sc;
        ctx.fillStyle=hsla(45,70,60,nA*0.6);
        ctx.fillRect(x-W*0.45,wfY,W*0.9,1.5*sc);
      }
    }
    /* Hook work light */
    ctx.fillStyle=hsla(45,80,70,nA*0.7);
    ctx.beginPath();ctx.arc(craneX+Math.cos(fb.craneAngle*0.3)*jibLen*0.7,craneTopY+10*sc+Math.sin(fc*0.1+fb.phase)*4*sc,2*sc,0,Math.PI*2);ctx.fill();
  }
};

/* ══════════════════════════════════════════════════════════════════════════════════════
   GODZILLA — Sprite-based kaiju with 2D cut-out rigging animation
   Rendered in 3 passes: body (before buildings), effects (after all buildings)
   ══════════════════════════════════════════════════════════════════════════════════════ */
var _GZParts=null,_GZLoaded=false,_GZCache={};

P._initGodzillaSprite=function(){
  if(_GZLoaded)return;_GZLoaded=true;
  var img=new Image();
  img.onerror=function(){console.warn("Godzilla sprite failed");_GZParts=P._fallbackParts();};
  img.onload=function(){
    var oc=document.createElement("canvas");
    var W=img.naturalWidth,H=img.naturalHeight;
    oc.width=W;oc.height=H;
    var c=oc.getContext("2d");c.drawImage(img,0,0);
    var id=c.getImageData(0,0,W,H);var d=id.data;
    for(var i=0;i<d.length;i+=4){if(d[i]>220&&d[i+1]>220&&d[i+2]>220)d[i+3]=0;}
    c.putImageData(id,0,0);
    _GZParts=P._sliceGodzilla(oc,W,H);
    console.log("Godzilla sprite sliced: "+W+"x"+H);
  };
  img.src="godzilla_sprite.jpg";
};
P._sliceGodzilla=function(srcCanvas,SW,SH){
  var M=4;
  var defs={
    tail:{x:0,y:0.42,w:0.42,h:0.30,px:0.42,py:0.50},
    farLegU:{x:0.52,y:0.55,w:0.16,h:0.22,px:0.56,py:0.58},
    farLegL:{x:0.54,y:0.72,w:0.14,h:0.24,px:0.60,py:0.72},
    torso:{x:0.40,y:0.18,w:0.34,h:0.50,px:0.55,py:0.45},
    farArm:{x:0.56,y:0.32,w:0.12,h:0.20,px:0.58,py:0.34},
    neck:{x:0.60,y:0.14,w:0.14,h:0.20,px:0.64,py:0.30},
    head:{x:0.70,y:0.05,w:0.20,h:0.28,px:0.74,py:0.30},
    nearArm:{x:0.64,y:0.30,w:0.14,h:0.22,px:0.66,py:0.32},
    nearLegU:{x:0.65,y:0.52,w:0.16,h:0.24,px:0.68,py:0.55},
    nearLegL:{x:0.66,y:0.70,w:0.16,h:0.28,px:0.70,py:0.72}
  };
  var parts={};
  for(var k in defs){
    var d=defs[k];
    var sx=Math.floor(d.x*SW),sy=Math.floor(d.y*SH);
    var sw=Math.floor(d.w*SW),sh=Math.floor(d.h*SH);
    var ex=Math.max(0,sx-M),ey=Math.max(0,sy-M);
    var ew=Math.min(SW-ex,sw+M*2),eh=Math.min(SH-ey,sh+M*2);
    var pc=document.createElement("canvas");pc.width=ew;pc.height=eh;
    pc.getContext("2d").drawImage(srcCanvas,ex,ey,ew,eh,0,0,ew,eh);
    parts[k]={canvas:pc,w:ew,h:eh,pivotX:sx+d.px*SW-ex,pivotY:sy+d.py*SH-ey,origX:ex,origY:ey};
  }
  return {parts:parts,sw:SW,sh:SH,_fullCanvas:srcCanvas};
};
P._fallbackParts=function(){
  var mp=function(w,h,col){var c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").fillStyle=col;c.getContext("2d").fillRect(0,0,w,h);return{canvas:c,w:w,h:h,pivotX:w/2,pivotY:h/2,origX:0,origY:0};};
  return {parts:{tail:mp(120,40,"#1a1a1a"),farLegU:mp(30,50,"#1a1a1a"),farLegL:mp(28,55,"#222"),torso:mp(100,80,"#2a2a2a"),farArm:mp(20,35,"#1a1a1a"),neck:mp(30,30,"#2a2a2a"),head:mp(50,40,"#2a2a2a"),nearArm:mp(22,38,"#222"),nearLegU:mp(32,55,"#222"),nearLegL:mp(30,60,"#1a1a1a")},sw:200,sh:200};
};

function _drawGZPart(part,screenX,screenY,angle,sc){
  var c=part.canvas,pw=part.w,ph=part.h;
  ctx.save();
  ctx.translate(screenX,screenY);
  ctx.scale(sc,sc);
  if(angle)ctx.rotate(angle);
  ctx.drawImage(c,-part.pivotX,-part.pivotY);
  ctx.restore();
}

/* Compute 2D rigging pose — returns joint angles for all parts */
P._computeGZPose=function(t,isWalking,mouthPhase,beamActive){
  var walkSpd=isWalking?1:0.15;
  var cycle=t*0.07*walkSpd;

  /* Breathing — slow body undulation always active */
  var breathe=Math.sin(t*0.025);

  /* Body bob — vertical bounce from walk cycle */
  var bodyBob=Math.abs(Math.sin(cycle))*0.6+0.15;

  /* Torso lean — slight forward lean when walking, more when beaming */
  var torsoLean=isWalking?Math.sin(cycle)*0.015:0;
  if(beamActive)torsoLean=0.02+Math.sin(t*0.12)*0.008;

  /* Head — smooth multi-frequency tilt for organic feel */
  var headTilt=Math.sin(t*0.04)*0.025+Math.sin(t*0.067)*0.012;
  var headBob=Math.sin(t*0.045)*0.015;
  var roarShake=mouthPhase>0.7?Math.sin(t*0.45)*0.018*(mouthPhase-0.7)/0.3:0;

  /* Neck follows head with lag */
  var neckTilt=headTilt*0.65+Math.sin(t*0.038)*0.01;

  /* Tail — multi-segment wave: base, mid, tip each offset in phase */
  var tailBase=Math.sin(cycle*0.6)*0.08;
  var tailMid=Math.sin(cycle*0.6+0.5)*0.12;
  var tailTip=Math.sin(cycle*0.6+1.0)*0.15;

  /* Arms — natural swing, rear arm offset 180deg */
  var armSwing=Math.sin(cycle)*0.13;
  var farArmSwing=Math.sin(cycle+Math.PI)*0.11;

  /* Legs — knee-bent walking with ground-contact foot flat */
  var farLegThigh=Math.sin(cycle)*0.10;
  var farLegShin=Math.max(0,-Math.sin(cycle))*0.06;
  var nearLegThigh=Math.sin(cycle+Math.PI)*0.10;
  var nearLegShin=Math.max(0,-Math.sin(cycle+Math.PI))*0.06;

  return {
    bodyBob:bodyBob,torsoLean:torsoLean,breathe:breathe,
    headTilt:headTilt,headBob:headBob,roarShake:roarShake,neckTilt:neckTilt,
    tailBase:tailBase,tailMid:tailMid,tailTip:tailTip,
    armSwing:armSwing,farArmSwing:farArmSwing,
    farLegThigh:farLegThigh,farLegShin:farLegShin,
    nearLegThigh:nearLegThigh,nearLegShin:nearLegShin
  };
};

/* PASS 1: Draw creature body — called BEFORE building layer 4 */
P._drawGodzillaBody=function(){
  var gz=this.godzillaState;
  if(!gz.visible)return;
  if(!_GZParts)this._initGodzillaSprite();
  if(!_GZParts)return;
  var w=this.W,h=this.H;
  var gx=gz.x,gy=gz.y;
  var parts=_GZParts.parts;
  var t=gz.animFrame||this.frameCount;
  var isWalking=!gz.stopWalking;
  var mouthPhase=gz.mouthOpen||0;

  var sc=Math.min(w,h)*0.48/_GZParts.sh;
  var pose=P._computeGZPose(t,isWalking,mouthPhase,gz.beamActive);
  var groundY=gy+pose.bodyBob*h*0.005;

  /* Cache pose for PASS 2 */
  _GZCache={gx:gx,gy:gy,sc:sc,groundY:groundY,pose:pose,t:t,mouthPhase:mouthPhase,w:w,h:h,beamActive:gz.beamActive};

  ctx.save();
  ctx.imageSmoothingEnabled=false;

  var torsoP=parts.torso;
  var cx=gx,cy=groundY-torsoP.pivotY*sc;
  function partPos(p){
    var dx=(p.origX+p.pivotX-torsoP.origX-torsoP.pivotX)*sc;
    var dy=(p.origY+p.pivotY-torsoP.origY-torsoP.pivotY)*sc;
    return{x:cx+dx,y:cy+dy};
  }

  /* 1. TAIL — multi-segment sway */
  var tp=partPos(parts.tail);
  _drawGZPart(parts.tail,tp.x,tp.y,pose.tailBase+pose.tailMid+pose.tailTip,sc);

  /* 2. FAR LEG upper + lower */
  var flu=partPos(parts.farLegU);
  _drawGZPart(parts.farLegU,flu.x,flu.y,pose.farLegThigh,sc);
  var fll=partPos(parts.farLegL);
  _drawGZPart(parts.farLegL,fll.x,fll.y,pose.farLegShin,sc);

  /* 3. TORSO */
  var torsoSP=partPos(parts.torso);
  _drawGZPart(parts.torso,torsoSP.x,torsoSP.y+pose.breathe*sc*1.5,pose.torsoLean,sc);

  /* 4. FAR ARM */
  var fa=partPos(parts.farArm);
  _drawGZPart(parts.farArm,fa.x,fa.y,pose.farArmSwing,sc);

  /* 5. NECK */
  var np=partPos(parts.neck);
  _drawGZPart(parts.neck,np.x,np.y,pose.neckTilt,sc);

  /* 6. HEAD */
  var hp=partPos(parts.head);
  _drawGZPart(parts.head,hp.x,hp.y+pose.headBob*sc*6,pose.headTilt+pose.roarShake,sc);

  /* 7. NEAR ARM */
  var na=partPos(parts.nearArm);
  _drawGZPart(parts.nearArm,na.x,na.y,pose.armSwing,sc);

  /* 8. NEAR LEG upper + lower */
  var nlu=partPos(parts.nearLegU);
  _drawGZPart(parts.nearLegU,nlu.x,nlu.y,pose.nearLegThigh,sc);
  var nll=partPos(parts.nearLegL);
  _drawGZPart(parts.nearLegL,nll.x,nll.y,pose.nearLegShin,sc);

  /* DORSAL PLATE GLOW */
  var plateGlow=gz.beamActive?(0.5+0.5*Math.sin(t*0.15)):0.15;
  if(plateGlow>0.2){
    var glowAlpha=plateGlow*0.25;
    ctx.fillStyle="rgba(80,180,255,"+glowAlpha+")";
    for(var gi=0;gi<5;gi++){
      var gpx=torsoSP.x+(gi*0.1-0.2)*parts.torso.w*sc;
      var gpy=torsoSP.y-parts.torso.h*sc*0.35+gi*sc*3;
      ctx.beginPath();ctx.arc(gpx,gpy,sc*10,0,Math.PI*2);ctx.fill();
    }
  }

  /* ROAR EFFECT */
  if(mouthPhase>0.85){
    var mTipX=hp.x+parts.head.w*sc*0.95;
    var mTipY=hp.y+parts.head.h*sc*0.4;
    for(var ri=0;ri<3;ri++){
      var rR=sc*12+ri*sc*10;
      var rA=0.12*(1-ri*0.3)*Math.abs(Math.sin(t*0.15+ri));
      ctx.strokeStyle="rgba(255,200,200,"+rA+")";ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(mTipX,mTipY,rR,-0.35,0.35);ctx.stroke();
    }
  }

  /* GROUND DUST */
  if(gz.x>50&&gz.x<w-50&&isWalking){
    var dA=0.08+0.05*Math.abs(Math.sin(t*0.07));
    ctx.fillStyle="rgba(100,90,80,"+dA+")";
    for(var di=0;di<3;di++){
      ctx.beginPath();ctx.arc(gx-sc*10+di*sc*8,groundY+sc*2,sc*(3+di*1.5),0,Math.PI*2);ctx.fill();
    }
  }

  ctx.imageSmoothingEnabled=true;
  ctx.restore();
};

/* PASS 2: Draw plasma beam, volume shadow, spotlights — called AFTER all buildings */
P._drawGodzillaEffects=function(){
  if(!_GZCache.w)return;
  var C=_GZCache;
  var w=C.w,h=C.h,sc=C.sc,gx=C.gx,groundY=C.groundY,pose=C.pose,t=C.t;
  var mouthPhase=C.mouthPhase,beamActive=C.beamActive;

  if(!_GZParts||!_GZParts.parts)return;
  var parts=_GZParts.parts;
  var torsoP=parts.torso;
  var cx=gx,cy=groundY-torsoP.pivotY*sc;
  function partPos(p){
    var dx=(p.origX+p.pivotX-torsoP.origX-torsoP.pivotX)*sc;
    var dy=(p.origY+p.pivotY-torsoP.origY-torsoP.pivotY)*sc;
    return{x:cx+dx,y:cy+dy};
  }
  var hp=partPos(parts.head);
  ctx.save();

  /* ─── PLASMA BEAM ─── */
  var showBeam=beamActive||mouthPhase>0.3;
  if(showBeam){
    /* Beam origin at mouth (left-center of head part, before pivot) */
    var beamX=hp.x+parts.head.w*sc*0.10;
    var beamY=hp.y+parts.head.h*sc*0.38+pose.headBob*sc*6;
    var beamW=Math.max(14,sc*18);
    var beamLen=w-beamX+sc*40;
    if(beamLen>0){
      var bInt=mouthPhase>0.3?Math.min(1,(mouthPhase-0.3)*2.5):0.35;
      if(beamActive)bInt=1;

      /* Atmospheric scatter glow */
      var grd=ctx.createLinearGradient(beamX,beamY-beamW*5,beamX,beamY+beamW*5);
      grd.addColorStop(0,"rgba(60,160,255,0)");
      grd.addColorStop(0.5,"rgba(60,200,255,"+(0.30*bInt)+")");
      grd.addColorStop(1,"rgba(60,160,255,0)");
      ctx.fillStyle=grd;ctx.fillRect(beamX,beamY-beamW*5,beamLen,beamW*10);

      /* Outer beam */
      ctx.fillStyle="rgba(30,100,255,"+(0.55*bInt)+")";
      ctx.fillRect(beamX,beamY-beamW*1.5,beamLen,beamW*3);

      /* Mid beam */
      ctx.fillStyle="rgba(100,190,255,"+(0.80*bInt)+")";
      ctx.fillRect(beamX,beamY-beamW*0.7,beamLen,beamW*1.4);

      /* Core */
      ctx.fillStyle="rgba(220,250,255,"+(0.90*bInt)+")";
      ctx.fillRect(beamX,beamY-beamW*0.25,beamLen,beamW*0.5);

      /* Energy pulses traveling along beam */
      for(var rp=0;rp<12;rp++){
        var rpFrac=(rp/12+t*0.015)%1;
        var rpX=beamX+rpFrac*beamLen;
        var rpA=(0.08+0.08*Math.sin(t*0.35+rp*0.8))*bInt;
        ctx.fillStyle="rgba(255,60,160,"+rpA+")";
        ctx.fillRect(rpX-sc*1.2,beamY-beamW*0.8,sc*2,beamW*1.6);
      }

      /* Origin flare at mouth */
      var flareR=sc*16*bInt;
      var flare=ctx.createRadialGradient(beamX,beamY,0,beamX,beamY,flareR);
      flare.addColorStop(0,"rgba(180,240,255,"+(0.70*bInt)+")");
      flare.addColorStop(0.5,"rgba(60,180,255,"+(0.35*bInt)+")");
      flare.addColorStop(1,"rgba(60,160,255,0)");
      ctx.fillStyle=flare;ctx.beginPath();ctx.arc(beamX,beamY,flareR,0,Math.PI*2);ctx.fill();

      /* Impact flash at far edge */
      var impX=beamX+beamLen;
      var impR=sc*30*bInt;
      var imp=ctx.createRadialGradient(impX,beamY,0,impX,beamY,impR);
      imp.addColorStop(0,"rgba(255,255,255,"+(0.45*bInt)+")");
      imp.addColorStop(0.25,"rgba(100,200,255,"+(0.25*bInt)+")");
      imp.addColorStop(1,"rgba(60,160,255,0)");
      ctx.fillStyle=imp;ctx.beginPath();ctx.arc(impX,beamY,impR,0,Math.PI*2);ctx.fill();

      /* Volume shadow under beam */
      ctx.fillStyle="rgba(0,0,20,"+(0.08*bInt)+")";
      ctx.fillRect(beamX,beamY+beamW*1.2,beamLen,h*0.10);

      /* Ground illumination from beam */
      ctx.fillStyle="rgba(80,160,255,"+(0.04*bInt)+")";
      ctx.fillRect(beamX-20,groundY-5,beamLen+20,h-groundY+5);
    }
  }

  /* ─── DYNAMIC VOLUME SHADOW — cast onto ground below creature ─── */
  var shadowA=0.15+0.08*Math.abs(Math.sin(t*0.07));
  var sOffX=sc*22;
  ctx.fillStyle="rgba(0,0,10,"+shadowA+")";
  ctx.beginPath();
  ctx.moveTo(gx-sc*40,groundY+sc*2);
  ctx.lineTo(gx+sc*40+sOffX,groundY+sc*2);
  ctx.lineTo(gx+sc*60+sOffX*2,groundY+h*0.09);
  ctx.lineTo(gx-sc*60+sOffX*2,groundY+h*0.09);
  ctx.closePath();ctx.fill();

  /* ─── STATIONARY SPOTLIGHTS — from each cityscape layer toward godzilla ─── */
  var spotLayers=[
    {groundFrac:0.52,color:"rgba(255,220,150,",intensity:0.30},
    {groundFrac:0.55,color:"rgba(255,200,130,",intensity:0.35},
    {groundFrac:0.60,color:"rgba(255,180,100,",intensity:0.40},
    {groundFrac:0.65,color:"rgba(255,160,80,",intensity:0.35},
    {groundFrac:0.72,color:"rgba(255,140,60,",intensity:0.30}
  ];
  /* Spotlights aim at creature torso center */
  var spotTX=gx;
  var spotTY=groundY-sc*80;
  for(var si=0;si<spotLayers.length;si++){
    var sl=spotLayers[si];
    var spotGY=h*sl.groundFrac;
    if(spotGY>gy-20){
      var coneW=sc*80;
      var sGrd=ctx.createLinearGradient(spotTX,spotGY,spotTX,spotTY);
      sGrd.addColorStop(0,sl.color+sl.intensity+")");
      sGrd.addColorStop(0.3,sl.color+(sl.intensity*0.5)+")");
      sGrd.addColorStop(0.7,sl.color+(sl.intensity*0.15)+")");
      sGrd.addColorStop(1,sl.color+"0)");
      ctx.fillStyle=sGrd;
      ctx.beginPath();
      ctx.moveTo(spotTX-coneW,spotGY);
      ctx.lineTo(spotTX+coneW,spotGY);
      ctx.lineTo(spotTX+sc*12,spotTY);
      ctx.lineTo(spotTX-sc*12,spotTY);
      ctx.closePath();ctx.fill();
    }
  }

  /* Creature body illumination from spotlights */
  var bodyGlow=ctx.createRadialGradient(spotTX,spotTY+sc*50,0,spotTX,spotTY+sc*50,sc*150);
  bodyGlow.addColorStop(0,"rgba(255,200,130,0.12)");
  bodyGlow.addColorStop(1,"rgba(255,200,130,0)");
  ctx.fillStyle=bodyGlow;ctx.beginPath();ctx.arc(spotTX,spotTY+sc*50,sc*150,0,Math.PI*2);ctx.fill();

  ctx.restore();
  _GZCache={};
};

P._drawGodzilla=function(){

P.drawElevatedRoad=function(yFrac,nextYFrac,style){
  var w=this.W,h=this.H,nf=this.nightFactor;
  var roadY=h*yFrac;
  var pillarBot=h*nextYFrac;
  /* Road surface */
  var roadH=6;
  ctx.fillStyle=nf>0.5?hsl(220,8,15):hsl(35,12,52);
  ctx.fillRect(0,roadY,w,roadH);
  /* Edge lines */
  ctx.fillStyle=nf>0.5?"rgba(180,180,180,0.2)":"rgba(255,255,255,0.5)";
  ctx.fillRect(0,roadY,w,1);
  ctx.fillRect(0,roadY+roadH-1,w,1);
  /* Center dashes */
  ctx.fillStyle=nf>0.5?"rgba(200,200,200,0.15)":"rgba(255,255,255,0.4)";
  for(var dx=0;dx<w;dx+=25){
    ctx.fillRect(dx,roadY+roadH/2-0.5,12,1);
  }
  /* Support pillars */
  if(style==="bridge"){
    /* Bridge: arched cable-stayed or suspension pillars */
    var pillarSpacing=180;
    for(var px=pillarSpacing/2;px<w;px+=pillarSpacing){
      var pillarW=6;
      ctx.fillStyle=nf>0.5?hsl(220,5,18):hsl(30,8,48);
      ctx.fillRect(px-pillarW/2,roadY+roadH,pillarW,pillarBot-roadY-roadH);
      /* Pillar cap */
      ctx.fillStyle=nf>0.5?hsl(220,5,22):hsl(30,8,55);
      ctx.fillRect(px-pillarW/2-2,roadY+roadH,pillarW+4,3);
      /* Pillar base */
      ctx.fillRect(px-pillarW/2-2,pillarBot-3,pillarW+4,3);
      /* Cable lines to towers */
      ctx.fillStyle=hsla(0,0,clamp(lerp(55,25,nf),0,100),0.35);
      var towerH=roadY-20;
      /* Tower */
      ctx.fillStyle=nf>0.5?hsl(220,5,20):hsl(30,10,50);
      ctx.fillRect(px-1,towerH,2,roadY-towerH);
      ctx.fillRect(px-3,towerH,6,2);
      /* Cables from tower to road */
      var cableSpan=pillarSpacing*0.45;
      for(var cs=-cableSpan;cs<=cableSpan;cs+=15){
        ctx.fillRect(px+cs,roadY,1,towerH-roadY+5);
      }
    }
  }else{
    /* Elevated highway: simple rectangular pillars */
    var pillarSpacing=100;
    for(var px=50;px<w;px+=pillarSpacing){
      ctx.fillStyle=nf>0.5?hsl(220,5,16):hsl(30,8,45);
      ctx.fillRect(px-2,roadY+roadH,4,pillarBot-roadY-roadH);
      /* Pillar base */
      ctx.fillRect(px-3,pillarBot-2,6,2);
    }
  }
  /* Road traffic on elevated road */
  for(var et=0;et<4;et++){
    var ev=this.elevatedTraffic?this.elevatedTraffic[et]:null;
    if(!ev)continue;
    ev.x+=ev.speed*0.4;
    if(ev.x>w+80)ev.x=-30;
    if(ev.x<-30)ev.x=w+80;
    var eLane=et<2?roadY:roadY+3;
    var ec=ev.color;
    var el=clamp(lerp(ec[2],ec[2]-8,nf),8,85);
    ctx.fillStyle=hsl(ec[0],ec[1],el);
    ctx.fillRect(ev.x,eLane+1,ev.w,3);
    /* Headlights */
    if(nf>0.3){
      var hla=clamp((nf-0.3)/0.3,0,1);
      ctx.fillStyle=hsla(50,100,90,hla*0.7);
      ctx.fillRect(ev.speed>0?ev.x+ev.w:ev.x,eLane+1,1,1);
      ctx.fillRect(ev.speed>0?ev.x+ev.w:ev.x,eLane+3,1,1);
    }
  }
};

P.drawForegroundRoad=function(){
  var w=this.W,h=this.H,nf=this.nightFactor;
  var roadY=h*LAYERS[4].groundFrac-18;
  /* Road surface */
  ctx.fillStyle=nf>0.5?hsl(220,8,14):hsl(35,12,48);
  ctx.fillRect(0,roadY,w,20);
  /* Lane markings */
  ctx.fillStyle=nf>0.5?"rgba(200,200,200,0.15)":"rgba(255,255,255,0.45)";
  for(var dx=0;dx<w;dx+=28){
    ctx.fillRect(dx,roadY+6,12,1);
    ctx.fillRect(dx,roadY+13,12,1);
  }
  /* Edge lines */
  ctx.fillStyle=nf>0.5?"rgba(180,180,180,0.2)":"rgba(255,255,255,0.6)";
  ctx.fillRect(0,roadY,w,1);
  ctx.fillRect(0,roadY+19,w,1);
  /* Street lamps */
  for(var lx=50;lx<w+200;lx+=120){
    var lampX=lx-(this.frameCount*LAYERS[4].scrollMul*0.15)%120;
    if(lampX<-30||lampX>w+30)continue;
    /* Pole */
    ctx.fillStyle=nf>0.5?hsl(0,0,20):hsl(0,0,45);
    ctx.fillRect(lampX+1,roadY-28,2,28);
    /* Curved arm */
    ctx.fillRect(lampX-4,roadY-30,8,2);
    /* Lamp head */
    ctx.fillStyle=nf>0.5?hsl(0,0,28):hsl(0,0,55);
    ctx.fillRect(lampX-3,roadY-32,6,3);
    if(nf>0.25){
      var lampA=clamp((nf-0.25)/0.25,0,1);
      /* Lamp bulb glow */
      ctx.fillStyle=hsla(45,100,90,lampA*0.95);
      ctx.fillRect(lampX-1,roadY-30,3,2);
      /* Light cone downward */
      ctx.fillStyle=hsla(45,90,80,lampA*0.12);
      ctx.beginPath();
      ctx.moveTo(lampX-2,roadY-29);
      ctx.lineTo(lampX+4,roadY-29);
      ctx.lineTo(lampX+15,roadY+5);
      ctx.lineTo(lampX-10,roadY+5);
      ctx.closePath();ctx.fill();
      /* Light pool on road surface */
      ctx.fillStyle=hsla(45,80,70,lampA*0.08);
      ctx.fillRect(lampX-12,roadY+1,20,18);
      /* Glow halo */
      ctx.fillStyle=hsla(45,80,85,lampA*0.2);
      ctx.beginPath();ctx.arc(lampX,roadY-30,5,0,Math.PI*2);ctx.fill();
    }
  }
  /* Traffic vehicles */
  for(var k=0;k<this.fgTraffic.length;k++){
    var v=this.fgTraffic[k];
    v.x+=v.speed*0.6;
    if(v.x>w+150)v.x=-v.w-80;
    if(v.x<-v.w-80)v.x=w+150;
    var vx=v.x;
    var laneY=roadY+2+v.lane*6;
    var vc=v.color;
    var vl=clamp(lerp(vc[2],vc[2]-8,nf),8,85);
    var vs=clamp(lerp(vc[1],vc[1]*0.4,nf),0,75);
    var vh=clamp(lerp(vc[0],230,nf),0,360);
    /* Shadow */
    ctx.fillStyle="rgba(0,0,0,0.15)";
    ctx.fillRect(vx+1,laneY+v.h,v.w,2);
    /* Body */
    ctx.fillStyle=hsl(vh,vs,vl);
    ctx.fillRect(vx,laneY,v.w,v.h);
    /* Cabin */
    ctx.fillStyle=hsl(vh,Math.max(vs-5,0),clamp(vl+10,0,95));
    ctx.fillRect(vx+Math.floor(v.w*0.15),laneY,Math.floor(v.w*0.7),Math.max(1,Math.floor(v.h*0.35)));
    /* Bus stripe */
    if(v.isBus){
      ctx.fillStyle=hsl(vh,vs+10,clamp(vl-8,0,80));
      ctx.fillRect(vx,laneY+Math.floor(v.h*0.6),v.w,Math.max(1,Math.floor(v.h*0.15)));
    }
    /* Headlights at night */
    if(nf>0.3){
      var hlA=clamp((nf-0.3)/0.3,0,1);
      var frontX=v.speed>0?vx+v.w-1:vx;
      ctx.fillStyle=hsla(50,100,92,hlA*0.9);
      ctx.fillRect(frontX,laneY+1,2,2);
      ctx.fillRect(frontX,laneY+v.h-3,2,2);
      /* Headlight beam */
      ctx.fillStyle=hsla(50,80,85,hlA*0.08);
      var beamX=v.speed>0?frontX:frontX-20;
      ctx.fillRect(beamX,laneY-1,20,v.h+2);
      /* Tail lights */
      var rearX=v.speed>0?vx:vx+v.w-2;
      ctx.fillStyle=hsla(0,85,45,hlA*0.7);
      ctx.fillRect(rearX,laneY+1,2,2);
      ctx.fillRect(rearX,laneY+v.h-3,2,2);
    }
  }
};

P.drawBoats=function(waterTop,waterH){
  var w=this.W,h=this.H,nf=this.nightFactor;
  var t=this.frameCount*0.01;

  /* --- Buoys --- */
  for(var bi=0;bi<this.buoys.length;bi++){
    var buo=this.buoys[bi];
    var bux=buo.x*w;
    var buy=waterTop+buo.y*waterH+Math.sin(t*1.5+buo.phase)*3;
    /* Buoy body */
    ctx.fillStyle=nf>0.5?hsl(0,60,25):hsl(0,70,50);
    ctx.fillRect(bux-2,buy-5,4,5);
    /* Top */
    ctx.fillStyle=nf>0.5?hsl(0,70,30):hsl(0,80,55);
    ctx.fillRect(bux-3,buy-6,6,2);
    /* Night light */
    if(nf>0.3){
      var blA=Math.sin(t*2+buo.phase)>0.3?0.9:0.2;
      ctx.fillStyle=hsla(0,100,50,blA);
      ctx.fillRect(bux-1,buy-8,2,2);
      /* Light glow on water */
      ctx.fillStyle=hsla(0,80,50,blA*0.15);
      ctx.fillRect(bux-6,buy,12,6);
    }
  }

  /* --- Boats/Ships --- */
  for(var i=0;i<this.boats.length;i++){
    var b=this.boats[i];
    b.x+=b.speed*0.001;
    if(b.x>1.3)b.x=-0.3;
    if(b.x<-0.3)b.x=1.3;
    var bx=b.x*w;
    var by=waterTop+b.y*waterH+Math.sin(t+b.x*10)*2;
    var bodyCol=nf>0.5?hsl(210,15,25):hsl(210,30,55);
    var deckCol=nf>0.5?hsl(200,20,35):hsl(200,35,65);

    /* Store wake position */
    b.wakeTrail.push({x:bx+w/2,y:by});
    if(b.wakeTrail.length>40)b.wakeTrail.shift();

    /* Draw dynamic wake line */
    if(b.wakeTrail.length>2){
      ctx.strokeStyle="rgba(255,255,255,0.25)";
      ctx.lineWidth=1;
      ctx.beginPath();
      var dir=b.speed>0?1:-1;
      ctx.moveTo(b.wakeTrail[0].x,b.wakeTrail[0].y);
      for(var wi=1;wi<b.wakeTrail.length;wi++){
        ctx.lineTo(b.wakeTrail[wi].x-dir*wi*0.3,b.wakeTrail[wi].y+Math.sin(t*3+wi*0.5)*1.5);
      }
      ctx.stroke();
      /* Second wake line (V shape) */
      ctx.strokeStyle="rgba(255,255,255,0.15)";
      ctx.beginPath();
      ctx.moveTo(b.wakeTrail[0].x,b.wakeTrail[0].y);
      for(var wi2=1;wi2<b.wakeTrail.length;wi2++){
        ctx.lineTo(b.wakeTrail[wi2].x-dir*wi2*0.3,b.wakeTrail[wi2].y+wi2*0.15+Math.sin(t*2.5+wi2)*1);
      }
      ctx.stroke();
    }

    if(b.type==="ship"){
      ctx.fillStyle=bodyCol;
      ctx.fillRect(bx,by-b.h*0.6,b.w,b.h*0.6);
      ctx.fillStyle=deckCol;
      ctx.fillRect(bx+b.w*0.1,by-b.h,b.w*0.4,b.h*0.4);
      ctx.fillRect(bx+b.w*0.6,by-b.h*0.8,b.w*0.3,b.h*0.3);
      ctx.fillStyle=nf>0.5?hsl(0,0,30):hsl(0,0,50);
      ctx.fillRect(bx+b.w*0.3,by-b.h*1.5,2,b.h*0.5);
      /* Ship spotlight at night */
      if(nf>0.3){
        var spA=clamp((nf-0.3)/0.3,0,1)*0.25;
        var frontX=b.speed>0?bx+b.w:bx;
        ctx.fillStyle=hsla(50,100,85,spA);
        ctx.beginPath();
        ctx.moveTo(frontX,by-b.h*0.5);
        ctx.lineTo(frontX+(b.speed>0?40:-40),by-b.h*0.3);
        ctx.lineTo(frontX+(b.speed>0?40:-40),by+5);
        ctx.lineTo(frontX,by);
        ctx.fill();
      }
    }else if(b.type==="small"){
      ctx.beginPath();
      ctx.moveTo(bx,by-b.h*0.3);
      ctx.lineTo(bx+b.w*0.2,by);
      ctx.lineTo(bx+b.w*0.8,by);
      ctx.lineTo(bx+b.w,by-b.h*0.3);
      ctx.closePath();
      ctx.fillStyle=bodyCol;ctx.fill();
      ctx.fillStyle=deckCol;
      ctx.fillRect(bx+b.w*0.3,by-b.h*0.8,b.w*0.25,b.h*0.5);
      if(nf>0.3){
        var spA2=clamp((nf-0.3)/0.3,0,1)*0.2;
        var fx2=b.speed>0?bx+b.w:bx;
        ctx.fillStyle=hsla(50,100,85,spA2);
        ctx.beginPath();
        ctx.moveTo(fx2,by-b.h*0.2);
        ctx.lineTo(fx2+(b.speed>0?25:-25),by+8);
        ctx.lineTo(fx2,by);
        ctx.fill();
      }
    }else if(b.type==="speedboat"){
      ctx.beginPath();
      ctx.moveTo(bx,by-b.h*0.2);
      ctx.lineTo(bx+b.w*0.3,by-b.h*0.5);
      ctx.lineTo(bx+b.w,by-b.h*0.2);
      ctx.lineTo(bx+b.w*0.9,by);
      ctx.lineTo(bx+b.w*0.1,by);
      ctx.closePath();
      ctx.fillStyle=hsl(0,60,50);ctx.fill();
      if(nf>0.3){
        var spA3=clamp((nf-0.3)/0.3,0,1)*0.15;
        var fx3=b.speed>0?bx+b.w:bx;
        ctx.fillStyle=hsla(50,100,85,spA3);
        ctx.beginPath();
        ctx.moveTo(fx3,by-b.h*0.3);
        ctx.lineTo(fx3+(b.speed>0?20:-20),by+5);
        ctx.lineTo(fx3,by);
        ctx.fill();
      }
    }else if(b.type==="sailboat"){
      /* Hull: curved white sailboat hull */
      ctx.beginPath();
      ctx.moveTo(bx,by);
      ctx.quadraticCurveTo(bx+b.w*0.1,by-b.h*0.5,bx+b.w*0.5,by-b.h*0.5);
      ctx.quadraticCurveTo(bx+b.w*0.9,by-b.h*0.5,bx+b.w,by);
      ctx.lineTo(bx+b.w*0.95,by+2);
      ctx.lineTo(bx+b.w*0.05,by+2);
      ctx.closePath();
      ctx.fillStyle=nf>0.5?hsl(0,0,35):hsl(0,0,90);ctx.fill();
      /* Keel line */
      ctx.fillStyle=nf>0.5?hsl(200,15,20):hsl(200,25,50);
      ctx.fillRect(bx+b.w*0.05,by+1,b.w*0.9,1);
      /* Mast */
      ctx.fillStyle=nf>0.5?hsl(25,20,18):hsl(25,30,35);
      ctx.fillRect(bx+b.w*0.5,by-b.h*2.2,1,b.h*1.8);
      /* Main sail (triangle) */
      var sailDir=b.speed>0?1:-1;
      ctx.fillStyle=nf>0.5?hsla(0,0,55,0.85):hsla(0,0,95,0.9);
      ctx.beginPath();
      ctx.moveTo(bx+b.w*0.5+1,by-b.h*2);
      ctx.lineTo(bx+b.w*0.5+sailDir*b.w*0.35,by-b.h*0.6);
      ctx.lineTo(bx+b.w*0.5+1,by-b.h*0.5);
      ctx.closePath();ctx.fill();
      /* Jib sail (front triangle) */
      ctx.fillStyle=nf>0.5?hsla(0,0,50,0.75):hsla(0,0,92,0.85);
      ctx.beginPath();
      ctx.moveTo(bx+b.w*0.5+1,by-b.h*1.9);
      ctx.lineTo(bx+b.w*0.5-sailDir*b.w*0.2,by-b.h*0.55);
      ctx.lineTo(bx+b.w*0.5+1,by-b.h*0.5);
      ctx.closePath();ctx.fill();
      /* Sail highlight */
      ctx.fillStyle=hsla(0,0,100,nf>0.5?0.1:0.2);
      ctx.beginPath();
      ctx.moveTo(bx+b.w*0.5+1,by-b.h*1.8);
      ctx.lineTo(bx+b.w*0.5+sailDir*b.w*0.25,by-b.h*0.7);
      ctx.lineTo(bx+b.w*0.5+1,by-b.h*0.6);
      ctx.closePath();ctx.fill();
      /* Flag at mast top */
      var flagWave=Math.sin(t*3+b.x*5)*2;
      ctx.fillStyle=nf>0.5?hsl(0,60,35):hsl(0,65,55);
      ctx.fillRect(bx+b.w*0.5+1,by-b.h*2.3,4+sailDir*flagWave,2);
      /* Night: warm cabin light */
      if(nf>0.3){
        var slA=clamp((nf-0.3)/0.3,0,1);
        ctx.fillStyle=hsla(45,90,80,slA*0.7);
        ctx.fillRect(bx+b.w*0.4,by-b.h*0.3,3,2);
        /* Water reflection */
        ctx.fillStyle=hsla(45,80,70,slA*0.12);
        ctx.fillRect(bx+b.w*0.3,by+2,b.w*0.4,5);
      }
    }else{
      ctx.fillStyle=bodyCol;
      ctx.fillRect(bx,by-b.h*0.4,b.w,b.h*0.4);
      ctx.fillStyle=deckCol;
      ctx.fillRect(bx+b.w*0.15,by-b.h,b.w*0.35,b.h*0.6);
      if(nf>0.3){
        var spA4=clamp((nf-0.3)/0.3,0,1)*0.2;
        var fx4=b.speed>0?bx+b.w:bx;
        ctx.fillStyle=hsla(50,100,85,spA4);
        ctx.beginPath();
        ctx.moveTo(fx4,by-b.h*0.3);
        ctx.lineTo(fx4+(b.speed>0?30:-30),by+5);
        ctx.lineTo(fx4,by);
        ctx.fill();
      }
    }
    /* Minimal splash particles */
    if(Math.abs(b.speed)>0.25){
      ctx.fillStyle="rgba(255,255,255,0.3)";
      var splashCount=3;
      for(var s=0;s<splashCount;s++){
        var sx=bx+(b.speed>0?-5-s*4:b.w+5+s*4);
        var sy=by+Math.sin(t*3+s+i)*2;
        ctx.fillRect(sx,sy,2,1);
      }
    }
  }
};



P.drawWater=function(){
  var w=this.W,h=this.H;
  var baseWaterY=h*LAYERS[4].groundFrac;
  /* Tide: slowly shift water level up/down */
  this._tideTimer++;
  if(this._tideTimer>600){
    this._tideTimer=0;
    this._targetTide=(Math.random()-0.5)*12;
  }
  this._tideOffset+=(this._targetTide-this._tideOffset)*0.003;
  /* Invalidate water cache when tide shifts */
  if(Math.abs(this._tideOffset-this._targetTide)>2)this._waterCacheKey="";
  var waterTop=baseWaterY+this._tideOffset;
/* Rain causes flood: water level rises during prolonged rain */
var floodOffset=0;
var isRainFlood=this.currentWeather==="rain"||this.currentWeather==="heavy_rain"||this.currentWeather==="thunderstorm"||this.currentWeather==="light_rain";
if(isRainFlood){floodOffset=this._floodLevel||0}
var isPrevRainFlood=this.prevWeather==="rain"||this.prevWeather==="heavy_rain"||this.prevWeather==="thunderstorm";
if(isPrevRainFlood){var prevFlood=this._floodLevel||0;floodOffset=lerp(floodOffset,prevFlood,this.weatherBlend)}
waterTop=waterTop+floodOffset;
  var waterH=h-waterTop;
  if(waterH<5)return;
  var nf=this.nightFactor;
  var t=this.frameCount*0.01;

  /* Water gradient fill (cached, but applied with wave surface) */
  var wCacheKey=Math.round(w)+"|"+Math.round(h)+"|"+Math.round(waterTop)+"|"+Math.round(nf*20);
  if(this._waterCacheKey!==wCacheKey){
    this._waterCacheKey=wCacheKey;
    var wGrad=ctx.createLinearGradient(0,waterTop,0,h);
    var topH=lerp(210,225,nf),topS=lerp(40,20,nf),topL=lerp(40,8,nf);
    var botH=lerp(215,230,nf),botS=lerp(35,15,nf),botL=lerp(20,5,nf);
    wGrad.addColorStop(0,hsl(topH,topS,topL));
    wGrad.addColorStop(0.4,hsl(lerp(topH,botH,0.5),lerp(topS,botS,0.5),lerp(topL,botL,0.5)));
    wGrad.addColorStop(1,hsl(botH,botS,botL));
    this._waterCache=wGrad;
    var skyRefGrad=ctx.createLinearGradient(0,waterTop,0,waterTop+waterH*0.25);
