  ctx.fillRect(craneBase-jibLen,by-craneH+bh+craneH*0.6+7,jibLen,2);
  ctx.fillRect(craneBase,by-craneH+bh+craneH*0.6+7,counterLen,2);
  /* Counterweight */
  ctx.fillStyle=hsl(0,0,clamp(lerp(35,12,nf),0,100));
  ctx.fillRect(craneBase+counterLen-6,by-craneH+bh+craneH*0.6+9,8,6);
  /* Pendant lines from jib tips to mast top */
  ctx.fillStyle=hsla(0,0,50,0.5);
  ctx.fillRect(craneBase-jibLen+5,by-craneH+bh+craneH*0.6+7,1,craneH*0.35);
  ctx.fillRect(craneBase+counterLen-5,by-craneH+bh+craneH*0.6+7,1,craneH*0.35);
  /* Trolley and hook cable */
  var trolleyPos=craneBase-jibLen*0.4;
  var cableLen=bh*0.5;
  ctx.fillStyle=hsla(0,0,60,0.5);
  ctx.fillRect(trolleyPos,by-craneH+bh+craneH*0.6+9,1,cableLen);
  /* Hook */
  ctx.fillStyle=hsl(0,0,clamp(lerp(40,15,nf),0,100));
  ctx.fillRect(trolleyPos-2,by-craneH+bh+craneH*0.6+9+cableLen,4,3);
  /* Warning beacon on top */
  if(nf>0.3){
    var beaconA=Math.sin(this.frameCount*0.08)>0.5?0.8:0.2;
    ctx.fillStyle=hsla(0,100,50,beaconA);
    ctx.fillRect(craneBase-1,by-craneH+bh,2,2);
  }
  /* Base building (small) */
  ctx.fillStyle=hsl(bH,bS,bL);
  ctx.fillRect(bx,by,bw,bh);
};

P._drawHarbor=function(bx,by,bw,bh,bH,bS,bL,sL,tL,nf,li){
  /* Harbor/dock structure */
  /* Concrete quay wall */
  ctx.fillStyle=nf>0.5?hsl(30,8,18):hsl(30,10,50);
  ctx.fillRect(bx,by+bh*0.6,bw,bh*0.4);
  /* Dock edge highlight */
  ctx.fillStyle=nf>0.5?hsl(30,8,25):hsl(30,12,60);
  ctx.fillRect(bx,by+bh*0.6,bw,2);
  /* Bollards (mooring posts) */
  ctx.fillStyle=nf>0.5?hsl(0,0,20):hsl(0,0,40);
  for(var bl=bx+8;bl<bx+bw-5;bl+=18){
    ctx.fillRect(bl,by+bh*0.6-4,4,4);
  }
  /* Warehouse behind dock */
  ctx.fillStyle=hsl(bH,bS,bL);
  ctx.fillRect(bx+bw*0.1,by,bw*0.8,bh*0.6);
  ctx.fillStyle=hsl(bH,bS,sL);
  ctx.fillRect(bx+bw*0.1,by+bh*0.6-2,bw*0.8,2);
  /* Warehouse roof */
  ctx.fillStyle=hsl(bH,bS,clamp(bL-5,0,95));
  ctx.fillRect(bx+bw*0.05,by,bw*0.9,3);
  /* Large warehouse door */
  ctx.fillStyle=nf>0.5?hsl(0,0,15):hsl(0,0,35);
  ctx.fillRect(bx+bw*0.35,by+bh*0.25,bw*0.3,bh*0.35);
  /* Door lines */
  ctx.fillStyle=nf>0.5?hsl(0,0,22):hsl(0,0,42);
  ctx.fillRect(bx+bw*0.5,by+bh*0.25,1,bh*0.35);
  /* Crane on dock */
  var dockCraneH=bh*0.5;
  var dockCraneX=bx+bw*0.75;
  ctx.fillStyle=hsl(0,0,clamp(lerp(45,20,nf),0,100));
  ctx.fillRect(dockCraneX-1,by-dockCraneH+bh*0.6,2,dockCraneH);
  ctx.fillRect(dockCraneX-bw*0.3,by-dockCraneH+bh*0.6,bw*0.35,2);
  /* Container stacks */
  var containerColors=[[0,65,45],[0,55,40],[220,50,40],[30,70,50],[0,60,45]];
  for(var cs=0;cs<3;cs++){
    var cc=containerColors[cs%containerColors.length];
    var cl=clamp(lerp(cc[2],cc[2]-8,nf),8,80);
    ctx.fillStyle=hsl(cc[0],cc[1],cl);
    ctx.fillRect(bx+bw*0.05+cs*bw*0.12,by+bh*0.6-bh*0.15-cs*6,bw*0.1,bh*0.12);
  }
  /* Water reflection at base */
  ctx.fillStyle=hsla(200,30,clamp(lerp(30,8,nf),0,60),0.3);
  ctx.fillRect(bx,by+bh,bw,4);
};

/* ═══════════════════════════════════════════════════════
   JETTY / SEAWALL (water-edge structures)
   ═══════════════════════════════════════════════════════ */
P._drawJetty=function(bx,by,bw,bh,groundY,nf){
  var t=this.frameCount*0.01;
  var jettyLen=randf(0,1)*0+15+Math.abs(Math.sin(bx*0.01))*30;
  var jettyW=Math.max(6,bw*0.3);
  var jx=bx+bw/2-jettyW/2;
  var jy=groundY;
  var pierCol=nf>0.5?hsl(25,25,18):hsl(30,30,42);
  var plankCol=nf>0.5?hsl(28,20,22):hsl(32,25,55);
  var waterDepth=20+Math.sin(bx*0.02)*8;
  /* Pier structure: vertical piles */
  var pileCount=Math.max(2,Math.floor(jettyLen/12));
  for(var pi=0;pi<pileCount;pi++){
    var px=jx+pi*(jettyW/(pileCount-1));
    ctx.fillStyle=pierCol;
    ctx.fillRect(px,jy,2,waterDepth);
    /* Cross braces */
    if(pi<pileCount-1){
      var nx=jx+(pi+1)*(jettyW/(pileCount-1));
      ctx.fillStyle=nf>0.5?hsla(25,20,20,0.5):hsla(30,25,45,0.4);
      ctx.fillRect(px,jy+waterDepth*0.3,nx-px,1);
      ctx.fillRect(px,jy+waterDepth*0.6,nx-px,1);
    }
  }
  /* Pier deck (planks) */
  ctx.fillStyle=plankCol;
  ctx.fillRect(jx-1,jy-3,jettyW+2,4);
  /* Plank lines */
  ctx.fillStyle=nf>0.5?hsla(20,15,15,0.4):hsla(25,20,35,0.3);
  for(var pl=0;pl<jettyW;pl+=4){
    ctx.fillRect(jx+pl,jy-3,1,4);
  }
  /* Railing posts */
  var postH=6;
  for(var rp=0;rp<Math.floor(jettyW/6);rp++){
    var rpx=jx+rp*6+3;
    ctx.fillStyle=pierCol;
    ctx.fillRect(rpx,jy-3-postH,1,postH);
  }
  /* Top rail */
  ctx.fillRect(jx,jy-3-postH,jettyW,1);
  /* Bollard at end */
  ctx.fillStyle=nf>0.5?hsl(0,0,20):hsl(0,0,45);
  ctx.fillRect(jx+jettyW-3,jy-6,3,3);
  /* Mooring post with rope */
  if(bw>30){
    ctx.fillStyle=nf>0.5?hsl(25,20,16):hsl(30,25,38);
    ctx.fillRect(jx+2,jy-8,2,5);
    /* Rope line */
    ctx.strokeStyle=nf>0.5?hsla(30,20,30,0.4):hsla(35,25,50,0.3);
    ctx.lineWidth=0.8;
    ctx.beginPath();
    var ropeEnd=jx+jettyW*0.6;
    var ropeSag=Math.sin(t*0.5)*2+3;
    ctx.moveTo(jx+3,jy-7);
    ctx.quadraticCurveTo(jx+jettyW*0.3,jy-7+ropeSag,ropeEnd,jy-5);
    ctx.stroke();
  }
  /* Small boat tied to jetty */
  if(Math.sin(bx*0.07)>0.3){
    var boatX=jx+jettyW*0.5;
    var boatY=jy+waterDepth*0.4+Math.sin(t*1.2+bx)*2;
    ctx.fillStyle=nf>0.5?hsl(0,0,25):hsl(0,0,60);
    ctx.beginPath();
    ctx.moveTo(boatX-5,boatY);
    ctx.lineTo(boatX+5,boatY);
    ctx.lineTo(boatX+3,boatY+3);
    ctx.lineTo(boatX-3,boatY+3);
    ctx.closePath();ctx.fill();
  }
  /* Water reflection under jetty */
  ctx.fillStyle=hsla(210,20,40,nf>0.5?0.08:0.04);
  ctx.fillRect(jx-2,jy+waterDepth*0.5,jettyW+4,waterDepth*0.4);
};

P._drawSeawall=function(bx,by,bw,bh,groundY,nf){
  var t=this.frameCount*0.01;
  var wallH=8+Math.abs(Math.sin(bx*0.015))*6;
  var wallW=bw;
  var wx=bx;
  /* Stone/concrete wall body */
  var wallGrad=ctx.createLinearGradient(0,groundY,0,groundY+wallH);
  wallGrad.addColorStop(0,nf>0.5?hsl(220,8,22):hsl(220,12,52));
  wallGrad.addColorStop(1,nf>0.5?hsl(220,6,15):hsl(220,10,40));
  ctx.fillStyle=wallGrad;
  ctx.fillRect(wx,groundY,wallW,wallH);
  /* Stone block pattern */
  var blockW=8,blockH=4;
  ctx.strokeStyle=nf>0.5?hsla(220,5,28,0.3):hsla(220,8,45,0.2);
  ctx.lineWidth=0.5;
  for(var row=0;row<Math.ceil(wallH/blockH);row++){
    var offset=row%2===0?0:blockW/2;
    for(var col=-1;col<Math.ceil(wallW/blockW)+1;col++){
      var bkx=wx+col*blockW+offset;
      var bky=groundY+row*blockH;
      if(bkx>=wx&&bkx<wx+wallW&&bky<groundY+wallH){
        ctx.strokeRect(bkx,bky,blockW,blockH);
      }
    }
  }
  /* Coping (top cap) */
  ctx.fillStyle=nf>0.5?hsl(220,8,28):hsl(220,12,58);
  ctx.fillRect(wx-1,groundY-1,wallW+2,3);
  /* Rounded top edge highlight */
  ctx.fillStyle=nf>0.5?hsla(200,10,35,0.3):hsla(200,15,70,0.25);
  ctx.fillRect(wx,groundY-1,wallW,1);
  /* Drainage pipes */
  if(wallW>20){
    for(var dp=0;dp<Math.floor(wallW/25);dp++){
      var dpx=wx+10+dp*25;
      ctx.fillStyle=nf>0.5?hsl(0,0,18):hsl(0,0,40);
      ctx.fillRect(dpx,groundY+wallH*0.5,3,2);
      /* Drip effect */
      var dripPhase=Math.sin(t*2+dp*1.5);
      if(dripPhase>0.7){
        ctx.fillStyle=hsla(210,20,60,0.3);
        ctx.fillRect(dpx+1,groundY+wallH+1,1,2);
      }
    }
  }
  /* Splash zone at base */
  var splashW=wallW+4;
  ctx.fillStyle=hsla(210,15,55,nf>0.5?0.06:0.03);
  for(var sp=0;sp<3;sp++){
    var spx=wx-2+Math.sin(t*1.5+sp*2)*3;
    var spy=groundY+wallH+sp*2;
    ctx.fillRect(spx,spy,splashW,1);
  }
  /* Chain/fence on top if wide enough */
  if(wallW>30){
    ctx.strokeStyle=nf>0.5?hsla(0,0,30,0.4):hsla(0,0,55,0.3);
    ctx.lineWidth=0.8;
    /* Posts */
    for(var fp=0;fp<Math.floor(wallW/15);fp++){
      var fpx=wx+fp*15+5;
      ctx.beginPath();ctx.moveTo(fpx,groundY-4);ctx.lineTo(fpx,groundY);ctx.stroke();
    }
    /* Chain wire (sagging) */
    ctx.beginPath();
    ctx.moveTo(wx+3,groundY-3);
    for(var cx=wx+3;cx<wx+wallW-3;cx+=2){
      var sag=Math.sin((cx-wx)/wallW*Math.PI)*2;
      ctx.lineTo(cx,groundY-3+sag);
    }
    ctx.stroke();
  }
  /* Algae/moss at water line */
  ctx.fillStyle=nf>0.5?hsla(120,20,15,0.3):hsla(100,30,30,0.2);
  for(var am=0;am<wallW;am+=3){
    var amH=1+Math.sin(am*0.5+bx)*1;
    ctx.fillRect(wx+am,groundY+wallH-amH,2,amH);
  }
};
/* Street tree / vegetation among buildings */
P._drawStreetTree=function(bx,by,bw,bh,bH,bS,bL,sL,tL,nf,li){
  var groundY=by+bh;
  var treeH=bh*0.8;
  var treeCount=Math.max(1,Math.floor(bw/12));
  for(var ti=0;ti<treeCount;ti++){
    var tx=bx+(ti+0.5)*(bw/treeCount);
    /* Trunk */
    var trunkW=Math.max(2,Math.floor(bw*0.03));
    var trunkH=treeH*0.4;
    ctx.fillStyle=nf>0.5?hsl(25,30,15):hsl(25,40,30);
    ctx.fillRect(tx-trunkW/2,groundY-trunkH,trunkW,trunkH);
    /* Canopy */
    var canopyH=treeH*0.6;
    var canopyW=trunkW*3;
    var season=this.currentSeason;
    var sBlend=this.seasonBlend;
    var leafH=this._getSeasonLerp("treeH");
    var leafS=nf>0.5?25:40;
    var leafL=nf>0.5?lerp(20,35,1-nf):lerp(45,55,nf);
    if(season===3||this.targetSeason===3){
      /* Winter: bare branches, no canopy */
      var wb2=season===3?(1-sBlend):sBlend;
      ctx.strokeStyle=nf>0.5?hsl(25,20,18):hsl(25,30,32);
      ctx.lineWidth=Math.max(0.5,1);
      ctx.beginPath();ctx.moveTo(tx,groundY-trunkH);ctx.lineTo(tx-canopyW*0.5,groundY-trunkH-canopyH*0.5);ctx.stroke();
      ctx.beginPath();ctx.moveTo(tx,groundY-trunkH);ctx.lineTo(tx+canopyW*0.5,groundY-trunkH-canopyH*0.4);ctx.stroke();
      ctx.beginPath();ctx.moveTo(tx,groundY-trunkH);ctx.lineTo(tx-canopyW*0.3,groundY-trunkH-canopyH*0.7);ctx.stroke();
    }else{
      ctx.fillStyle=hsl(leafH,leafS,leafL);
      ctx.beginPath();ctx.arc(tx,groundY-trunkH-canopyH*0.3,canopyW*0.5,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(tx-canopyW*0.3,groundY-trunkH-canopyH*0.1,canopyW*0.35,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(tx+canopyW*0.3,groundY-trunkH-canopyH*0.1,canopyW*0.35,0,Math.PI*2);ctx.fill();
    }
  }
  /* Ground bushes */
  var bushColor=nf>0.5?hsl(this._getSeasonLerp("treeH"),20,20):hsl(this._getSeasonLerp("treeH"),35,35);
  ctx.fillStyle=bushColor;
  for(var bi=0;bi<Math.floor(bw/8);bi++){
    var bsx=bx+bi*8+Math.sin(bi*2.3)*2;
    ctx.beginPath();ctx.arc(bsx,groundY,3,Math.PI,0);ctx.fill();
  }
};

/* ═══════════════════════════════════════════════════════
   PARK / VEGETATION
   ═══════════════════════════════════════════════════════ */
P._drawPark=function(bx,by,bw,bh,bH,bS,bL,sL,tL,nf,li){
  var groundY=by+bh;
  var seasonIdx=this.currentSeason;
  var seasonBlend=this.seasonBlend;
  /* Ground / grass */
  var grassH=lerp(25,35,nf>0.5?1:0);
  var grassBaseH=seasonIdx===3?220:seasonIdx===2?35:100;
  var grassTargetH=0;
  if(this.targetSeason===3)grassTargetH=220;
  else if(this.targetSeason===2)grassTargetH=35;
  else if(this.targetSeason===0)grassTargetH=100;
  else grassTargetH=85;
  var grassHue=lerp(grassBaseH,grassTargetH,seasonBlend);
  var grassSat=li<=1?30:50;
  var grassLit=lerp(clamp(grassHue===220?40:grassHue===35?45:35,0,50),
    clamp(grassHue===220?12:grassHue===35?20:15,0,50),nf);
  ctx.fillStyle=hsl(grassHue,grassSat,grassLit);
  ctx.fillRect(bx,groundY-2,bw,grassH);
  /* Grass texture dots */
  var grassDetailH=clamp(grassLit+8,0,60);
  ctx.fillStyle=hsl(grassHue,grassSat+10,grassDetailH);
  for(var gd=0;gd<bw;gd+=4){
    var gdy=groundY+Math.sin(gd*0.5+this.frameCount*0.01)*1;
    ctx.fillRect(bx+gd,gdy,2,2);
  }
  /* Trees - varied shapes */
  var treeCount=Math.max(2,Math.floor(bw/15));
  var treeSpacing=bw/(treeCount+1);
  for(var ti=0;ti<treeCount;ti++){
    var tx=bx+treeSpacing*(ti+1);
    var treeH=bh*0.6+ti*3;
    var trunkW=Math.max(2,Math.floor(bw*0.04));
    var treeShape=(ti*7+li*3)%5; /* 0-4 shapes */
    /* Trunk */
    ctx.fillStyle=nf>0.5?hsl(25,30,15):hsl(25,40,30);
    ctx.fillRect(tx-trunkW/2,groundY-treeH*0.4,trunkW,treeH*0.4+2);
    var canopyH=treeH*0.55;
    var canopyW=treeH*0.4;
    var canopyY=groundY-treeH*0.4-canopyH*0.3;
    if(grassHue===220){
      /* Winter: bare branches - shape varies */
      ctx.fillStyle=nf>0.5?hsl(25,25,18):hsl(25,35,35);
      if(treeShape===0){
        /* V-shape branch */
        ctx.fillRect(tx-1,groundY-treeH*0.8,2,treeH*0.45);
        ctx.fillRect(tx-canopyW*0.4,groundY-treeH*0.7,canopyW*0.4,1);
        ctx.fillRect(tx+1,groundY-treeH*0.65,canopyW*0.3,1);
      }else if(treeShape===1){
        /* Y-shape */
        ctx.fillRect(tx-1,groundY-treeH*0.75,2,treeH*0.4);
        ctx.fillRect(tx-canopyW*0.3,groundY-treeH*0.7,canopyW*0.6,1);
        ctx.fillRect(tx,groundY-treeH*0.85,1,treeH*0.15);
      }else if(treeShape===2){
        /* Forked */
        ctx.fillRect(tx-1,groundY-treeH*0.6,2,treeH*0.25);
        ctx.fillRect(tx-canopyW*0.3,groundY-treeH*0.6,1,treeH*0.25);
        ctx.fillRect(tx+canopyW*0.2,groundY-treeH*0.55,1,treeH*0.2);
      }else{
        /* Standard bare */
        ctx.fillRect(tx-1,groundY-treeH*0.8,2,treeH*0.45);
        ctx.fillRect(tx-canopyW*0.3,groundY-treeH*0.7,canopyW*0.6,1);
        ctx.fillRect(tx-canopyW*0.2,groundY-treeH*0.85,canopyW*0.4,1);
      }
      if(nf>0.3){
        ctx.fillStyle=hsla(0,0,85,clamp((nf-0.3)*2,0,0.6));
        ctx.fillRect(tx-canopyW*0.2,groundY-treeH*0.72,canopyW*0.5,2);
      }
    }else if(grassHue===35){
      /* Autumn: shape-dependent canopy colors */
      var autumnColors=[
        nf>0.5?hsl(25,50,20):hsl(25,65,40),
        nf>0.5?hsl(15,55,18):hsl(15,60,35),
        nf>0.5?hsl(35,50,22):hsl(35,55,42),
        nf>0.5?hsl(5,60,22):hsl(5,65,40),
        nf>0.5?hsl(45,50,25):hsl(45,55,45)
      ];
      var ac=autumnColors[(ti+treeShape)%5];
      if(treeShape===0){
        /* Round bushy */
        ctx.fillStyle=ac;
        ctx.beginPath();ctx.arc(tx,canopyY,canopyW*0.5,0,Math.PI*2);ctx.fill();
        ctx.fillStyle=autumnColors[(ti+2)%5];
        ctx.beginPath();ctx.arc(tx-canopyW*0.2,canopyY+3,canopyW*0.35,0,Math.PI*2);ctx.fill();
      }else if(treeShape===1){
        /* Cone/pointed */
        ctx.fillStyle=ac;
        ctx.beginPath();
        ctx.moveTo(tx,canopyY-canopyH*0.6);
        ctx.lineTo(tx+canopyW*0.45,canopyY+canopyH*0.2);
        ctx.lineTo(tx-canopyW*0.45,canopyY+canopyH*0.2);
        ctx.closePath();ctx.fill();
        ctx.fillStyle=autumnColors[(ti+3)%5];
        ctx.beginPath();
        ctx.moveTo(tx,canopyY-canopyH*0.3);
        ctx.lineTo(tx+canopyW*0.5,canopyY+canopyH*0.35);
        ctx.lineTo(tx-canopyW*0.5,canopyY+canopyH*0.35);
        ctx.closePath();ctx.fill();
      }else if(treeShape===2){
        /* Columnar/cypress */
        ctx.fillStyle=ac;
        ctx.fillRect(tx-canopyW*0.2,canopyY-canopyH*0.5,canopyW*0.4,canopyH);
        ctx.fillStyle=autumnColors[(ti+1)%5];
        ctx.fillRect(tx-canopyW*0.15,canopyY-canopyH*0.45,canopyW*0.3,canopyH*0.85);
      }else if(treeShape===3){
        /* Weeping willow */
        ctx.fillStyle=ac;
        ctx.beginPath();ctx.arc(tx,canopyY,canopyW*0.4,0,Math.PI*2);ctx.fill();
        for(var wd=0;wd<5;wd++){
          var wdx=tx-canopyW*0.4+wd*canopyW*0.2;
          var wdy=canopyY+canopyH*0.3+wd*2;
          ctx.fillStyle=autumnColors[(ti+wd)%5];
          ctx.fillRect(wdx,canopyY,1,wdy-canopyY);
        }
      }else{
        /* Mushroom/umbrella */
        ctx.fillStyle=ac;
        ctx.beginPath();ctx.arc(tx,canopyY+2,canopyW*0.55,Math.PI,0);ctx.fill();
        ctx.fillRect(tx-canopyW*0.55,canopyY+1,canopyW*1.1,2);
      }
    }else{
      /* Spring/Summer: green, shape dependent */
      var greenLit=nf>0.5?18:38;
      var greenSat=nf>0.5?25:55;
      var greenH=grassHue===100?120:110;
      if(treeShape===0){
        /* Round multi-circle */
        ctx.fillStyle=hsl(greenH,greenSat,greenLit);
        ctx.beginPath();ctx.arc(tx,canopyY,canopyW*0.5,0,Math.PI*2);ctx.fill();
        ctx.fillStyle=hsl(greenH-5,greenSat+5,greenLit+5);
        ctx.beginPath();ctx.arc(tx-canopyW*0.2,canopyY+3,canopyW*0.38,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.arc(tx+canopyW*0.25,canopyY+2,canopyW*0.4,0,Math.PI*2);ctx.fill();
        ctx.fillStyle=hsla(greenH-10,greenSat,greenLit+15,0.4);
        ctx.beginPath();ctx.arc(tx-canopyW*0.1,canopyY-2,canopyW*0.25,0,Math.PI*2);ctx.fill();
      }else if(treeShape===1){
        /* Conical pine tree */
        var coneH=canopyH*1.2;
        ctx.fillStyle=hsl(greenH+10,greenSat-5,greenLit-3);
        for(var cn=0;cn<3;cn++){
          var cnW=canopyW*(0.3+cn*0.12);
          var cnY=canopyY-coneH*0.3+cn*coneH*0.25;
          ctx.beginPath();
          ctx.moveTo(tx,cnY-coneH*0.35);
          ctx.lineTo(tx+cnW,cnY+coneH*0.15);
          ctx.lineTo(tx-cnW,cnY+coneH*0.15);
          ctx.closePath();ctx.fill();
        }
      }else if(treeShape===2){
        /* Columnar cypress */
        ctx.fillStyle=hsl(greenH-5,greenSat+10,greenLit+2);
        var colW=canopyW*0.22;
        ctx.fillRect(tx-colW,canopyY-canopyH*0.5,colW*2,canopyH*1.1);
        ctx.fillStyle=hsl(greenH,greenSat,greenLit+6);
        ctx.fillRect(tx-colW*0.7,canopyY-canopyH*0.45,colW*1.4,canopyH);
      }else if(treeShape===3){
        /* Weeping willow */
        ctx.fillStyle=hsl(greenH+15,greenSat-10,greenLit+3);
        ctx.beginPath();ctx.arc(tx,canopyY,canopyW*0.4,0,Math.PI*2);ctx.fill();
        ctx.fillStyle=hsl(greenH+5,greenSat,greenLit);
        for(var wd=0;wd<7;wd++){
          var wdx=tx-canopyW*0.5+wd*canopyW*0.16;
          ctx.fillRect(wdx,canopyY+canopyW*0.2,1,canopyH*0.6);
        }
      }else{
        /* Flat-topped / pollarded */
        ctx.fillStyle=hsl(greenH,greenSat,greenLit);
        ctx.fillRect(tx-canopyW*0.5,canopyY,canopyW,canopyH*0.4);
        ctx.fillStyle=hsl(greenH-5,greenSat+5,greenLit+5);
        ctx.fillRect(tx-canopyW*0.4,canopyY-1,canopyW*0.8,canopyH*0.3);
        /* Sub-rounded top */
        ctx.beginPath();ctx.arc(tx,canopyY,canopyW*0.45,Math.PI,0);ctx.fill();
      }
    }
  }
  /* Bushes / shrubs along the ground */
  var bushCount=Math.floor(bw/12);
  for(var bi=0;bi<bushCount;bi++){
    var bushX=bx+3+bi*12+(ti*7&3);
    var bushY=groundY-1;
    var bushW=6+((bi*3)&3);
    var bushH=3+((bi*5)&3);
    if(grassHue===220){
      ctx.fillStyle=nf>0.5?hsl(220,15,12):hsl(220,20,28);
    }else{
      var bushLit=nf>0.5?15:grassHue===35?30:32;
      ctx.fillStyle=hsl(grassHue===35?25:110,nf>0.5?20:40,bushLit);
    }
    ctx.beginPath();
    ctx.arc(bushX,bushY,bushW*0.5,Math.PI,0);ctx.fill();
  }
  /* Park bench */
  if(bw>25){
    var benchX=bx+bw*0.4;
    var benchY=groundY-1;
    ctx.fillStyle=nf>0.5?hsl(25,30,20):hsl(25,45,45);
    ctx.fillRect(benchX,benchY-4,10,1);
    ctx.fillRect(benchX+1,benchY-4,1,4);
    ctx.fillRect(benchX+8,benchY-4,1,4);
    /* Back rest */
    ctx.fillRect(benchX,benchY-6,10,1);
  }
  /* Path through park */
  ctx.fillStyle=nf>0.5?hsl(30,8,18):hsl(30,15,55);
  ctx.fillRect(bx+bw*0.3,groundY+bh*0.15,bw*0.15,grassH*0.6);
  /* Flowers in spring */
  if(grassHue===100&&li>=2){
    for(var fi=0;fi<4;fi++){
      var fx=bx+bw*0.2+fi*bw*0.18;
      var fy=groundY+2;
      ctx.fillStyle=fi%2===0?hsla(340,70,65,0.8):hsla(50,80,70,0.8);
      ctx.fillRect(fx,fy,2,2);
      ctx.fillStyle=hsl(110,50,35);
      ctx.fillRect(fx,fy+2,1,2);
    }
  }
};

P._drawDistantWindows=function(bx,by,bw,bh,li,nf){
  if(!bw||!bh||bw<3||bh<3)return;
  var wSize=PX;
  var cols=Math.min(Math.floor(bw/wSize),60);
  var rows=Math.min(Math.floor(bh/(wSize*1.5)),100);
  if(cols<1||rows<1)return;
  var dayC="rgba(180,200,220,0.3)";
  var energy=this._energy||0;
  for(var r=1;r<rows;r++){
    for(var col=0;col<cols;col++){
      var wx=bx+col*wSize+2;
      var wy=by+r*wSize*1.5+2;
      /* At night, windows flicker with music energy */
      if(nf>0.4&&energy>0.05){
        var hash=((r*17+col*31+li*7+Math.floor(this.frameCount*0.15))&255)/255;
        var onThresh=0.55-energy*0.4;
        if(hash>onThresh){
          var bright=clamp((hash-onThresh)*3*energy,0,1);
          ctx.fillStyle=hsla(40+col*5,90,70+bright*20,bright*(nf-0.3)*1.5);
        }else{
          ctx.fillStyle=nf>0.6?"rgba(15,15,25,0.7)":"rgba(80,90,110,0.4)";
        }
      }else{
        ctx.fillStyle=dayC;
      }
      ctx.fillRect(wx,wy,wSize-3,wSize-3);
    }
  }
};

P._drawNearWindows=function(bx,by,bw,bh,li,nf,litWins){
  if(!bw||!bh||bw<5||bh<8)return;
  var wSize=6,frameW=1,gapX=10,gapY=12;
  var cols=Math.min(Math.floor((bw-4)/gapX),50);
  var rows=Math.min(Math.floor((bh-8)/gapY),80);
  if(cols<1||rows<1)return;
  var waterY=this.H*LAYERS[4].groundFrac;
  var energy=this._energy||0;
  var bands=this._freqBands;
  var bandIdx=((Math.floor(bx/10)+li*5)&7);
  var bandE=bands?bands[bandIdx]:0;

  for(var r=0;r<rows;r++){
    for(var c=0;c<cols;c++){
      var wx=bx+4+c*gapX;
      var wy=by+6+r*gapY;
      if(wx+wSize>bx+bw-2||wy+wSize>by+bh-2)continue;
      /* Window frame */
      ctx.fillStyle=nf>0.4?hsla(220,15,12,1):hsla(210,25,70,0.5);
      ctx.fillRect(wx-frameW,wy-frameW,wSize+frameW*2,wSize+frameW*2);

      /* Dynamic lit window based on music */
      var isLit=false;
      var winBright=0;
      /* Check pre-assigned lit windows */
      for(var lw=0;lw<litWins.length;lw++){
        if(litWins[lw].r===r&&litWins[lw].c===c){
          isLit=true;break;
        }
      }
      /* Music drives additional windows on/off */
      if(nf>0.35&&energy>0.05){
        var winHash=((r*23+c*37+li*11+Math.floor(this.frameCount*0.18))&255)/255;
        var thresh=0.5-bandE*0.4;
        if(!isLit&&winHash>thresh){
          isLit=true;
          winBright=clamp((winHash-thresh)*2.5*bandE,0,1);
        }
        /* Pre-lit windows pulse with music */
        if(isLit&&litWins.length>0&&litWins[0]){
          winBright=clamp(energy*1.5+bandE*0.8,0,1);
        }
      }

      if(isLit&&nf>0.35){
        /* Lit window glow */
        var glowA=clamp(0.3+winBright*0.5+0.08*Math.sin(this.frameCount*0.06+r*3+c*2),0.1,1);
        ctx.fillStyle=hsla(40+((r+c)&3)*10,85,68+winBright*22,glowA*0.6);
        ctx.fillRect(wx-2,wy-2,wSize+4,wSize+4);
        /* Window pane */
        ctx.fillStyle=hsla(45+((r+c)&3)*8,95,80+winBright*15,0.8+winBright*0.2);
        ctx.fillRect(wx,wy,wSize,wSize);
        /* Water reflection for every lit window */
        var refY=waterY+(waterY-wy)*0.25;
        if(refY<this.H){
          ctx.fillStyle=hsla(45,90,75,glowA*0.15);
          ctx.fillRect(wx,refY,wSize,wSize*1.5);
        }
      }else{
        /* Dark/off window */
        ctx.fillStyle=nf>0.4?hsla(220,15,8,1):hsla(210,20,85,0.7);
        ctx.fillRect(wx,wy,wSize,wSize);
      }
    }
  }
};

P._drawBuildingGlow=function(bx,by,bw,bh,nf){
  var a=0.08+nf*0.05;
  ctx.fillStyle=hsla(220,30,70,a);
  ctx.fillRect(bx-2,by-2,2,bh+4);
  ctx.fillRect(bx+bw,by-2,2,bh+4);
  ctx.fillRect(bx-2,by-2,bw+4,2);
  ctx.fillStyle=hsla(220,20,60,a*0.5);
  ctx.fillRect(bx-4,by-4,bw+8,bh+8);
};

/* ═══════════════════════════════════════════════════════
   ROAD
   ═══════════════════════════════════════════════════════ */
P.initRoad=function(){
  this.roadBushes=[];this.streetLamps=[];this.roadTraffic=[];
  var w=this.W;
  for(var x=0;x<w+200;x+=90){
    this.roadBushes.push({x:x,side:Math.random()>0.5?0:1,h:randi(6,10)});
  }
  for(var lx=40;lx<w+200;lx+=160){
    this.streetLamps.push({x:lx});
  }
  /* Road traffic vehicles */
  var carColors=[[0,0,30],[220,50,35],[200,40,50],[30,60,40],[0,0,60],[30,30,55],[180,20,45],[350,45,40]];
  for(var t=0;t<8;t++){
    var cc=carColors[t%carColors.length];
    this.roadTraffic.push({
      x:Math.random()*w*1.5,
      lane:Math.random()>0.5?0:1,
      speed:randf(0.3,1.2)*(Math.random()>0.5?1:-1),
      w:randi(10,18),h:randi(5,7),
      color:cc,
      isTruck:t<3
    });
  }
};

P.drawRoad=function(){
  var w=this.W,h=this.H;
  var roadY=h*LAYERS[2].groundFrac;
  var nf=this.nightFactor;
  ctx.fillStyle=nf>0.5?hsl(220,10,12):hsl(40,15,50);
  ctx.fillRect(0,roadY,w,14);
  ctx.fillStyle=nf>0.5?"rgba(200,200,200,0.2)":"rgba(255,255,255,0.5)";
  ctx.fillRect(0,roadY,w,1);
  ctx.fillRect(0,roadY+13,w,1);
  ctx.fillStyle=nf>0.5?"rgba(200,200,200,0.15)":"rgba(255,255,255,0.4)";
  for(var dx=0;dx<w;dx+=30){
    ctx.fillRect(dx,roadY+6,15,2);
  }
  for(var i=0;i<this.roadBushes.length;i++){
    var b=this.roadBushes[i];
    var bx=b.x-this.frameCount*LAYERS[2].scrollMul*0.3%((this.roadBushes.length>0?90:1)||1);
    if(bx<-20||bx>w+20)continue;
    var by=b.side===0?roadY-2:roadY+14;
    var dir=b.side===0?-1:1;
    ctx.fillStyle="#3a2a1a";
    ctx.fillRect(bx+2,by,2,dir*b.h*0.4);
    var bushH=b.h*0.6;
    ctx.fillStyle=nf>0.5?hsl(140,20,12):hsl(120,35,30);
    ctx.fillRect(bx,by+dir*b.h*0.3-2,6,dir*bushH);
    ctx.fillStyle=nf>0.5?hsl(140,25,15):hsl(120,40,35);
    ctx.fillRect(bx-1,by+dir*b.h*0.5-1,8,dir*bushH*0.5);
  }
  if(nf>0.3){
    var nightA=clamp((nf-0.3)/0.3,0,1);
    for(var j=0;j<this.streetLamps.length;j++){
      var sl=this.streetLamps[j];
      var sx=sl.x-this.frameCount*LAYERS[2].scrollMul*0.3%((this.streetLamps.length>0?160:1)||1);
      if(sx<-30||sx>w+30)continue;
      var poleBase=roadY-2;
      ctx.fillStyle=hsl(0,0,clamp(lerp(40,25,nf),0,100));
      ctx.fillRect(sx+1,poleBase-20,2,20);
      ctx.fillStyle=hsl(0,0,clamp(lerp(50,30,nf),0,100));
      ctx.fillRect(sx-2,poleBase-22,8,3);
      ctx.fillStyle=hsla(45,100,85,nightA*0.9);
      ctx.fillRect(sx,poleBase-19,4,2);
      ctx.fillStyle=hsla(45,90,70,nightA*0.4);
      ctx.beginPath();
      ctx.moveTo(sx-8,poleBase-18);ctx.lineTo(sx+12,poleBase-18);
      ctx.lineTo(sx+8,poleBase+10);ctx.lineTo(sx-4,poleBase+10);
      ctx.fill();
      ctx.fillStyle=hsla(45,80,60,nightA*0.15);
      ctx.beginPath();
      ctx.moveTo(sx-15,poleBase);ctx.lineTo(sx+19,poleBase);
      ctx.lineTo(sx+14,poleBase+25);ctx.lineTo(sx-10,poleBase+25);
      ctx.fill();
    }
  }
  /* --- Road traffic --- */
  for(var k=0;k<this.roadTraffic.length;k++){
    var v=this.roadTraffic[k];
    v.x+=v.speed*0.5;
    if(v.x>w+100)v.x=-v.w-50;
    if(v.x<-v.w-50)v.x=w+100;
    var vx=v.x;
    var vLane=v.lane===0?roadY+1:roadY+7;
    var vTop=vLane;
    var vc=v.color;
    var vl=clamp(lerp(lerp(vc[2],vc[2]+20,0.5),vc[2]-10,nf),5,90);
    var vs=clamp(lerp(vc[1],vc[1]*0.5,nf),0,80);
    var vh=clamp(lerp(vc[0],230,nf),0,360);
    ctx.fillStyle=hsl(vh,vs,vl);
    ctx.fillRect(vx,vTop,v.w,v.h);
    ctx.fillStyle=hsl(vh,vs,clamp(vl+12,0,95));
    ctx.fillRect(vx+v.w*0.2,vTop,Math.floor(v.w*0.6),Math.max(1,Math.floor(v.h*0.4)));
    if(nf>0.3){
      var hlA=clamp((nf-0.3)/0.3,0,1);
      var frontX=v.speed>0?vx+v.w:vx;
      ctx.fillStyle=hsla(50,100,90,hlA*0.8);
      ctx.fillRect(frontX,vTop+1,2,2);
      ctx.fillRect(frontX,vTop+v.h-3,2,2);
      var rearX=v.speed>0?vx:vx+v.w-2;
      ctx.fillStyle=hsla(0,80,45,hlA*0.7);
      ctx.fillRect(rearX,vTop+1,2,2);
      ctx.fillRect(rearX,vTop+v.h-3,2,2);
    }
  }
};

/* ═══════════════════════════════════════════════════════
   TRAIN
   ═══════════════════════════════════════════════════════ */
P.updateTrain=function(){
  this.trainTimer++;
  if(!this.trainVisible&&this.trainTimer>500+randi(0,400)){
    this.trainVisible=true;this.trainX=this.trainDir>0?-500:this.W+100;
    this.trainTimer=0;
  }
  if(this.trainVisible){
    this.trainX+=this.trainDir*5;
    if((this.trainDir>0&&this.trainX>this.W+500)||(this.trainDir<0&&this.trainX<-500)){
      this.trainVisible=false;this.trainDir*=-1;this.trainTimer=0;
    }
  }
};

P.drawTrain=function(){
  if(!this.trainVisible)return;
  var w=this.W,h=this.H;
  var trackY=h*0.58; /* Aligned with elevated highway */
  var nf=this.nightFactor;
  var tx=this.trainX,dir=this.trainDir;

  /* --- Rail on top of highway surface --- */
  var totalLen=5*(90+3)+60;
  var railL=dir>0?tx-80:tx-totalLen;
  var railR=dir>0?tx+totalLen:tx+80;
  var railColor=nf>0.5?hsl(0,0,22):hsl(0,0,48);
  ctx.fillStyle=railColor;
  ctx.fillRect(Math.min(railL,railR),trackY-1,Math.abs(railR-railL),1);
  ctx.fillRect(Math.min(railL,railR),trackY+1,Math.abs(railR-railL),1);
  /* Ties */
  ctx.fillStyle=railColor;
  for(var tie=Math.floor(Math.min(railL,railR)/20)*20;tie<Math.max(railL,railR);tie+=12){
    ctx.fillRect(tie,trackY-2,4,5);
  }
  /* Catenary poles and overhead wire */
  var wireColor=nf>0.5?hsla(0,0,30,0.4):hsla(0,0,60,0.5);
  for(var cp=Math.floor(Math.min(railL,railR)/60)*60;cp<Math.max(railL,railR);cp+=60){
    ctx.fillStyle=nf>0.5?hsl(0,0,20):hsl(0,0,42);
    ctx.fillRect(cp,trackY-22,1,20);
    ctx.fillRect(cp-4,trackY-22,9,2);
  }
  ctx.fillStyle=wireColor;
  ctx.fillRect(Math.min(railL,railR),trackY-20,Math.abs(railR-railL),1);

  var carLen=90,carH=12,gap=2;
  var cars=5;
  var noseLen=35;
  var tH=carH;

  /* Colors */
  var bodyTop=nf>0.5?hsl(215,20,32):hsl(215,45,78);
  var bodyBot=nf>0.5?hsl(220,15,20):hsl(220,38,62);
  var roofCol=nf>0.5?hsl(210,12,35):hsl(210,30,85);
  var noseHighlight=nf>0.5?hsla(215,25,42,0.6):hsla(215,50,88,0.5);
  var underCol=nf>0.5?hsl(0,0,12):hsl(0,0,35);
  var stripeA=nf>0.5?hsl(0,60,40):hsl(0,70,55);
  var stripeB=nf>0.5?hsl(215,40,35):hsl(215,55,65);

  var leadI=dir>0?cars-1:0;
  var tailI=dir>0?0:cars-1;

  for(var i=0;i<cars;i++){
    var cx=tx+i*(carLen+gap);
    var top=trackY-tH;

    /* --- Undercarriage --- */
    ctx.fillStyle=underCol;
    ctx.fillRect(cx+3,top+tH-1,carLen-6,2);
    /* Bogies (wheel trucks) */
    ctx.fillStyle=nf>0.5?hsl(0,0,10):hsl(0,0,22);
    ctx.fillRect(cx+6,top+tH,16,2);
    ctx.fillRect(cx+carLen-22,top+tH,16,2);

    /* --- Body --- */
    var bGrad=ctx.createLinearGradient(0,top,0,top+tH);
    bGrad.addColorStop(0,bodyTop);
    bGrad.addColorStop(1,bodyBot);
    ctx.fillStyle=bGrad;
    ctx.fillRect(cx,top,carLen,tH);

    /* --- Aerodynamic nose (lead car) --- */
    if(i===leadI){
      var noseTip=dir>0?cx+carLen+noseLen:cx-noseLen;
      var noseBase=dir>0?cx+carLen:cx;
      /* Main nose body - smooth elongated bullet shape */
      ctx.fillStyle=bodyTop;
      ctx.beginPath();
      ctx.moveTo(noseBase,top);
      /* Top curve: gentle arc to tip */
      ctx.bezierCurveTo(
        noseBase+(noseTip-noseBase)*0.4,top-1,
        noseTip+(noseBase-noseTip)*0.15,top+tH*0.15,
        noseTip,top+tH*0.45
      );
      /* Bottom curve: back to base */
      ctx.bezierCurveTo(
        noseTip+(noseBase-noseTip)*0.15,top+tH*0.75,
        noseBase+(noseTip-noseBase)*0.4,top+tH+1,
        noseBase,top+tH
      );
      ctx.closePath();ctx.fill();

      /* Nose highlight strip (white) */
      ctx.fillStyle=noseHighlight;
      ctx.beginPath();
      ctx.moveTo(noseBase,top+1);
      ctx.bezierCurveTo(
        noseBase+(noseTip-noseBase)*0.5,top,
        noseTip+(noseBase-noseTip)*0.2,top+tH*0.2,
        noseTip,top+tH*0.35
      );
      ctx.lineTo(noseBase,top+tH*0.35);
      ctx.closePath();ctx.fill();

      /* Windshield - sleek dark strip */
      ctx.fillStyle=nf>0.5?hsla(180,30,20,0.9):hsla(200,50,40,0.75);
      var wsX=dir>0?cx+carLen-noseLen*0.55:cx+noseLen*0.55-2;
      ctx.beginPath();
      var wsW=noseLen*0.4;
      var wsY=top+2;
      ctx.moveTo(wsX,wsY);
      ctx.bezierCurveTo(wsX+wsW*0.3,wsY-1,wsX+wsW*0.7,wsY,wsX+wsW,wsY+tH*0.3);
      ctx.lineTo(wsX,wsY+tH*0.3);
      ctx.closePath();ctx.fill();

      /* Front headlight cluster */
      if(nf>0.3){
        var hlA=clamp((nf-0.3)/0.3,0,1);
        ctx.fillStyle=hsla(50,100,95,hlA*0.9);
        ctx.fillRect(noseTip-1,top+tH*0.4,3,3);
        /* Headlight beam */
        ctx.fillStyle=hsla(50,90,85,hlA*0.2);
        ctx.beginPath();
        var beamX=dir>0?noseTip:noseTip;
        var beamDir=dir>0?1:-1;
        ctx.moveTo(beamX,top+tH*0.3);
        ctx.lineTo(beamX+beamDir*50,top+tH*0.15);
        ctx.lineTo(beamX+beamDir*50,top+tH*0.7);
        ctx.lineTo(beamX,top+tH*0.55);
        ctx.closePath();ctx.fill();
      }
    }

    /* --- Streamlined tail --- */
    if(i===tailI){
      var tailTip=dir>0?cx-20:cx+carLen+20;
      var tailBase=dir>0?cx:cx+carLen;
      ctx.fillStyle=bodyBot;
      ctx.beginPath();
      ctx.moveTo(tailBase,top+tH*0.05);
      ctx.bezierCurveTo(
        tailBase+(tailTip-tailBase)*0.6,top+tH*0.1,
        tailTip,top+tH*0.3,
        tailTip,top+tH*0.5
      );
      ctx.bezierCurveTo(
        tailTip,top+tH*0.7,
        tailBase+(tailTip-tailBase)*0.6,top+tH*0.95,
        tailBase,top+tH
      );
      ctx.closePath();ctx.fill();
      /* Tail lights */
      if(nf>0.3){
        var tlA=clamp((nf-0.3)/0.3,0,1);
        ctx.fillStyle=hsla(0,100,55,tlA*0.9);
        ctx.fillRect(tailTip,top+tH*0.35,2,2);
        ctx.fillRect(tailTip,top+tH*0.6,2,2);
      }
    }

    /* --- Roof --- */
    ctx.fillStyle=roofCol;
    ctx.fillRect(cx+1,top,carLen-2,1);

    /* --- Dual livery stripe --- */
    ctx.fillStyle=stripeA;
    ctx.fillRect(cx,top+tH*0.38,carLen,1);
    ctx.fillStyle=stripeB;
    ctx.fillRect(cx,top+tH*0.52,carLen,1);

    /* --- Windows --- */
    if(nf>0.3){
      var wAlpha=clamp((nf-0.3)*1.5,0,0.85);
      var winY=top+2,winH=tH*0.28;
      if(i!==leadI){
        var winCount=Math.floor((carLen-12)/14);
        var winStart=cx+8;
        for(var wi=0;wi<winCount;wi++){
          var wx=winStart+wi*14;
          ctx.fillStyle=hsla(50,90,75,wAlpha*0.2);
          ctx.fillRect(wx-1,winY-1,8,winH+2);
          ctx.fillStyle=hsla(50,100,85,wAlpha);
          ctx.fillRect(wx,winY,6,winH);
        }
      }
    }

    /* --- Inter-car diaphragm --- */
    if(i<cars-1){
      ctx.fillStyle=underCol;
      ctx.fillRect(cx+carLen,trackY-tH+3,gap,tH-5);
      ctx.fillStyle=nf>0.5?hsl(0,0,18):hsl(0,0,40);
      ctx.fillRect(cx+carLen,trackY-tH+1,gap,2);
    }
  }

  /* --- Speed lines --- */
  ctx.fillStyle=nf>0.5?hsla(215,15,30,0.12):hsla(215,30,70,0.08);
  for(var sl=0;sl<10;sl++){
    var slx=dir>0?tx-carLen-sl*18:tx+cars*(carLen+gap)+sl*18;
    var sly=trackY-tH+2+((sl*11)&(tH-4));
    ctx.fillRect(slx,sly,dir>0?-12:12,1);
  }

  /* --- Ground shadow --- */
  ctx.fillStyle="rgba(0,0,0,0.1)";
  ctx.fillRect(tx+10,trackY+1,cars*(carLen+gap)-5,2);
};

/* ═══════════════════════════════════════════════════════
   TV TOWER
   ═══════════════════════════════════════════════════════ */
P._drawTVTower=function(bx,by,bw,bh,bH,bS,bL,sL,tL,nf,li){
  var towerH=bh*2.5;
  var towerTop=by-towerH+bh;
  /* Main shaft - tapered */
  ctx.fillStyle=nf>0.5?hsl(220,8,22):hsl(220,12,55);
  ctx.fillRect(bx+bw/2-2,towerTop,4,towerH);
  /* Wider base section */
  ctx.fillRect(bx+bw/2-4,by-towerH*0.3+bh,8,towerH*0.3);
  /* Observation deck */
  var deckY=towerTop+towerH*0.35;
  ctx.fillStyle=nf>0.5?hsl(220,10,28):hsl(220,15,60);
  ctx.fillRect(bx+bw/2-8,deckY,16,5);
  /* Windows on deck */
  if(nf>0.3){
    var wa=clamp((nf-0.3)/0.3,0,1)*0.7;
    ctx.fillStyle=hsla(45,80,70,wa);
    ctx.fillRect(bx+bw/2-6,deckY+1,3,3);
    ctx.fillRect(bx+bw/2+3,deckY+1,3,3);
  }
  /* Antenna spire */
  ctx.fillStyle=nf>0.5?hsl(0,0,25):hsl(0,0,50);
  ctx.fillRect(bx+bw/2,towerTop-12,2,12);
  /* Transmission dishes */
  ctx.fillStyle=nf>0.5?hsl(0,0,30):hsl(0,0,60);
  ctx.fillRect(bx+bw/2+3,towerTop+5,4,2);
  ctx.fillRect(bx+bw/2-7,towerTop+10,4,2);
  /* Blinking red beacon */
  var beaconA=Math.sin(this.frameCount*0.06)>0.5?0.9:0.15;
  ctx.fillStyle=hsla(0,100,50,beaconA*(nf>0.2?1:0.3));
  ctx.fillRect(bx+bw/2,towerTop-13,2,2);
  /* Second beacon lower */
  var beacon2A=Math.sin(this.frameCount*0.06+Math.PI)>0.5?0.7:0.1;
  ctx.fillStyle=hsla(0,100,50,beacon2A*(nf>0.2?1:0.3));
  ctx.fillRect(bx+bw/2-1,towerTop+towerH*0.5,2,2);
  /* Support guy wires */
  ctx.fillStyle=hsla(0,0,50,0.2);
  ctx.fillRect(bx+bw/2,towerTop,bx+bw/2-(bx-10),1);
  ctx.fillRect(bx+bw/2,towerTop,(bx+bw+10)-bx-bw/2,1);
};

/* ═══════════════════════════════════════════════════════
   ROTATING STAR FIELD (rotary disk)
   ═══════════════════════════════════════════════════════ */
P.drawStars=function(){
  if(this.nightFactor<0.3)return;
  var w=this.W,h=this.H;
  var alpha=clamp((this.nightFactor-0.3)/0.3,0,1);
  /* Rotation: entire star field rotates around moon position */
  var cx=this._moonX,cy=this._moonY;
  var rotSpeed=this.frameCount*0.0004;
  var cosR=Math.cos(rotSpeed),sinR=Math.sin(rotSpeed);
  for(var i=0;i<this.stars.length;i++){
    var s=this.stars[i];
    var twinkle=0.5+0.5*Math.sin(this.frameCount*0.02*s.twinkleSpeed+s.twinkleOffset);
    var a=alpha*s.brightness*twinkle;
    if(a<0.1)continue;
    /* Rotate star position around moon center */
    var sx=s.x*w-cx,sy=s.y*h-cy;
    var rx=sx*cosR-sy*sinR+cx;
    var ry=sx*sinR+sy*cosR+cy;
    /* Wrap around if off-screen */
    rx=((rx%w)+w)%w;
    ry=((ry%(h*0.6))+(h*0.6))%(h*0.6);
    if(ry>h*0.55)continue;
    ctx.globalAlpha=a;
    var sz=Math.ceil(s.size);
    ctx.fillStyle="#fff";
    ctx.fillRect(Math.floor(rx),Math.floor(ry),sz,sz);
  }
  ctx.globalAlpha=1;
};

P.updateEasterEggs=function(){
  var w=this.W,h=this.H;
  /* Compute water level for ship Y positions */
  var baseWaterY=h*LAYERS[4].groundFrac;
  var waterTop=baseWaterY+(this._tideOffset||0);
  var waterH=h-waterTop;
  var u=this.ufoState,a=this.airplaneState,ast=this.asteroidState;
  var energy=this._energy||0;
  var bass=this._bassEnergy||0;
  /* Music-triggered easter eggs: energy spikes can trigger hidden events */
  var energySpike=energy>0.45;
  var bassSpike=bass>0.55;
  /* UFO */
  u.timer--;
  if(!u.visible&&u.timer<=0&&(energySpike||Math.random()>0.7)){
    u.visible=true;u.x=-100;u.y=h*randf(0.1,0.35);u.beam=false;u.grabbed=null;
  }
  if(u.visible){
    u.x+=1.8;
    u.y+=Math.sin(this.frameCount*0.03)*0.5;
    /* Activate tractor beam near a traffic vehicle */
    if(!u.beam&&u.x>w*0.3&&u.x<w*0.7&&this.frameCount%3===0){
      u.beam=true;u.grabbed=null;
    }
    if(u.beam&&!u.grabbed&&this.fgTraffic){
      for(var vi=0;vi<this.fgTraffic.length;vi++){
        var v=this.fgTraffic[vi];
        if(Math.abs(v.x-u.x)<30){u.grabbed=v;u.grabOffY=0;break}
      }
    }
    if(u.grabbed){
      u.grabbed.x=u.x-5;u.grabbed.y=u.y+30;
    }
    if(u.x>w+150){u.visible=false;u.timer=randi(1500,3000);u.beam=false;u.grabbed=null}
  }
  /* Airplane */
  a.timer--;
  if(!a.visible&&a.timer<=0){
    a.visible=true;a.x=-80;a.y=h*randf(0.05,0.2);
  }
  if(a.visible){
    a.x+=3.5;
    if(a.x>w+80){a.visible=false;a.timer=randi(600,1500)}
  }
  /* Asteroid */
  ast.timer--;
  if(!ast.visible&&ast.timer<=0&&(bassSpike||Math.random()>0.6)){
    ast.visible=true;ast.x=-60;ast.y=h*randf(0.05,0.25);ast.trail=[];
  }
  if(ast.visible){
    ast.x+=2.5;ast.y+=0.3;
    ast.trail.push({x:ast.x,y:ast.y});
    if(ast.trail.length>25)ast.trail.shift();
    if(ast.x>w+60||ast.y>h*0.5){ast.visible=false;ast.timer=randi(1200,2500);ast.trail=[]}
  }
  /* Cruise Ship */
  var cs=this.cruiseShipState;
  cs.timer--;
  cs.lightPhase=this.frameCount*0.04;
  if(!cs.visible&&cs.timer<=0){
    cs.visible=true;
    cs.dir=Math.random()>0.5?1:-1;
    cs.x=cs.dir>0?-500:w+100;
    cs.y=h*0.62;
  }
  if(cs.visible){
    cs.x+=cs.dir*0.3;
    cs.y+=Math.sin(this.frameCount*0.008)*0.15;
    if((cs.dir>0&&cs.x>w+600)||(cs.dir<0&&cs.x<-600)){
      cs.visible=false;cs.timer=randi(2000,4000);
    }
  }
  /* --- Modern Arch Bridge --- */
  var br=this.bridgeState;
  br.timer--;
  if(!br.visible&&br.timer<=0){
    br.visible=true;
    br.x=-300;
    br.archStyle=Math.floor(Math.random()*3);
    br.dir=Math.random()>0.5?1:-1;
  }
  if(br.visible){
    br.x+=br.dir*0.4;
    if((br.dir>0&&br.x>w+300)||(br.dir<0&&br.x<-300)){
      br.visible=false;
      br.timer=randi(2500,5000);
    }
  }
  /* --- Cargo Ship --- */
  var cg=this.cargoShipState;
  cg.timer--;
  if(!cg.visible&&cg.timer<=0){
    cg.visible=true;cg.x=-500;cg.dir=Math.random()>0.5?1:-1;cg.lightPhase=0;
  }
  if(cg.visible){
    cg.lightPhase+=0.02;
    cg.x+=cg.dir*0.25;cg.y=waterTop*0.85+waterH*0.12+Math.sin(cg.lightPhase*0.8)*2;
    if((cg.dir>0&&cg.x>w+500)||(cg.dir<0&&cg.x<-500)){cg.visible=false;cg.timer=randi(2500,5000)}
  }
  /* --- Tourist Cruiser --- */
  var tc=this.touristCruiserState;
  tc.timer--;
  if(!tc.visible&&tc.timer<=0){
    tc.visible=true;tc.x=-400;tc.dir=Math.random()>0.5?1:-1;tc.lightPhase=0;
  }
  if(tc.visible){
    tc.lightPhase+=0.02;
    tc.x+=tc.dir*0.2;tc.y=waterTop*0.82+waterH*0.15+Math.sin(tc.lightPhase)*3;
    if((tc.dir>0&&tc.x>w+400)||(tc.dir<0&&tc.x<-400)){tc.visible=false;tc.timer=randi(3000,5500)}
  }
  /* --- Ferry --- */
  var fe=this.ferryState;
  fe.timer--;
  if(!fe.visible&&fe.timer<=0){
    fe.visible=true;fe.x=-350;fe.dir=Math.random()>0.5?1:-1;fe.lightPhase=0;
  }
  if(fe.visible){
    fe.lightPhase+=0.02;
    fe.x+=fe.dir*0.35;fe.y=waterTop*0.88+waterH*0.1+Math.sin(fe.lightPhase*1.2)*2;
    if((fe.dir>0&&fe.x>w+350)||(fe.dir<0&&fe.x<-350)){fe.visible=false;fe.timer=randi(2000,4000)}
  }
  /* --- Fireworks --- */
  var fw2=this.fireworksState;
  fw2.timer--;
  if(!fw2.visible&&fw2.timer<=0){
    /* No fireworks in rainy weather */
    var cw=this.currentWeather;
    var isRain=cw==="rain"||cw==="heavy_rain"||cw==="thunderstorm"||cw==="light_rain"||cw==="drizzle"||cw==="sleet"||cw==="freezing_rain"||cw==="hail";
    if(isRain){fw2.timer=randi(600,1200);return}
    fw2.visible=true;fw2.showTimer=0;fw2.rockets=[];fw2.particles=[];
  }
  if(fw2.visible){
    fw2.showTimer++;
    /* Cancel fireworks if rain starts during show */
    var cwR=this.currentWeather;
    if(cwR==="rain"||cwR==="heavy_rain"||cwR==="thunderstorm"||cwR==="light_rain"||cwR==="drizzle"||cwR==="sleet"||cwR==="freezing_rain"||cwR==="hail"){
      fw2.visible=false;fw2.timer=randi(2000,5000);fw2.rockets=[];fw2.particles=[];
    }
    /* Launch rockets frequently - up to 3 at once */
    if(fw2.showTimer%10===0&&fw2.showTimer<300){
      var rocketCount=1+Math.floor(Math.random()*3);
      for(var rc=0;rc<rocketCount;rc++){
        fw2.rockets.push({x:w*randf(0.1,0.9),y:h*randf(0.8,0.9),vy:randf(-3.5,-5.5),
          targetY:h*randf(0.05,0.35),colorH:Math.floor(Math.random()*360)});
      }
    }
    /* Update rockets */
    for(var ri=fw2.rockets.length-1;ri>=0;ri--){
      var rkt=fw2.rockets[ri];
      rkt.y+=rkt.vy;
      if(rkt.y<=rkt.targetY){
        /* Explode into particles */
        var pCount=randi(40,80);
        for(var pi=0;pi<pCount;pi++){
          var pa=Math.random()*Math.PI*2;
          var pv=randf(0.8,4);
          fw2.particles.push({x:rkt.x,y:rkt.y,vx:Math.cos(pa)*pv,vy:Math.sin(pa)*pv,
            life:randi(30,65),maxLife:65,colorH:rkt.colorH,colorS:randf(60,95),colorL:randf(45,75)});
        }
        fw2.rockets.splice(ri,1);
      }
    }
    /* Update particles (cap at 600 to prevent perf issues) */
    if(fw2.particles.length>600){fw2.particles.splice(0,fw2.particles.length-600)}
    for(var pk=fw2.particles.length-1;pk>=0;pk--){
      var ptc=fw2.particles[pk];
      ptc.x+=ptc.vx;ptc.y+=ptc.vy;ptc.vy+=0.04;ptc.vx*=0.985;ptc.life--;
      if(ptc.life<=0)fw2.particles.splice(pk,1);
    }
    if(fw2.showTimer>350&&fw2.rockets.length===0&&fw2.particles.length===0){
      fw2.visible=false;fw2.timer=randi(1500,4000);
    }
  }
  /* --- Ferris Wheel --- */
  var fws=this.ferrisWheelState;
  fws.timer--;
  if(!fws.visible&&fws.timer<=0){
    fws.visible=true;fws.x=w*randf(0.15,0.85);fws.angle=0;
  }
  if(fws.visible){
    fws.angle+=0.008;
    fws.timer--;
    if(fws.timer<=0){fws.visible=false;fws.timer=randi(5000,9000)}
  }
  /* --- Zeppelin --- */
  var zp=this.zeppelinState;
  zp.timer--;
  if(!zp.visible&&zp.timer<=0){
    zp.visible=true;zp.x=-350;zp.dir=1;zp.y=h*randf(0.08,0.25);
  }
  if(zp.visible){
    zp.x+=zp.dir*0.35;
    zp.y+=Math.sin(this.frameCount*0.005)*0.15;
    if((zp.dir>0&&zp.x>w+350)||(zp.dir<0&&zp.x<-350)){zp.visible=false;zp.timer=randi(3000,6000)}
  }
  /* --- Godzilla (suspended — does not trigger) --- */
  var gz=this.godzillaState;
  gz.timer--;
  /* If suspended, ensure hidden and skip all trigger logic */
  if(gz.suspended){
    gz.visible=false;gz.triggered=false;gz.mouthOpen=0;gz.beamActive=false;gz.beamTimer=0;
  }else{
  /* Trigger by music: sub-bass heavy + high energy, OR track name keywords */
  var isGodzillaTrack=false;
  if(this.currentTrack>=0&&this.playlist[this.currentTrack]){
    var tn=this.playlist[this.currentTrack].name.toLowerCase();
    var keywords=["godzilla","gojira","zilla","monster","king","kaiju"];
    for(var kw=0;kw<keywords.length;kw++){
      if(tn.indexOf(keywords[kw])!==-1){isGodzillaTrack=true;break}
    }
  }
  var isGodzillaTone=(this._bassEnergy||0)>0.6&&(this._energy||0)>0.5;
  if((isGodzillaTrack||isGodzillaTone)&&!gz.visible&&!gz.triggered){
     gz.visible=true;gz.x=-200;gz.dir=1;gz.y=h*0.55;
     gz.mouthOpen=0;gz.beamActive=false;gz.beamTimer=0;gz.triggered=true;
    }
  if(!gz.visible&&!gz.triggered&&gz.timer<=0&&this.currentScene==="cityscape"){
    gz.visible=true;gz.x=-200;gz.dir=1;gz.y=h*0.55;
    gz.mouthOpen=0;gz.beamActive=false;gz.beamTimer=0;
  }
  if(gz.visible){
    gz.animFrame=this.frameCount;
    gz.x+=gz.dir*(gz.stopWalking?0:0.5);
    /* Walk bob */
    gz.y=h*0.55+Math.sin(this.frameCount*0.08)*h*0.003;
    /* Mouth opens over time */
    if(gz.x>w*0.2)gz.mouthOpen=Math.min(1,gz.mouthOpen+0.01);
    /* Beam fires when mouth fully open */
    if(gz.mouthOpen>=1){
      if(!gz.stopWalking)gz.beamTimer++;
      if(gz.beamTimer>60)gz.beamActive=true;
      if(gz.beamTimer>800&&!gz.stopWalking){gz.beamActive=false;gz.mouthOpen=Math.max(0,gz.mouthOpen-0.005)}
    }
    if(gz.x>w+300){gz.visible=false;gz.timer=randi(4000,8000);gz.triggered=false;gz.mouthOpen=0;gz.beamActive=false;gz.beamTimer=0}
  }
  }
  this.updateFamousBuildings();
  this.updateFerrisWheel();
};

P.drawEasterEggs=function(){
  var w=this.W,h=this.H,nf=this.nightFactor;
  var u=this.ufoState,a=this.airplaneState,ast=this.asteroidState;
  /* --- UFO --- */
  if(u.visible){
    var ux=Math.floor(u.x),uy=Math.floor(u.y);
    /* Saucer body */
    ctx.fillStyle=nf>0.5?hsl(180,30,35):hsl(180,40,65);
    ctx.beginPath();ctx.ellipse(ux,uy,16,6,0,0,Math.PI*2);ctx.fill();
    /* Dome */
    ctx.fillStyle=nf>0.5?hsl(200,35,45):hsl(200,50,75);
    ctx.beginPath();ctx.ellipse(ux,uy-4,7,5,0,Math.PI,0);ctx.fill();
    /* Lights along saucer rim */
    for(var ul=0;ul<5;ul++){
      var la=Math.sin(this.frameCount*0.15+ul*1.3)>0.5?0.8:0.2;
      ctx.fillStyle=hsla(120+ul*50,100,60,la);
      var lx=ux-12+ul*6;
      ctx.fillRect(lx,uy+4,2,2);
    }
    /* Tractor beam */
    if(u.beam){
      var beamA=0.15+0.1*Math.sin(this.frameCount*0.1);
      ctx.fillStyle=hsla(180,80,70,beamA);
      ctx.beginPath();
      ctx.moveTo(ux-6,uy+6);ctx.lineTo(ux+6,uy+6);
      ctx.lineTo(ux+14,uy+50);ctx.lineTo(ux-14,uy+50);
      ctx.fill();
      ctx.fillStyle=hsla(180,80,70,beamA*0.5);
      ctx.beginPath();
      ctx.moveTo(ux-8,uy+50);ctx.lineTo(ux+8,uy+50);
      ctx.lineTo(ux+20,uy+80);ctx.lineTo(ux-20,uy+80);
      ctx.fill();
    }
  }
  /* --- Airplane --- */
  if(a.visible){
    var ax=Math.floor(a.x),ay=Math.floor(a.y);
    /* Contrail */
    ctx.fillStyle="rgba(255,255,255,0.12)";
    ctx.fillRect(ax-60,ay+1,60,1);
    ctx.fillRect(ax-60,ay+5,60,1);
    /* Fuselage */
    ctx.fillStyle=nf>0.5?hsl(220,10,30):hsl(220,15,65);
    ctx.fillRect(ax-20,ay+1,40,5);
    /* Wings */
    ctx.fillStyle=nf>0.5?hsl(220,10,25):hsl(220,12,58);
    ctx.fillRect(ax-5,ay-2,15,2);
    ctx.fillRect(ax-5,ay+7,15,2);
    /* Tail */
    ctx.fillRect(ax-20,ay-2,6,2);
    ctx.fillRect(ax-20,ay+7,6,2);
    /* Tail fin */
    ctx.fillRect(ax-22,ay+1,3,5);
    /* Windows */
    if(nf>0.3){
      ctx.fillStyle="rgba(255,200,100,0.5)";
      for(var aw=ax-15;aw<ax+15;aw+=4){

  /* --- Asteroid --- */
  if(ast.visible){

  /* --- Gigantic Cruise Ship --- */
  var cs=this.cruiseShipState;

  /* --- Cargo Ship --- */
