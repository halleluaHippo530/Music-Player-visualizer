    var srH=lerp(210,225,nf),srS=lerp(50,25,nf),srL=lerp(55,12,nf);
    skyRefGrad.addColorStop(0,hsla(srH,srS,srL,0.25));
    skyRefGrad.addColorStop(1,hsla(srH,srS,srL,0));
    this._skyRefCache=skyRefGrad;
  }
  /* Draw water with wave-shaped surface edge */
  ctx.fillStyle=this._waterCache;
  ctx.beginPath();
  ctx.moveTo(0,h);
  ctx.lineTo(0,waterTop);
  for(var wx=0;wx<=w;wx+=4){
    var waveY=waterTop
      +Math.sin(t*1.5+wx*0.008)*3
      +Math.sin(t*2.3+wx*0.015)*2
      +Math.sin(t*0.7+wx*0.003)*4;
    ctx.lineTo(wx,waveY);
  }
  ctx.lineTo(w,h);
  ctx.closePath();ctx.fill();
  /* Sky reflection on wave surface */
  ctx.fillStyle=this._skyRefCache;
  ctx.beginPath();
  ctx.moveTo(0,waterTop);
  for(var wx2=0;wx2<=w;wx2+=4){
    var waveY2=waterTop
      +Math.sin(t*1.5+wx2*0.008)*3
      +Math.sin(t*2.3+wx2*0.015)*2
      +Math.sin(t*0.7+wx2*0.003)*4;
    ctx.lineTo(wx2,waveY2);
  }
  ctx.lineTo(w,waterTop+waterH*0.25);
  ctx.lineTo(0,waterTop+waterH*0.25);
  ctx.closePath();ctx.fill();
  /* Wave crest highlights */
  ctx.strokeStyle=hsla(200,30,75,0.08+nf*0.04);
  ctx.lineWidth=1;
  ctx.beginPath();
  for(var wx3=0;wx3<=w;wx3+=4){
    var waveY3=waterTop
      +Math.sin(t*1.5+wx3*0.008)*3
      +Math.sin(t*2.3+wx3*0.015)*2
      +Math.sin(t*0.7+wx3*0.003)*4;
    if(wx3===0)ctx.moveTo(wx3,waveY3);
    else ctx.lineTo(wx3,waveY3);
  }
  ctx.stroke();
  /* Secondary wave line (smaller, offset) */
  ctx.strokeStyle=hsla(210,20,65,0.05+nf*0.02);
  ctx.beginPath();
  for(var wx4=0;wx4<=w;wx4+=4){
    var waveY4=waterTop+6
      +Math.sin(t*1.8+wx4*0.01+2)*2.5
      +Math.sin(t*2.6+wx4*0.018+1)*1.5
      +Math.sin(t*0.9+wx4*0.004+3)*3;
    if(wx4===0)ctx.moveTo(wx4,waveY4);
    else ctx.lineTo(wx4,waveY4);
  }
  ctx.stroke();

  /* Shore/river bank */
  var bankH=Math.min(12,waterH*0.08);
  var bankGrad=ctx.createLinearGradient(0,waterTop-bankH,0,waterTop+4);
  var bankL=lerp(55,15,nf);
  bankGrad.addColorStop(0,hsl(35,lerp(25,10,nf),bankL));
  bankGrad.addColorStop(1,hsla(30,lerp(30,15,nf),bankL-5,0));
  ctx.fillStyle=bankGrad;
  ctx.fillRect(0,waterTop-bankH,w,bankH+4);
  /* Bank edge detail (follows wave) */
  ctx.fillStyle=hsla(30,lerp(30,15,nf),bankL-8,0.4);
  ctx.beginPath();
  for(var wx5=0;wx5<=w;wx5+=4){
    var waveY5=waterTop
      +Math.sin(t*1.5+wx5*0.008)*3
      +Math.sin(t*2.3+wx5*0.015)*2
      +Math.sin(t*0.7+wx5*0.003)*4;
    if(wx5===0)ctx.moveTo(wx5,waveY5);
    else ctx.lineTo(wx5,waveY5);
  }
  ctx.lineTo(w,waterTop+2);
  ctx.lineTo(0,waterTop+2);
  ctx.closePath();ctx.fill();

  for(var li=0;li<5;li++){
    this._drawWaterReflection(li,waterTop,waterH,nf,t);
  }

  this._drawSunMoonReflection(waterTop,waterH,nf,t);

  this._drawWaterRipples(waterTop,waterH,nf,t);

  this._drawWaterSparkles(waterTop,waterH,nf,t);

  this.drawBoats(waterTop,waterH);

  if(nf>0.3){
    var fogA=clamp((nf-0.3)*0.15,0,0.12);
    fogA+=this._getFogExtra();
    if(fogA>0.005){
      ctx.fillStyle=hsla(210,20,70,fogA);
      ctx.fillRect(0,waterTop,w,waterH);
    }
    for(var fi=0;fi<this.waterWisps.length;fi++){
      var fw=this.waterWisps[fi];
      fw.x+=fw.speed*0.001;
      if(fw.x>1.2)fw.x=-0.2;
      var fx=fw.x*w,fy=waterTop+fw.y*waterH;
      ctx.fillStyle=hsla(210,15,65,fogA*0.8);
      ctx.fillRect(fx,fy,fw.w,8);
    }
  }

  var isRain=this.currentWeather==="rain"||this.currentWeather==="heavy_rain"||
    this.currentWeather==="light_rain"||this.currentWeather==="drizzle"||
    this.currentWeather==="thunderstorm"||this.currentWeather==="sleet"||
    this.currentWeather==="freezing_rain"||this.currentWeather==="hail";
  if(isRain||this.prevWeather==="rain"||this.prevWeather==="heavy_rain"||
    this.prevWeather==="light_rain"||this.prevWeather==="drizzle"||
    this.prevWeather==="thunderstorm"){
    this._drawSplashDots(waterTop,waterH);
  }
};



P._drawWaterReflection=function(li,waterTop,waterH,nf,t){
  var L=LAYERS[li];
  var alpha=lerp(0.15,0.4,li/4)*(0.5+nf*0.3);
  var scrollOff=this.frameCount*L.scrollMul*0.3;
  var w=this.W;
  var groundY=this.H*L.groundFrac;
  var wrapW=L.wrapW||1000;
  for(var i=0;i<L.buildings.length;i++){
    var b=L.buildings[i];
    var bx=b.x-scrollOff%wrapW;
    while(bx+b.w<-50)bx+=wrapW;
    while(bx>w+50)bx-=wrapW;
    if(bx+b.w<-50||bx>w+50)continue;
    var refY=waterTop+(waterTop-(groundY-b.h))*0.15+waterH*0.05;
    var waveOff=Math.sin(t*2+bx*0.01)*3+Math.sin(t*3+bx*0.02)*2+Math.sin(t*1.5+bx*0.005)*4;
    var ry=refY+waveOff;
    if(ry>waterTop&&ry<this.H){
      ctx.globalAlpha=alpha;
      ctx.fillStyle=nf>0.5?hsl(230,15,8):hsl(210,20,35);
      var rh=Math.min(b.h*0.3,this.H-ry);
      ctx.fillRect(bx,ry,b.w,Math.max(1,rh));
      ctx.globalAlpha=1;
    }
  }
};



P._drawSunMoonReflection=function(waterTop,waterH,nf,t){
  var w=this.W;
  if(nf<0.7&&this._sunX>0&&this._sunX<w){
    var sunA=clamp(1-nf*1.5,0,1)*0.2;
    var shimmerX=this._sunX+Math.sin(t*2)*15;
    var sKey=Math.round(shimmerX)+"|"+Math.round(sunA*100);
    if(this._sunRefCacheKey!==sKey){
      this._sunRefCacheKey=sKey;
      var grad=ctx.createLinearGradient(shimmerX-40,0,shimmerX+40,0);
      grad.addColorStop(0,hsla(45,100,80,0));
      grad.addColorStop(0.5,hsla(45,100,80,sunA));
      grad.addColorStop(1,hsla(45,100,80,0));
      this._sunRefCache=grad;
    }
    ctx.fillStyle=this._sunRefCache;
    ctx.fillRect(shimmerX-40,waterTop,80,waterH*0.6);
  }
  if(nf>0.4&&this._moonX>0&&this._moonX<w){
    var moonA=clamp((nf-0.4)*0.8,0,0.15);
    var mx=this._moonX+Math.sin(t*1.5)*10;
    var mKey=Math.round(mx)+"|"+Math.round(moonA*100);
    if(this._moonRefCacheKey!==mKey){
      this._moonRefCacheKey=mKey;
      var mGrad=ctx.createLinearGradient(mx-30,0,mx+30,0);
      mGrad.addColorStop(0,hsla(220,30,80,0));
      mGrad.addColorStop(0.5,hsla(220,30,80,moonA));
      mGrad.addColorStop(1,hsla(220,30,80,0));
      this._moonRefCache=mGrad;
    }
    ctx.fillStyle=this._moonRefCache;
    ctx.fillRect(mx-30,waterTop,60,waterH*0.5);
  }
};



P._drawWaterRipples=function(waterTop,waterH,nf,t){
  var w=this.W;
  /* Background wave lines (subtle) */
  ctx.strokeStyle=hsla(210,20,55,0.06+nf*0.03);
  ctx.lineWidth=1;
  var isRain=this._isRainyWeather();
  var waveCount=isRain?18:12;
  for(var i=0;i<waveCount;i++){
    var ry=waterTop+(i/waveCount)*waterH;
    var waveY=ry+Math.sin(t*2+i*0.7)*2+Math.sin(t*3+i*1.1)*1.5;
    ctx.beginPath();
    ctx.moveTo(0,waveY);
    for(var x=0;x<w;x+=20){
      ctx.lineTo(x,waveY+Math.sin(t*2+x*0.02+i)*2);
    }
    ctx.stroke();
  }
  /* Expanding random-shaped ripples */
  for(var r=0;r<this.ripples.length;r++){
    var rp=this.ripples[r];
    rp.age+=rp.speed;
    if(rp.age>=rp.maxAge){
      this.ripples[r]=this._newRipple();
      continue;
    }
    var progress=rp.age/rp.maxAge;
    var alpha=Math.sin(progress*Math.PI)*0.15;
    if(alpha<0.01)continue;
    var rx=rp.x*w;
    var ry=waterTop+rp.y*waterH+Math.sin(t+rp.phase)*1.5;
    var radius=rp.maxR*progress;
    var ripH=nf>0.5?210:195;
    var ripS=nf>0.5?15:30;
    var ripL=nf>0.5?50:70;
    ctx.strokeStyle=hsla(ripH,ripS,ripL,alpha);
    ctx.lineWidth=0.8;
    /* Draw two concentric rings per ripple */
    for(var ring=0;ring<2;ring++){
      var rr=radius*(ring===0?1:0.65);
      var ra=alpha*(ring===0?1:0.6);
      ctx.strokeStyle=hsla(ripH,ripS,ripL,ra);
      ctx.beginPath();
      switch(rp.shape){
        case 0:/* Circle */
          ctx.arc(rx,ry,Math.max(1,rr),0,Math.PI*2);
          break;
        case 1:/* Wide ellipse */
          ctx.ellipse(rx,ry,Math.max(1,rr*1.5),Math.max(1,rr*0.6),Math.sin(t*0.5+rp.phase)*0.2,0,Math.PI*2);
          break;
        case 2:/* Tall ellipse */
          ctx.ellipse(rx,ry,Math.max(1,rr*0.5),Math.max(1,rr*1.4),Math.cos(t*0.3+rp.phase)*0.3,0,Math.PI*2);
          break;
        case 3:/* Diamond/square rotated */
          var d=rr;
          var rot=Math.sin(t*0.2+rp.phase)*0.15;
          var dx1=Math.cos(rot)*d,dy1=Math.sin(rot)*d;
          var dx2=Math.cos(rot+Math.PI/2)*d,dy2=Math.sin(rot+Math.PI/2)*d;
          ctx.moveTo(rx,ry-dy1);
          ctx.lineTo(rx+dx1,ry);
          ctx.lineTo(rx,ry+dy1);
          ctx.lineTo(rx-dx1,ry);
          ctx.closePath();
          break;
      }
      ctx.stroke();
    }
  }
  /* Rain creates extra circular splashes */
  if(isRain){
    var splashAlpha=0.1+nf*0.05;
    ctx.strokeStyle=hsla(210,15,60,splashAlpha);
    ctx.lineWidth=0.5;
    for(var si=0;si<6;si++){
      var sx=(Math.sin(t*7+si*2.3)*0.5+0.5)*w;
      var sy=waterTop+randf(0.1,0.9)*waterH;
      var sr=2+Math.sin(t*5+si*1.7)*3;
      if(sr>0.5){
        ctx.beginPath();ctx.arc(sx,sy,sr,0,Math.PI*2);ctx.stroke();
      }
    }
  }
};



P._drawWaterSparkles=function(waterTop,waterH,nf,t){
  var w=this.W,h=this.H;
  for(var i=0;i<this.sparkles.length;i++){
    var s=this.sparkles[i];
    var sx=s.x*w,sy=waterTop+s.y*waterH;
    var twinkle=Math.sin(t*s.speed*3+s.phase);
    if(Math.abs(twinkle)<0.6)continue;
    var a=Math.abs(twinkle)*0.8;
    if(nf>0.5){
      ctx.fillStyle=hsla(40,90,70,a*0.6);
      ctx.fillRect(sx-1,sy,3,3);
      ctx.fillStyle=hsla(40,80,60,a*0.3);
      ctx.fillRect(sx-2,sy-2,5,1);ctx.fillRect(sx-2,sy-2,1,5);
      ctx.fillRect(sx+2,sy-2,1,5);ctx.fillRect(sx-2,sy+2,5,1);
    }else{
      ctx.fillStyle=hsla(0,0,100,a*0.9);
      var ss=s.size;
      ctx.fillRect(sx-1,sy-ss,2,ss*2);
      ctx.fillRect(sx-ss,sy-1,ss*2,2);
      ctx.fillStyle=hsla(0,0,100,a*0.3);
      ctx.fillRect(sx-ss-1,sy-ss-1,ss*2+2,ss*2+2);
    }
  }
};



/* Flagship ships sailing across waters */
P._drawShips=function(){
  var w=this.W,h=this.H;
  this._shipTimer--;
  /* Only 1 cruise allowed at a time; flagships limited to 2 */
  var cruiseCount=0,flagCount=0;
  for(var ci=0;ci<this._ships.length;ci++){if(this._ships[ci].shipType==="cruise")cruiseCount++;else flagCount++}
  var maxCruise=1,maxFlag=2;
  if(this._shipTimer<=0&&this._ships.length<(cruiseCount<maxCruise?maxCruise+maxFlag:maxFlag)){
    /* Diversified tracks: ships follow water surface with varied paths */
    var waterBaseY=h*0.72;
    var trackType=randi(0,3);/* 0=straight, 1=gentle curve, 2=diagonal, 3=meandering */
    var dir=Math.random()<0.5?1:-1;/* direction: left-to-right or right-to-left */
    var startY=waterBaseY+randf(-3,1);
    var shipType=Math.random()<0.35?"cruise":"flagship";
    var sz=shipType==="cruise"?randf(1.8,2.4):randf(1.1,1.6);
    var shipData={
      x:dir>0?-220:w+220,
      y:startY+(shipType==="cruise"?randf(2,8):0),
      speed:(shipType==="cruise"?randf(0.12,0.25):randf(0.2,0.4))*dir,
      sailPhase:randf(0,6),
      size:sz,
      opacity:0,
      trackType:trackType,
      baseY:startY,
      trackPhase:randf(0,6),
      waveBob:randf(0,6),
      dir:dir,
      shipType:shipType,
      phase:randf(0,Math.PI*2)
    };
    this._ships.push(shipData);
    this._shipTimer=randi(2500,6000);
  }
  for(var i=this._ships.length-1;i>=0;i--){
    var sh=this._ships[i];
    sh.x+=sh.speed;
    /* Water surface wave bobbing */
    var waveOff=Math.sin(this.frameCount*0.008+sh.waveBob)*3;
    var trackOff=0;
    /* Diversified track patterns */
    switch(sh.trackType){
      case 1:/* Gentle sine curve */
        trackOff=Math.sin(sh.x*0.003+sh.trackPhase)*12;
        break;
      case 2:/* Diagonal traverse */
        trackOff=(sh.x/w)*-8*sh.dir;
        break;
      case 3:/* Meandering */
        trackOff=Math.sin(sh.x*0.005+sh.trackPhase)*8+Math.cos(sh.x*0.002+sh.trackPhase*2)*5;
        break;
    }
    sh.y=sh.baseY+trackOff+waveOff;
    /* Fade in/out at screen edges */
    var fadeW=80;
    sh.opacity=sh.dir>0?
      (sh.x<fadeW?sh.x/fadeW:(sh.x>w-fadeW?(w-sh.x)/fadeW:1)):
      (sh.x>w-fadeW?(w-sh.x)/fadeW:(sh.x<fadeW?sh.x/fadeW:1));
    if(sh.dir>0&&sh.x>w+200){this._ships.splice(i,1);continue}
    if(sh.dir<0&&sh.x<-200){this._ships.splice(i,1);continue}
    if(sh.opacity<=0.01)continue;
    ctx.save();
    ctx.globalAlpha=clamp(sh.opacity,0,1);
    var sx=Math.floor(sh.x),sy=Math.floor(sh.y);
    var sc=sh.size;
    if(sh.shipType==="cruise"){this._drawCruiseShip(sx,sy,sc,sh)}
    else{this._drawFlagship(sx,sy,sc,sh)}
    ctx.restore();
  }
};

/* ── Spanish Galleon Flagship ── */
P._drawFlagship=function(sx,sy,sc,sh){
  var fc=this.frameCount;
  var wl=sy;
  /* Flip horizontally when traveling right (bow faces forward) */
  if(sh.dir>0){ctx.save();ctx.translate(sx*2,sy);ctx.scale(-1,1)}
  var bowTip=sx-70*sc;
  var sternEnd=sx+55*sc;
  var hullBot=wl+8*sc;
  var mainDeck=wl-3*sc;
  /* ── Lower hull (dark wood below waterline) ── */
  ctx.fillStyle=hsl(15,45,18);
  ctx.beginPath();
  ctx.moveTo(bowTip+15*sc,wl);
  ctx.quadraticCurveTo(bowTip+5*sc,wl+3*sc,bowTip,wl+6*sc);
  ctx.lineTo(bowTip,hullBot);
  ctx.lineTo(sternEnd,hullBot);
  ctx.lineTo(sternEnd,wl+6*sc);
  ctx.quadraticCurveTo(sternEnd-3*sc,wl+3*sc,sternEnd-5*sc,wl);
  ctx.closePath();ctx.fill();
  /* Hull planking lines */
  ctx.strokeStyle=hsla(20,35,15,0.4);ctx.lineWidth=0.5;
  for(var pl=0;pl<3;pl++){
    ctx.beginPath();ctx.moveTo(bowTip+5*sc,wl+2*sc+pl*2.5*sc);
    ctx.lineTo(sternEnd-2*sc,wl+2*sc+pl*2.5*sc);ctx.stroke();
  }
  /* ── Upper hull (warm brown wood) ── */
  ctx.fillStyle=hsl(25,50,28);
  ctx.beginPath();
  ctx.moveTo(bowTip+10*sc,wl);
  ctx.lineTo(bowTip+5*sc,mainDeck);
  ctx.lineTo(sternEnd-5*sc,mainDeck);
  ctx.lineTo(sternEnd-5*sc,wl);
  ctx.closePath();ctx.fill();
  /* ── Stern castle (high ornate structure) ── */
  var sternH=28*sc;
  var sternTop=mainDeck-sternH;
  ctx.fillStyle=hsl(22,48,30);
  ctx.fillRect(sternEnd-18*sc,sternTop,15*sc,sternH);
  /* Stern gallery windows (3 tiers) */
  for(var st=0;st<3;st++){
    var stY=sternTop+4*sc+st*8*sc;
    ctx.fillStyle=hsla(40,70,55,0.6);
    ctx.fillRect(sternEnd-16*sc,stY,4*sc,3*sc);
    ctx.fillRect(sternEnd-11*sc,stY,4*sc,3*sc);
    ctx.fillRect(sternEnd-6*sc,stY,4*sc,3*sc);
  }
  /* Stern decorative railing */
  ctx.strokeStyle=hsla(40,60,50,0.5);ctx.lineWidth=Math.max(0.5,0.8*sc);
  ctx.beginPath();ctx.moveTo(sternEnd-18*sc,sternTop);ctx.lineTo(sternEnd-3*sc,sternTop);ctx.stroke();
  /* Gold stern accent */
  ctx.fillStyle=hsla(42,75,50,0.5);
  ctx.fillRect(sternEnd-17*sc,sternTop-1*sc,14*sc,2*sc);
  /* ── Bow castle (forecastle, lower) ── */
  var fcTop=mainDeck-8*sc;
  ctx.fillStyle=hsl(24,46,30);
  ctx.fillRect(bowTip+5*sc,fcTop,18*sc,8*sc);
  /* Bowsprit (extends forward from bow) */
  ctx.strokeStyle=hsl(20,40,25);ctx.lineWidth=Math.max(1,1.2*sc);
  ctx.beginPath();ctx.moveTo(bowTip+8*sc,mainDeck-2*sc);ctx.lineTo(bowTip-12*sc,mainDeck-10*sc);ctx.stroke();
  /* Beakhead decoration */
  ctx.strokeStyle=hsla(40,55,45,0.4);ctx.lineWidth=Math.max(0.5,0.6*sc);
  ctx.beginPath();ctx.arc(bowTip+2*sc,mainDeck-4*sc,3*sc,Math.PI*0.2,Math.PI*0.8);ctx.stroke();
  /* ── Gunports (10 along the side) ── */
  ctx.fillStyle=hsl(10,30,12);
  for(var gp=0;gp<10;gp++){
    var gpX=bowTip+18*sc+gp*4.5*sc;
    if(gpX<sternEnd-20*sc){
      ctx.fillRect(gpX,wl-2*sc,2.5*sc,2.5*sc);
    }
  }
  /* ── Three masts with square sails ── */
  var masts=[{x:sx-30*sc,h:48*sc,sailW:16*sc,sailH:12*sc,topW:10*sc,topH:8*sc},
             {x:sx+5*sc,h:55*sc,sailW:18*sc,sailH:14*sc,topW:12*sc,topH:9*sc},
             {x:sx+35*sc,h:40*sc,sailW:14*sc,sailH:10*sc,topW:9*sc,topH:7*sc}];
  for(var mi=0;mi<masts.length;mi++){
    var m=masts[mi];
    var mastBot=mainDeck;
    var mastTop=mastBot-m.h;
    /* Mast pole */
    ctx.strokeStyle=hsl(20,35,22);ctx.lineWidth=Math.max(1,1.5*sc);
    ctx.beginPath();ctx.moveTo(m.x,mastBot);ctx.lineTo(m.x,mastTop);ctx.stroke();
    /* Yard arms (horizontal spars) */
    ctx.strokeStyle=hsl(20,30,25);ctx.lineWidth=Math.max(0.5,1*sc);
    /* Lower yard */
    var lowerY=mastBot-m.h*0.55;
    ctx.beginPath();ctx.moveTo(m.x-m.sailW*0.5,lowerY);ctx.lineTo(m.x+m.sailW*0.5,lowerY);ctx.stroke();
    /* Upper yard */
    var upperY=mastBot-m.h*0.8;
    ctx.beginPath();ctx.moveTo(m.x-m.topW*0.5,upperY);ctx.lineTo(m.x+m.topW*0.5,upperY);ctx.stroke();
    /* Lower sail (dramatically billowing white) */
    var windT=Math.sin(fc*0.025+sh.sailPhase+mi*0.7)*0.7+Math.sin(fc*0.04+mi*1.3)*0.5+Math.sin(fc*0.008+sh.sailPhase*2)*0.4;
    var gust=Math.max(0,Math.sin(fc*0.06+sh.sailPhase+mi*2.1))*1.2;
    var billow=(windT+gust)*5*sc;
    ctx.fillStyle=hsla(40,8,95,0.92);
    ctx.beginPath();
    ctx.moveTo(m.x-m.sailW*0.5,lowerY);
    ctx.bezierCurveTo(m.x-m.sailW*0.2,lowerY-m.sailH*0.3+billow*0.3,
      m.x+m.sailW*0.1,lowerY-m.sailH*0.5+billow*0.6,
      m.x+billow,lowerY-m.sailH*0.7);
    ctx.bezierCurveTo(m.x+m.sailW*0.4,lowerY-m.sailH*0.5+billow*0.5,
      m.x+m.sailW*0.5,lowerY-m.sailH*0.15,
      m.x+m.sailW*0.5,lowerY);
    ctx.lineTo(m.x+m.sailW*0.45,lowerY-m.sailH*0.12);
    ctx.bezierCurveTo(m.x+m.sailW*0.3,lowerY-m.sailH*0.4+billow*0.35,
      m.x-m.sailW*0.1,lowerY-m.sailH*0.45+billow*0.2,
      m.x-m.sailW*0.45,lowerY-m.sailH*0.12);
    ctx.closePath();ctx.fill();
    /* Sail shadow fold */
    ctx.strokeStyle=hsla(0,0,70,0.15);ctx.lineWidth=0.5;
    ctx.beginPath();ctx.moveTo(m.x+billow*0.4,lowerY-m.sailH*0.65);ctx.lineTo(m.x+billow*0.35,lowerY-m.sailH*0.1);ctx.stroke();
    /* Upper topsail (dramatically billowing white) */
    var windT2=Math.sin(fc*0.03+sh.sailPhase+mi*0.9+1)*0.6+Math.sin(fc*0.05+mi*1.1)*0.4+Math.sin(fc*0.01+sh.sailPhase*2+0.5)*0.3;
    var gust2=Math.max(0,Math.sin(fc*0.07+sh.sailPhase+mi*1.8+1))*0.9;
    var billow2=(windT2+gust2)*4*sc;
    ctx.fillStyle=hsla(40,6,94,0.88);
    ctx.beginPath();
    ctx.moveTo(m.x-m.topW*0.5,upperY);
    ctx.bezierCurveTo(m.x-m.topW*0.2,upperY-m.topH*0.3+billow2*0.3,
      m.x+m.topW*0.1,upperY-m.topH*0.55+billow2*0.5,
      m.x+billow2,upperY-m.topH*0.7);
    ctx.bezierCurveTo(m.x+m.topW*0.4,upperY-m.topH*0.45+billow2*0.4,
      m.x+m.topW*0.5,upperY-m.topH*0.12,
      m.x+m.topW*0.5,upperY);
    ctx.lineTo(m.x+m.topW*0.45,upperY-m.topH*0.1);
    ctx.bezierCurveTo(m.x+m.topW*0.3,upperY-m.topH*0.35+billow2*0.3,
      m.x-m.topW*0.1,upperY-m.topH*0.4+billow2*0.15,
      m.x-m.topW*0.45,upperY-m.topH*0.1);
    ctx.closePath();ctx.fill();
    ctx.strokeStyle=hsla(0,0,70,0.12);ctx.lineWidth=0.5;
    ctx.beginPath();ctx.moveTo(m.x+billow2*0.35,upperY-m.topH*0.6);ctx.lineTo(m.x+billow2*0.3,upperY-m.topH*0.08);ctx.stroke();
  }
  /* ── Rigging lines ── */
  ctx.strokeStyle=hsla(25,15,50,0.2);ctx.lineWidth=0.5;
  /* Forestay (bow to foremast) */
  ctx.beginPath();ctx.moveTo(bowTip-8*sc,mainDeck-8*sc);ctx.lineTo(masts[0].x,mainDeck-masts[0].h*0.8);ctx.stroke();
  /* Shrouds (mast stays) */
  for(var ri=0;ri<masts.length;ri++){
    ctx.beginPath();ctx.moveTo(masts[ri].x-4*sc,mainDeck-masts[ri].h*0.9);ctx.lineTo(masts[ri].x,mainDeck-masts[ri].h);ctx.stroke();
    ctx.beginPath();ctx.moveTo(masts[ri].x+4*sc,mainDeck-masts[ri].h*0.9);ctx.lineTo(masts[ri].x,mainDeck-masts[ri].h);ctx.stroke();
  }
  /* ── Flag at mainmast top ── */
  var flagX=masts[1].x;
  var flagY=mainDeck-masts[1].h;
  var flagWave=Math.sin(fc*0.03+sh.sailPhase)*2.5*sc;
  ctx.fillStyle=hsl(0,70,45);
  ctx.beginPath();ctx.moveTo(flagX,flagY);ctx.lineTo(flagX+8*sc+flagWave,flagY+2*sc);ctx.lineTo(flagX,flagY+4*sc);ctx.closePath();ctx.fill();
  /* ── V-wake ── */
  var wD=sh.dir;
  ctx.strokeStyle=hsla(210,25,75,0.2);ctx.lineWidth=Math.max(0.5,0.7);
  ctx.beginPath();ctx.moveTo(bowTip,wl+4*sc);
  ctx.quadraticCurveTo(bowTip-25*sc*(-wD),wl+12*sc,bowTip-50*sc*(-wD),wl+10*sc);ctx.stroke();
  ctx.beginPath();ctx.moveTo(bowTip,wl+4*sc);
  ctx.quadraticCurveTo(bowTip-25*sc*(-wD),wl+16*sc,bowTip-50*sc*(-wD),wl+18*sc);ctx.stroke();
  /* Bow foam */
  ctx.fillStyle=hsla(200,20,88,0.15*sh.opacity);
  for(var fi=0;fi<4;fi++){
    ctx.beginPath();ctx.arc(bowTip-3*(-wD)-fi*3*sc,wl+1*sc+Math.sin(fc*0.03+fi)*1.5,1.2*sc,0,Math.PI*2);ctx.fill();
  }
  if(sh.dir>0)ctx.restore();
};

/* ── Modern Cruise Liner (twin-funnel) ── */
P._drawCruiseShip=function(sx,sy,sc,sh){
  var fc=this.frameCount;
  var wl=sy;
  /* Flip horizontally when traveling right (bow faces forward) */
  if(sh.dir>0){ctx.save();ctx.translate(sx*2,sy);ctx.scale(-1,1)}
  var bowTip=sx-80*sc;
  var sternBack=sx+65*sc;
  var hullDepth=9*sc;
  var hullBot=wl+hullDepth;
  var mainDeck=wl-3*sc;
  /* ─── Lower hull (navy blue below waterline) ─── */
  ctx.fillStyle=hsl(215,50,16);
  ctx.beginPath();
  ctx.moveTo(bowTip+22*sc,wl);
  ctx.quadraticCurveTo(bowTip+10*sc,wl+2*sc,bowTip,wl+5*sc);
  ctx.lineTo(bowTip,hullBot);ctx.lineTo(sternBack,hullBot);
  ctx.lineTo(sternBack,wl+5*sc);
  ctx.quadraticCurveTo(sternBack-4*sc,wl+2*sc,sternBack-8*sc,wl);
  ctx.closePath();ctx.fill();
  /* ─── Upper hull (white) ─── */
  ctx.fillStyle=hsl(0,0,88);
  ctx.beginPath();
  ctx.moveTo(bowTip+18*sc,wl);
  ctx.lineTo(bowTip+8*sc,mainDeck);
  ctx.lineTo(sternBack-8*sc,mainDeck);
  ctx.lineTo(sternBack-8*sc,wl);
  ctx.closePath();ctx.fill();
  /* Red boot-topping stripe */
  ctx.strokeStyle=hsl(8,55,38);ctx.lineWidth=Math.max(1,1.5*sc);
  ctx.beginPath();ctx.moveTo(bowTip+10*sc,wl+0.5*sc);ctx.lineTo(sternBack-8*sc,wl+0.5*sc);ctx.stroke();
  /* ─── 8 passenger decks with balcony windows ─── */
  var deckCount=8;
  var deckH=5.5*sc;
  var baseLeft=bowTip+8*sc;
  var baseRight=sternBack-10*sc;
  for(var di=0;di<deckCount;di++){
    var taper=di*0.8*sc;
    var dLeft=baseLeft+taper;
    var dRight=baseRight-taper*0.4;
    var dBot=mainDeck-di*deckH;
    var dTop=dBot-deckH;
    /* Solid deck band */
    ctx.fillStyle=hsl(0,0,87);
    ctx.fillRect(dLeft,dTop,dRight-dLeft,deckH);
    /* Deck shadow separation */
    ctx.fillStyle=hsla(0,0,40,0.1);
    ctx.fillRect(dLeft,dBot-0.5,dRight-dLeft,1);
    /* Lower decks: porthole windows — solid warm glow */
    if(di<2){
      var pSp=4.5*sc;
      for(var px=dLeft+3*sc;px<dRight-2*sc;px+=pSp){
        ctx.fillStyle=hsla(45,70,60,0.55);
        ctx.beginPath();ctx.arc(px,dTop+deckH*0.5,1*sc,0,Math.PI*2);ctx.fill();
      }
    }
    /* Middle decks: balcony windows — solid warm lit */
    if(di>=2&&di<6){
      var wSp=3.5*sc;
      var wW=2.2*sc;
      var wH=deckH*0.65;
      for(var wx=dLeft+2*sc;wx<dRight-1.5*sc;wx+=wSp){
        /* Window frame */
        ctx.fillStyle=hsla(0,0,55,0.3);
        ctx.fillRect(wx,dTop+1,wW,wH);
        /* Solid warm lit interior */
        ctx.fillStyle=hsla(45,65,58,0.55);
        ctx.fillRect(wx+0.3*sc,dTop+1.3*sc,wW-0.6*sc,wH-0.6*sc);
      }
      /* Railing */
      ctx.strokeStyle=hsla(0,0,70,0.35);ctx.lineWidth=Math.max(0.5,0.4*sc);
      ctx.beginPath();ctx.moveTo(dLeft,dTop+0.5);ctx.lineTo(dRight,dTop+0.5);ctx.stroke();
    }
    /* Upper decks: larger windows (public rooms) — solid warm lit */
    if(di>=6){
      var wSp2=5*sc;
      for(var wx2=dLeft+3*sc;wx2<dRight-3*sc;wx2+=wSp2){
        ctx.fillStyle=hsla(45,50,50,0.5);
        ctx.fillRect(wx2,dTop+1.5*sc,3.5*sc,deckH*0.5);
      }
    }
    /* Top deck railing */
    if(di===deckCount-1){
      ctx.strokeStyle=hsla(0,0,65,0.45);ctx.lineWidth=Math.max(0.5,0.5*sc);
      ctx.beginPath();ctx.moveTo(dLeft,dTop);ctx.lineTo(dRight,dTop);ctx.stroke();
    }
  }
  /* ─── Swimming pool (turquoise, upper deck amidships) ─── */
  var topDeckBase=mainDeck-deckCount*deckH;
  var poolX=sx-8*sc;
  var poolW=18*sc;
  var poolH=3*sc;
  var poolY=topDeckBase-poolH-1*sc;
  ctx.fillStyle=hsla(185,60,48,0.6);
  ctx.fillRect(poolX,poolY,poolW,poolH);
  ctx.strokeStyle=hsl(0,0,85);ctx.lineWidth=Math.max(0.5,0.5*sc);
  ctx.strokeRect(poolX,poolY,poolW,poolH);
  /* Sun deck loungers */
  ctx.fillStyle=hsla(45,65,55,0.4);
  for(var li=0;li<3;li++){
    ctx.fillRect(poolX-8*sc+li*4*sc,topDeckBase-1.5*sc,2.5*sc,1.2*sc);
  }
  for(var li=0;li<3;li++){
    ctx.fillRect(poolX+poolW+3*sc+li*4*sc,topDeckBase-1.5*sc,2.5*sc,1.2*sc);
  }
  /* ─── Bridge (forward, with angled windshield) ─── */
  var brLeft=sx-20*sc;
  var brRight=sx-2*sc;
  var brBot=topDeckBase-2*sc;
  var brTop=brBot-8*sc;
  ctx.fillStyle=hsl(0,0,85);
  ctx.fillRect(brLeft,brTop,brRight-brLeft,brBot-brTop);
  /* Angled windshield */
  ctx.fillStyle=hsla(200,45,55,0.5);
  ctx.beginPath();
  ctx.moveTo(brLeft,brTop);ctx.lineTo(brLeft+2*sc,brTop-2*sc);
  ctx.lineTo(brLeft+(brRight-brLeft)*0.7,brTop-2*sc);ctx.lineTo(brLeft+(brRight-brLeft)*0.65,brTop);
  ctx.closePath();ctx.fill();
  /* Bridge side windows */
  for(var bw=0;bw<5;bw++){
    ctx.fillStyle=hsla(200,40,55,0.4);
    ctx.fillRect(brLeft+3*sc+bw*2.8*sc,brTop+1.5*sc,2*sc,3*sc);
  }
  /* Bridge wings */
  ctx.fillStyle=hsl(0,0,83);
  ctx.fillRect(brLeft-3*sc,brTop+3*sc,4*sc,4*sc);
  ctx.fillRect(brRight-1*sc,brTop+3*sc,4*sc,4*sc);
  /* ─── TWIN FUNNELS (amidships) ─── */
  var fn1X=sx+10*sc;
  var fn2X=sx+22*sc;
  var fnW=5.5*sc;
  var fnH=13*sc;
  var fnBot=brBot+2*sc;
  var fnTop=fnBot-fnH;
  /* Funnel base deckhouse */
  ctx.fillStyle=hsl(0,0,83);
  ctx.fillRect(fn1X-12*sc,fnBot,fn2X-fn1X+24*sc,4*sc);
  /* Draw both funnels */
  var funnels=[{x:fn1X},{x:fn2X}];
  for(var fi=0;fi<2;fi++){
    var fnX2=funnels[fi].x;
    /* White funnel body */
    ctx.fillStyle=hsl(0,0,85);
    ctx.fillRect(fnX2-fnW*0.5,fnTop,fnW,fnH);
    /* Navy blue top cap */
    ctx.fillStyle=hsl(215,50,20);
    ctx.fillRect(fnX2-fnW*0.48,fnTop,fnW*0.96,fnH*0.25);
    /* Dark blue band */
    ctx.fillStyle=hsla(215,45,25,0.8);
    ctx.fillRect(fnX2-fnW*0.5,fnTop+fnH*0.7,fnW,fnH*0.08);
  }
  /* ─── Forward mast ─── */
  var mastX2=sx-12*sc;
  var mastTop2=brTop-16*sc;
  ctx.strokeStyle=hsl(0,0,30);ctx.lineWidth=Math.max(1,0.8*sc);
  ctx.beginPath();ctx.moveTo(mastX2,brTop);ctx.lineTo(mastX2,mastTop2);ctx.stroke();
  /* Radar dome */
  ctx.fillStyle=hsl(0,0,68);
  ctx.beginPath();ctx.ellipse(mastX2,mastTop2+4*sc,4*sc,2*sc,0,0,Math.PI*2);ctx.fill();
  /* Nav light */
  ctx.fillStyle=hsla(0,75,48,0.6+0.4*Math.sin(fc*0.06));
  ctx.beginPath();ctx.arc(mastX2,mastTop2,0.8*sc,0,Math.PI*2);ctx.fill();
  /* ─── Aft mast (tripod with antennas) ─── */
  var aftX=sx+35*sc;
  ctx.strokeStyle=hsl(0,0,35);ctx.lineWidth=Math.max(0.5,0.6*sc);
  ctx.beginPath();ctx.moveTo(aftX,brBot);ctx.lineTo(aftX,brBot-10*sc);ctx.stroke();
  ctx.beginPath();ctx.moveTo(aftX-2*sc,brBot-1*sc);ctx.lineTo(aftX,brBot-10*sc);ctx.stroke();
  ctx.beginPath();ctx.moveTo(aftX+2*sc,brBot-1*sc);ctx.lineTo(aftX,brBot-10*sc);ctx.stroke();
  /* Small radar */
  ctx.fillStyle=hsl(0,0,65);
  ctx.beginPath();ctx.ellipse(aftX,brBot-8*sc,2.5*sc,1.2*sc,0,0,Math.PI*2);ctx.fill();
  /* ─── Lifeboats (orange, on boat deck) ─── */
  var lbDeck=mainDeck-2*deckH;
  ctx.fillStyle=hsla(25,70,48,0.6);
  for(var li2=0;li2<6;li2++){
    var lbx=baseLeft+6*sc+li2*8*sc;
    if(lbx<baseRight-5*sc){
      ctx.beginPath();
      ctx.moveTo(lbx,lbDeck);ctx.lineTo(lbx+0.5*sc,lbDeck+1.8*sc);
      ctx.lineTo(lbx+3*sc,lbDeck+1.8*sc);ctx.lineTo(lbx+3.2*sc,lbDeck);
      ctx.closePath();ctx.fill();
    }
  }
  /* ─── Flat transom stern ─── */
  ctx.fillStyle=hsl(0,0,82);
  ctx.fillRect(sternBack-8*sc,mainDeck+1,3*sc,wl-mainDeck-1);
  /* ─── V-wake ─── */
  var wD2=sh.dir;
  ctx.strokeStyle=hsla(200,25,75,0.16);ctx.lineWidth=Math.max(0.5,0.5);
  ctx.beginPath();ctx.moveTo(sternBack,wl+4*sc);
  ctx.quadraticCurveTo(sternBack+18*sc*wD2,wl+12*sc,sternBack+40*sc*wD2,wl+10*sc);ctx.stroke();
  ctx.beginPath();ctx.moveTo(sternBack,wl+4*sc);
  ctx.quadraticCurveTo(sternBack+18*sc*wD2,wl+16*sc,sternBack+40*sc*wD2,wl+18*sc);ctx.stroke();
  /* Bow foam */
  ctx.fillStyle=hsla(200,18,88,0.12*sh.opacity);
  for(var fi2=0;fi2<4;fi2++){
    ctx.beginPath();ctx.arc(bowTip-2*sc-fi2*3*(-wD2),wl+1*sc+Math.sin(fc*0.03+fi2)*1.2*sc,1*sc,0,Math.PI*2);ctx.fill();
  }
  /* ─── DYNAMIC SMOKE from twin funnels ─── */
  var smokeBase=brTop-16*sc;
  for(var smi=0;smi<2;smi++){
    var smFnX=smi===0?fn1X:fn2X;
    for(var sp=0;sp<5;sp++){
      var age=((fc*0.015+sp*0.8+smi*3)%4);
      var smX=smFnX+age*sc*1.5+Math.sin(fc*0.01+sp*2+smi)*2*sc;
      var smY=smokeBase-age*sc*2.5-Math.sin(fc*0.008+sp)*sc;
      var smR=(2+age*2.5)*sc;
      var smA=clamp(0.12-age*0.03,0,0.12)*sh.opacity;
      ctx.fillStyle=hsla(0,0,75,smA);
      ctx.beginPath();ctx.arc(smX,smY,smR,0,Math.PI*2);ctx.fill();
    }
  }
  if(sh.dir>0)ctx.restore();
};

/* ═══ Ferris Wheel — modern observation wheel, parallax with layer 4 ═══ */
P.ferrisWheel=null;
P.ferrisWheelTimer=0;
P.ferrisWheelCooldown=0;

P.initFerrisWheel=function(){
  this.ferrisWheel=null;
  this.ferrisWheelTimer=0;
  this.ferrisWheelCooldown=600+Math.floor(Math.random()*1200);
};

P.updateFerrisWheel=function(){
  if(this.ferrisWheelCooldown>0){this.ferrisWheelCooldown--;return}
  if(!this.ferrisWheel){
    this.ferrisWheelTimer++;
    if(this.ferrisWheelTimer>800+Math.random()*600){
      var w=this.W,h=this.H;
      var groundY=h*0.72;
      var wheelR=Math.min(w,h)*0.12+Math.random()*Math.min(w,h)*0.04;
      this.ferrisWheel={
        x:w*(0.1+Math.random()*0.8),
        groundY:groundY,
        radius:wheelR,
        rotation:0,
        rotationSpeed:0.005,
        baseRotationSpeed:0.005,
        gondolaCount:16,
        opacity:0,
        fadeIn:true,
        fadeOut:false,
        lifeTimer:0,
        maxLife:2200+Math.floor(Math.random()*1500),
        spokes:16
      };
      this.ferrisWheelTimer=0;
    }
  }else{
    var fw=this.ferrisWheel;
    /* Slightly faster when music is playing */
    var energy=this._energy||0;
    fw.rotationSpeed=fw.baseRotationSpeed+energy*0.004;
    fw.rotation+=fw.rotationSpeed;
    fw.lifeTimer++;
    if(fw.fadeIn){
      fw.opacity=Math.min(fw.opacity+0.008,1);
      if(fw.opacity>=1)fw.fadeIn=false;
    }
    if(fw.lifeTimer>fw.maxLife){fw.fadeOut=true}
    if(fw.fadeOut){
      fw.opacity-=0.006;
      if(fw.opacity<=0){
        this.ferrisWheel=null;
        this.ferrisWheelCooldown=800+Math.floor(Math.random()*1200);
      }
    }
  }
};

P.drawFerrisWheel=function(){
  var fw=this.ferrisWheel;
  if(!fw||fw.opacity<=0)return;
  var w=this.W,h=this.H;
  var nf=this.nightFactor;
  var fc=this.frameCount;
  /* Parallax: scroll with layer 4 (scrollMul=0.5) */
  var scrollOff=fc*0.5*0.3;
  var wrapW=w*2.5;
  var cx=((fw.x-scrollOff)%wrapW+wrapW)%wrapW;
  if(cx<-200||cx>w+200)return;
  var gy=fw.groundY;
  var R=fw.radius;
  var rot=fw.rotation;
  var gondolas=fw.gondolaCount;
  var alpha=clamp(fw.opacity,0,1);
  ctx.save();
  ctx.globalAlpha=alpha;
  var hubY=gy-R;
  /* ─── A-FRAME SUPPORT STRUCTURE (bright white) ─── */
  var legSpread=R*0.52;
  var baseSpread=R*0.68;
  /* Main legs */
  ctx.strokeStyle=hsl(0,0,88);ctx.lineWidth=Math.max(3,R*0.05);
  ctx.beginPath();ctx.moveTo(cx-legSpread,hubY);ctx.lineTo(cx-baseSpread,gy);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx+legSpread,hubY);ctx.lineTo(cx+baseSpread,gy);ctx.stroke();
  /* Back legs (slightly offset for depth) */
  ctx.strokeStyle=hsl(0,0,82);ctx.lineWidth=Math.max(2,R*0.04);
  ctx.beginPath();ctx.moveTo(cx-legSpread*0.9,hubY+R*0.05);ctx.lineTo(cx-baseSpread*0.85,gy);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx+legSpread*0.9,hubY+R*0.05);ctx.lineTo(cx+baseSpread*0.85,gy);ctx.stroke();
  /* Lights along support legs */
  var legLightCount=6;
  for(var ll=0;ll<legLightCount;ll++){
    var llFrac=0.15+ll*0.12;
    var llY=hubY+(gy-hubY)*llFrac;
    var llX1=cx-legSpread*(0.52+0.18*llFrac);
    var llX2=cx+legSpread*(0.52+0.18*llFrac);
    var llBright=0.3+0.7*Math.sin(fc*0.04+ll*0.8);
    var llHue=(ll%2===0)?50:270;
    var llSz=R*0.012;
    ctx.fillStyle=hsla(llHue,80,70,llBright*alpha*clamp(nf,0,1)*0.7);
    ctx.beginPath();ctx.arc(llX1,llY,llSz,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(llX2,llY,llSz,0,Math.PI*2);ctx.fill();
    if(llBright>0.6){
      ctx.fillStyle=hsla(llHue,70,65,llBright*alpha*clamp(nf,0,1)*0.1);
      ctx.beginPath();ctx.arc(llX1,llY,llSz*3,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(llX2,llY,llSz*3,0,Math.PI*2);ctx.fill();
    }
  }
  /* ─── BASE PLATFORM with control station ─── */
  ctx.fillStyle=hsl(0,0,75);
  ctx.fillRect(cx-baseSpread-5,gy-3,baseSpread*2+10,6);
  /* Control station box */
  ctx.fillStyle=hsl(0,0,80);
  ctx.fillRect(cx-8,gy-8,16,6);
  ctx.fillStyle=hsla(40,20,70,0.3*nf);
  ctx.fillRect(cx-6,gy-7,4,3);
  ctx.fillRect(cx+2,gy-7,4,3);
  /* Steps */
  ctx.fillStyle=hsl(0,0,78);
  ctx.fillRect(cx+12,gy-4,3,1.5);
  ctx.fillRect(cx+15,gy-2.5,3,1.5);
  /* Railing */
  ctx.strokeStyle=hsla(0,0,55,0.35);ctx.lineWidth=Math.max(0.5,0.6);
  ctx.beginPath();ctx.moveTo(cx-baseSpread,gy-3);ctx.lineTo(cx+baseSpread,gy-3);ctx.stroke();
  /* ─── DOUBLE RIM (bright white) ─── */
  /* Outer rim glow at night */
  var rimGlow=nf*0.4;
  if(rimGlow>0.05){
    ctx.strokeStyle=hsla(270,50,70,rimGlow*alpha);
    ctx.lineWidth=R*0.08;
    ctx.beginPath();ctx.arc(cx,hubY,R,0,Math.PI*2);ctx.stroke();
  }
  /* Outer rim (white) */
  ctx.strokeStyle=hsl(0,0,92);ctx.lineWidth=Math.max(3,R*0.045);
  ctx.beginPath();ctx.arc(cx,hubY,R,0,Math.PI*2);ctx.stroke();
  /* Inner structural ring */
  ctx.strokeStyle=hsl(0,0,85);ctx.lineWidth=Math.max(1.5,R*0.025);
  ctx.beginPath();ctx.arc(cx,hubY,R*0.88,0,Math.PI*2);ctx.stroke();
  /* ─── 16 SPOKES (bicycle-wheel pattern) ─── */
  var spokes=16;
  for(var si=0;si<spokes;si++){
    var angle=rot+si*(Math.PI*2/spokes);
    var ex=cx+Math.cos(angle)*R;
    var ey=hubY+Math.sin(angle)*R;
    ctx.strokeStyle=hsl(0,0,88);ctx.lineWidth=Math.max(1.5,R*0.02);
    ctx.beginPath();ctx.moveTo(cx,hubY);ctx.lineTo(ex,ey);ctx.stroke();
    /* Spoke lights at night */
    if(nf>0.2){
      var spokeMid=R*0.45;
      var smx=cx+Math.cos(angle)*spokeMid;
      var smy=hubY+Math.sin(angle)*spokeMid;
      var smB=0.4+0.6*Math.sin(fc*0.05+si*0.9);
      var smH=(si%3===0)?50:(si%3===1)?270:0;
      ctx.fillStyle=hsla(smH,85,70,clamp(nf,0,1)*smB*alpha*0.8);
      ctx.beginPath();ctx.arc(smx,smy,R*0.01,0,Math.PI*2);ctx.fill();
    }
    var ix=cx+Math.cos(angle)*R*0.88;
    var iy=hubY+Math.sin(angle)*R*0.88;
    ctx.strokeStyle=hsl(0,0,82);ctx.lineWidth=Math.max(1,R*0.015);
    ctx.beginPath();ctx.moveTo(cx,hubY);ctx.lineTo(ix,iy);ctx.stroke();
    /* Cross-brace to mid-point of next spoke */
    var midX=cx+Math.cos(angle)*R*0.5;
    var midY=hubY+Math.sin(angle)*R*0.5;
    var nAngle=rot+(si+1)*(Math.PI*2/spokes);
    var nMidX=cx+Math.cos(nAngle)*R*0.5;
    var nMidY=hubY+Math.sin(nAngle)*R*0.5;
    ctx.strokeStyle=hsl(0,0,80);ctx.lineWidth=Math.max(0.5,R*0.01);
    ctx.beginPath();ctx.moveTo(midX,midY);ctx.lineTo(nMidX,nMidY);ctx.stroke();
  }
  /* ─── HUB (bright white, concentric) ─── */
  ctx.fillStyle=hsl(0,0,90);
  ctx.beginPath();ctx.arc(cx,hubY,R*0.08,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=hsl(0,0,75);ctx.lineWidth=Math.max(1,R*0.02);
  ctx.beginPath();ctx.arc(cx,hubY,R*0.08,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle=hsla(50,50,85,0.5);
  ctx.beginPath();ctx.arc(cx,hubY,R*0.04,0,Math.PI*2);ctx.fill();
  /* Hub ring lights at night */
  if(nf>0.3){
    for(var hli=0;hli<8;hli++){
      var hlA=hli*(Math.PI*2/8)+fc*0.02;
      var hlx=cx+Math.cos(hlA)*R*0.06;
      var hly=hubY+Math.sin(hlA)*R*0.06;
      var hlB=0.5+0.5*Math.sin(fc*0.06+hli);
      ctx.fillStyle=hsla(hli%2===0?50:280,80,75,clamp(nf,0,1)*hlB*alpha);
      ctx.beginPath();ctx.arc(hlx,hly,R*0.01,0,Math.PI*2);ctx.fill();
    }
  }
  /* ─── 16 ENCLOSED GONDOLA CABINS (white) ─── */
  for(var gi=0;gi<gondolas;gi++){
    var gAngle=rot+gi*(Math.PI*2/gondolas);
    var gx=cx+Math.cos(gAngle)*R;
    var gy2=hubY+Math.sin(gAngle)*R;
    var hangLen=R*0.12;
    ctx.strokeStyle=hsl(0,0,80);ctx.lineWidth=Math.max(1,R*0.012);
    ctx.beginPath();ctx.moveTo(gx,gy2);ctx.lineTo(gx,gy2+hangLen);ctx.stroke();
    var cabW=R*0.085;
    var cabH=R*0.065;
    var cabX=gx-cabW*0.5;
    var cabY=gy2+hangLen;
    /* White cabin body */
    ctx.fillStyle=hsl(0,0,92);
    ctx.fillRect(cabX,cabY,cabW,cabH);
    /* Cabin outline */
    ctx.strokeStyle=hsl(0,0,70);ctx.lineWidth=Math.max(0.5,0.5);
    ctx.strokeRect(cabX,cabY,cabW,cabH);
    /* Windows */
    ctx.fillStyle=hsla(200,40,60,0.4+0.2*nf);
    ctx.fillRect(cabX+cabW*0.12,cabY+cabH*0.15,cabW*0.3,cabH*0.5);
    ctx.fillRect(cabX+cabW*0.55,cabY+cabH*0.15,cabW*0.3,cabH*0.5);
    /* Roof */
    ctx.fillStyle=hsl(0,0,85);
    ctx.fillRect(cabX-0.5,cabY-1,cabW+1,1.5);
    /* Night glow around cabin */
    if(nf>0.3){
      var cabGlowA=clamp((nf-0.3)*1.5,0,1)*alpha;
      ctx.fillStyle=hsla(50,40,80,cabGlowA*0.1);
      ctx.beginPath();ctx.arc(gx,cabY+cabH*0.5,cabW*1.3,0,Math.PI*2);ctx.fill();
      /* Cabin window warm glow */
      ctx.fillStyle=hsla(45,60,70,cabGlowA*0.5);
      ctx.fillRect(cabX+cabW*0.12,cabY+cabH*0.15,cabW*0.3,cabH*0.5);
      ctx.fillRect(cabX+cabW*0.55,cabY+cabH*0.15,cabW*0.3,cabH*0.5);
    }
  }
  /* ─── RIM LED LIGHTS (at night, enhanced density) ─── */
  if(nf>0.2){
    var lightCount=64;
    var lightAlpha=clamp((nf-0.2)*2,0,1)*alpha;
    for(var li=0;li<lightCount;li++){
      var lAngle=li*(Math.PI*2/lightCount);
      var lx=cx+Math.cos(lAngle)*R;
      var ly=hubY+Math.sin(lAngle)*R;
      var chase=((fc*0.04+li*0.18)%1);
      var bright=0.3+0.7*Math.pow(chase,2);
      var lHue=(li%3===0)?50:(li%3===1)?280:200;
      var lSat=(li%3===0)?85:80;
      var lLight=75;
      var lSize=R*0.016;
      ctx.fillStyle=hsla(lHue,lSat,lLight,lightAlpha*bright);
      ctx.beginPath();ctx.arc(lx,ly,lSize,0,Math.PI*2);ctx.fill();
      if(bright>0.65){
        ctx.fillStyle=hsla(lHue,lSat,lLight,lightAlpha*bright*0.1);
        ctx.beginPath();ctx.arc(lx,ly,lSize*2.5,0,Math.PI*2);ctx.fill();
      }
    }
    /* Mid-ring lights (between outer and inner ring) */
    for(var li2=0;li2<32;li2++){
      var lAngle2=li2*(Math.PI*2/32)+0.06;
      var lx2=cx+Math.cos(lAngle2)*R*0.94;
      var ly2=hubY+Math.sin(lAngle2)*R*0.94;
      var lHue2=(li2%2===0)?50:280;
      var lAlpha2=lightAlpha*(0.4+0.4*Math.sin(fc*0.05+li2*0.8));
      ctx.fillStyle=hsla(lHue2,80,65,lAlpha2*0.6);
      ctx.beginPath();ctx.arc(lx2,ly2,R*0.009,0,Math.PI*2);ctx.fill();
    }
    /* Inner ring lights */
    for(var li3=0;li3<16;li3++){
      var lAngle3=li3*(Math.PI*2/16)+0.12;
      var lx3=cx+Math.cos(lAngle3)*R*0.44;
      var ly3=hubY+Math.sin(lAngle3)*R*0.44;
      var lB3=0.5+0.5*Math.sin(fc*0.06+li3*1.2);
      var lHue3=(li3%2===0)?200:50;
      ctx.fillStyle=hsla(lHue3,75,60,lightAlpha*lB3*0.5);
      ctx.beginPath();ctx.arc(lx3,ly3,R*0.008,0,Math.PI*2);ctx.fill();
    }
  }
  /* ─── WATER REFLECTION at night ─── */
  if(nf>0.4&&gy<h*0.85){
    var refAlpha=clamp((nf-0.4)*0.4,0,0.15)*alpha;
    var waterY=gy+5;
    ctx.save();
    ctx.globalAlpha=refAlpha;
    ctx.translate(cx,waterY);
    ctx.scale(1,0.25);
    ctx.strokeStyle=hsla(0,0,70,0.25);
    ctx.lineWidth=R*0.025;
    ctx.beginPath();ctx.arc(0,-(waterY-hubY)*0.25,R,0,Math.PI);ctx.stroke();
    for(var ri=0;ri<gondolas;ri++){
      var rAngle=rot+ri*(Math.PI*2/gondolas);
      var rx=Math.cos(rAngle)*R;
      var ry=-(Math.sin(rAngle)*R)*0.25-(waterY-hubY)*0.25;
      ctx.fillStyle=hsla(50,50,60,0.3);
      ctx.beginPath();ctx.arc(rx,ry,R*0.01,0,Math.PI*2);ctx.fill();
    }
    for(var rli=0;rli<12;rli++){
      var rlAngle=rli*(Math.PI*2/12);
      var rlx=Math.cos(rlAngle)*R;
      var rly=-(Math.sin(rlAngle)*R)*0.25-(waterY-hubY)*0.25;
      var rlHue=(rli%2===0)?50:280;
      ctx.fillStyle=hsla(rlHue,50,60,0.2);
      ctx.beginPath();ctx.arc(rlx,rly,R*0.007,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
  }
  ctx.restore();
};

/* Mid-Autumn event: bright full moon + bird couple silhouette */
P._drawMidAutumnEvent=function(){
  if(!this._midAutumnActive||this.nightFactor<0.4)return;
  /* Force full moon at maximum brightness */
  var mx=this.W*0.35,my=this.H*0.18;
  var r=PX*8;
  var alpha=clamp((this.nightFactor-0.4)*3,0,1);
  ctx.globalAlpha=alpha;
  /* Extra bright moon glow */
  var eg=ctx.createRadialGradient(mx,my,r*0.8,mx,my,r*3);
  eg.addColorStop(0,hsla(40,60,95,alpha*0.35));
  eg.addColorStop(0.3,hsla(45,50,88,alpha*0.15));
  eg.addColorStop(0.6,hsla(40,40,80,alpha*0.06));
  eg.addColorStop(1,hsla(35,30,70,0));
  ctx.fillStyle=eg;ctx.beginPath();ctx.arc(mx,my,r*3,0,Math.PI*2);ctx.fill();
  /* Bright moon body */
  var mg=ctx.createRadialGradient(mx-r*0.2,my-r*0.2,0,mx,my,r);
  mg.addColorStop(0,hsla(40,15,99,1));
  mg.addColorStop(0.4,hsla(42,12,96,1));
  mg.addColorStop(0.7,hsla(44,10,92,1));
  mg.addColorStop(1,hsla(42,8,85,0.95));
  ctx.fillStyle=mg;ctx.beginPath();ctx.arc(mx,my,r,0,Math.PI*2);ctx.fill();
  /* Bird couple silhouette flying towards the moon */
  var bx=this.W*0.6+Math.sin(this.frameCount*0.003)*30;
  var by=this.H*0.25+Math.cos(this.frameCount*0.004)*10;
  ctx.fillStyle=hsla(220,20,15,alpha*0.8);
  /* Bird 1 (left) */
  ctx.beginPath();
  ctx.moveTo(bx-12,by-2);ctx.quadraticCurveTo(bx-6,by-8,bx,by);
  ctx.quadraticCurveTo(bx+4,by-6,bx+8,by-1);
  ctx.lineTo(bx+6,by);ctx.quadraticCurveTo(bx,by+2,bx-6,by);
  ctx.closePath();ctx.fill();
  /* Bird 2 (right, slightly behind) */
  ctx.beginPath();
  ctx.moveTo(bx+4,by+4);ctx.quadraticCurveTo(bx+8,by-1,bx+12,by+2);
  ctx.quadraticCurveTo(bx+15,by,bx+18,by+3);
  ctx.lineTo(bx+16,by+4);ctx.quadraticCurveTo(bx+12,by+5,bx+6,by+4);
  ctx.closePath();ctx.fill();
  /* Trailing birds in V formation */
  for(var bi=0;bi<5;bi++){
    var trailX=bx-20-bi*12;
    var trailY=by+5+bi*4;
    var tw=3+bi*0.5;
    ctx.fillStyle=hsla(220,15,15,alpha*(0.5-bi*0.08));
    ctx.beginPath();
    ctx.moveTo(trailX-tw,trailY);ctx.quadraticCurveTo(trailX,trailY-tw*0.5,trailX+tw,trailY);
    ctx.quadraticCurveTo(trailX,trailY+tw*0.3,trailX-tw,trailY);
    ctx.closePath();ctx.fill();
  }
  ctx.globalAlpha=1;
};

/* Christmas event: Santa rides reindeer across sky */
P._drawChristmasEvent=function(){
  if(!this._christmasActive)return;
  var w=this.W,h=this.H;
  /* Santa flies across every ~800 frames */
  if(!this._santa){this._santa={x:-200,y:h*0.15,timer:0}}
  this._santa.timer++;
  if(this._santa.timer>800){this._santa={x:-200,y:h*0.12+randf(0,h*0.08),timer:0}}
  var s=this._santa;
  if(s.timer<120){
    s.x+=w/120;
    if(s.x>w+200)return;
  }else{return}
  var sx=Math.floor(s.x),sy=Math.floor(s.y);
  ctx.save();
  /* Reindeer team (4 deer in a line) */
  for(var ri=0;ri<4;ri++){
    var dx=sx-ri*35,dy=sy+ri*5;
    /* Body */
    ctx.fillStyle=hsl(25,50,30);
    ctx.beginPath();ctx.ellipse(dx,dy,15,8,0,0,Math.PI*2);ctx.fill();
    /* Head */
    ctx.beginPath();ctx.arc(dx+18,dy-5,4,0,Math.PI*2);ctx.fill();
    /* Antlers */
    ctx.strokeStyle=hsl(30,40,40);ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(dx+20,dy-8);ctx.lineTo(dx+24,dy-16);ctx.lineTo(dx+27,dy-14);ctx.stroke();
    ctx.beginPath();ctx.moveTo(dx+22,dy-8);ctx.lineTo(dx+26,dy-15);ctx.stroke();
    /* Legs (galloping) */
    var legA=Math.sin(this.frameCount*0.15+ri)*4;
    ctx.strokeStyle=hsl(25,45,28);ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(dx-8,dy+6);ctx.lineTo(dx-10+legA,dy+14);ctx.stroke();
    ctx.beginPath();ctx.moveTo(dx+8,dy+6);ctx.lineTo(dx+10-legA,dy+14);ctx.stroke();
  }
  /* Lead reindeer: red nose */
  ctx.fillStyle=hsl(0,90,55);
  ctx.beginPath();ctx.arc(sx+18,sy-2,2,0,Math.PI*2);ctx.fill();
  /* Sleigh */
  ctx.fillStyle=hsl(0,60,35);
  ctx.beginPath();
  ctx.moveTo(sx-30,sy+10);ctx.lineTo(sx-35,sy+20);
  ctx.lineTo(sx+10,sy+20);ctx.lineTo(sx+5,sy+8);
  ctx.closePath();ctx.fill();
  /* Runner curves */
  ctx.strokeStyle=hsl(30,40,60);ctx.lineWidth=1.5;
  ctx.beginPath();
  ctx.moveTo(sx-40,sy+18);ctx.quadraticCurveTo(sx-15,sy+22,sx+15,sy+18);
  ctx.stroke();
  /* Santa */
  ctx.fillStyle=hsl(0,80,45);
  ctx.fillRect(sx-5,sy-5,12,15);
  /* Belt */
  ctx.fillStyle=hsl(0,0,20);ctx.fillRect(sx-4,sy+3,10,2);
  /* Head */
  ctx.fillStyle=hsl(30,50,70);
  ctx.beginPath();ctx.arc(sx+1,sy-8,5,0,Math.PI*2);ctx.fill();
  /* Hat */
  ctx.fillStyle=hsl(0,75,40);
  ctx.fillRect(sx-3,sy-15,8,8);
  ctx.fillRect(sx-4,sy-8,10,2);
  /* Hat trim */
  ctx.fillStyle=hsl(0,0,95);
  ctx.fillRect(sx-4,sy-8,10,2);
  /* Beard */
  ctx.fillStyle=hsl(40,20,90);
  ctx.beginPath();ctx.arc(sx+1,sy-4,4,0,Math.PI);ctx.fill();
  /* Gift bag */
  ctx.fillStyle=hsl(0,70,30);
  ctx.fillRect(sx-25,sy+5,10,12);
  ctx.fillStyle=hsl(120,60,30);
  ctx.fillRect(sx-28,sy+2,6,6);
  /* Magic dust trail */
  for(var di=0;di<8;di++){
    var dustX=sx-50-di*20+randf(-5,5);
    var dustY=sy+15+randf(-8,8);
    var dustA=randf(0.2,0.6);
    ctx.fillStyle=hsla(45,90,80,dustA);
    ctx.fillRect(dustX,dustY,2,2);
  }
  ctx.restore();
};

P._drawSplashDots=function(waterTop,waterH){
  var w=this.W;
  for(var i=this.splashDots.length-1;i>=0;i--){
    var s=this.splashDots[i];
    s.life--;
    if(s.life<=0){this.splashDots.splice(i,1);continue}
    var a=s.life/s.maxLife;
    ctx.strokeStyle=hsla(200,50,80,a*0.4);
    ctx.lineWidth=1;
    var r=(1-a)*8+2;
    ctx.beginPath();
    ctx.moveTo(s.x-r,s.y);ctx.lineTo(s.x+r,s.y);
    ctx.moveTo(s.x,s.y-r);ctx.lineTo(s.x,s.y+r);
    ctx.stroke();
  }
};



P._isRainyWeather=function(){
  var wt=this.currentWeather;
  return wt==="rain"||wt==="heavy_rain"||wt==="light_rain"||wt==="drizzle"||
    wt==="thunderstorm"||wt==="sleet"||wt==="freezing_rain"||wt==="hail";
};



P._getFogExtra=function(){
  var wt=this.currentWeather;
  if(wt==="foggy")return 0.2;
  var pt=this.prevWeather;
  if(pt==="foggy"&&this.weatherBlend<1)return 0.2*(1-this.weatherBlend);
  return 0;
};


P._spawnWeatherParticles=function(){
  var wt=this.currentWeather;
  var cfg=WTYPES[wt];if(!cfg)return;
  var w=this.W,h=this.H;
  var maxP=0;
  switch(wt){
    case"clear_sky":case"partly_cloudy":case"cloudy":case"overcast":case"foggy":maxP=0;break;
    case"drizzle":maxP=60;break;case"light_rain":maxP=120;break;
    case"rain":maxP=250;break;case"heavy_rain":maxP=500;break;
    case"thunderstorm":maxP=400;break;
    case"snow":maxP=150;break;case"heavy_snow":maxP=350;break;case"blizzard":maxP=600;break;
    case"sleet":maxP=120;break;case"freezing_rain":maxP=100;break;
    case"dust_storm":maxP=150;break;case"sandstorm":maxP=250;break;
    case"hail":maxP=80;break;default:maxP=0;
  }
  while(this.weatherParticles.length<maxP){
    var p=this._createParticle(wt,w,h);
    if(p)this.weatherParticles.push(p);else break;
  }
  while(this.weatherParticles.length>maxP)this.weatherParticles.pop();
};



P._createParticle=function(wt,w,h){
  var p={x:randf(-50,w+50),y:randf(-100,-10),life:1};
  switch(wt){
    case"drizzle":case"light_rain":case"rain":case"heavy_rain":case"thunderstorm":
      p.speed=randf(7,14);p.len=randf(10,22);p.wind=randf(-2,2);
      if(wt==="heavy_rain"){p.speed*=1.4;p.len*=1.4;p.wind*=1.5}
      if(wt==="thunderstorm"){p.speed*=1.3;p.wind=randf(-4,4)}
      break;
    case"snow":case"heavy_snow":case"blizzard":
      p.speed=randf(1,3.5);p.size=randf(1.5,4);p.drift=randf(-0.8,0.8);p.phase=Math.random()*6.28;
      p.wind=randf(-1,1);
      if(wt==="heavy_snow"){p.speed*=1.4;p.size*=1.3;p.drift*=1.5}
      if(wt==="blizzard"){p.speed*=2.2;p.drift*=4;p.wind=randf(-3,3);p.size=randf(1,3)}
      break;
    case"sleet":case"freezing_rain":
      p.speed=randf(4,8);p.size=randf(2,4);p.wind=randf(-3,1);p.isIce=true;
      break;
    case"dust_storm":case"sandstorm":
      p.x=randf(-100,w);p.y=randf(0,h*0.8);
      p.speed=randf(2,6);p.size=randf(1,3);p.wind=randf(2,5);
      break;
    case"hail":
      p.speed=randf(6,12);p.size=randf(2,5);p.bounce=randf(0.3,0.6);
      p.y=randf(-50,0);p.onGround=false;
      break;
    default:return null;
  }
  return p;
};



P._updateWeatherParticles=function(){
  var w=this.W,h=this.H;
  var waterY=h*LAYERS[4].groundFrac;
  var wt=this.currentWeather;
  var t=this.frameCount*0.01;
  for(var i=this.weatherParticles.length-1;i>=0;i--){
    var p=this.weatherParticles[i];
    p.y+=p.speed;
    p.x+=(p.wind||0);
    /* Snow: sinusoidal drift + wind gusts */
    if(wt==="snow"||wt==="heavy_snow"||wt==="blizzard"){
      p.x+=Math.sin(t*2+p.phase)*p.drift;
      /* Strong gust every ~3 seconds */
      var gust=Math.sin(t*0.33+p.phase*0.5);
      if(gust>0.7)p.x+=gust*(wt==="blizzard"?4:1.5);
    }
    if(wt==="hail"&&!p.onGround&&p.y>=waterY){
      p.onGround=true;p.vy=-p.speed*p.bounce;p.y=waterY;
    }
    if(wt==="hail"&&p.onGround){
      p.vy+=0.5;p.y+=p.vy;
      if(p.y>=waterY){p.y=waterY;p.vy*=-0.4;if(Math.abs(p.vy)<1){this.weatherParticles.splice(i,1);continue}}
    }
    var isRain=wt==="drizzle"||wt==="light_rain"||wt==="rain"||wt==="heavy_rain"||wt==="thunderstorm";
    if(isRain&&p.y>=waterY){
      /* Splash dots - more during heavy rain */
      var maxSplash=wt==="heavy_rain"||wt==="thunderstorm"?100:wt==="rain"?60:40;
      if(this.splashDots.length<maxSplash){
        this.splashDots.push({x:p.x,y:waterY,life:8,maxLife:8});
        if(wt==="heavy_rain"||wt==="thunderstorm"){
          this.splashDots.push({x:p.x+randf(-3,3),y:waterY+randf(-2,0),life:5,maxLife:5});
        }
      }
      p.y=randf(-100,-10);p.x=randf(-50,w+50);
    }
    if(wt==="sleet"||wt==="freezing_rain"){
      if(p.y>=waterY){p.y=randf(-100,-10);p.x=randf(-50,w+50)}
    }
    if(wt==="snow"||wt==="heavy_snow"||wt==="blizzard"){
      if(p.y>=waterY+20){p.y=randf(-50,-10);p.x=randf(-50,w+50)}
    }
    if(wt==="dust_storm"||wt==="sandstorm"){
      p.x+=p.wind;
      if(p.x>w+100){p.x=-100;p.y=randf(0,h*0.8)}
    }
  }
};



P._drawWeatherParticles=function(){
  var wt=this.currentWeather;
  var isRain=wt==="drizzle"||wt==="light_rain"||wt==="rain"||wt==="heavy_rain"||wt==="thunderstorm";
  var isSnow=wt==="snow"||wt==="heavy_snow"||wt==="blizzard";
  var isIce=wt==="sleet"||wt==="freezing_rain";
  var isDust=wt==="dust_storm"||wt==="sandstorm";
  var isHail=wt==="hail";
  if(isRain){
    /* Rain: batched into single stroke path for performance */
    var rainAlpha=wt==="heavy_rain"||wt==="thunderstorm"?0.6:wt==="rain"?0.5:wt==="light_rain"?0.4:0.3;
    var rainWidth=wt==="heavy_rain"||wt==="thunderstorm"?1.5:wt==="rain"?1.2:1;
    var rainBright=wt==="heavy_rain"||wt==="thunderstorm"?220:200;
    var windMul=wt==="heavy_rain"||wt==="thunderstorm"?2:1.2;
    ctx.strokeStyle="rgba("+rainBright+","+rainBright+10+","+rainBright+20+","+rainAlpha+")";
    ctx.lineWidth=rainWidth;
    ctx.beginPath();
    for(var i=0;i<this.weatherParticles.length;i++){
      var p=this.weatherParticles[i];
      var windX=p.wind*windMul;
      ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+windX,p.y+p.len);
    }
    ctx.stroke();
    /* Heavy rain: horizontal mist streaks */
    if(wt==="heavy_rain"||wt==="thunderstorm"){
      ctx.strokeStyle="rgba(180,200,220,0.06)";
      ctx.lineWidth=2;
      ctx.beginPath();
      for(var ms=0;ms<8;ms++){
        var my=randf(0,this.H*0.7);
        var mx=randf(0,this.W);
        ctx.moveTo(mx,my);ctx.lineTo(mx+randf(30,80),my);
      }
      ctx.stroke();
    }
  }else if(isSnow){
    var snowAlpha=wt==="blizzard"?0.9:wt==="heavy_snow"?0.85:0.75;
    for(var j=0;j<this.weatherParticles.length;j++){
      var s=this.weatherParticles[j];
      /* Snow glow for larger flakes */
      if(s.size>2.5){
        ctx.fillStyle="rgba(200,210,230,"+(snowAlpha*0.15)+")";
        ctx.beginPath();ctx.arc(s.x+s.size/2,s.y+s.size/2,s.size,0,Math.PI*2);ctx.fill();
      }
      /* Flake body */
      ctx.fillStyle="rgba(240,245,255,"+snowAlpha+")";
      if(s.size>2){
        /* Star-shaped snowflake for large flakes */
        var cx=s.x+s.size/2,cy=s.y+s.size/2;
        var r=s.size*0.6;
        ctx.fillRect(cx-r,cy-0.5,r*2,1);
        ctx.fillRect(cx-0.5,cy-r,1,r*2);
        var d=r*0.7;
        ctx.fillRect(cx-d+0.5,cy-d+0.5,1,1);
        ctx.fillRect(cx+d-0.5,cy-d+0.5,1,1);
        ctx.fillRect(cx-d+0.5,cy+d-0.5,1,1);
        ctx.fillRect(cx+d-0.5,cy+d-0.5,1,1);
      }else{
        ctx.fillRect(s.x,s.y,s.size,s.size);
      }
    }
    /* Blizzard: whiteout overlay */
    if(wt==="blizzard"){
      var blizA=0.03+Math.sin(this.frameCount*0.05)*0.02;
      ctx.fillStyle="rgba(220,230,245,"+blizA+")";
      ctx.fillRect(0,0,this.W,this.H);
    }
  }else if(isIce){
    ctx.fillStyle="rgba(200,220,255,0.7)";
    for(var k=0;k<this.weatherParticles.length;k++){
      var ic=this.weatherParticles[k];
      ctx.fillRect(ic.x,ic.y,ic.size,ic.size);
      ctx.fillStyle="rgba(220,240,255,0.4)";
      ctx.fillRect(ic.x+1,ic.y+1,ic.size-2,ic.size-2);
      ctx.fillStyle="rgba(200,220,255,0.7)";
    }
  }else if(isDust){
    var dustColor=wt==="sandstorm"?"rgba(180,140,80,0.5)":"rgba(150,120,80,0.4)";
    ctx.fillStyle=dustColor;
    for(var d=0;d<this.weatherParticles.length;d++){
      var dp=this.weatherParticles[d];
      ctx.fillRect(dp.x,dp.y,dp.size*2,dp.size);
    }
  }else if(isHail){
    ctx.fillStyle="rgba(220,230,250,0.8)";
    for(var hl=0;hl<this.weatherParticles.length;hl++){
      var hp=this.weatherParticles[hl];
      ctx.fillRect(hp.x,hp.y,hp.size,hp.size);
    }
  }
};


P._getSeasonLerp=function(prop){
  var cs=SEASONS[this.currentSeason];
  var ts=SEASONS[this.targetSeason];
  return lerp(cs[prop],ts[prop],this.seasonBlend);
};



P.transitionSeason=function(){
  this._seasonTimer++;
  if(this._seasonTimer<this._seasonInterval)return;
  this._seasonTimer=0;
  this._seasonInterval=3000+Math.floor(Math.random()*2000);
  this.currentSeason=this.targetSeason;
  this.targetSeason=(this.targetSeason+1)%4;
  this.seasonBlend=0;
};



P._updateSeasonBlend=function(){
  if(this.seasonBlend<1){
    this.seasonBlend=Math.min(1,this.seasonBlend+0.003);
  }
};


P._drawDynamicShadows=function(){
  var w=this.W,h=this.H,nf=this.nightFactor;
  if(nf>0.9)return;
  var sp=this._sunProgress;
  /* Sun angle: 0=dawn(east/left), 0.25=noon(top), 0.5=dusk(west/right) */
  var sunAngle=(sp<0.5?sp/0.5:0)*Math.PI; /* 0 to PI during day */
  var shadowDirX=Math.cos(sunAngle); /* -1 to 1 */
  var shadowDirY=-Math.abs(Math.sin(sunAngle))*0.3+0.1;
  /* Shadow length based on sun elevation */
  var sunElev=Math.sin(sunAngle);
  var shadowLen=clamp((1-sunElev)*0.6,0.05,0.5);
  var shadowAlpha=clamp(0.12*(1-nf)-shadowLen*0.1,0,0.15);
  var seasonAmbient=this._getSeasonLerp("ambient");

  /* Building layer shadows - cast from each layer's buildings */
  for(var li=1;li<5;li++){
    var L=LAYERS[li];
    var blds=L.buildings;
    var groundY=h*L.groundFrac;
    var scrollOff=(this.frameCount*L.scrollMul*0.3)%L.wrapW;
    var dirX=shadowDirX*shadowLen*w*0.3;
    var dirY=Math.abs(shadowDirY)*shadowLen*h*0.2;
    ctx.fillStyle="rgba(0,0,0,"+shadowAlpha+")";
    for(var bi=0;bi<blds.length;bi++){
      var b=blds[bi];
      var bx=b.x-scrollOff;
      while(bx>w+50)bx-=L.wrapW;
      while(bx<-200)bx+=L.wrapW;
      if(bx>w+50||bx<-200)continue;
      var by=groundY-b.h;
      /* Shadow shape: parallelogram offset from building base */
      ctx.beginPath();
      ctx.moveTo(bx,groundY);
      ctx.lineTo(bx+b.w,groundY);
      ctx.lineTo(bx+b.w+dirX,groundY+dirY);
      ctx.lineTo(bx+dirX,groundY+dirY);
      ctx.closePath();
      ctx.fill();
    }
  }
};



P._drawDynamicLighting=function(){
  var w=this.W,h=this.H,nf=this.nightFactor;
  var sp=this._sunProgress;
  var seasonAmbient=this._getSeasonLerp("ambient");
  /* Dynamic ambient light overlay based on sun position and season */
  if(sp<0.5){
    /* Daytime: warm/cool based on sun elevation */
    var sunElev=Math.sin((sp/0.5)*Math.PI);
    /* Enhanced golden hour near dawn/dusk with higher contrast */
    var goldenFactor=0;
    if(sp<0.15)goldenFactor=1-sp/0.15;
    else if(sp>0.35)goldenFactor=(sp-0.35)/0.15;
    goldenFactor=clamp(goldenFactor,0,1);
    goldenFactor=Math.pow(goldenFactor,0.7);
    /* Warm palette overlay during golden hour — STRONGER */
    if(goldenFactor>0.01){
      var pal=this._getDuskPalette();
      var ga=goldenFactor*0.22*(1-nf);
      ctx.fillStyle=hsla(pal[9],pal[10],pal[11],ga);
      ctx.fillRect(0,0,w,h);
      /* Second warm pass: horizon band (bottom 40%) with richer warm tone */
      var horizGa=goldenFactor*0.12*(1-nf);
      var horizGrad=ctx.createLinearGradient(0,h*0.5,0,h);
      horizGrad.addColorStop(0,hsla(pal[9],pal[10],pal[11],0));
      horizGrad.addColorStop(0.5,hsla(pal[1],pal[4]+10,pal[7]+5,horizGa));
      horizGrad.addColorStop(1,hsla(pal[2],pal[5]+10,pal[8]+5,horizGa*1.3));
      ctx.fillStyle=horizGrad;
      ctx.fillRect(0,0,w,h);
    }
    /* Season tint */
    var seasonA=0.04*(1-nf);
    var sH=this._getSeasonLerp("skyBotH");
    var sS=this._getSeasonLerp("skyTopS");
    if(sH!==200||seasonAmbient!==0){
      ctx.fillStyle=hsla(sH,sS,50,seasonA);
      ctx.fillRect(0,0,w,h);
    }
  }
  /* Night: cool blue ambient */
  if(nf>0.3){
    var nightAmbA=clamp((nf-0.3)*0.06,0,0.06);
    var nightH=this._getSeasonLerp("skyTopH");
    ctx.fillStyle=hsla(nightH,30,20,nightAmbA);
    ctx.fillRect(0,0,w,h);
  }
  /* Vignette: darken edges based on time of day */
  var vigA=clamp(0.08+nf*0.12+Math.abs(seasonAmbient)*0.005,0,0.25);
  var vigR=Math.max(w,h)*0.75;
  var vig=ctx.createRadialGradient(w/2,h/2,vigR*0.4,w/2,h/2,vigR);
  vig.addColorStop(0,hsla(0,0,0,0));
  vig.addColorStop(1,hsla(0,0,0,vigA));
  ctx.fillStyle=vig;
  ctx.fillRect(0,0,w,h);
};



P._drawSeasonParticles=function(){
  var si=this.currentSeason;
  var blend=this.seasonBlend;
  var w=this.W,h=this.H,nf=this.nightFactor;
  /* Spring: cherry blossom petals drifting — enhanced with wind sway */
  if(si===0||this.targetSeason===0){
    var ba=si===0?blend:1-blend;
    if(ba>0.01){
      var t=this.frameCount;
      var windX=Math.sin(t*0.002)*0.4;
      for(var p=0;p<10;p++){
        var px=((t*0.5+p*157+Math.sin(t*0.007+p*2.3)*25)%w+w)%w;
        var py=((t*0.3+p*89+Math.sin(t*0.01+p)*30)%(h*0.85)+h)%h;
        var petalPhase=Math.sin(t*0.015+p*1.7);
        /* Petal body */
        ctx.fillStyle=hsla(340+p*3,55+p*2,78+p,ba*(0.4+petalPhase*0.2));
        ctx.fillRect(px,py,3+petalPhase,2);
        /* Petal highlight */
        if(petalPhase>0.5){
          ctx.fillStyle=hsla(350,60,90,ba*0.15);
          ctx.fillRect(px+1,py,1,1);
        }
      }
    }
  }
  /* Summer: heat shimmer / fireflies at dusk */
  if(si===1||this.targetSeason===1){
    var sa=si===1?blend:1-blend;
    if(sa>0.01){
      var st=this.frameCount;
      /* Heat shimmer haze near ground during day */
      if(nf<0.3){
        var shimA=sa*0.03*(1-nf);
        var shimGrad=ctx.createLinearGradient(0,h*0.7,0,h);
        shimGrad.addColorStop(0,hsla(40,30,90,0));
        shimGrad.addColorStop(0.5,hsla(45,25,85,shimA));
        shimGrad.addColorStop(1,hsla(50,20,80,shimA*0.5));
        ctx.fillStyle=shimGrad;
        ctx.fillRect(0,h*0.7,w,h*0.3);
      }
      /* Fireflies at dusk/night */
      if(nf>0.35){
        for(var ff=0;ff<6;ff++){
          var ffx=(st*0.3+ff*179)%w;
          var ffy=h*0.5+Math.sin(st*0.005+ff*2.7)*h*0.2;
          var ffGlow=Math.sin(st*0.06+ff*1.3)>0.6?1:0.05;
          ctx.fillStyle=hsla(60,90,70,sa*(nf-0.35)*ffGlow*0.5);
          ctx.fillRect(ffx,ffy,2,2);
          if(ffGlow>0.5){
            ctx.fillStyle=hsla(60,80,80,sa*(nf-0.35)*0.12);
            ctx.beginPath();ctx.arc(ffx,ffy,4,0,Math.PI*2);ctx.fill();
          }
        }
      }
    }
  }
  /* Autumn: falling leaves with rotation and more colors */
  if(si===2||this.targetSeason===2){
    var aa=si===2?blend:1-blend;
    if(aa>0.01){
      var at=this.frameCount;
      var leafColors=[hsla(25,80,50,aa*0.6),hsla(35,75,45,aa*0.5),hsla(10,70,40,aa*0.55),hsla(45,70,55,aa*0.45)];
      var windAX=Math.sin(at*0.0015)*0.6;
      for(var l=0;l<12;l++){
        var lx=((at*(0.35+windAX)+l*193+Math.sin(at*0.006+l*1.9)*18)%w+w)%w;
        var ly=((at*0.22+l*127+Math.sin(at*0.008+l*2)*25)%(h*0.75)+h)%h;
        var rot=Math.sin(at*0.02+l);
        ctx.fillStyle=leafColors[l%4];
        /* Leaf body with rotation effect */
        ctx.fillRect(lx+(rot>0?1:0),ly,4,3);
        /* Leaf stem */
        ctx.fillStyle=hsla(25,50,35,aa*0.4);
        ctx.fillRect(lx+2,ly-1,1,3);
        /* Leaf vein */
        if(l%3===0){
          ctx.fillStyle=hsla(30,60,40,aa*0.2);
          ctx.fillRect(lx+1,ly+1,2,1);
        }
      }
    }
  }
  /* Winter: frost sparkle + snow dust even without snow weather */
  if(si===3||this.targetSeason===3){
    var wa=si===3?blend:1-blend;
    if(wa>0.01){
      var wt2=this.frameCount;
      /* Frost sparkles on ground */
      if(nf>0.3){
        for(var f=0;f<8;f++){
          var fx=(wt2*0.08+f*211)%w;
          var fy=h*0.65+Math.sin(wt2*0.004+f)*h*0.2;
          var sparkle=Math.sin(wt2*0.08+f*3)>0.7?0.8:0.1;
          ctx.fillStyle=hsla(200,20,95,wa*sparkle*0.35*(nf-0.3));
          ctx.fillRect(fx,fy,2,2);
        }
      }
      /* Winter atmospheric haze (cold blue tint) */
      if(nf<0.5){
        var coldA=wa*0.04*(0.5-nf)*2;
        ctx.fillStyle=hsla(210,30,80,coldA);
        ctx.fillRect(0,0,w,h);
      }
      /* Snow dust particles even without snow weather */
      for(var sd=0;sd<4;sd++){
        var sdx=(wt2*0.15+sd*167+Math.sin(wt2*0.003+sd)*20)%w;
        var sdy=(wt2*0.08+sd*103)%h;
        ctx.fillStyle=hsla(210,15,90,wa*0.15);
        ctx.fillRect(sdx,sdy,1,1);
      }
    }
  }
};



P._drawTyndallEffect=function(){
  /* Tyndall effect: light scattering through particles + atmospheric god rays */
  var wt=this.currentWeather;
  var isTyndall=wt==="rain"||wt==="light_rain"||wt==="drizzle"||
    wt==="foggy"||wt==="cloudy"||wt==="overcast"||wt==="partly_cloudy"||
    wt==="heavy_rain"||wt==="thunderstorm";
  var isPrevTyndall=this.prevWeather==="foggy"||this.prevWeather==="cloudy"||
    this.prevWeather==="rain"||this.prevWeather==="light_rain";
  var blend=isTyndall?this.weatherBlend:(isPrevTyndall?1-this.weatherBlend:0);
  if(this.nightFactor>0.85)return;
  var w=this.W,h=this.H;
  var sx=this._sunX,sy=this._sunY;
  /* Sun elevation factor: rays strongest when sun is low (golden hour) */
  var sp=this._sunProgress;
  var sunElev=sp<0.5?Math.sin((sp/0.5)*Math.PI):0;
  var lowSunBoost=sp<0.5?(1-sunElev)*0.6:0;

  /* ── Weather-particle Tyndall rays ── */
  if(blend>0.01){
    var baseAlpha=blend*clamp(1-this.nightFactor*1.2,0,1);
    var rayCount=6;/* reduced from 12 */
    for(var r=0;r<rayCount;r++){
      var angle=-0.6+r*(1.2/(rayCount-1));
      var rayLen=Math.max(w,h)*1.2;/* reduced from 1.5 */
      var rayW=8+Math.sin(this.frameCount*0.008+r*1.7)*6;
      var animAngle=angle+Math.sin(this.frameCount*0.003+r*0.9)*0.03;
      var endX=sx+Math.sin(animAngle)*rayLen;
      var endY=sy+Math.cos(animAngle)*rayLen;
      var rayIntensity=0.3+0.4*Math.sin(this.frameCount*0.005+r*2.1);
      rayIntensity*=rayIntensity;
      var rayAlpha=baseAlpha*rayIntensity*0.15;
      if(rayAlpha<0.005)continue;/* skip nearly invisible rays */
      if(wt==="foggy")rayAlpha*=1.2;
      if(wt==="heavy_rain"||wt==="thunderstorm")rayAlpha*=0.6;
      if(wt==="cloudy"||wt==="overcast")rayAlpha*=0.8;
      var perpX=Math.cos(animAngle)*rayW;
      var perpY=-Math.sin(animAngle)*rayW;
      var rayGrad=ctx.createLinearGradient(sx,sy,endX,endY);
      rayGrad.addColorStop(0,hsla(35,80,85,rayAlpha));
      rayGrad.addColorStop(0.2,hsla(30,70,80,rayAlpha*0.7));
      rayGrad.addColorStop(0.5,hsla(25,50,75,rayAlpha*0.3));
      rayGrad.addColorStop(1,hsla(20,30,70,0));
      ctx.fillStyle=rayGrad;
      ctx.beginPath();
      ctx.moveTo(sx+perpX*0.3,sy+perpY*0.3);
      ctx.lineTo(sx-perpX*0.3,sy-perpY*0.3);
      ctx.lineTo(endX-perpX*2,endY-perpY*2);
      ctx.lineTo(endX+perpX*2,endY+perpY*2);
      ctx.closePath();ctx.fill();
    }
    /* Scattered light haze — skip if alpha too low */
    var hazeR=Math.min(w,h)*0.3;
    var hazeAlpha=baseAlpha*0.08;
    if(hazeAlpha>0.005){
      var hazeGrad=ctx.createRadialGradient(sx,sy,0,sx,sy,hazeR);
      hazeGrad.addColorStop(0,hsla(35,60,85,hazeAlpha));
      hazeGrad.addColorStop(0.4,hsla(30,40,80,hazeAlpha*0.5));
      hazeGrad.addColorStop(1,hsla(25,20,75,0));
      ctx.fillStyle=hazeGrad;
      ctx.beginPath();ctx.arc(sx,sy,hazeR,0,Math.PI*2);ctx.fill();
    }
  }

  /* ── Atmospheric god rays (clear/any sky, daytime) ── */
  if(this.nightFactor<0.5){
    var dayAlpha=clamp((0.5-this.nightFactor)*2,0,1);
    var lowSunBoost=sp<0.5?(1-sunElev)*0.6:0;
    var godRayBase=dayAlpha*(0.04+lowSunBoost*0.08);
    var godRayCount=5;/* reduced from 8 */
    if(godRayBase<0.003){godRayCount=0}/* skip entirely if too faint */
    for(var gr=0;gr<godRayCount;gr++){
      var gAngle=-0.45+gr*(0.9/(godRayCount-1));
      var gLen=Math.max(w,h)*1.2;
      var gAnim=gAngle+Math.sin(this.frameCount*0.002+gr*1.3)*0.04;
      var gWidth=12+Math.sin(this.frameCount*0.006+gr*2.5)*8;
      var gIntensity=Math.pow(0.4+0.6*Math.abs(Math.sin(this.frameCount*0.004+gr*1.7)),2);
      var gAlpha=godRayBase*gIntensity;
      if(gAlpha<0.002)continue;
      var gEndX=sx+Math.sin(gAnim)*gLen;
      var gEndY=sy+Math.cos(gAnim)*gLen;
      var gPerpX=Math.cos(gAnim)*gWidth;
      var gPerpY=-Math.sin(gAnim)*gWidth;
      /* Warm golden gradient fading to transparent */
      var gGrad=ctx.createLinearGradient(sx,sy,gEndX,gEndY);
      gGrad.addColorStop(0,hsla(38,85,88,gAlpha));
      gGrad.addColorStop(0.15,hsla(35,75,82,gAlpha*0.65));
      gGrad.addColorStop(0.4,hsla(30,55,78,gAlpha*0.25));
      gGrad.addColorStop(1,hsla(25,30,72,0));
      ctx.fillStyle=gGrad;
      ctx.beginPath();
      ctx.moveTo(sx+gPerpX*0.2,sy+gPerpY*0.2);
      ctx.lineTo(sx-gPerpX*0.2,sy-gPerpY*0.2);
      ctx.lineTo(gEndX-gPerpX*3,gEndY-gPerpY*3);
      ctx.lineTo(gEndX+gPerpX*3,gEndY+gPerpY*3);
      ctx.closePath();ctx.fill();
    }
    /* Sun corona radial rays (visible at low sun) */
    if(lowSunBoost>0.2){
      var coronaR=Math.min(w,h)*0.2*lowSunBoost;
      var coronaAlpha=lowSunBoost*0.06*dayAlpha;
      var coronaGrad=ctx.createRadialGradient(sx,sy,0,sx,sy,coronaR);
      coronaGrad.addColorStop(0,hsla(38,90,92,coronaAlpha));
      coronaGrad.addColorStop(0.3,hsla(35,70,85,coronaAlpha*0.5));
      coronaGrad.addColorStop(1,hsla(30,40,80,0));
      ctx.fillStyle=coronaGrad;
      ctx.beginPath();ctx.arc(sx,sy,coronaR,0,Math.PI*2);ctx.fill();
    }
  }
};



P._drawFog=function(){
  var wt=this.currentWeather;
  var isFoggy=wt==="foggy";
  var fogBlend=isFoggy?this.weatherBlend:(this.prevWeather==="foggy"?1-this.weatherBlend:0);
  if(fogBlend<0.01)return;
  var w=this.W,h=this.H,nf=this.nightFactor;
  var a=fogBlend;
  /* Layered fog: denser at bottom, patchy in middle, thin at top */
  var fogGrad=ctx.createLinearGradient(0,0,0,h);
  var fogBaseL=lerp(80,30,nf);
  var fogBaseH=lerp(210,220,nf);
  fogGrad.addColorStop(0,hsla(fogBaseH,12,fogBaseL+5,a*0.08));
  fogGrad.addColorStop(0.15,hsla(fogBaseH,10,fogBaseL,a*0.2));
  fogGrad.addColorStop(0.35,hsla(fogBaseH,10,fogBaseL+3,a*0.45));
  fogGrad.addColorStop(0.55,hsla(fogBaseH,8,fogBaseL+5,a*0.65));
  fogGrad.addColorStop(0.75,hsla(fogBaseH,8,fogBaseL+8,a*0.85));
  fogGrad.addColorStop(0.9,hsla(fogBaseH,6,fogBaseL+10,a*0.95));
  fogGrad.addColorStop(1,hsla(fogBaseH,5,fogBaseL+8,a*0.9));
  ctx.fillStyle=fogGrad;
  ctx.fillRect(0,0,w,h);
  /* Moving fog wisps - multiple layers at different depths */
  for(var i=0;i<this.fogWisps.length;i++){
    var fw=this.fogWisps[i];
    fw.x+=fw.speed;
    if(fw.x>w+200)fw.x=-200;
    var wispY=fw.y+Math.sin(this.frameCount*0.005+fw.phase)*15;
    var wispA=a*(0.15+0.1*Math.sin(this.frameCount*0.008+i*1.3));
    ctx.fillStyle=hsla(fogBaseH,8,fogBaseL+15,wispA);
    /* Draw wisp as overlapping rounded shapes */
    ctx.fillRect(fw.x,wispY,fw.w*0.8,fw.h*0.6);
    ctx.fillRect(fw.x+fw.w*0.2,wispY-fw.h*0.2,fw.w*0.6,fw.h*0.8);
    ctx.fillRect(fw.x+fw.w*0.1,wispY+fw.h*0.1,fw.w*0.9,fw.h*0.5);
  }
  /* Ground-level thick fog band */
  var groundFogY=h*0.7;
  var gfgGrad=ctx.createLinearGradient(0,groundFogY,0,h);
  gfgGrad.addColorStop(0,hsla(fogBaseH,6,fogBaseL+12,a*0.4));
  gfgGrad.addColorStop(0.3,hsla(fogBaseH,5,fogBaseL+10,a*0.7));
  gfgGrad.addColorStop(0.6,hsla(fogBaseH,5,fogBaseL+8,a*0.9));
  gfgGrad.addColorStop(1,hsla(fogBaseH,4,fogBaseL+5,a*0.85));
  ctx.fillStyle=gfgGrad;
  ctx.fillRect(0,groundFogY,w,h-groundFogY);
};



P._updateFogWisps=function(){
  if(this.fogWisps.length===0){
    for(var i=0;i<12;i++){
      this.fogWisps.push({x:randf(-200,this.W),y:randf(this.H*0.1,this.H*0.85),
        speed:randf(0.15,0.6),w:randf(100,280),h:randf(20,50),phase:Math.random()*Math.PI*2});
    }
  }
};



P.transitionWeather=function(){
  this._weatherTimer++;
  if(this._weatherTimer<this._weatherInterval)return;
  this._weatherTimer=0;
  /* Diversified weather: more frequent transitions */
  this._weatherInterval=1200+Math.floor(Math.random()*800);
  this.prevWeather=this.currentWeather;
  this.currentWeather=this.targetWeather;
  this.weatherBlend=0;
  var neighbors=[];
  for(var i=0;i<WTRANS.length;i++){
    if(WTRANS[i][0]===this.currentWeather)neighbors.push(WTRANS[i][1]);
  }
  if(neighbors.length===0)neighbors=[this.currentWeather];
  /* Season-aware weather bias: prefer weather matching current season */
  var season=this.currentSeason;
  var biased=[];
  for(var n=0;n<neighbors.length;n++){
    var wt=neighbors[n];
    var score=1;
    /* Winter: prefer snow/fog/sleet/freezing */
    if(season===3&&(wt==="snow"||wt==="heavy_snow"||wt==="blizzard"||wt==="sleet"||wt==="freezing_rain"||wt==="foggy"))score+=3;
    /* Summer: prefer thunderstorm/heavy_rain/clear */
    if(season===1&&(wt==="thunderstorm"||wt==="heavy_rain"||wt==="clear_sky"||wt==="partly_cloudy"))score+=2;
    /* Autumn: prefer foggy/rain/overcast */
    if(season===2&&(wt==="foggy"||wt==="rain"||wt==="overcast"||wt==="drizzle"))score+=2;
    /* Spring: prefer light_rain/partly_cloudy/clear */
    if(season===0&&(wt==="light_rain"||wt==="partly_cloudy"||wt==="clear_sky"))score+=2;
    for(var s=0;s<score;s++)biased.push(wt);
  }
  this.targetWeather=biased[Math.floor(Math.random()*biased.length)];
};



P._updateWeatherBlend=function(){
  if(this.weatherBlend<1)this.weatherBlend=Math.min(1,this.weatherBlend+0.012);
};


P._updateLightning=function(){
  if(this.currentWeather!=="thunderstorm")return;
  if(this.lightningFlash>0)this.lightningFlash*=0.85;
  if(this.lightningFlash<0.01)this.lightningFlash=0;
  if(this._lightningReflashTimer>0){
    this._lightningReflashTimer--;
    if(this._lightningReflashTimer===0&&this._lightningReflash>0){
      this.lightningFlash=this._lightningReflash*0.6;
      this._lightningReflash=0;
    }
  }
  this.thunderShake*=0.9;
  if(Math.random()<0.012){
    this.lightningFlash=0.45;
    this._lightningReflash=0.4;
    this._lightningReflashTimer=randi(4,8);
    this.thunderShake=randf(5,8);
    this.lightningBolts=this._generateBolt(this.W*randf(0.15,0.85),0,this.H*0.55);
  }
};



P._generateBolt=function(x,y,targetY){
  var bolts=[{points:[],branches:[]}];
  var points=bolts[0].points;
  points.push({x:x,y:y});
  var cy=y;
  while(cy<targetY){
    cy+=randf(10,30);
    x+=randf(-35,35);
    points.push({x:x,y:Math.min(cy,targetY)});
    if(Math.random()<0.4){
      var bx=x,by=cy;
      var bpts=[];
      for(var b=0;b<randi(2,5);b++){
        bx+=randf(-25,25);by+=randf(10,30);
        bpts.push({x:bx,y:by});
      }
      bolts[0].branches.push(bpts);
    }
  }
  return bolts;
};



P._drawLightning=function(){
  if(this.lightningFlash<0.01)return;
  ctx.fillStyle="rgba(255,255,255,"+this.lightningFlash*0.3+")";
  ctx.fillRect(0,0,this.W,this.H);
  for(var b=0;b<this.lightningBolts.length;b++){
    var bolt=this.lightningBolts[b];
    if(bolt.points.length<2)continue;
    ctx.strokeStyle="rgba(200,200,255,"+this.lightningFlash*2+")";
    ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(bolt.points[0].x,bolt.points[0].y);
    for(var i=1;i<bolt.points.length;i++)ctx.lineTo(bolt.points[i].x,bolt.points[i].y);
    ctx.stroke();
    ctx.strokeStyle="rgba(180,180,255,"+this.lightningFlash*0.6+")";
    ctx.lineWidth=6;
    ctx.beginPath();ctx.moveTo(bolt.points[0].x,bolt.points[0].y);
    for(var j=1;j<bolt.points.length;j++)ctx.lineTo(bolt.points[j].x,bolt.points[j].y);
    ctx.stroke();
    for(var k=0;k<bolt.branches.length;k++){
      var br=bolt.branches[k];
      if(br.length<1)continue;
      ctx.strokeStyle="rgba(200,200,255,"+this.lightningFlash*1.2+")";
      ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(bolt.points[0].x,bolt.points[0].y);
      for(var m=0;m<br.length;m++)ctx.lineTo(br[m].x,br[m].y);
      ctx.stroke();
    }
  }
  if(this.thunderShake>0.5){
    vizCanvas.style.transform="translate("+randf(-this.thunderShake,this.thunderShake)+"px,"+randf(-this.thunderShake,this.thunderShake)+"px)";
  }else{
    vizCanvas.style.transform="";
  }
};


P._getFreqData=function(){
  if(!this.analyser||!this.freqData)return null;
  var empty=true;
  for(var i=0;i<this.freqData.length;i++){if(this.freqData[i]>0){empty=false;break}}
  if(empty){
    var amb=0.08+Math.sin(this.frameCount*0.015)*0.04;
    for(var j=0;j<this.freqData.length;j++){
      this.freqData[j]=Math.floor(amb*255*(0.5+0.5*Math.sin(j*0.3+this.frameCount*0.02)));
    }
  }
  return this.freqData;
};


P.detectTone=function(){
  if(!this.analyser||!this.freqData||!this.isPlaying||!this.audioCtx)return;
  this.analyser.getByteFrequencyData(this.freqData);
  var maxVal=0,maxIdx=0;
  for(var i=0;i<this.freqData.length;i++){
    if(this.freqData[i]>maxVal){maxVal=this.freqData[i];maxIdx=i}
  }
  if(maxVal<10)return;
  var sr=this.audioCtx.sampleRate;
  var freq=maxIdx*sr/(this.analyser.fftSize);
  var tone=null;
  var keys=Object.keys(TONES);
  for(var k=0;k<keys.length;k++){
    var t=TONES[keys[k]];
    if(freq>=t.min&&freq<t.max){tone=t;break}
  }
  if(tone){
    this._toneHue=tone.hue;
  }
};


P.toast=function(msg){
  toastEl.textContent=msg;toastEl.classList.add("show");
  clearTimeout(this._toastTimer);
  this._toastTimer=setTimeout(function(){toastEl.classList.remove("show")},2500);
};



P._showUI=function(){
  document.body.classList.remove("ui-hidden");
  clearTimeout(this._idleTimer);
  this._idleTimer=setTimeout(function(){document.body.classList.add("ui-hidden")},3000);
};



P.setupUI=function(){
  var self=this;
  playBtn.addEventListener("click",function(){self.togglePlay()});
  nextBtn.addEventListener("click",function(){self.next()});
  prevBtn.addEventListener("click",function(){self.prev()});
  shuffleBtn.addEventListener("click",function(){
    self.shuffle=!self.shuffle;shuffleBtn.classList.toggle("on",self.shuffle);
    self.toast(self.shuffle?"Shuffle on":"Shuffle off");
  });
  repeatBtn.addEventListener("click",function(){
    self.repeat=(self.repeat+1)%3;
    repeatBtn.classList.toggle("on",self.repeat>0);
    var labels=["Repeat off","Repeat all","Repeat one"];
    self.toast(labels[self.repeat]);
  });
  volSlider.addEventListener("input",function(){self.setVolume(parseInt(volSlider.value)/100)});

  progressBar.addEventListener("click",function(e){
    var rect=progressBar.getBoundingClientRect();
    self.seek((e.clientX-rect.left)/rect.width);
  });
  /* Touch/mouse drag seek on progress bar */
  (function(){
    var seeking=false;
    function seekAt(e){
      var touch=e.touches?e.touches[0]:e;
      var rect=progressBar.getBoundingClientRect();
      var pct=clamp((touch.clientX-rect.left)/rect.width,0,1);
      self.seek(pct);
    }
    progressBar.addEventListener("mousedown",function(){seeking=true});
    progressBar.addEventListener("touchstart",function(e){seeking=true;seekAt(e)},{passive:true});
    document.addEventListener("mousemove",function(e){if(seeking)seekAt(e)});
    document.addEventListener("touchmove",function(e){if(seeking)seekAt(e)},{passive:true});
    document.addEventListener("mouseup",function(){seeking=false});
    document.addEventListener("touchend",function(){seeking=false});
  })();

  plToggle.addEventListener("click",function(){
    playlistPanel.classList.toggle("open");
    plToggle.classList.toggle("active");
  });
  plFoldBtn.addEventListener("click",function(){
    playlistPanel.classList.remove("open");
    plToggle.classList.remove("active");
  });
  clearBtn.addEventListener("click",function(){self.clearPlaylist();self.clearSavedPlaylist()});
  saveBtn.addEventListener("click",function(){self.savePlaylist()});
  loadBtn.addEventListener("click",function(){self.loadPlaylist()});
  addBtn.addEventListener("click",function(){fileInput.click()});
  plBrowseBtn.addEventListener("click",function(){fileInput.click()});
  plDropZone.addEventListener("click",function(e){
    if(e.target.closest(".pl-browse-btn"))return;fileInput.click();
  });
  plQuickAddBtn.addEventListener("click",function(){fileInput.click()});
  /* Drag-drop on playlist drop zone */
  plDropZone.addEventListener("dragover",function(e){e.preventDefault();e.stopPropagation();plDropZone.classList.add("drag-over")});
  plDropZone.addEventListener("dragleave",function(e){e.stopPropagation();plDropZone.classList.remove("drag-over")});
  plDropZone.addEventListener("drop",function(e){
    e.preventDefault();e.stopPropagation();plDropZone.classList.remove("drag-over");
    var files=e.dataTransfer.files;
    for(var i=0;i<files.length;i++){
      if(files[i].type.startsWith("audio/"))self.addToPlaylist(files[i]);
    }
  });

  fileInput.addEventListener("change",function(){
    var files=fileInput.files;
    for(var i=0;i<files.length;i++)self.addToPlaylist(files[i]);
    fileInput.value="";
  });

  vizStage.addEventListener("mousemove",function(){self._showUI()});
  vizStage.addEventListener("touchstart",function(){self._showUI()});

  /* Click outside playlist panel to close it */
  document.addEventListener("click",function(e){
    var panel=playlistPanel;
    if(panel.classList.contains("open")&&!panel.contains(e.target)&&!plToggle.contains(e.target)){
      panel.classList.remove("open");
      plToggle.classList.remove("active");
    }
  });

  this._showUI();
  /* Start with UI hidden for immersive view */
  setTimeout(function(){document.body.classList.add("ui-hidden")},1500);

  window.addEventListener("resize",function(){self.resize()});
};



P.setupKeyboard=function(){
  var self=this;
  document.addEventListener("keydown",function(e){
    if(e.target.tagName==="INPUT")return;
    switch(e.code){
      case"Space":e.preventDefault();self.togglePlay();break;
      case"ArrowRight":e.preventDefault();self.next();break;
      case"ArrowLeft":e.preventDefault();self.prev();break;
      case"ArrowUp":e.preventDefault();self.setVolume(self.volume+0.05);break;
      case"ArrowDown":e.preventDefault();self.setVolume(self.volume-0.05);break;
    }
  });
};



P.setupDragDrop=function(){
  var self=this;
  vizStage.addEventListener("dragover",function(e){e.preventDefault();e.dataTransfer.dropEffect="copy"});
  vizStage.addEventListener("drop",function(e){
    e.preventDefault();
    var files=e.dataTransfer.files;
    for(var i=0;i<files.length;i++){
      if(files[i].type.startsWith("audio/"))self.addToPlaylist(files[i]);
    }
  });
};



/* Handle tab visibility changes - resume AudioContext when tab regains focus */
P.setupVisibilityHandler=function(){
  var self=this;
  document.addEventListener("visibilitychange",function(){
    if(!document.hidden&&self.audioCtx&&self.audioCtx.state==="suspended"){
      self.audioCtx.resume();
    }
    /* Re-kick the loop if it somehow stopped */
    if(!document.hidden&&!self._rafId){
      self.animate();
    }
  });
};


P.animate=function(){
  if(this._rafId)return;
  this._rafId=requestAnimationFrame(this._loop.bind(this));
};



P._loop=function(){
  this._rafId=null;
  /* Prevent re-entrant calls */
  if(this._loopRunning)return;
  this._loopRunning=true;
  try{
  this.frameCount++;
  this._lastFrameTime=performance.now();
  this.resize();
  if(this.analyser&&this.freqData)this.analyser.getByteFrequencyData(this.freqData);
  /* Compute energy and bass for dynamic buildings */
  var sum=0,bassSum=0;
  if(this.freqData){
    var bands=8;
    var bandSize=Math.floor(this.freqData.length/bands);
    this._freqBands=[];
    for(var bi=0;bi<bands;bi++){
      var bSum=0;
      for(var bf=bi*bandSize;bf<(bi+1)*bandSize&&bf<this.freqData.length;bf++){
        bSum+=this.freqData[bf];
        sum+=this.freqData[bf];
        if(bf<10)bassSum+=this.freqData[bf];
      }
      this._freqBands[bi]=bSum/bandSize/255;
    }
    this._energy=(sum/this.freqData.length)/255;
    this._bassEnergy=(bassSum/10)/255;
  }else{
    if(!this._freqBands)this._freqBands=[];
